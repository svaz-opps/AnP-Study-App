 before adding."},{"id":"N6-17","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",1]],"type":"mcq","stem":"What does the adult rule of nines estimate?","why":"The adult rule of nines estimates how much body surface area is burned. It does not measure depth or replace a full severity assessment, and children need different charts.","diff":2,"origin":"new","opts":[{"t":"The percentage of an adult's body surface area that is burned","c":true},{"t":"The depth of a burn","w":"The rule of nines measures surface area, not depth."},{"t":"Burned surface area in young children","w":"Children have different body proportions and need age-appropriate methods."},{"t":"How painful a burn will be","w":"The rule of nines doesn't measure pain."}],"trick":"Nines = how MUCH skin (area), not how DEEP.","tip":"Separate 'how much' (extent) from 'how deep' (depth). They are different questions."},{"id":"N7-01","unit":"ch7","sec":"ch7-overview","focus":[["ch7-overview",0],["ch7-overview",1]],"type":"sata","stem":"A nurse is reviewing the skeleton with a client recovering from a hip replacement. Which bones belong to the appendicular skeleton? Select all that apply.","why":"The adult skeleton has 206 bones in two groups. Axial = the central axis (skull, hyoid, spine, rib cage). Appendicular = the limbs plus the girdles (pectoral and pelvic) that attach them to the trunk.","diff":1,"origin":"new","opts":[{"t":"Femur","c":true},{"t":"Scapula","c":true},{"t":"Coxal (hip) bone of the pelvic girdle","c":true},{"t":"Clavicle","c":true},{"t":"Sternum","w":"The sternum is part of the thoracic cage, which sits on the body's central axis (axial skeleton)."},{"t":"Vertebrae","w":"The vertebral column is the body's central axis, so it is axial."}],"trick":"APPENDicular = APPENDages, plus the girdles that hang them on the body.","tip":"SATA: judge each option on its own as true or false. Don't look for a set number of answers."},{"id":"N7-02","unit":"ch7","sec":"ch7-shape","focus":[["ch7-shape",0],["ch7-shape",1],["ch7-shape",2]],"type":"sata","stem":"A student nurse is matching bones to their shapes. Which pairings are correct? Select all that apply.","why":"Long = a shaft with two ends (femur, humerus, phalanges). Short = cube-like (carpals, tarsals). Flat = thin plates (skull, ribs, sternum, scapulae). Irregular = odd shapes (vertebrae). Sesamoid = forms inside a tendon (patella, inside the quadriceps tendon).","diff":2,"origin":"new","opts":[{"t":"Femur: long bone","c":true},{"t":"Patella: sesamoid bone","c":true},{"t":"Vertebra: irregular bone","c":true},{"t":"Rib: flat bone","c":true},{"t":"Phalanx (finger bone): short bone","w":"Phalanges are long bones. 'Long' means a shaft with two ends, not a big size."},{"t":"Tarsal (ankle bone): flat bone","w":"Tarsals and carpals are cube-like, so they are short bones."}],"trick":"Sesamoid looks like a sesame seed sitting in a tendon. The kneecap is the classic one.","tip":"SATA: test each pairing alone. One wrong word ('short' vs 'long') makes the whole option false."},{"id":"N7-03","unit":"ch7","sec":"ch7-long-bone","focus":[["ch7-long-bone",0],["ch7-long-bone",1]],"type":"mcq","stem":"A nurse reviews an X-ray of a client's femur. Which statement about the shaft (diaphysis) is accurate?","why":"The diaphysis is a thick collar of compact bone, which makes it rigid and strong. The epiphyses at the ends are mostly spongy bone and hold red marrow.","diff":1,"origin":"new","opts":[{"t":"It is made mostly of compact bone around a hollow medullary cavity.","c":true},{"t":"It is made mostly of spongy bone filled with red marrow.","w":"That describes the epiphyses (the expanded ends)."},{"t":"It is covered with hyaline articular cartilage.","w":"Articular cartilage covers only the ends, where the bone meets another bone in a joint."},{"t":"It is the site where the bone grows in length.","w":"Lengthwise growth happens at the epiphyseal plate, between the epiphysis and the diaphysis."}],"trick":"Diaphysis = the Dense shaft. Epiphyses = the Ends, spongy inside.","tip":"When options name two similar parts (diaphysis vs epiphysis), picture the bone and place each part before choosing."},{"id":"N7-04","unit":"ch7","sec":"ch7-long-bone","focus":[["ch7-long-bone",2]],"type":"mcq","stem":"A client with knee pain asks what normally covers the ends of the bones inside the joint. Which response by the nurse is accurate?","why":"The articular surfaces of long bones are covered with hyaline cartilage. It is smooth, so it reduces friction, and it acts as a shock absorber.","diff":1,"origin":"new","opts":[{"t":"Hyaline (articular) cartilage","c":true},{"t":"Fibrocartilage","w":"Fibrocartilage forms the intervertebral discs and the pad of the symphysis pubis, not the ends of long bones."},{"t":"Periosteum","w":"Periosteum covers the outside of the bone everywhere except over the articular cartilage."},{"t":"Compact bone with no covering","w":"The joint surface is capped with cartilage, which absorbs shock and reduces friction."}],"trick":"Hyaline = 'glassy' smooth, like ice on the bone ends so they glide.","tip":"Watch for options that are true facts about a different location (periosteum is real, just not on the joint surface)."},{"id":"N7-05","unit":"ch7","sec":"ch7-growth","focus":[["ch7-growth",1],["ch7-long-bone",3]],"type":"mcq","stem":"A parent looks at their 10-year-old's X-ray and asks why there is a dark line near the end of the tibia. Which response by the nurse is accurate?","why":"The epiphyseal disk (plate) is hyaline cartilage between the epiphysis and diaphysis. If you can see it on an X-ray, the bone is still lengthening. When growth ends it ossifies and leaves only a thin epiphyseal line.","diff":1,"origin":"new","opts":[{"t":"That is the epiphyseal plate. Seeing it means the bone is still growing.","c":true},{"t":"That dark line is a fracture.","w":"The growth plate is cartilage, which looks dark on an X-ray. It is normal in children."},{"t":"That is the epiphyseal line, which means growth has stopped.","w":"The thin epiphyseal line is what remains in adults after the plate ossifies."},{"t":"That is the medullary cavity.","w":"The medullary cavity is the hollow center of the shaft, not a line near the end."}],"trick":"PLATE = still Playing (growing). LINE = growth has Left.","tip":"Choose the answer that explains a normal finding before assuming the worst. Not every line on an X-ray is a break."},{"id":"N7-06","unit":"ch7","sec":"ch7-marrow","focus":[["ch7-marrow",0],["ch7-marrow",1],["ch7-marrow",2]],"type":"sata","stem":"A nurse is preparing a client for a bone marrow biopsy. Which statements about bone marrow are accurate? Select all that apply.","why":"Red marrow does hematopoiesis (makes all blood cells). Yellow marrow stores fat. In adults, red marrow stays in spongy bone of flat bones (sternum, ribs, pelvis, vertebrae) and in the upper ends of the femur and humerus, which is why the sternum or iliac crest is sampled.","diff":2,"origin":"new","opts":[{"t":"Red marrow forms red blood cells, white blood cells, and platelets.","c":true},{"t":"Yellow marrow stores fat.","c":true},{"t":"In adults, red marrow is found mainly in spongy bone, such as in the sternum and hip.","c":true},{"t":"The iliac crest is a common biopsy site because it keeps active red marrow for life.","c":true},{"t":"Red marrow increases as a person gets older.","w":"With age, much red marrow is replaced by yellow marrow."},{"t":"In adults, yellow marrow fills the epiphyses.","w":"Adult yellow marrow fills the medullary cavity of long-bone shafts. Epiphyses are spongy bone."}],"trick":"RED makes blood (red). YELLOW is butter-colored fat.","tip":"SATA: an absolute change ('increases with age') is a red flag. Check it against what you know."},{"id":"N7-07","unit":"ch7","sec":"ch7-cells","focus":[["ch7-cells",0]],"type":"mcq","stem":"A client's blood calcium is high because bone is being broken down too fast. Which bone cell is most responsible for breaking down (resorbing) bone?","why":"Osteoclasts are large, multinucleated cells that dissolve bone matrix with acid and enzymes. This releases calcium and phosphate into the blood.","diff":1,"origin":"new","opts":[{"t":"Osteoclast","c":true},{"t":"Osteoblast","w":"Osteoblasts build bone by secreting collagen and matrix."},{"t":"Osteocyte","w":"Osteocytes are mature cells that maintain bone from inside their lacunae."},{"t":"Osteoprogenitor cell","w":"Osteoprogenitor cells are stem cells that divide and become osteoblasts."}],"trick":"Clast = Cut/Crush. Blast = Build. Cyte = Caretaker. (From your guide.)","tip":"Bone-cell questions are about the suffix. Decode -clast, -blast and -cyte and the answer follows."},{"id":"N7-08","unit":"ch7","sec":"ch7-cells","focus":[["ch7-cells",1],["ch7-cells",2]],"type":"sata","stem":"Which statements about bone tissue are accurate? Select all that apply.","why":"Bone matrix is about 65% mineral (hydroxyapatite = hardness) and 35% organic (mostly collagen = flexibility and tensile strength). Osteocytes sit in lacunae and connect through canaliculi.","diff":2,"origin":"new","opts":[{"t":"Osteocytes live in small chambers called lacunae.","c":true},{"t":"Most of the bone matrix is hydroxyapatite (calcium phosphate crystals).","c":true},{"t":"Collagen fibers give bone flexibility so it does not shatter.","c":true},{"t":"Osteoclasts release calcium and phosphate into the blood.","c":true},{"t":"Osteoblasts divide quickly to make more bone cells.","w":"Osteoblasts cannot divide. Osteoprogenitor cells divide and become osteoblasts."},{"t":"Hydroxyapatite is what makes bone flexible.","w":"Hydroxyapatite makes bone hard. Collagen makes it flexible."}],"trick":"Hard Hydroxyapatite, Comfy-bendy Collagen.","tip":"Two options that swap the same two words (hard vs flexible) can't both be true. Decide which way is right."},{"id":"N7-09","unit":"ch7","sec":"ch7-compact-spongy","focus":[["ch7-compact-spongy",0],["ch7-compact-spongy",1],["ch7-compact-spongy",2]],"type":"mcq","stem":"A nurse is explaining bone types to a client with osteoporosis. Which description matches compact bone?","why":"Compact bone forms the wall of the diaphysis and is built of osteons (Haversian systems): concentric lamellae around a central canal. Spongy (cancellous) bone has trabeculae and no osteons, and fills the epiphyses.","diff":2,"origin":"new","opts":[{"t":"It is built of osteons: rings of matrix around a central canal.","c":true},{"t":"It is a lattice of thin plates (trabeculae) with open spaces.","w":"That is spongy bone."},{"t":"It is also called cancellous bone.","w":"Cancellous is another name for spongy bone."},{"t":"It makes up most of the epiphyses of long bones.","w":"The epiphyses are mainly spongy bone covered by a thin compact layer."}],"trick":"Compact = Concentric Circles (osteons). Cancellous comes from the Latin for 'lattice', so it is the spongy one with holes.","tip":"Eliminate any option that belongs to the 'other' item in a pair. Three of these describe spongy bone."},{"id":"N7-10","unit":"ch7","sec":"ch7-ossification","focus":[["ch7-ossification",0]],"type":"mcq","stem":"Which bone forms by intramembranous ossification?","why":"Intramembranous ossification builds bone inside sheets of fibrous membrane. It forms the flat bones of the skull roof (frontal, parietal, and parts of the occipital and temporal bones) and most of the clavicles. Most other bones, like the femur, radius and ulna, form from cartilage (endochondral).","diff":1,"origin":"new","opts":[{"t":"Frontal bone","c":true},{"t":"Femur","w":"The femur forms from a hyaline cartilage model (endochondral ossification)."},{"t":"Radius","w":"The radius forms by endochondral ossification."},{"t":"Ulna","w":"The ulna forms by endochondral ossification."}],"trick":"INTRAmembranous = flat skull bones made 'in membranes'. ENDOCHONDRAL = 'inside cartilage' (chondro = cartilage).","tip":"When three options share a feature (all limb bones) and one doesn't, the odd one out is often the answer."},{"id":"N7-11","unit":"ch7","sec":"ch7-ossification","focus":[["ch7-ossification",1]],"type":"order","stem":"Put the steps of endochondral ossification in order, from first to last.","why":"The cartilage model comes first, then it calcifies and dies in the middle, periosteum forms, and bone replaces cartilage from the center (diaphysis) out to the ends (epiphyses). At the end, cartilage is left only where it is still needed: joint surfaces and growth plates.","diff":3,"origin":"new","steps":["Hyaline cartilage forms in the shape of the future bone.","Cartilage cells in the center enlarge, the matrix calcifies, and the cells die.","Periosteum forms on the outside of the developing bone.","Blood vessels and osteoblasts invade, forming the primary ossification center in the diaphysis.","Secondary ossification centers appear in the epiphyses.","Cartilage remains only as articular cartilage and the epiphyseal plates."],"trick":"Model, Mineralize, Membrane wrap, Middle first, Ends second, Leftovers at joints and plates.","tip":"Ordering items: find the obvious first and last steps, then fill in the middle."},{"id":"N7-12","unit":"ch7","sec":"ch7-ossification","focus":[["ch7-ossification",1]],"type":"mcq","stem":"Which statement is NOT a step of endochondral ossification?","why":"In endochondral ossification, cartilage is replaced by bone, never by fat (adipose tissue). Your instructor flagged this false statement as a favorite.","diff":2,"origin":"new","opts":[{"t":"Hyaline cartilage changes into adipose tissue.","c":true},{"t":"A hyaline cartilage model forms in the shape of the bone.","w":"This is a real step. It is the very first one."},{"t":"A primary ossification center appears in the diaphysis.","w":"This is a real step. Osteoblasts replace cartilage from the center."},{"t":"Secondary ossification centers appear in the epiphyses.","w":"This is a real step that happens later."}],"trick":"Cartilage turns into BONE, never into FAT.","tip":"For NOT or EXCEPT questions, mark each option true or false. The answer is the only false one."},{"id":"N7-13","unit":"ch7","sec":"ch7-growth","focus":[["ch7-growth",0]],"type":"mcq","stem":"By about what age are all bones normally fully ossified?","why":"Most epiphyseal plates close between ages 14 and 20, and ossification of all bones is normally complete by about age 25.","diff":1,"origin":"new","opts":[{"t":"25 years","c":true},{"t":"12 years","w":"Bones are still growing at 12. Most growth plates close between ages 14 and 20."},{"t":"18 years","w":"Many plates close by then, but ossification of all bones is complete around 25."},{"t":"40 years","w":"Ossification is finished long before 40."}],"trick":"Quarter-century skeleton: done by 25.","tip":"Number questions: remember the anchor fact (25) and the range around it (plates close 14-20)."},{"id":"N7-14","unit":"ch7","sec":"ch7-growth","focus":[["ch7-growth",2]],"type":"mcq","stem":"How does a long bone grow in thickness (width)?","why":"Appositional growth: osteoblasts under the periosteum add compact bone on the outside while osteoclasts on the inside remove bone. The bone gets wider without getting too heavy.","diff":2,"origin":"new","opts":[{"t":"Osteoblasts beneath the periosteum deposit compact bone on the outer surface.","c":true},{"t":"Chondrocytes divide in the epiphyseal plate.","w":"That is how bone grows in length, not thickness."},{"t":"Osteoclasts add bone beneath the endosteum.","w":"Osteoclasts remove bone on the inner surface, which enlarges the medullary cavity."},{"t":"Yellow marrow hardens into bone.","w":"Marrow does not turn into bone."}],"trick":"Appositional = bone is 'applied' to the outside, like adding layers of paint.","tip":"Separate 'length' from 'thickness' before reading the options. They use different growth sites."},{"id":"N7-15","unit":"ch7","sec":"ch7-factors","focus":[["ch7-factors",0]],"type":"teaching","stem":"A nurse teaches a client about nutrients that help bones heal. Which statement by the client indicates a need for further teaching?","why":"Vitamin D increases calcium absorption from the small intestine. Vitamin C is needed to make collagen (lack of it causes scurvy and weak, slow-healing bones). The client mixed up the two vitamins.","diff":2,"origin":"new","opts":[{"t":"\"Vitamin C helps my body absorb calcium from my intestine.\"","c":true},{"t":"\"Vitamin C helps my body make collagen for the bone matrix.\"","w":"Accurate. Vitamin C is required for collagen synthesis."},{"t":"\"Vitamin D helps me absorb calcium from my intestine.\"","w":"Accurate. This is vitamin D's main bone job."},{"t":"\"Calcium and phosphorus make up the hard mineral part of bone.\"","w":"Accurate. They form hydroxyapatite."}],"trick":"C = Collagen. D = Digest (absorb) calcium.","tip":"'Needs further teaching' means find the WRONG statement. Three options will be correct facts."},{"id":"N7-16","unit":"ch7","sec":"ch7-factors","focus":[["ch7-factors",1]],"type":"mcq","stem":"A 35-year-old client has thickened bones in the hands, feet, and jaw caused by too much growth hormone. Which condition does this describe?","why":"Excess growth hormone before the epiphyseal plates ossify causes gigantism (very tall). In adults the plates are already closed, so bones can't lengthen. They thicken instead: acromegaly.","diff":2,"origin":"new","opts":[{"t":"Acromegaly","c":true},{"t":"Pituitary gigantism","w":"Gigantism is excess growth hormone BEFORE the growth plates close, so the bones grow very long."},{"t":"Pituitary dwarfism","w":"Dwarfism comes from too LITTLE growth hormone in childhood."},{"t":"Rickets","w":"Rickets is soft bones from lack of vitamin D in children."}],"trick":"Before plates close: GIANT. After: ACRO-megaly (acro = the ends: hands, feet, jaw).","tip":"Use the client's age as a clue. An adult can't have growth-plate problems."},{"id":"N7-17","unit":"ch7","sec":"ch7-factors","focus":[["ch7-factors",2],["ch7-factors",3]],"type":"sata","stem":"Which hormones can stop bones from growing longer by causing the epiphyseal plates to ossify? Select all that apply.","why":"Sex hormones stimulate ossification of the epiphyseal disks, which ends growth. Estrogen's effect is stronger than androgens', so girls' plates usually close earlier. An excess of thyroid hormone can also halt growth by closing the plates too early.","diff":3,"origin":"new","opts":[{"t":"Estrogen","c":true},{"t":"Testosterone (an androgen)","c":true},{"t":"Excess thyroid hormone","c":true},{"t":"Growth hormone","w":"Growth hormone makes plate cartilage divide, which keeps bones growing."},{"t":"Calcitonin","w":"Calcitonin controls blood calcium and remodeling, not plate closure."}],"trick":"Puberty hormones Put the brakes on height. Estrogen brakes harder.","tip":"SATA: an option that does the opposite (growth hormone speeds growth) is a quick elimination."},{"id":"N7-18","unit":"ch7","sec":"ch7-factors","focus":[["ch7-factors",4]],"type":"mcq","stem":"A client began weight-bearing exercise six months ago. A scan now shows thicker, stronger bones. What is this change called?","why":"Physical stress from weight-bearing activity and muscle pull stimulates bone growth. The increase in bone mass is called bone hypertrophy. Disuse causes the opposite, bone atrophy.","diff":1,"origin":"new","opts":[{"t":"Bone hypertrophy","c":true},{"t":"Bone atrophy","w":"Atrophy is bone LOSS from lack of use, such as long bed rest."},{"t":"Osteoporosis","w":"Osteoporosis is loss of bone mass, the opposite change."},{"t":"Acromegaly","w":"Acromegaly is bone thickening from excess growth hormone in adults, not from exercise."}],"trick":"Hyper = more (use it, gain it). Atrophy = 'a-trophy', no prize for skipping the gym.","tip":"Match the cause in the stem (exercise) to the effect. Two options here describe loss, so they can't fit."},{"id":"N7-19","unit":"ch7","sec":"ch7-functions","focus":[["ch7-functions",0]],"type":"sata","stem":"A nurse explains the jobs of the skeletal system to a client. Which are functions of bones? Select all that apply.","why":"Bones support the body, protect organs, act as levers for movement, make blood cells (red marrow), store salts like calcium and phosphate, and store fat (yellow marrow). On your instructor's exam this showed up as an 'all of the above' item.","diff":1,"origin":"new","opts":[{"t":"Producing blood cells","c":true},{"t":"Storing inorganic salts such as calcium and phosphate","c":true},{"t":"Protecting organs such as the brain and heart","c":true},{"t":"Storing fat for energy in yellow marrow","c":true},{"t":"Making vitamin C","w":"Bone needs vitamin C for collagen, but the body gets vitamin C from food."},{"t":"Producing insulin","w":"Insulin comes from the pancreas, not bone."}],"trick":"Some People Move Blood, Salts, and Energy: Support, Protection, Movement, Blood cells, Salt storage, Energy storage. (From your guide.)","tip":"If your exam shows 'all of the above', check that every listed item really is a skeletal function. Here blood cells, salts and protection all are."},{"id":"N7-20","unit":"ch7","sec":"ch7-remodeling","focus":[["ch7-remodeling",0],["ch7-remodeling",2]],"type":"mcq","stem":"A client's blood calcium level is above normal. Which response does the nurse expect the body to make?","why":"Negative feedback reverses the change. High blood calcium causes the thyroid to release calcitonin. Calcitonin inhibits osteoclasts, osteoblasts deposit calcium into bone, and the kidneys excrete more calcium, so blood calcium falls back to normal.","diff":2,"origin":"new","opts":[{"t":"The thyroid releases calcitonin, which slows osteoclasts and helps osteoblasts deposit calcium in bone.","c":true},{"t":"The parathyroid glands release PTH to stimulate osteoclasts.","w":"PTH is the response to LOW calcium. It would raise calcium further."},{"t":"Osteoclast activity increases to release more calcium.","w":"That would make the high calcium worse."},{"t":"The intestine absorbs more calcium.","w":"Extra absorption (with vitamin D) is part of the response to low calcium."}],"trick":"CalciTONEin TONES down blood calcium. (From your guide.)","tip":"Homeostasis questions: the correct response always pushes the value back toward normal. Rule out anything that pushes it further."},{"id":"N7-21","unit":"ch7","sec":"ch7-remodeling","focus":[["ch7-remodeling",1]],"type":"sata","stem":"A client's blood calcium is low, and the parathyroid glands release parathyroid hormone (PTH). Which effects of PTH should the nurse expect? Select all that apply.","why":"When the parathyroid glands sense low blood calcium, they release PTH. PTH raises calcium three ways: bone (osteoclasts release calcium), kidneys (keep calcium), and intestine (absorb more, with vitamin D).","diff":2,"origin":"new","opts":[{"t":"Osteoclasts are stimulated to break down bone.","c":true},{"t":"The kidneys reabsorb calcium back into the blood.","c":true},{"t":"The intestine absorbs more dietary calcium (with vitamin D).","c":true},{"t":"Osteoblasts deposit calcium into bone.","w":"That lowers blood calcium. It is calcitonin's effect."},{"t":"The kidneys excrete more calcium in the urine.","w":"That also lowers blood calcium. It is calcitonin's effect."}],"trick":"PTH Pulls calcium To the Heart (into the blood). (From your guide.)","tip":"SATA: sort each option into 'raises calcium' or 'lowers calcium'. Only the raisers fit PTH."},{"id":"N7-22","unit":"ch7","sec":"ch7-fractures","focus":[["ch7-fractures",0]],"type":"priority","stem":"The nurse receives report on four clients on the orthopedic unit. Which client should the nurse see first?","why":"In a compound (open) fracture the broken bone is exposed through an opening in the skin. That means bleeding and a high risk of infection, so it is acute and unstable. The other clients are stable or need teaching.","diff":2,"origin":"new","opts":[{"t":"A client with a compound fracture of the tibia, with bone visible through the skin","c":true},{"t":"A client with a closed greenstick fracture of the forearm in a cast, rating pain 3 out of 10","w":"A closed fracture in a cast with mild pain is stable. This client can wait."},{"t":"A client with osteoporosis asking about calcium supplements","w":"Teaching matters, but it can wait until physical needs are met."},{"t":"An adolescent with scoliosis waiting for a follow-up screening","w":"Scoliosis is a chronic, stable condition."}],"trick":"Compound = bone has COME out through the skin.","tip":"Priority: acute before chronic, unstable before stable, physical needs before teaching."},{"id":"N7-23","unit":"ch7","sec":"ch7-fractures","focus":[["ch7-fractures",2]],"type":"mcq","stem":"A 3-year-old is brought in with a spiral fracture of the humerus. The parent says the child fell off the couch. What should the nurse recognize?","why":"A spiral fracture is caused by excessive twisting of a bone and is often seen in child abuse cases. When the story doesn't match the injury, the nurse keeps the child safe and reports per policy.","diff":2,"origin":"new","opts":[{"t":"A twisting injury suggests possible abuse; report per policy.","c":true},{"t":"Spiral fractures are the usual result of short falls.","w":"A spiral fracture is caused by excessive twisting, which a simple fall doesn't explain well."},{"t":"A spiral fracture means the bone broke through the skin.","w":"Breaking through the skin is a compound (open) fracture."},{"t":"Spiral fractures happen only in adults with osteoporosis.","w":"A break from disease-weakened bone is a pathologic fracture."}],"trick":"Spiral = twiSted. A twisting injury in a small child is a red flag.","tip":"Safety answers win: when an injury doesn't match the explanation, protect the client first."},{"id":"N7-24","unit":"ch7","sec":"ch7-fractures","focus":[["ch7-fractures",1]],"type":"order","stem":"Put the stages of fracture repair in order, from first to last.","why":"Bleeding comes first (hematoma), then the clot is organized into granulation tissue, then a callus bridges the gap (cartilage first, then spongy bone), and finally remodeling restores the original shape.","diff":2,"origin":"new","steps":["Hematoma: a blood clot forms at the break.","Granulation tissue: fibroblasts and new blood vessels invade the clot.","Cartilaginous callus forms across the break.","Bony callus: osteoblasts replace the cartilage with spongy bone.","Remodeling: osteoclasts remove extra bone and compact bone restores the shape."],"trick":"Happy Grandmas Cook Recipes: Hematoma, Granulation, Callus, Remodeling. (From your guide.)","tip":"Ordering items: healing always starts with bleeding and clotting and ends with remodeling."},{"id":"N7-25","unit":"ch7","sec":"ch7-axial","focus":[["ch7-axial",0]],"type":"mcq","stem":"Which suture joins the parietal bone to the temporal bone?","why":"The squamous suture is the side seam just above the ear, where the parietal bone meets the temporal bone. A suture is an immovable fibrous joint.","diff":2,"origin":"new","opts":[{"t":"Squamous suture","c":true},{"t":"Coronal suture","w":"The coronal suture joins the frontal and parietal bones."},{"t":"Sagittal suture","w":"The sagittal suture runs between the two parietal bones."},{"t":"Lambdoid suture","w":"The lambdoid suture joins the parietal and occipital bones."}],"trick":"Coronal = Crown (front). Sagittal = Splits left and right. Lambdoid = back of the head, shaped like λ. Squamous = Side, above the ear.","tip":"Picture the skull from the side. The temporal bone is by the ear, so the answer is the side suture."},{"id":"N7-26","unit":"ch7","sec":"ch7-axial","focus":[["ch7-axial",1]],"type":"mcq","stem":"During a school screening, a nurse sees that a 13-year-old girl's right shoulder is higher than her left. Which condition does this suggest?","why":"Scoliosis is a sideways (lateral) curve of the spine. One shoulder or hip ends up lower than the other, and it is most common in adolescent girls.","diff":1,"origin":"new","opts":[{"t":"Scoliosis","c":true},{"t":"Kyphosis","w":"Kyphosis is an exaggerated thoracic curve ('hunchback')."},{"t":"Lordosis","w":"Lordosis is an exaggerated lumbar curve ('swayback')."},{"t":"Herniated disc","w":"A herniated disc presses on spinal nerves. It doesn't make one shoulder or hip higher."}],"trick":"Scoliosis = S-shaped Sideways curve. Kyphosis = hump. Lordosis = Lower back (Lumbar).","tip":"Use every clue in the stem: age, sex, and an uneven shoulder all point to one answer."},{"id":"N7-27","unit":"ch7","sec":"ch7-appendicular","focus":[["ch7-appendicular",0]],"type":"sata","stem":"A client fell on an outstretched arm and injured the pectoral girdle. Which bones make up the pectoral girdle? Select all that apply.","why":"The pectoral (shoulder) girdle is the two clavicles and two scapulae. It connects the upper limbs to the trunk.","diff":1,"origin":"new","opts":[{"t":"Clavicle","c":true},{"t":"Scapula","c":true},{"t":"Humerus","w":"The humerus is the upper-limb bone that attaches TO the girdle."},{"t":"Sternum","w":"The sternum is part of the axial thoracic cage."},{"t":"First rib","w":"Ribs are part of the axial skeleton."}],"trick":"Shoulder girdle = Collarbone + Shoulder blade: 'C and S'.","tip":"SATA can have only two correct answers. Don't add options just because they are near the shoulder."},{"id":"N7-28","unit":"ch7","sec":"ch7-aging","focus":[["ch7-aging",0]],"type":"mcq","stem":"Four 65-year-old clients have similar diets and activity levels. Which client is most likely to have the lowest bone mass?","why":"Women lose bone faster after menopause because estrogen falls. White or Asian ancestry tends to mean less peak bone mass to begin with. Together they give the lowest bone mass at 65.","diff":2,"origin":"new","opts":[{"t":"A light-skinned woman","c":true},{"t":"A dark-skinned woman","w":"Darker-skinned people tend to start with more peak bone mass."},{"t":"A light-skinned man","w":"Men don't have the fast bone loss that follows menopause."},{"t":"A dark-skinned man","w":"This client has neither the sex nor the ancestry risk factor."}],"trick":"Osteoporosis risk: Female + Fair skin + Frail frame.","tip":"Stack the risk factors. The client with the most risk factors is the answer."},{"id":"N7-29","unit":"ch7","sec":"ch7-aging","focus":[["ch7-aging",1]],"type":"mcq","stem":"An 80-year-old client fractured the upper femur after a minor fall. Why does this part of the bone often break in older adults?","why":"Trabecular (spongy) bone is lost sooner and faster than compact bone. The femoral neck and the vertebral bodies have lots of spongy bone, so they weaken first, which is why hip and vertebral compression fractures are common in older adults.","diff":2,"origin":"new","opts":[{"t":"Its spongy bone weakens sooner than its compact bone.","c":true},{"t":"Its compact bone is lost before its spongy bone.","w":"It is the reverse. Spongy bone is lost sooner and faster."},{"t":"Its epiphyseal plates reopen in older adults.","w":"Plates ossify for good. They never reopen."},{"t":"Its yellow marrow gradually turns into cartilage.","w":"Marrow does not turn into cartilage."}],"trick":"Spongy goes Soonest: the hip and spine break first.","tip":"If two options say opposite things (spongy first vs compact first), one of them is usually the answer."},{"id":"N7-30","unit":"ch7","sec":"ch7-aging","focus":[],"type":"teaching","stem":"A nurse teaches a 60-year-old postmenopausal client about preventing osteoporosis. Which statement by the client indicates a need for further teaching?","why":"Lack of use causes bone atrophy, as in prolonged bed rest. Weight-bearing exercise, enough calcium and vitamin D, and avoiding smoking and heavy alcohol all protect bone.","diff":1,"origin":"new","opts":[{"t":"\"Resting in bed as much as I can will protect my bones.\"","c":true},{"t":"\"Walking and other weight-bearing exercise will help my bones.\"","w":"Accurate. Physical stress builds bone mass."},{"t":"\"I need enough calcium and vitamin D every day.\"","w":"Accurate. Low calcium or vitamin D is a risk factor."},{"t":"\"Quitting smoking can help protect my bones.\"","w":"Accurate. Smoking is a risk factor."}],"trick":"Bones follow 'use it or lose it'.","tip":"'Needs further teaching' = the statement that would hurt the client if they followed it."},{"id":"N7-31","unit":"ch7","sec":"ch7-aging","focus":[],"type":"math","stem":"A provider prescribes calcium carbonate 1,000 mg by mouth daily for a client with osteoporosis. The tablets on hand are 500 mg each. How many tablets should the nurse give?","why":"Desired ÷ Have × Quantity = 1,000 mg ÷ 500 mg × 1 tablet = 2 tablets.","diff":1,"origin":"new","opts":[{"t":"2 tablets","c":true},{"t":"0.5 tablet","w":"This flips the formula (have ÷ desired). Always put the dose you WANT on top."},{"t":"1 tablet","w":"One tablet is only 500 mg, half the prescribed dose."},{"t":"4 tablets","w":"Four tablets would be 2,000 mg, double the dose."}],"trick":"D over H times Q: what you Desire, over what you Have, times the Quantity it comes in.","tip":"Med math: check that your answer makes sense. A dose bigger than one tablet needs more than one tablet."},{"id":"N7-32","unit":"ch7","sec":"ch7-disorders","focus":[],"type":"mcq","stem":"A child has bowed legs and soft bones caused by a lack of vitamin D. Which disorder does the nurse recognize?","why":"Lack of vitamin D (or calcium) makes bones soft. In children this is rickets, which causes bowed legs. In adults the same problem is called osteomalacia.","diff":1,"origin":"new","opts":[{"t":"Rickets","c":true},{"t":"Osteogenesis imperfecta","w":"This is an inherited collagen defect ('brittle bone disease')."},{"t":"Scurvy","w":"Scurvy comes from lack of vitamin C, which is needed for collagen."},{"t":"Osteoporosis","w":"Osteoporosis is porous, fragile bone, mostly in older adults."}],"trick":"Rickets = Rubbery legs in kids. Vitamin D = 'Don't bend'.","tip":"Link the deficiency to its disease: D goes with rickets and osteomalacia, C goes with scurvy."},{"id":"N8-01","unit":"ch8","sec":"ch8-functional","focus":[["ch8-functional",0]],"type":"mcq","stem":"A client asks why the discs between the vertebrae let the spine bend a little but not a lot. Which functional class describes a joint with some limited movement?","why":"Functional classes describe how much a joint moves. Amphiarthrotic joints move a little: intervertebral discs, the symphysis pubis, and the distal tibiofibular joint.","diff":1,"origin":"new","opts":[{"t":"Amphiarthrotic","c":true},{"t":"Synarthrotic","w":"Synarthrotic joints are immovable, like skull sutures."},{"t":"Diarthrotic","w":"Diarthrotic joints are freely movable, like the shoulder and knee."},{"t":"Synovial","w":"Synovial is a structural class (fluid-filled cavity), not a functional one."}],"trick":"Syn = Stuck. Amphi = About half. Di = Does everything. (From your guide.)","tip":"Check which classification the question asks for. 'Synovial' is a real joint word, but it answers a structure question, not a movement question."},{"id":"N8-02","unit":"ch8","sec":"ch8-functional","focus":[["ch8-functional",1]],"type":"sata","stem":"Which joint-to-movement pairings are correct? Select all that apply.","why":"Synarthrotic = immovable (sutures). Amphiarthrotic = slightly movable (symphysis pubis, intervertebral discs, distal tibiofibular joint). Diarthrotic = freely movable (most limb joints, like the knee and shoulder).","diff":2,"origin":"new","opts":[{"t":"Skull suture: synarthrotic (immovable)","c":true},{"t":"Knee: diarthrotic (freely movable)","c":true},{"t":"Symphysis pubis: amphiarthrotic (slightly movable)","c":true},{"t":"Shoulder: synarthrotic (immovable)","w":"The shoulder is the most freely movable joint, so it is diarthrotic."},{"t":"Distal tibiofibular joint: diarthrotic (freely movable)","w":"This syndesmosis has only a little 'give', so it is amphiarthrotic."}],"trick":"Syn = Stuck. Amphi = About half. Di = Does everything.","tip":"SATA: judge each pairing alone. Picture whether that joint actually moves."},{"id":"N8-03","unit":"ch8","sec":"ch8-fibrous","focus":[["ch8-fibrous",0],["ch8-fibrous",1]],"type":"mcq","stem":"The parietal and temporal bones of the skull are joined by which type of joint?","why":"Skull bones (except the mandible) are joined by sutures: very short collagen fibers with no joint cavity. Structurally fibrous, functionally synarthrotic (immovable). The parietal–temporal one is the squamous suture.","diff":2,"origin":"new","opts":[{"t":"A suture: a fibrous joint that is synarthrotic","c":true},{"t":"A symphysis: a cartilaginous joint that is amphiarthrotic","w":"Symphyses join the vertebral bodies and the pubic bones, not skull bones."},{"t":"A synovial joint that is diarthrotic","w":"The only movable skull joint is the jaw (TMJ). The parietal and temporal bones don't move."},{"t":"A syndesmosis: a fibrous joint with a ligament","w":"Syndesmoses have longer fibers that allow a little give, like the distal tibiofibular joint."}],"trick":"Sutures are like stitches holding the skull plates shut.","tip":"Joint questions often need two labels: what it's made of (structure) and how much it moves (function). Make sure both halves are right."},{"id":"N8-04","unit":"ch8","sec":"ch8-fibrous","focus":[],"type":"mcq","stem":"A dental client asks how a tooth is held in its socket. Which type of joint is this?","why":"A gomphosis is a fibrous joint where the short periodontal ligament holds a tooth in its socket. It is synarthrotic (immovable).","diff":2,"origin":"new","opts":[{"t":"Gomphosis","c":true},{"t":"Suture","w":"Sutures join skull bones."},{"t":"Synchondrosis","w":"A synchondrosis is joined by hyaline cartilage, like the epiphyseal plate."},{"t":"Gliding joint","w":"Gliding joints are synovial joints between flat surfaces, like the carpals."}],"trick":"Gomphosis = a tooth 'bolted' into the gums.","tip":"Odd-sounding terms are often the right answer when the stem describes something specific, like teeth."},{"id":"N8-05","unit":"ch8","sec":"ch8-cartilaginous","focus":[["ch8-cartilaginous",0],["ch8-cartilaginous",1],["ch8-summary",0]],"type":"mcq","stem":"Which statement correctly describes the symphysis pubis?","why":"A symphysis is a cartilaginous joint joined by fibrocartilage. It works as a compressible shock absorber and is amphiarthrotic. The symphysis pubis and the intervertebral discs are both symphyses. Your instructor flagged that it is neither fibrous nor synovial.","diff":2,"origin":"new","opts":[{"t":"It is a cartilaginous joint with a fibrocartilage pad, and it is slightly movable.","c":true},{"t":"It is a fibrous joint held by short collagen fibers.","w":"Short collagen fibers describe a suture. The symphysis pubis is NOT fibrous."},{"t":"It is a synovial joint with a fluid-filled cavity.","w":"The symphysis pubis is NOT synovial. It has no joint cavity."},{"t":"It is a synchondrosis made of hyaline cartilage.","w":"Synchondroses use hyaline cartilage (like the epiphyseal plate). Symphyses use fibrocartilage."}],"trick":"SYMphysis = SYMmetrical pads of fibrocartilage in the middle of the body (pubis, spine).","tip":"When an option uses the word 'synovial' or 'fibrous' for a cartilage joint, cross it out."},{"id":"N8-06","unit":"ch8","sec":"ch8-cartilaginous","focus":[["ch8-cartilaginous",0]],"type":"sata","stem":"Which joints are symphyses? Select all that apply.","why":"Symphyses are fibrocartilage pads: the intervertebral discs and the symphysis pubis. Synchondroses are hyaline cartilage plates: the epiphyseal plate and the first rib–manubrium joint.","diff":2,"origin":"new","opts":[{"t":"The joint between the bodies of two vertebrae (intervertebral disc)","c":true},{"t":"The joint between the two pubic bones","c":true},{"t":"The epiphyseal plate","w":"The epiphyseal plate is a synchondrosis (hyaline cartilage) that later turns to bone."},{"t":"The joint between the first rib and the manubrium","w":"This is also a synchondrosis."},{"t":"The joint between the parietal and temporal bones","w":"That is a suture, a fibrous joint."}],"trick":"Hyaline plate = synCHONDROsis (chondro = cartilage, grows then ossifies). Fibro pad = symphysis (stays cartilage for life).","tip":"SATA can have just two answers. Stop once the remaining options clearly belong to another category."},{"id":"N8-07","unit":"ch8","sec":"ch8-synovial-structure","focus":[["ch8-synovial-structure",0],["ch8-synovial-structure",4]],"type":"sata","stem":"A nurse is teaching about a client's knee replacement. Which statements about synovial joints are accurate? Select all that apply.","why":"Every synovial joint has articular (hyaline) cartilage on the bone ends, a joint capsule reinforced by ligaments, a synovial membrane that makes fluid, and a fluid-filled cavity. That design makes them freely movable.","diff":2,"origin":"new","opts":[{"t":"The ends of the bones are covered with hyaline (articular) cartilage.","c":true},{"t":"A joint capsule, reinforced by ligaments, holds the bones together.","c":true},{"t":"The synovial membrane secretes synovial fluid.","c":true},{"t":"Tendons connect the bones to each other inside the capsule.","w":"Ligaments connect bone to bone. Tendons connect muscle to bone."},{"t":"Synovial joints have no joint cavity.","w":"A fluid-filled joint cavity is the defining feature of a synovial joint."}],"trick":"Ligament links bone to bone. Tendon ties muscle to bone.","tip":"Watch for one swapped word (tendon vs ligament). It is the classic SATA trap."},{"id":"N8-08","unit":"ch8","sec":"ch8-synovial-structure","focus":[["ch8-synovial-structure",1]],"type":"mcq","stem":"Which structure secretes synovial fluid, lines the joint cavity, and reabsorbs fluid?","why":"The synovial membrane is the inner layer of the joint capsule. It secretes synovial fluid (lubricant and nourishment for the cartilage), reabsorbs fluid, and its phagocytes clear debris.","diff":1,"origin":"new","opts":[{"t":"Synovial membrane","c":true},{"t":"Articular cartilage","w":"Articular cartilage covers the bone ends. It reduces friction but doesn't make fluid."},{"t":"Fibrous layer of the capsule","w":"The tough outer fibrous layer holds the bones together. The inner layer makes the fluid."},{"t":"Meniscus","w":"A meniscus is a fibrocartilage pad that absorbs shock in the knee."}],"trick":"The synovial membrane makes the synovial fluid: same word, same job.","tip":"When the name of the answer matches the name in the stem (synovial fluid, synovial membrane), it is often right, but confirm the function."},{"id":"N8-09","unit":"ch8","sec":"ch8-synovial-structure","focus":[["ch8-synovial-structure",3]],"type":"mcq","stem":"A client who leans on their elbows all day has a swollen, fluid-filled sac over the point of the elbow. Which structure is inflamed?","why":"Bursae are flat fluid-filled sacs lined with synovial membrane. They sit between skin and bony prominences (and between tendons and bone) where friction happens. Inflammation of a bursa is bursitis.","diff":1,"origin":"new","opts":[{"t":"A bursa","c":true},{"t":"A meniscus","w":"Menisci are fibrocartilage pads inside the knee."},{"t":"A ligament","w":"Ligaments are bands connecting bone to bone, not sacs."},{"t":"A fat pad","w":"Fat pads cushion and fill space but are not fluid-filled sacs."}],"trick":"Bursa = a little purse of fluid. Bursitis = the purse is swollen.","tip":"Match the description ('fluid-filled sac') to the structure word by word."},{"id":"N8-10","unit":"ch8","sec":"ch8-synovial-structure","focus":[["ch8-synovial-structure",2],["ch8-examples",4]],"type":"mcq","stem":"A soccer player has a torn C-shaped pad of fibrocartilage inside the knee. Which structure is torn?","why":"Menisci (medial and lateral) are C-shaped fibrocartilage pads in the knee. They absorb shock and improve how the femur fits on the tibia.","diff":2,"origin":"new","opts":[{"t":"Meniscus","c":true},{"t":"Bursa","w":"A bursa is a fluid-filled sac, not a cartilage pad."},{"t":"Anterior cruciate ligament (ACL)","w":"The ACL is a ligament inside the knee, not a C-shaped cartilage pad."},{"t":"Articular disc of the jaw","w":"Articular discs are also fibrocartilage, but this one is in the jaw, not the knee."}],"trick":"Meniscus = crescent moon (C-shaped) cushions in the knee.","tip":"Use location plus shape: 'C-shaped' + 'knee' points to only one structure."},{"id":"N8-11","unit":"ch8","sec":"ch8-synovial-structure","focus":[],"type":"teaching","stem":"A nurse teaches a client with a sprained ankle about joint structures. Which statement by the client indicates a need for further teaching?","why":"Ligaments connect bone to bone and reinforce the joint capsule. Tendons connect muscle to bone. Joint stability depends on the shape of the bones, the ligaments, and muscle tone.","diff":1,"origin":"new","opts":[{"t":"\"Ligaments connect my muscles to my bones.\"","c":true},{"t":"\"Tendons connect muscle to bone.\"","w":"Accurate."},{"t":"\"Synovial fluid lubricates the joint and nourishes the cartilage.\"","w":"Accurate."},{"t":"\"Strong muscles around a joint help keep it stable.\"","w":"Accurate. Muscle tone is one of the three factors in joint stability."}],"trick":"Ligament links bone to bone. Tendon ties muscle to bone. (From your guide.)","tip":"'Needs further teaching' = find the incorrect statement."},{"id":"N8-12","unit":"ch8","sec":"ch8-types","focus":[["ch8-types",0],["ch8-types",1]],"type":"mcq","stem":"Which type of synovial joint allows the most movement, including rotation?","why":"A ball-and-socket joint (shoulder, hip) has a rounded head in a cup, so it allows flexion, extension, abduction, adduction, circumduction, and rotation. Pivot joints also rotate, but only around one axis.","diff":1,"origin":"new","opts":[{"t":"Ball-and-socket joint","c":true},{"t":"Hinge joint","w":"Hinges allow only flexion and extension in one plane."},{"t":"Condyloid joint","w":"Condyloid joints allow all angular movements EXCEPT rotation."},{"t":"Gliding joint","w":"Gliding joints only slide back and forth."}],"trick":"Ball and socket: the shoulder and hip rock. (From your guide.)","tip":"'Most' questions: pick the option that does everything the others do and more."},{"id":"N8-13","unit":"ch8","sec":"ch8-types","focus":[["ch8-types",2]],"type":"sata","stem":"Which joint-type pairings are correct? Select all that apply.","why":"Saddle = base of the thumb (allows opposition). Gliding = between carpals and tarsals. Pivot = atlas–axis (shaking your head 'no'). Hinge = elbow and knee. Condyloid = wrist and knuckles.","diff":2,"origin":"new","opts":[{"t":"Base of the thumb: saddle joint","c":true},{"t":"Between the carpals: gliding joint","c":true},{"t":"Atlas and axis: pivot joint","c":true},{"t":"Elbow: ball-and-socket joint","w":"The elbow is mainly a hinge joint."},{"t":"Wrist (radiocarpal): pivot joint","w":"The radiocarpal wrist joint is condyloid."}],"trick":"Pivot: shake your head 'no.' Saddle: the thumb can touch every finger. (From your guide.)","tip":"Act it out. Move your own thumb, wrist and head to check each pairing."},{"id":"N8-14","unit":"ch8","sec":"ch8-types","focus":[["ch8-types",3]],"type":"mcq","stem":"Which statement about a condyloid joint, such as the wrist, is accurate?","why":"A condyloid (ellipsoidal) joint has an oval head in an oval cavity. It allows flexion, extension, abduction, adduction and circumduction (two planes), but not rotation.","diff":3,"origin":"new","opts":[{"t":"It moves in two planes but does not allow rotation.","c":true},{"t":"It allows rotation, like a ball-and-socket joint.","w":"Condyloid joints allow every angular movement except rotation."},{"t":"It is limited to one plane, like a hinge.","w":"Condyloid joints move in two planes, not one."},{"t":"It is the joint between the atlas and axis.","w":"The atlas–axis joint is a pivot joint."}],"trick":"Condyloid = oval, so it can't spin. Try twisting your wrist alone: the forearm does the turning.","tip":"Two of these options are 'too much' or 'too little'. The answer sits in the middle."},{"id":"N8-15","unit":"ch8","sec":"ch8-types","focus":[["ch8-types",4]],"type":"mcq","stem":"The elbow and the knee are primarily which type of joint?","why":"Hinge joints move like a door: flexion and extension in one plane. The elbow (humerus–ulna), the knee and the finger joints are hinges. The knee also allows slight rotation.","diff":1,"origin":"new","opts":[{"t":"Hinge","c":true},{"t":"Pivot","w":"Pivot joints rotate around one axis (atlas–axis)."},{"t":"Saddle","w":"The saddle joint is at the base of the thumb."},{"t":"Ball-and-socket","w":"Ball-and-socket joints are the shoulder and hip."}],"trick":"Hinge: like a door at the elbow and knee. (From your guide.)","tip":"Picture the movement: bend and straighten only, like a door, means hinge."},{"id":"N8-16","unit":"ch8","sec":"ch8-movements","focus":[["ch8-movements",0]],"type":"mcq","stem":"During range-of-motion exercises, the nurse asks a client to pull the top of the foot up toward the shin. Which movement is this?","why":"Dorsiflexion brings the top (dorsum) of the foot closer to the shin, as when you stand on your heels. Plantar flexion is the opposite: pointing the toes.","diff":1,"origin":"new","opts":[{"t":"Dorsiflexion","c":true},{"t":"Plantar flexion","w":"Plantar flexion points the toes down, like standing on tiptoe."},{"t":"Inversion","w":"Inversion turns the sole of the foot inward."},{"t":"Eversion","w":"Eversion turns the sole of the foot outward."}],"trick":"DORSiflexion = toes up like a shark's DORSal fin. PLANTar flexion = press the gas pedal, sole toward the floor.","tip":"Opposite pairs are common distractors. Decide the direction first, then the name."},{"id":"N8-17","unit":"ch8","sec":"ch8-movements","focus":[["ch8-movements",1]],"type":"mcq","stem":"A client lowers the arm from straight out at the side back down against the body. Which movement is this?","why":"Adduction moves a body part toward the trunk (midline). Abduction moves it away.","diff":1,"origin":"new","opts":[{"t":"Adduction","c":true},{"t":"Abduction","w":"Abduction moves the arm AWAY from the midline (raising it to the side)."},{"t":"Circumduction","w":"Circumduction moves a limb in a cone-shaped circle."},{"t":"Rotation","w":"Rotation turns a bone around its own long axis."}],"trick":"ADDuction = ADD it back to the body. ABduction = ABduct (take it away). (From your guide.)","tip":"Abduction and adduction differ by one letter. Slow down and read each one."},{"id":"N8-18","unit":"ch8","sec":"ch8-movements","focus":[],"type":"sata","stem":"A nurse documents a client's range of motion. Which descriptions are accurate? Select all that apply.","why":"Flexion decreases a joint angle and extension increases it. Supination = palm up, pronation = palm down (rotation at the radioulnar joint). Inversion = sole in, eversion = sole out.","diff":2,"origin":"new","opts":[{"t":"Pronation turns the palm down.","c":true},{"t":"Supination turns the palm up.","c":true},{"t":"Flexion decreases the angle between two bones.","c":true},{"t":"Extension decreases the angle between two bones.","w":"Extension INCREASES the angle (straightening the elbow)."},{"t":"Eversion turns the sole of the foot inward.","w":"That is inversion. Eversion turns the sole outward."}],"trick":"SUPination: you can hold a bowl of SOUP. PRONE = face (palm) down.","tip":"SATA with opposite pairs: only one direction of each pair can be correct."},{"id":"N8-19","unit":"ch8","sec":"ch8-examples","focus":[["ch8-examples",0],["ch8-examples",1]],"type":"mcq","stem":"A client is scheduled for rotator cuff repair. What is the anatomical name of the joint this surgery stabilizes?","why":"The shoulder joint is the glenohumeral joint: the head of the humerus in the glenoid cavity of the scapula. Because the socket is shallow, it is stabilized mainly by the rotator cuff (four muscles and their tendons).","diff":2,"origin":"new","opts":[{"t":"Glenohumeral joint","c":true},{"t":"Acromioclavicular joint","w":"This is a separate small joint between the acromion and the clavicle."},{"t":"Coxal joint","w":"The coxal joint is the hip."},{"t":"Sternoclavicular joint","w":"This joins the sternum and the clavicle."}],"trick":"GLENO-HUMERAL = GLENOid cavity + HUMERus.","tip":"Break long anatomy names into their bones. The name tells you which bones meet."},{"id":"N8-20","unit":"ch8","sec":"ch8-examples","focus":[["ch8-examples",3],["ch8-summary",1]],"type":"sata","stem":"Which statements about the major joints are accurate? Select all that apply.","why":"Mobility and stability trade off. The shoulder's shallow socket gives the most motion and the most dislocations. The hip's deep acetabulum makes it stable but less mobile. The knee is the largest, most complex synovial joint.","diff":2,"origin":"new","opts":[{"t":"The shoulder has the greatest range of motion, so it dislocates most easily.","c":true},{"t":"The hip is less mobile than the shoulder because of its deep socket and strong ligaments.","c":true},{"t":"The knee is the largest and most complex synovial joint.","c":true},{"t":"The hip is the largest and most complex synovial joint.","w":"That title belongs to the knee."},{"t":"The elbow is a ball-and-socket joint.","w":"The elbow is a hinge joint."}],"trick":"Shallow socket = more swing, more slips (shoulder). Deep socket = steady (hip).","tip":"Comparison SATAs: check that each 'more' or 'most' points at the right joint."},{"id":"N8-21","unit":"ch8","sec":"ch8-examples","focus":[["ch8-examples",2]],"type":"mcq","stem":"An injury report mentions the radial collateral ligament. Which joint is involved?","why":"The elbow is very stable thanks to strong ligaments: the radial collateral ligament on the lateral side and the ulnar collateral ligament on the medial side.","diff":2,"origin":"new","opts":[{"t":"Elbow","c":true},{"t":"Knee","w":"The knee's collateral ligaments are the tibial (medial) and fibular (lateral) collateral ligaments."},{"t":"Shoulder","w":"The shoulder relies mainly on the rotator cuff."},{"t":"Hip","w":"The hip is reinforced by large hip ligaments, not the radial collateral."}],"trick":"Radial and ulnar are forearm bones, so their collateral ligaments guard the elbow.","tip":"Use the bone name inside a structure's name to find its location."},{"id":"N8-22","unit":"ch8","sec":"ch8-examples","focus":[],"type":"mcq","stem":"A client tore the anterior cruciate ligament (ACL). What does the ACL normally prevent?","why":"The cruciate ligaments cross inside the knee capsule. The ACL stops the tibia from sliding anteriorly, and the PCL stops it from sliding posteriorly. Both help prevent hyperextension.","diff":2,"origin":"new","opts":[{"t":"The tibia sliding forward (anteriorly) under the femur","c":true},{"t":"The tibia sliding backward (posteriorly)","w":"That is the job of the posterior cruciate ligament (PCL)."},{"t":"Friction between the patella and femur","w":"Cartilage and fluid reduce friction. The ACL is a stabilizing ligament."},{"t":"Swelling of the bursae","w":"Ligaments don't control bursa swelling."}],"trick":"ACL stops the tibia sliding Anteriorly. PCL stops it sliding Posteriorly. (From your guide.)","tip":"The first letter of the ligament's name gives you the direction."},{"id":"N8-23","unit":"ch8","sec":"ch8-aging","focus":[["ch8-aging",0]],"type":"mcq","stem":"A 28-year-old client is surprised that their knees feel stiffer than they used to. When does loss of function in synovial joints often begin?","why":"Collagen changes cause stiffening beginning around age 30, so loss of synovial joint function often begins in the third decade of life. Fibrocartilage also loses water with age. Exercise delays stiffening.","diff":2,"origin":"new","opts":[{"t":"In the third decade (your 20s)","c":true},{"t":"Only after the age of 70","w":"Changes begin much earlier, around age 30."},{"t":"During early childhood","w":"Childhood joints are still growing and flexible."},{"t":"Only after menopause begins","w":"Joint stiffening affects everyone and starts well before menopause."}],"trick":"Third decade = your twenties. Joint changes start earlier than most people expect.","tip":"Decades count from birth: the first decade is ages 0 to 10, so the third decade is roughly your twenties."},{"id":"N8-24","unit":"ch8","sec":"ch8-disorders","focus":[["ch8-disorders",0]],"type":"priority","stem":"The nurse in a sports medicine clinic has four clients waiting. Which client should the nurse see first?","why":"A dislocation displaces the articulating bones, so the joint is clearly deformed, and it often damages the capsule and ligaments. It is acute and needs attention first.","diff":2,"origin":"new","opts":[{"t":"A client whose shoulder is visibly deformed after a fall and who cannot move the arm","c":true},{"t":"A client with an ankle sprain who is resting with ice and elevation","w":"This injury is already being managed and is stable."},{"t":"A client with osteoarthritis reporting morning knee stiffness","w":"A chronic, expected symptom. It can wait."},{"t":"A client with gout asking which foods to avoid","w":"Teaching is important but not urgent."}],"trick":"Dislocation = the joint looks 'dis-placed'. Deformed means look first.","tip":"Priority: new and acute beats chronic and expected. Teaching comes last."},{"id":"N8-25","unit":"ch8","sec":"ch8-disorders","focus":[["ch8-disorders",1]],"type":"mcq","stem":"A client twisted an ankle and overstretched its ligaments. Which injury is this?","why":"A sprain is overstretching or tearing of the ligaments (and sometimes tendons) in a joint. A strain is the same kind of injury to a muscle.","diff":1,"origin":"new","opts":[{"t":"Sprain","c":true},{"t":"Strain","w":"A strain overstretches or tears a MUSCLE, like a hamstring."},{"t":"Dislocation","w":"A dislocation displaces the bones, leaving the joint deformed."},{"t":"Bursitis","w":"Bursitis is inflammation of a bursa."}],"trick":"sTrain has a T, as in Tug on a muscle. Sprain is the joint's ligaments.","tip":"Look for the tissue named in the stem (ligament vs muscle). That decides sprain vs strain."},{"id":"N8-26","unit":"ch8","sec":"ch8-disorders","focus":[["ch8-disorders",2]],"type":"teaching","stem":"A nurse teaches a client newly diagnosed with rheumatoid arthritis (RA). Which statement by the client indicates a need for further teaching?","why":"RA is autoimmune: the immune system attacks the synovial membrane. Wear and tear from aging causes osteoarthritis (OA). They do not share the same cause.","diff":2,"origin":"new","opts":[{"t":"\"My RA is caused by wear and tear from getting older.\"","c":true},{"t":"\"In RA, my immune system attacks the synovial membrane.\"","w":"Accurate. RA is autoimmune."},{"t":"\"Osteoarthritis is the most common type and affects weight-bearing joints.\"","w":"Accurate."},{"t":"\"Gout is caused by uric acid crystals in the joint.\"","w":"Accurate."}],"trick":"OA = Old and Aching. RA = Rogue Antibodies. (From your guide.)","tip":"'Needs further teaching' = the one statement that mixes up two conditions."},{"id":"N8-27","unit":"ch8","sec":"ch8-disorders","focus":[["ch8-disorders",3]],"type":"mcq","stem":"A client who went hiking in the woods now has a swollen, painful knee and remembers a tick bite. Which condition should the nurse suspect?","why":"Lyme arthritis is caused by the bacterium Borrelia burgdorferi, transmitted by a tick bite. It causes joint swelling and pain, especially in the knees.","diff":1,"origin":"new","opts":[{"t":"Lyme arthritis, caused by a tick-borne bacterium","c":true},{"t":"Gout, caused by uric acid crystals","w":"Gout often hits the big toe and is not linked to tick bites."},{"t":"Rheumatoid arthritis, an autoimmune disease","w":"RA is not caused by a tick bite."},{"t":"Osteoarthritis from wear and tear","w":"OA develops slowly with age, not after a bite."}],"trick":"Lyme = Little tick, Large knee.","tip":"A clear exposure in the stem (tick bite) usually points straight to the answer."},{"id":"N9-01","unit":"ch9","sec":"ch9-structure","focus":[["ch9-structure",0]],"type":"mcq","stem":"During surgery, the surgeon cuts through the deep fascia. Which connective tissue layer, wrapping the entire muscle, lies just underneath?","why":"From outside in: deep fascia, then epimysium (the whole muscle, the outermost connective tissue layer), then perimysium (each fascicle), then endomysium (each fiber).","diff":1,"origin":"new","opts":[{"t":"Epimysium","c":true},{"t":"Perimysium","w":"Perimysium wraps each fascicle (a bundle of fibers), deeper inside."},{"t":"Endomysium","w":"Endomysium wraps each single muscle fiber, the deepest layer."},{"t":"Sarcolemma","w":"The sarcolemma is the cell membrane of a muscle fiber, not a connective tissue wrap."}],"trick":"Epi = on the outside, Peri = around the bundle, Endo = inside, around each fiber. (From your guide.)","tip":"Layer questions: line up the prefixes from outside to inside before reading the options."},{"id":"N9-02","unit":"ch9","sec":"ch9-structure","focus":[["ch9-structure",1]],"type":"mcq","stem":"A client has an Achilles tendon injury. What is a tendon?","why":"A tendon is a cord of dense connective tissue that attaches muscle to bone. A ligament attaches bone to bone, and an aponeurosis is a broad flat sheet.","diff":1,"origin":"new","opts":[{"t":"A cord of dense connective tissue that attaches muscle to bone","c":true},{"t":"A band that attaches bone to bone","w":"That is a ligament."},{"t":"A broad, flat sheet that attaches a muscle to another muscle","w":"That is an aponeurosis."},{"t":"A seam where the fibers of two muscles meet","w":"That is a raphe."}],"trick":"Tendon ties muscle to bone. Ligament links bone to bone.","tip":"All four options are real structures. Match the exact connection described."},{"id":"N9-03","unit":"ch9","sec":"ch9-structure","focus":[["ch9-structure",2]],"type":"priority","stem":"The nurse is caring for four clients on the orthopedic unit. Which client should the nurse assess first?","why":"Severe pain that medicine doesn't relieve, plus a tight, swollen limb after an injury, suggests compartment syndrome. Fluid pressure inside the fascia compartment squeezes vessels and nerves, and untreated it can permanently damage tissue. Surgery (fasciotomy) relieves the pressure.","diff":3,"origin":"new","opts":[{"t":"A client with a casted lower-leg fracture whose severe calf pain is not relieved by pain medicine and whose calf feels tight","c":true},{"t":"A client with a pulled hamstring resting with ice","w":"A muscle strain being treated with rest and ice is stable."},{"t":"A client with muscular dystrophy who wants to talk about a support group","w":"Important, but not urgent."},{"t":"A client with tendinitis asking when they can return to tennis","w":"Teaching can wait."}],"trick":"Compartment syndrome = a crowded closet: too much fluid, no room for blood and nerves.","tip":"Pain out of proportion to the injury is a red-flag phrase. It points to the urgent client."},{"id":"N9-04","unit":"ch9","sec":"ch9-structure","focus":[["ch9-structure",2]],"type":"mcq","stem":"What causes the severe pain of compartment syndrome?","why":"Swelling or bleeding inside a compartment enclosed by fascia raises the fluid pressure, which squeezes blood vessels and nerves. That excessive fluid pressure causes the pain.","diff":2,"origin":"new","opts":[{"t":"High fluid pressure in the compartment","c":true},{"t":"Tearing of the surrounding fascia walls","w":"The fascia is intact. Its toughness is why pressure builds up."},{"t":"Overstretched tendons near the injury","w":"Tendons are not the cause."},{"t":"Lactic acid buildup from exercise","w":"Lactic acid causes fatigue, not compartment syndrome."}],"trick":"Pressure = Pain in a closed Pocket.","tip":"Your instructor tests the mechanism. Look for the option that names the cause, not a side detail."},{"id":"N9-05","unit":"ch9","sec":"ch9-fiber","focus":[["ch9-fiber",0]],"type":"mcq","stem":"Myofibrils inside a skeletal muscle fiber are composed primarily of which proteins?","why":"Myofibrils are made mostly of thin filaments (actin) and thick filaments (myosin). Their sliding produces contraction.","diff":1,"origin":"new","opts":[{"t":"Actin and myosin","c":true},{"t":"Collagen and elastin","w":"These are connective tissue fibers, not myofibril proteins."},{"t":"Hemoglobin and myoglobin","w":"Myoglobin stores oxygen in muscle, but it doesn't form myofibrils."},{"t":"Keratin and melanin","w":"These are skin proteins and pigments."}],"trick":"Actin is thin, Myosin is thick (and has the Mighty heads).","tip":"Eliminate options from other body systems first (skin, blood, connective tissue)."},{"id":"N9-06","unit":"ch9","sec":"ch9-fiber","focus":[["ch9-fiber",1],["ch9-fiber",3],["ch9-fiber",4]],"type":"sata","stem":"Which statements about the sarcomere are accurate? Select all that apply.","why":"A sarcomere runs from one Z line to the next and is the contractile unit. Alternating dark A bands (thick and thin overlap) and light I bands (thin only) make the stripes.","diff":2,"origin":"new","opts":[{"t":"It is the functional unit of contraction.","c":true},{"t":"Z lines form its boundaries and hold the bands of actin together.","c":true},{"t":"The arrangement of thick and thin filaments in sarcomeres creates the striations.","c":true},{"t":"The I band contains thick filaments only.","w":"The light I band has thin filaments only."},{"t":"The filaments themselves shorten during contraction.","w":"The filaments slide past each other. They don't shorten."}],"trick":"Z = the end of the alphabet = the end of the sarcomere. I band = lIght, thIn only.","tip":"SATA: one wrong word (thick vs thin) makes an option false."},{"id":"N9-07","unit":"ch9","sec":"ch9-fiber","focus":[["ch9-fiber",2]],"type":"mcq","stem":"Which pairing of muscle fiber structure and job is correct?","why":"T (transverse) tubules are inward extensions of the sarcolemma that carry the muscle impulse deep into the fiber. The sarcoplasmic reticulum (SR) surrounds each myofibril, stores calcium, and releases it when stimulated.","diff":2,"origin":"new","opts":[{"t":"T tubules carry the impulse into the cell's interior; the sarcoplasmic reticulum stores calcium.","c":true},{"t":"T tubules store calcium; the sarcoplasmic reticulum carries the impulse inward.","w":"The jobs are swapped."},{"t":"T tubules make ATP; the sarcoplasmic reticulum makes acetylcholine.","w":"Mitochondria make ATP. ACh comes from the motor neuron."},{"t":"The sarcolemma stores calcium; T tubules contract the fiber.","w":"The sarcolemma is the membrane, and T tubules don't contract."}],"trick":"T tubules = Transmit inward. SR = Storage Room for calcium.","tip":"Swapped-pair options are common. Check each half of the statement separately."},{"id":"N9-08","unit":"ch9","sec":"ch9-nmj","focus":[["ch9-nmj",0]],"type":"mcq","stem":"What is a motor unit?","why":"A motor unit is one motor neuron plus every fiber it stimulates. Fine-movement muscles (eye, fingers) have few fibers per neuron. Powerful muscles have hundreds.","diff":1,"origin":"new","opts":[{"t":"One motor neuron and all the muscle fibers it controls","c":true},{"t":"All the motor neurons that supply one muscle","w":"A motor unit has just one neuron."},{"t":"A single sarcomere","w":"A sarcomere is the contractile unit inside a fiber."},{"t":"The gap between a neuron and a fiber","w":"That gap is the synaptic cleft."}],"trick":"One boss (neuron) and the whole team (fibers) it commands.","tip":"Definitions: pick the option that matches the size of the thing (one neuron, many fibers)."},{"id":"N9-09","unit":"ch9","sec":"ch9-nmj","focus":[["ch9-nmj",1],["ch9-nmj",2],["ch9-nmj",3],["ch9-nmj",4]],"type":"sata","stem":"Which statements about the neuromuscular junction are accurate? Select all that apply.","why":"At the NMJ, the axon terminal releases acetylcholine from its vesicles across the synaptic cleft onto the motor end plate. Acetylcholinesterase in the cleft breaks ACh down, so one impulse gives one twitch. On your exam this appeared as an 'all of these' item.","diff":2,"origin":"new","opts":[{"t":"It is the functional connection (synapse) between a motor neuron and a muscle fiber.","c":true},{"t":"A small gap, the synaptic cleft, separates the neuron from the fiber.","c":true},{"t":"Acetylcholine is stored in vesicles in the motor neuron endings.","c":true},{"t":"Cholinesterase breaks down (decomposes) acetylcholine.","c":true},{"t":"Acetylcholine is stored in the sarcoplasmic reticulum.","w":"The SR stores calcium. ACh is stored in vesicles in the axon terminal."},{"t":"The neuron directly touches the muscle membrane.","w":"They don't touch. The synaptic cleft separates them."}],"trick":"ACh: stored in the neuron's Vesicles, Crosses the cleft, then Chopped by cholinesterase.","tip":"If your exam lists several true NMJ facts with 'all of these', check each one against this list."},{"id":"N9-10","unit":"ch9","sec":"ch9-nmj","focus":[["ch9-nmj",2]],"type":"mcq","stem":"A farm worker was exposed to a pesticide that blocks acetylcholinesterase. What effect on the muscles should the nurse expect?","why":"Acetylcholinesterase normally breaks down ACh. If it is blocked, ACh keeps stimulating the muscle, so the muscle stays contracted (spastic paralysis).","diff":3,"origin":"new","opts":[{"t":"Muscles stay contracted (spastic) because acetylcholine remains in the cleft.","c":true},{"t":"Flaccid paralysis because acetylcholine is never released","w":"That describes botulism toxin, which blocks ACh release."},{"t":"Weakness because the ACh receptors are destroyed","w":"That describes myasthenia gravis, an autoimmune attack on receptors."},{"t":"No effect, because calcium controls contraction","w":"Calcium matters, but ACh starts the whole process."}],"trick":"No cleaner (cholinesterase) means the 'GO' signal never gets cleared.","tip":"Predict the result: if you remove the 'off switch', the muscle stays 'on'."},{"id":"N9-11","unit":"ch9","sec":"ch9-contraction","focus":[["ch9-contraction",0],["ch9-contraction",2]],"type":"order","stem":"Put the events of skeletal muscle contraction in order, from first to last.","why":"The nerve signal releases ACh, ACh excites the muscle membrane, the impulse runs down the T tubules, the SR releases calcium, calcium binds troponin to uncover actin, and myosin heads pull the thin filaments using ATP.","diff":3,"origin":"new","steps":["Acetylcholine is released from the end of the motor neuron.","ACh binds receptors on the motor end plate, and the sarcolemma depolarizes.","The muscle impulse travels deep into the fiber through the T tubules.","The sarcoplasmic reticulum releases calcium ions.","Calcium binds troponin, which moves tropomyosin off the binding sites on actin.","Myosin heads form cross-bridges and pull actin in a power stroke, using ATP."],"trick":"A-T-C-C-S: ACh, T tubule, Calcium, Cross-bridges, Slide. (From your guide.)","tip":"Ordering: start where the nerve meets the muscle, finish where the filaments slide."},{"id":"N9-12","unit":"ch9","sec":"ch9-contraction","focus":[["ch9-contraction",0]],"type":"mcq","stem":"Which is the first event in skeletal muscle contraction at the neuromuscular junction?","why":"Contraction starts when the motor neuron releases acetylcholine into the synaptic cleft. Everything else follows from that signal.","diff":2,"origin":"new","opts":[{"t":"Acetylcholine is released from the end of the motor neuron.","c":true},{"t":"Calcium binds to troponin.","w":"This happens later, after the SR releases calcium."},{"t":"Myosin cross-bridges form.","w":"Cross-bridges form near the end of the sequence."},{"t":"The sarcoplasmic reticulum releases calcium.","w":"The SR releases calcium only after the impulse arrives through the T tubules."}],"trick":"ACh is the Alarm Clock that starts the sequence.","tip":"'First' questions: picture the chain of events. The answer is the one that triggers the others."},{"id":"N9-13","unit":"ch9","sec":"ch9-contraction","focus":[["ch9-contraction",2]],"type":"mcq","stem":"Calcium released from the sarcoplasmic reticulum binds to which protein to start contraction?","why":"Calcium binds troponin. Troponin then shifts tropomyosin off the myosin-binding sites on actin, so cross-bridges can form.","diff":2,"origin":"new","opts":[{"t":"Troponin","c":true},{"t":"Tropomyosin","w":"Tropomyosin covers the binding sites. It moves AFTER calcium binds troponin."},{"t":"Myosin","w":"Myosin heads bind actin, not calcium."},{"t":"Acetylcholine","w":"ACh is a neurotransmitter, not a calcium-binding protein."}],"trick":"Troponin Takes the calcium. Tropomyosin is the cover that Moves.","tip":"Similar names (troponin vs tropomyosin): learn one detail that tells them apart."},{"id":"N9-14","unit":"ch9","sec":"ch9-contraction","focus":[["ch9-contraction",1]],"type":"mcq","stem":"A family member asks why the body of a deceased relative became stiff. Which explanation is accurate?","why":"ATP supplies the energy for myofilament movement, and a new ATP is also needed to release each myosin head from actin. After death no ATP is made, so the heads stay attached: rigor mortis.","diff":2,"origin":"new","opts":[{"t":"Without ATP, myosin heads cannot detach from actin, so the muscles stay contracted.","c":true},{"t":"Too much ATP builds up and locks the muscles.","w":"It is the LACK of ATP that causes stiffness."},{"t":"Acetylcholine keeps being released after death.","w":"Rigor mortis is about ATP, not ongoing nerve signals."},{"t":"The bones fuse together after death.","w":"Rigor mortis is a muscle change, not a bone change."}],"trick":"ATP = the 'Release button'. No ATP, no letting go.","tip":"Clinical-story questions often test one mechanism. Find the mechanism (ATP) behind the story."},{"id":"N9-15","unit":"ch9","sec":"ch9-energy","focus":[["ch9-energy",0]],"type":"mcq","stem":"A sprinter's muscles use creatine phosphate in the first few seconds of a race. What does creatine phosphate do?","why":"Muscle stores only a few seconds of ATP. Creatine phosphate quickly hands its phosphate to ADP to make ATP (CP + ADP → creatine + ATP), lasting about 10 seconds.","diff":2,"origin":"new","opts":[{"t":"It supplies energy for the synthesis of ATP.","c":true},{"t":"It breaks ATP down into ADP.","w":"CP rebuilds ATP. It doesn't break it down."},{"t":"It delivers oxygen to the mitochondria.","w":"Myoglobin and blood carry oxygen."},{"t":"It converts lactic acid back into glucose.","w":"That happens during oxygen debt, mostly after exercise."}],"trick":"Creatine Phosphate = a Charged Phone battery that recharges ATP fast.","tip":"Direction matters: 'supplies energy for making ATP' vs 'breaks ATP down' are opposites."},{"id":"N9-16","unit":"ch9","sec":"ch9-energy","focus":[["ch9-energy",1]],"type":"mcq","stem":"After a hard sprint, a client keeps breathing heavily for several minutes. What is the extra oxygen being used for?","why":"Oxygen debt is the oxygen needed after intense exercise to convert lactic acid back to glucose and glycogen, rebuild ATP and creatine phosphate, and restore oxygen levels. That's why you keep breathing hard after you stop.","diff":2,"origin":"new","opts":[{"t":"Repaying the oxygen debt","c":true},{"t":"Starting a new contraction","w":"The client has stopped exercising."},{"t":"Breaking down acetylcholine","w":"Acetylcholinesterase does that, without needing extra oxygen."},{"t":"Making more lactic acid","w":"Lactic acid builds up when oxygen is SHORT, not when extra oxygen arrives."}],"trick":"Oxygen debt = paying back the oxygen loan you took during the sprint.","tip":"Look for the option that describes RECOVERY, since the stem happens after exercise."},{"id":"N9-17","unit":"ch9","sec":"ch9-energy","focus":[["ch9-energy",2]],"type":"mcq","stem":"A client wakes at night with a painful calf cramp. What is the most likely cause of a muscle cramp?","why":"Without ATP, calcium can't be pumped back into the SR and myosin heads can't detach, so the muscle stays contracted. That is a cramp.","diff":2,"origin":"new","opts":[{"t":"A lack of ATP","c":true},{"t":"Too much ATP","w":"Extra ATP would help the muscle relax."},{"t":"Too much oxygen","w":"Oxygen does not cause cramps."},{"t":"Too much calcium stored in the sarcoplasmic reticulum","w":"Calcium stored in the SR is the RELAXED state."}],"trick":"No ATP means the muscle can't let go, both in a cramp and in rigor mortis.","tip":"Connect related facts: the cramp and rigor mortis share the same mechanism."},{"id":"N9-18","unit":"ch9","sec":"ch9-responses","focus":[["ch9-responses",0],["ch9-responses",1]],"type":"sata","stem":"Which definitions of muscle responses are correct? Select all that apply.","why":"On a myogram: the latent period is the delay before the twitch, and the refractory period is the brief unresponsive time after stimulation. A threshold stimulus is the minimum that triggers contraction, and the fiber then responds all or none.","diff":2,"origin":"new","opts":[{"t":"Latent period: the delay between the stimulus and the start of the response","c":true},{"t":"Refractory period: a brief moment after stimulation when the fiber can't respond","c":true},{"t":"Threshold stimulus: the minimal stimulus needed to cause a contraction","c":true},{"t":"Tetanus: a single, brief twitch","w":"Tetanus is a SUSTAINED contraction with no relaxation between stimuli."},{"t":"Recruitment: activating fewer motor units as the stimulus grows","w":"Recruitment activates MORE motor units as the stimulus grows."}],"trick":"LATEnt = LATE start. REfractory = REst time, no response.","tip":"SATA: words like 'fewer' or 'single' are often the twist that makes an option false."},{"id":"N9-19","unit":"ch9","sec":"ch9-responses","focus":[["ch9-responses",2]],"type":"mcq","stem":"A client in rehab pushes against a wall. The arm muscles tighten, but the arms don't move. Which type of contraction is this?","why":"In an isometric contraction tension increases but the muscle length does not change. Isotonic contractions change length: concentric shortens, eccentric lengthens.","diff":2,"origin":"new","opts":[{"t":"Isometric","c":true},{"t":"Concentric","w":"Concentric contractions shorten the muscle, so the limb moves."},{"t":"Eccentric","w":"Eccentric contractions lengthen the muscle while it works."},{"t":"Isotonic","w":"Isotonic contractions change the muscle's length and move the load."}],"trick":"Iso-METRIC = same Measure (length). Iso-TONIC = same Tension, the length changes.","tip":"Ask: did anything move? If not, it's isometric."},{"id":"N9-20","unit":"ch9","sec":"ch9-responses","focus":[["ch9-responses",2]],"type":"mcq","stem":"A client slowly lowers a dumbbell from a curl. The biceps stays tense while it lengthens. Which contraction is this?","why":"An eccentric contraction is a lengthening contraction: the muscle is working (tense) while it gets longer, as when lowering a weight under control.","diff":3,"origin":"new","opts":[{"t":"Eccentric","c":true},{"t":"Concentric","w":"Concentric is the lifting phase, when the biceps shortens."},{"t":"Isometric","w":"In isometric contractions the length doesn't change."},{"t":"Treppe","w":"Treppe (staircase effect) is a series of twitches, each a bit stronger."}],"trick":"ECcentric = Elongates under Control. CONcentric = CONtracts shorter.","tip":"Watch the direction of length change: shortening vs lengthening decides concentric vs eccentric."},{"id":"N9-21","unit":"ch9","sec":"ch9-responses","focus":[["ch9-responses",2]],"type":"mcq","stem":"A nurse lifts a light box and then a heavy one. To produce more force, the nervous system activates more motor units. What is this called?","why":"Recruitment increases the number of active motor units as the stimulus grows, producing a stronger contraction.","diff":2,"origin":"new","opts":[{"t":"Recruitment","c":true},{"t":"Muscle tone","w":"Tone is the steady, partial contraction of a resting muscle that maintains posture."},{"t":"A tw
