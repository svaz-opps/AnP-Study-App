rom the body surface."}],"trick":"Proximal = Proximity to the trunk. Distal = Distant.","tip":"Pick the right PAIR of terms first: along a limb means proximal/distal."},{"id":"N1-10","unit":"ch1","sec":"ch1-directions","focus":[["ch1-directions",0]],"type":"mcq","stem":"Using anatomical position, which statement is accurate?","why":"In anatomical position the palms face forward, so the thumb is on the lateral side. Directional terms always use the subject's own position, even when the client is lying down.","diff":2,"origin":"new","opts":[{"t":"The thumb is lateral to the little finger.","c":true},{"t":"The nose is lateral to the eyes.","w":"The nose is medial to the eyes (closer to the midline)."},{"t":"The sternum is posterior to the heart.","w":"The sternum is anterior to the heart."},{"t":"The skin is deep to the muscle.","w":"Skin is superficial to muscle."}],"trick":"Palms forward and thumbs out: anatomical position puts the thumb lateral.","tip":"Picture yourself in anatomical position (palms forward) before answering."},{"id":"N1-11","unit":"ch1","sec":"ch1-planes","focus":[["ch1-planes",0]],"type":"mcq","stem":"An MRI image divides the body into front (anterior) and back (posterior) portions. Which plane is this?","why":"Sagittal = right and left. Coronal (frontal) = front and back. Transverse (horizontal) = top and bottom.","diff":1,"origin":"new","opts":[{"t":"Coronal (frontal) plane","c":true},{"t":"Sagittal plane","w":"A sagittal plane divides right and left portions."},{"t":"Transverse plane","w":"A transverse plane divides upper and lower portions."},{"t":"Midsagittal plane","w":"Midsagittal divides equal right and left halves."}],"trick":"Coronal = a Crown worn across the head from ear to ear, splitting front from back.","tip":"Match the plane to the portions it creates, not to how the picture is drawn."},{"id":"N1-12","unit":"ch1","sec":"ch1-planes","focus":[["ch1-planes",1]],"type":"sata","stem":"Which surface landmark terms are matched correctly? Select all that apply.","why":"Patellar = front of the knee, popliteal = back of the knee. Brachial = upper arm, antebrachial = forearm, antecubital = front of the elbow (a common IV and blood-draw site).","diff":2,"origin":"new","opts":[{"t":"Popliteal: back of the knee","c":true},{"t":"Antecubital: front of the elbow","c":true},{"t":"Antebrachial: forearm","c":true},{"t":"Patellar: back of the knee","w":"Patellar is the FRONT of the knee (the kneecap)."},{"t":"Brachial: forearm","w":"Brachial is the upper arm. The forearm is antebrachial."}],"trick":"ANTE-brachial = before (below) the brachium. Popliteal = the 'pit' behind the knee.","tip":"Front vs back pairs (patellar vs popliteal) are the usual swaps."},{"id":"N1-13","unit":"ch1","sec":"ch1-regions","focus":[["ch1-regions",0]],"type":"mcq","stem":"A client with suspected appendicitis points to their pain. In which quadrant is the appendix typically found?","why":"The appendix is typically in the right lower quadrant (the right iliac region). 'Right' always means the client's own right, not the viewer's.","diff":1,"origin":"new","opts":[{"t":"Right lower quadrant","c":true},{"t":"Left lower quadrant","w":"The sigmoid colon is in the left lower quadrant."},{"t":"Right upper quadrant","w":"The liver and gallbladder are in the right upper quadrant."},{"t":"Left upper quadrant","w":"The stomach and spleen are in the left upper quadrant."}],"trick":"Appendix = Right Lower (RLQ). Think 'appendix is down to the right.'","tip":"Always use the client's right and left, not your own."},{"id":"N1-14","unit":"ch1","sec":"ch1-regions","focus":[["ch1-regions",1]],"type":"mcq","stem":"Which abdominal region is directly superior to the umbilical region?","why":"The middle column, from top to bottom, is epigastric, umbilical, hypogastric. 'Epi' means above and 'hypo' means below.","diff":2,"origin":"new","opts":[{"t":"Epigastric","c":true},{"t":"Hypogastric (pubic)","w":"The hypogastric region is INFERIOR to the umbilical region."},{"t":"Right hypochondriac","w":"This is in the upper row, but on the right side, not directly above."},{"t":"Left lumbar","w":"This is beside the umbilical region, not above it."}],"trick":"EPI = above the belly button. HYPO = below it.","tip":"Use prefixes: epi- (upon), hypo- (under)."},{"id":"N2-01","unit":"ch2","sec":"ch2-atoms","focus":[["ch2-atoms",0]],"type":"math","stem":"A chlorine atom has an atomic number of 17 and a mass number of 35. How many neutrons does it have?","why":"Mass number = protons + neutrons. Neutrons = 35 − 17 = 18.","diff":1,"origin":"new","opts":[{"t":"18","c":true},{"t":"17","w":"17 is the number of protons (the atomic number)."},{"t":"35","w":"35 is protons plus neutrons together."},{"t":"52","w":"Subtract, don't add: 35 − 17."}],"trick":"Mass minus Atomic = Neutrons (M − A = N).","tip":"Write the formula first, then plug in. Don't guess from the numbers shown."},{"id":"N2-02","unit":"ch2","sec":"ch2-atoms","focus":[["ch2-atoms",0]],"type":"math","stem":"A sodium ion (Na⁺) has 11 protons. How many electrons does it have?","why":"A neutral atom has equal protons and electrons. Na⁺ has lost one electron, so 11 − 1 = 10 electrons, which leaves a +1 charge.","diff":2,"origin":"new","opts":[{"t":"10","c":true},{"t":"11","w":"11 electrons would be a neutral sodium ATOM, not the Na⁺ ion."},{"t":"12","w":"Gaining an electron would give a negative charge."},{"t":"1","w":"Only one electron was lost, not ten."}],"trick":"Plus sign = lost electrons (electrons are negative, so losing them makes it positive).","tip":"Charge = protons − electrons. A +1 ion has one more proton than electrons."},{"id":"N2-03","unit":"ch2","sec":"ch2-atoms","focus":[["ch2-atoms",1]],"type":"sata","stem":"Which statements about atoms are accurate? Select all that apply.","why":"Change protons and you get a new element. Change neutrons and you get an isotope. Change electrons and you get an ion. Periodic-table atomic mass is a weighted average of isotopes.","diff":2,"origin":"new","opts":[{"t":"Isotopes of an element have the same number of protons but different numbers of neutrons.","c":true},{"t":"An ion forms when an atom gains or loses electrons.","c":true},{"t":"Mass number counts protons plus neutrons for one isotope.","c":true},{"t":"Isotopes of an element differ in their number of protons.","w":"Changing protons changes the element itself."},{"t":"The atomic mass on the periodic table is the mass number of the most common isotope.","w":"It is an abundance-weighted average of all the isotopes."}],"trick":"Protons = identity. Neutrons = isotope. Electrons = ion (charge).","tip":"Match each particle to the change it causes."},{"id":"N2-04","unit":"ch2","sec":"ch2-bonds","focus":[["ch2-bonds",0]],"type":"mcq","stem":"Sodium gives an electron to chlorine, forming Na⁺ and Cl⁻, which attract each other. Which type of bond is this?","why":"Ionic bonds form after electron TRANSFER: the atoms become oppositely charged ions that attract. Covalent bonds SHARE electron pairs.","diff":1,"origin":"new","opts":[{"t":"Ionic bond","c":true},{"t":"Nonpolar covalent bond","w":"Covalent bonds SHARE electrons. Here an electron was transferred."},{"t":"Polar covalent bond","w":"Polar covalent bonds share electrons unequally, without full transfer."},{"t":"Hydrogen bond","w":"Hydrogen bonds are weak attractions involving a partially positive hydrogen."}],"trick":"Ionic = I Own it now (transfer). Covalent = Co-operate (share).","tip":"'Gives' or 'transfers' means ionic. 'Shares' means covalent."},{"id":"N2-05","unit":"ch2","sec":"ch2-bonds","focus":[["ch2-bonds",1]],"type":"mcq","stem":"Which statement correctly describes the bonds involved with water?","why":"Inside one water molecule, oxygen and hydrogen share electrons unequally (polar covalent). Between molecules, the partially positive hydrogen of one attracts the partially negative oxygen of another (hydrogen bonds), which are weaker.","diff":2,"origin":"new","opts":[{"t":"Polar covalent bonds hold each water molecule together; hydrogen bonds attract neighboring water molecules.","c":true},{"t":"Hydrogen bonds hold each water molecule together; covalent bonds attract neighbors.","w":"This swaps the two bond types."},{"t":"Ionic bonds hold the oxygen and hydrogens together.","w":"Water's O–H bonds are polar covalent, not ionic."},{"t":"Only hydrogen bonds exist in water.","w":"Each molecule's O–H bonds are covalent."}],"trick":"INside = covalent (strong). BETWEEN = hydrogen bonds (weak, like Velcro).","tip":"Swapped-pair options: check which bond is inside versus between molecules."},{"id":"N2-06","unit":"ch2","sec":"ch2-reactions","focus":[["ch2-reactions",0]],"type":"mcq","stem":"Which type of reaction is shown: AB → A + B?","why":"Decomposition breaks a larger compound into smaller parts. Synthesis builds, exchange swaps partners, and reversible reactions go both ways.","diff":1,"origin":"new","opts":[{"t":"Decomposition","c":true},{"t":"Synthesis","w":"Synthesis combines parts: A + B → AB."},{"t":"Exchange","w":"Exchange swaps partners: AB + CD → AD + CB."},{"t":"Reversible","w":"A reversible reaction uses a double arrow (⇌)."}],"trick":"Decompose = break down, like leaves decomposing.","tip":"Look at the arrow: one thing becoming two is decomposition."},{"id":"N2-07","unit":"ch2","sec":"ch2-reactions","focus":[["ch2-reactions",1]],"type":"mcq","stem":"During digestion, a peptide is broken into amino acids by adding water. What is this reaction called?","why":"Hydrolysis uses water to break a bond (hydro = water, lysis = split). Dehydration synthesis is the opposite: it joins subunits and releases water.","diff":2,"origin":"new","opts":[{"t":"Hydrolysis","c":true},{"t":"Dehydration synthesis","w":"Dehydration synthesis BUILDS molecules and RELEASES water."},{"t":"Exchange reaction","w":"Exchange reactions swap partners."},{"t":"Equilibrium","w":"Equilibrium is when forward and reverse rates balance."}],"trick":"Hydro-LYSIS = water Splits it. De-HYDRATION = water leaves as things join.","tip":"Break the word apart. Most chemistry terms describe themselves."},{"id":"N2-08","unit":"ch2","sec":"ch2-water","focus":[["ch2-water",0]],"type":"sata","stem":"Which properties of water are important in the body? Select all that apply.","why":"Because water is polar, it dissolves ions and polar molecules, transports them, is the medium for reactions, takes part in hydrolysis, cushions and lubricates, and resists temperature change.","diff":2,"origin":"new","opts":[{"t":"It dissolves ions and many polar substances.","c":true},{"t":"It is the medium for reactions and takes part in hydrolysis.","c":true},{"t":"Its high heat capacity limits rapid temperature changes.","c":true},{"t":"It dissolves oils easily.","w":"Oils are nonpolar and don't mix well with water."},{"t":"It dissolves every substance.","w":"Water is not a universal solvent for everything."}],"trick":"Like dissolves like: polar water dissolves polar things.","tip":"'Every' is an absolute. Absolutes are usually false."},{"id":"N2-09","unit":"ch2","sec":"ch2-water","focus":[["ch2-water",1]],"type":"mcq","stem":"Which of these will conduct an electric current?","why":"A solution conducts current only when mobile charged particles (ions) are present. Dissolved NaCl dissociates into moving Na⁺ and Cl⁻ ions.","diff":2,"origin":"new","opts":[{"t":"Table salt (NaCl) dissolved in water","c":true},{"t":"Glucose dissolved in water","w":"Glucose is a nonelectrolyte. It dissolves without forming ions."},{"t":"A dry crystal of table salt","w":"In a solid crystal the ions can't move."},{"t":"Pure distilled water","w":"Pure water has very few mobile ions."}],"trick":"No moving ions, no current.","tip":"Ask two questions: are there ions, and can they move?"},{"id":"N2-10","unit":"ch2","sec":"ch2-ph","focus":[["ch2-ph",0]],"type":"math","stem":"In a lab demonstration, a solution's pH drops from 7.4 to 6.4. How much has the hydrogen ion concentration changed?","why":"The pH scale is logarithmic: each 1-unit decrease means about 10 times more hydrogen ions. (For comparison, normal arterial blood is about 7.35 to 7.45, so even small pH shifts in the body matter.)","diff":2,"origin":"new","opts":[{"t":"About 10 times higher","c":true},{"t":"About 1 time higher (no real change)","w":"pH is logarithmic. One unit is a big change."},{"t":"About 100 times higher","w":"100× would be a drop of two pH units."},{"t":"About 10 times lower","w":"Lower pH means MORE hydrogen ions, not fewer."}],"trick":"Each pH step is ×10. Down in pH = up in H⁺.","tip":"Count the pH units, then multiply by 10 for each one."},{"id":"N2-11","unit":"ch2","sec":"ch2-ph","focus":[["ch2-ph",1]],"type":"mcq","stem":"Bicarbonate in the blood acts as a buffer. What does a buffer do?","why":"A buffer limits pH change by grabbing extra H⁺ or releasing H⁺ when it runs low. The bicarbonate system (CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻) works with the lungs and kidneys.","diff":2,"origin":"new","opts":[{"t":"It limits pH change by reversibly binding or releasing hydrogen ions.","c":true},{"t":"It amplifies pH changes so the body notices them.","w":"Buffers RESIST change. They don't amplify it."},{"t":"It prevents every change in pH completely.","w":"Buffers limit change but can't prevent all of it."},{"t":"It only works in the stomach.","w":"Blood buffers like bicarbonate work throughout the body."}],"trick":"A buffer is a shock absorber for pH.","tip":"Watch for 'completely' and 'only'. Real systems limit change, they don't stop it."},{"id":"N2-12","unit":"ch2","sec":"ch2-ph","focus":[],"type":"priority","stem":"The nurse reviews arterial blood pH results for four clients. Which result needs attention first?","why":"Normal arterial blood pH is about 7.35 to 7.45. A pH of 7.25 is below normal (acidic), so this client needs attention first.","diff":2,"origin":"new","opts":[{"t":"pH 7.25","c":true},{"t":"pH 7.38","w":"Within the normal range of about 7.35 to 7.45."},{"t":"pH 7.42","w":"Within the normal range."},{"t":"pH 7.40","w":"Right in the middle of normal."}],"trick":"Blood's sweet spot: 7.35 to 7.45, slightly alkaline.","tip":"Priority with lab values: the result outside the normal range comes first."},{"id":"N2-13","unit":"ch2","sec":"ch2-carbohydrates","focus":[["ch2-carbohydrates",0],["ch2-carbohydrates",1]],"type":"sata","stem":"A dietitian is reviewing carbohydrates with a client. Which statements are accurate? Select all that apply.","why":"Mono = one sugar (glucose, fructose, galactose). Di = two (sucrose, lactose, maltose). Poly = many (starch in plants, glycogen in animals, cellulose for plant structure).","diff":2,"origin":"new","opts":[{"t":"Glucose is a monosaccharide.","c":true},{"t":"Sucrose is a disaccharide of glucose and fructose.","c":true},{"t":"Glycogen is the animal storage form of glucose, kept in the liver and muscles.","c":true},{"t":"Starch is the animal storage form of glucose.","w":"Starch is PLANT storage. Glycogen is animal storage."},{"t":"Lactose is a monosaccharide.","w":"Lactose is a disaccharide (glucose + galactose)."}],"trick":"Glycogen = Glucose Go-bag stored in your liver and muscles. Starch = plants' pantry.","tip":"Plant vs animal is a common swap. Check each source carefully."},{"id":"N2-14","unit":"ch2","sec":"ch2-lipids","focus":[["ch2-lipids",0]],"type":"mcq","stem":"Which lipid has a polar head and two nonpolar tails and forms the cell membrane bilayer?","why":"Phospholipids are amphipathic: a water-loving head and water-avoiding tails. In water they form bilayers with heads facing out and tails facing in. That is the membrane.","diff":1,"origin":"new","opts":[{"t":"Phospholipid","c":true},{"t":"Triglyceride","w":"Triglycerides (glycerol + three fatty acids) store energy."},{"t":"Steroid","w":"Steroids, like cholesterol, have four fused carbon rings."},{"t":"Glycogen","w":"Glycogen is a carbohydrate, not a lipid."}],"trick":"PHOSPHOlipid = the Head is PHOSPHate (water-loving), tails hide inside.","tip":"Match the structure (head and tails) to the job (membrane)."},{"id":"N2-15","unit":"ch2","sec":"ch2-lipids","focus":[["ch2-lipids",1]],"type":"mcq","stem":"What makes a fatty acid unsaturated?","why":"Saturated fatty acids have no C=C double bonds (they're saturated with hydrogen). Unsaturated ones have one or more double bonds, which often bend the chain.","diff":1,"origin":"new","opts":[{"t":"It has one or more carbon–carbon double bonds.","c":true},{"t":"It has no carbon–carbon double bonds.","w":"That describes a saturated fatty acid."},{"t":"It is always solid at room temperature.","w":"Physical state depends on composition and temperature. No absolute rule."},{"t":"It contains no carbon.","w":"All fatty acids are carbon chains."}],"trick":"UNsaturated = UNfilled with hydrogen, so it has double bonds (kinks).","tip":"'Always' statements about physical state are traps."},{"id":"N2-16","unit":"ch2","sec":"ch2-proteins","focus":[["ch2-proteins",0]],"type":"mcq","stem":"Hemoglobin is made of four polypeptide subunits fitted together. Which level of protein structure describes this?","why":"Primary = sequence. Secondary = helices and sheets. Tertiary = one chain's 3D fold. Quaternary = several chains together, like hemoglobin. Not every protein has a quaternary level.","diff":2,"origin":"new","opts":[{"t":"Quaternary","c":true},{"t":"Primary","w":"Primary structure is the amino acid sequence."},{"t":"Secondary","w":"Secondary structure is helices and sheets in one chain."},{"t":"Tertiary","w":"Tertiary is the 3D shape of ONE polypeptide."}],"trick":"Quaternary = Quad = multiple chains teaming up.","tip":"Count the chains: one chain stops at tertiary, more than one means quaternary."},{"id":"N2-17","unit":"ch2","sec":"ch2-proteins","focus":[["ch2-proteins",1]],"type":"mcq","stem":"A client has a very high fever. Why can extreme heat harm the body's enzymes?","why":"Denaturation disrupts a protein's normal shape (from heat, extreme pH, and so on). An enzyme's active site depends on shape, so function can be lost. The amino acid sequence stays the same.","diff":2,"origin":"new","opts":[{"t":"Heat can denature proteins, changing their shape and impairing function.","c":true},{"t":"Heat breaks every peptide bond in the protein.","w":"Denaturation changes the shape. It usually doesn't break all the peptide bonds."},{"t":"Heat makes enzymes work better without limit.","w":"Past a point, heat disrupts enzyme shape."},{"t":"Heat changes the amino acid sequence.","w":"Denaturation changes the fold, not the sequence."}],"trick":"Denature = De-shape. The sequence stays, the shape goes.","tip":"Shape equals function for proteins. Look for the option about shape."},{"id":"N2-18","unit":"ch2","sec":"ch2-nucleic","focus":[["ch2-nucleic",0]],"type":"sata","stem":"Which statements comparing DNA and RNA are accurate? Select all that apply.","why":"DNA = deoxyribose + A, T, C, G, usually double-stranded. RNA = ribose + A, U, C, G, usually single-stranded. In DNA, A pairs with T and C pairs with G.","diff":2,"origin":"new","opts":[{"t":"DNA contains the sugar deoxyribose and the base thymine.","c":true},{"t":"RNA contains the sugar ribose and the base uracil.","c":true},{"t":"In DNA, adenine pairs with thymine.","c":true},{"t":"RNA contains thymine.","w":"RNA uses uracil instead of thymine."},{"t":"DNA contains ribose.","w":"DNA contains DEOXYribose."}],"trick":"DNA has 'D' for Deoxyribose. RNA swaps T for U: 'U are in RNA.'","tip":"One-word swaps (ribose vs deoxyribose, T vs U) are the usual traps."},{"id":"N2-19","unit":"ch2","sec":"ch2-nucleic","focus":[["ch2-nucleic",1]],"type":"mcq","stem":"Which bonds hold complementary base pairs together across the two strands of DNA?","why":"Hydrogen bonds connect complementary bases (A–T, C–G) between strands, so the strands can unzip for copying. Strong covalent bonds form each strand's sugar–phosphate backbone.","diff":2,"origin":"new","opts":[{"t":"Hydrogen bonds","c":true},{"t":"Covalent bonds","w":"Covalent bonds hold each sugar–phosphate backbone together, not the base pairs."},{"t":"Ionic bonds","w":"Base pairing does not involve ionic bonds."},{"t":"Peptide bonds","w":"Peptide bonds link amino acids in proteins."}],"trick":"Hydrogen bonds = the zipper teeth (easy to open). Covalent = the zipper's strong fabric.","tip":"Ask where the bond is: across the strands (hydrogen) or along one strand (covalent)."},{"id":"N3-01","unit":"ch3","sec":"ch3-membrane","focus":[["ch3-membrane",0]],"type":"mcq","stem":"Which substance crosses the lipid part of a cell membrane most easily, without a channel or carrier?","why":"Selective permeability depends on size, charge, and polarity. Small nonpolar molecules like oxygen cross the lipid bilayer readily. Ions and many polar solutes need channels or carriers.","diff":1,"origin":"new","opts":[{"t":"Oxygen","c":true},{"t":"Sodium ion","w":"Ions are charged, so they need channels or carriers."},{"t":"Glucose","w":"Glucose is polar and usually needs a transporter."},{"t":"A large protein","w":"Large molecules can't slip through the bilayer."}],"trick":"Small and nonpolar slips through. Charged or big needs a door.","tip":"Rank options by size and charge. The smallest uncharged one wins."},{"id":"N3-02","unit":"ch3","sec":"ch3-membrane","focus":[["ch3-membrane",1]],"type":"sata","stem":"Which cell-junction descriptions are correct? Select all that apply.","why":"Three junctions, three jobs: tight junctions SEAL, desmosomes ANCHOR, gap junctions COMMUNICATE (channels between cytoplasms).","diff":2,"origin":"new","opts":[{"t":"Tight junctions seal the space between neighboring cells.","c":true},{"t":"Desmosomes anchor cells together to resist stretching.","c":true},{"t":"Gap junctions connect the cytoplasm of neighboring cells so ions can pass.","c":true},{"t":"Gap junctions anchor cells against mechanical stress.","w":"Anchoring is the desmosome's job. Gap junctions communicate."},{"t":"Tight junctions let ions flow from one cell's cytoplasm into the next.","w":"That is a gap junction. Tight junctions seal."}],"trick":"Tight = Tape (seal). Desmosome = Dowel (anchor). Gap = a Gateway for messages.","tip":"SATA: one swapped job makes an option false."},{"id":"N3-03","unit":"ch3","sec":"ch3-organelles","focus":[["ch3-organelles",0]],"type":"order","stem":"Put the path of a secreted protein, such as a hormone, in order from where it is made to where it leaves the cell.","why":"Secreted proteins follow ribosome → rough ER → transport vesicle → Golgi → secretory vesicle → plasma membrane. Cells that secrete a lot have plenty of rough ER and Golgi.","diff":2,"origin":"new","steps":["Ribosome on the rough ER makes the polypeptide.","The protein enters the rough endoplasmic reticulum.","A transport vesicle carries it to the Golgi apparatus.","The Golgi modifies, sorts, and packages it.","A secretory vesicle carries it to the plasma membrane.","The vesicle fuses with the membrane and releases the protein (exocytosis)."],"trick":"Make it, Ship it (ER), Wrap it (Golgi), Mail it (vesicle out).","tip":"Ordering: think like a factory. Build, then package, then ship."},{"id":"N3-04","unit":"ch3","sec":"ch3-organelles","focus":[["ch3-organelles",1]],"type":"mcq","stem":"A liver cell is detoxifying a drug and must break down hydrogen peroxide. Which organelle, which contains catalase, does this?","why":"Peroxisomes handle oxidation and detoxification and contain catalase to break down hydrogen peroxide. They are prominent in liver and kidney cells.","diff":2,"origin":"new","opts":[{"t":"Peroxisome","c":true},{"t":"Lysosome","w":"Lysosomes digest engulfed material and worn parts with hydrolytic enzymes."},{"t":"Mitochondrion","w":"Mitochondria make ATP aerobically."},{"t":"Golgi apparatus","w":"The Golgi sorts and packages products."}],"trick":"PEROXisome breaks down hydrogen PEROXide.","tip":"Sometimes the name of the answer is hidden in the stem. Look for matching words."},{"id":"N3-05","unit":"ch3","sec":"ch3-organelles","focus":[["ch3-organelles",1]],"type":"mcq","stem":"Heart muscle cells need huge amounts of ATP. Which organelle would the nurse expect them to have in large numbers?","why":"Mitochondria carry out aerobic ATP production in their matrix and folded inner membrane (cristae). High energy demand predicts many mitochondria.","diff":1,"origin":"new","opts":[{"t":"Mitochondria","c":true},{"t":"Lysosomes","w":"Lysosomes digest material. They don't supply energy."},{"t":"Peroxisomes","w":"Peroxisomes detoxify and oxidize substances."},{"t":"Golgi apparatus","w":"Lots of Golgi predicts heavy secretion, not high energy use."}],"trick":"Mitochondria = the Mighty power plants.","tip":"Structure predicts function: match the cell's biggest need to the organelle."},{"id":"N3-06","unit":"ch3","sec":"ch3-nucleus","focus":[["ch3-nucleus",0]],"type":"mcq","stem":"Which statement about the nucleus is accurate?","why":"The nucleus holds DNA inside a double-membrane envelope. Nuclear pores control what goes in and out, and the nucleolus uses ribosomal RNA and proteins to build ribosome subunits.","diff":2,"origin":"new","opts":[{"t":"The nucleolus assembles ribosomal subunits.","c":true},{"t":"The nucleolus makes ATP for the nucleus.","w":"Mitochondria make ATP. The nucleolus builds ribosomal subunits."},{"t":"Nuclear pores let any molecule pass freely.","w":"Pores REGULATE exchange, such as RNA export and protein import."},{"t":"Chromatin assembles the cell's ribosomes.","w":"Chromatin is DNA plus proteins. The nucleolus assembles ribosomal subunits."}],"trick":"NucleOLus = the ribosome factOry.","tip":"Words like 'any' or 'freely' often signal a false statement."},{"id":"N3-07","unit":"ch3","sec":"ch3-nucleus","focus":[["ch3-nucleus",1]],"type":"sata","stem":"Which pairings of cell surface extension and function are correct? Select all that apply.","why":"Microvilli (actin-supported) increase surface area for absorption. Motile cilia (microtubule-based) move material across a surface. A flagellum propels a whole cell, like a sperm.","diff":2,"origin":"new","opts":[{"t":"Microvilli increase absorptive surface area in the intestine.","c":true},{"t":"Cilia move mucus along the respiratory passages.","c":true},{"t":"A flagellum propels a sperm cell.","c":true},{"t":"Microvilli sweep mucus out of the airways.","w":"Moving mucus is the job of cilia. Microvilli increase surface area."},{"t":"Cilia exist mainly to increase absorption area.","w":"That is microvilli. Cilia move material along a surface."}],"trick":"Microvilli = Many tiny folds for absorbing. Cilia = Conveyor belt. Flagellum = a tail for swimming.","tip":"Different projections, different jobs. Don't give the same job to all three."},{"id":"N3-08","unit":"ch3","sec":"ch3-diffusion","focus":[["ch3-diffusion",0],["ch3-diffusion",1]],"type":"mcq","stem":"Glucose enters a cell through a carrier protein, moving from high to low concentration, with no ATP used. Which process is this?","why":"Facilitated diffusion uses a channel or carrier but stays passive: substances move down their gradient without direct ATP. Carriers can saturate when all are occupied.","diff":2,"origin":"new","opts":[{"t":"Facilitated diffusion","c":true},{"t":"Primary active transport","w":"Active transport uses ATP to move substances AGAINST a gradient."},{"t":"Filtration","w":"Filtration is driven by a pressure gradient."},{"t":"Osmosis","w":"Osmosis is the movement of water."}],"trick":"Facilitated = a helper (protein) holds the door, but you still walk downhill for free.","tip":"Ask three things: Is there a protein? Is it down the gradient? Is ATP used?"},{"id":"N3-09","unit":"ch3","sec":"ch3-diffusion","focus":[["ch3-diffusion",0]],"type":"mcq","stem":"In the kidney, blood pressure pushes water and small solutes out of the capillaries. Which process is this?","why":"Filtration moves water and small solutes across a barrier because of a PRESSURE gradient. In the kidney, blood pressure drives glomerular filtration. Diffusion follows a CONCENTRATION gradient.","diff":2,"origin":"new","opts":[{"t":"Filtration","c":true},{"t":"Simple diffusion","w":"Diffusion follows a concentration gradient, not a pressure gradient."},{"t":"Osmosis","w":"Osmosis is water following effective solute concentration."},{"t":"Active transport","w":"Active transport uses ATP to move specific substances."}],"trick":"Filtration = Force (pressure). Diffusion = Different concentrations.","tip":"Find the driving force in the stem: pressure, concentration, or ATP."},{"id":"N3-10","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",0]],"type":"mcq","stem":"A lab sample of red blood cells is placed in a hypertonic solution. What happens to the cells?","why":"A hypertonic solution has more effective solute outside, so water leaves the cell by osmosis and the cell shrinks. In red cells this is called crenation.","diff":2,"origin":"new","opts":[{"t":"Water leaves the cells and they shrink (crenation).","c":true},{"t":"Water enters the cells and they swell and burst.","w":"That happens in a HYPOtonic solution."},{"t":"Nothing happens to their size.","w":"That describes an isotonic solution."},{"t":"Solute leaves the cells and they swell.","w":"Water does the moving, toward the side with more effective solute."}],"trick":"HYPER = more solute outside, so water exits and the cell shrinks. HYPO = the cell swells like a hippo.","tip":"Water moves toward more solute. Decide where the solute is, then where the water goes."},{"id":"N3-11","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",0]],"type":"sata","stem":"A nurse is reviewing how IV solutions affect red blood cells. Which statements are accurate? Select all that apply.","why":"Hypertonic shrinks, hypotonic swells (possibly to lysis), isotonic keeps volume steady. Even in isotonic fluid water keeps moving in both directions in equal amounts.","diff":2,"origin":"new","opts":[{"t":"In a hypertonic solution, cells lose water and shrink.","c":true},{"t":"In a hypotonic solution, cells gain water and may burst (hemolysis).","c":true},{"t":"In an isotonic solution, cell volume stays the same.","c":true},{"t":"In a hypotonic solution, cells shrink.","w":"Hypotonic solutions make cells SWELL."},{"t":"In an isotonic solution, water stops crossing the membrane completely.","w":"Water still crosses both ways. The flows just balance."}],"trick":"Hypo = Hippo (swells). Hyper = shrivels. Iso = Same.","tip":"SATA: watch for 'completely' and 'stops'. Molecules never stop moving."},{"id":"N3-12","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",1]],"type":"mcq","stem":"What determines a solution's tonicity?","why":"Tonicity depends on effective, relatively nonpenetrating solutes, the ones that stay outside and pull water. A solution can be iso-osmotic but not isotonic if its solute enters cells quickly.","diff":3,"origin":"new","opts":[{"t":"Solutes that do not freely cross the cell membrane","c":true},{"t":"Every dissolved particle, including ones that enter cells quickly","w":"That describes total osmolarity. Penetrating solutes don't count toward tonicity."},{"t":"The temperature of the solution","w":"Tonicity is about effective solutes, not temperature."},{"t":"The color of the solution","w":"Color has nothing to do with tonicity."}],"trick":"Tonicity counts only the solutes that stay put and pull water.","tip":"Tonicity vs osmolarity is a classic trap: tonicity counts only what can't cross."},{"id":"N3-13","unit":"ch3","sec":"ch3-active","focus":[["ch3-active",0]],"type":"mcq","stem":"Which statement about the sodium–potassium pump is accurate?","why":"The Na⁺/K⁺ pump uses ATP directly to export 3 Na⁺ and import 2 K⁺ per cycle, against their gradients. It keeps sodium high outside and potassium high inside.","diff":2,"origin":"new","opts":[{"t":"It uses ATP to move 3 sodium ions out and 2 potassium ions in, maintaining ion gradients.","c":true},{"t":"It moves ions passively down their gradients.","w":"The pump is primary ACTIVE transport and uses ATP."},{"t":"It moves 3 potassium ions out and 2 sodium ions in.","w":"The ions are swapped. Sodium goes out, potassium comes in."},{"t":"It mainly transports glucose.","w":"It transports sodium and potassium."}],"trick":"3 Na⁺ out, 2 K⁺ in: 'Salty outside, bananas (potassium) inside.'","tip":"Numbers and directions are easy to swap. Check both."},{"id":"N3-14","unit":"ch3","sec":"ch3-active","focus":[["ch3-active",1]],"type":"mcq","stem":"A white blood cell engulfs a bacterium into a vesicle. Which process is this?","why":"Phagocytosis ('cell eating') engulfs large particles like bacteria. The phagosome then fuses with lysosomes for digestion. Pinocytosis is 'cell drinking', and exocytosis releases material.","diff":1,"origin":"new","opts":[{"t":"Phagocytosis","c":true},{"t":"Pinocytosis","w":"Pinocytosis takes in droplets of fluid and dissolved substances."},{"t":"Exocytosis","w":"Exocytosis RELEASES vesicle contents out of the cell."},{"t":"Facilitated diffusion","w":"Large particles like bacteria can't diffuse through proteins."}],"trick":"Phago = eat. Pino = drink. Exo = exit.","tip":"Decode the prefix and the answer follows."},{"id":"N3-15","unit":"ch3","sec":"ch3-cycle","focus":[["ch3-cycle",0]],"type":"mcq","stem":"Which cell-cycle pairing is correct?","why":"DNA replication happens in S (synthesis) phase of interphase. During mitosis, sister chromatids are pulled apart in anaphase.","diff":2,"origin":"new","opts":[{"t":"S phase: DNA is replicated. Anaphase: sister chromatids separate.","c":true},{"t":"Metaphase: DNA is replicated. Telophase: chromatids separate.","w":"DNA replication happens in S phase, before mitosis starts."},{"t":"Prophase: sister chromatids separate. G1: DNA is replicated.","w":"Chromatids separate in anaphase, and DNA is replicated in S."},{"t":"G2: chromatids separate. Anaphase: DNA is replicated.","w":"Both halves are wrong."}],"trick":"S = Synthesis of DNA. Anaphase = chromatids move Apart.","tip":"For two-part pairings, test each half. One wrong half makes the option wrong."},{"id":"N3-16","unit":"ch3","sec":"ch3-cycle","focus":[["ch3-cycle",0]],"type":"order","stem":"Put the phases of mitosis in order.","why":"Prophase (condense), metaphase (middle), anaphase (apart), telophase (two new nuclei). Cytokinesis then splits the cytoplasm.","diff":2,"origin":"new","steps":["Prophase: chromosomes condense and the spindle forms","Metaphase: chromosomes line up at the equator","Anaphase: sister chromatids separate","Telophase: new nuclei form as chromosomes decondense"],"trick":"PMAT: Pack, Middle, Apart, Two nuclei.","tip":"Use the first letter of each phase name as your clue."},{"id":"N3-17","unit":"ch3","sec":"ch3-cycle","focus":[["ch3-cycle",1]],"type":"mcq","stem":"Which process divides the cytoplasm to form two separate cells?","why":"Mitosis distributes the duplicated chromosomes into two nuclei. Cytokinesis physically splits the cytoplasm, usually with an actin cleavage furrow.","diff":1,"origin":"new","opts":[{"t":"Cytokinesis","c":true},{"t":"Mitosis","w":"Mitosis divides the nuclear material (chromosomes)."},{"t":"S phase","w":"S phase replicates DNA."},{"t":"Interphase","w":"Interphase is the growth and preparation stage."}],"trick":"CYTOkinesis splits the CYTOplasm.","tip":"The word root 'cyto-' means cell or cytoplasm. Match roots to jobs."},{"id":"N3-18","unit":"ch3","sec":"ch3-differentiation","focus":[["ch3-differentiation",0]],"type":"mcq","stem":"A student asks why a nerve cell and a skin cell from the same person look and act so differently. Which explanation is accurate?","why":"Differentiation largely comes from differences in gene expression. Cells share nearly the same genome but switch different genes on and off.","diff":2,"origin":"new","opts":[{"t":"They activate different sets of genes from the same DNA.","c":true},{"t":"They contain completely different DNA.","w":"Most nucleated body cells contain the same genetic information."},{"t":"Nerve cells have more chromosomes.","w":"Normal body cells have the same chromosome number."},{"t":"Skin cells have no DNA.","w":"Skin cells have nuclei and DNA."}],"trick":"Same cookbook, different recipes.","tip":"Be suspicious of options claiming body cells have different DNA."},{"id":"N3-19","unit":"ch3","sec":"ch3-differentiation","focus":[["ch3-differentiation",1]],"type":"sata","stem":"Which statements about cell growth and tumors are accurate? Select all that apply.","why":"Benign = localized, no metastasis (but location can still matter). Malignant = invades and spreads. Stem cells both self-renew and give rise to specialized cells.","diff":2,"origin":"new","opts":[{"t":"A benign tumor stays localized and does not metastasize.","c":true},{"t":"A malignant tumor can invade nearby tissue and spread.","c":true},{"t":"Stem cells can self-renew and produce differentiated cells.","c":true},{"t":"Benign tumors are always harmless.","w":"Their location can still make them harmful."},{"t":"Every exposure to a carcinogen causes cancer.","w":"An exposure is a risk factor, not proof every exposed cell becomes cancerous."}],"trick":"Benign = stays Behind. Malignant = Migrates.","tip":"'Always' and 'every' usually make an option false."},{"id":"N4-01","unit":"ch4","sec":"ch4-enzymes","focus":[["ch4-enzymes",1]],"type":"mcq","stem":"How does an enzyme speed up a reaction?","why":"Enzymes are catalysts: they lower activation energy, speed up a specific reaction, and are reused. They don't change the overall energy difference or the equilibrium.","diff":1,"origin":"new","opts":[{"t":"It lowers the activation energy and is not used up.","c":true},{"t":"It is used up in the reaction, so the cell must replace it after each use.","w":"Enzymes are reused. They aren't consumed."},{"t":"It changes the reaction's equilibrium.","w":"Enzymes speed up reaching equilibrium but don't change it."},{"t":"It adds energy to the reactants.","w":"Enzymes lower the energy barrier. They don't supply energy."}],"trick":"An enzyme is a tunnel through the mountain: same start and end, easier path.","tip":"Eliminate options saying enzymes are consumed or change equilibrium."},{"id":"N4-02","unit":"ch4","sec":"ch4-enzymes","focus":[["ch4-enzymes",0]],"type":"mcq","stem":"When enough of a pathway's final product builds up, it slows an enzyme at an earlier step. What is this called?","why":"In feedback inhibition, a pathway's end product reduces the activity of an earlier enzyme, so the cell doesn't waste resources making more than it needs.","diff":2,"origin":"new","opts":[{"t":"Feedback inhibition","c":true},{"t":"Denaturation","w":"Denaturation destroys an enzyme's shape. Feedback inhibition only regulates activity."},{"t":"Positive feedback","w":"Positive feedback amplifies a process. This slows one down."},{"t":"Mutation","w":"A mutation changes DNA, not enzyme activity in the moment."}],"trick":"The finished product tells the start of the line to slow down.","tip":"Separate regulating an enzyme (temporary) from destroying it (denaturation)."},{"id":"N4-03","unit":"ch4","sec":"ch4-enzymes","focus":[["ch4-enzymes",0]],"type":"sata","stem":"Which statements about enzymes are accurate? Select all that apply.","why":"Enzymes are specific: the active site fits particular substrates (refined by induced fit). Helpers include cofactors (often metal ions) and coenzymes (organic, often from vitamins). The -ase name often shows the substrate: lipase acts on lipids, sucrase on sucrose.","diff":2,"origin":"new","opts":[{"t":"The active site binds specific substrates.","c":true},{"t":"Some cofactors are metal ions.","c":true},{"t":"Many coenzymes are derived from vitamins.","c":true},{"t":"Every enzyme requires a vitamin to work.","w":"Not all enzymes need a vitamin-derived coenzyme."},{"t":"Lipase digests proteins.","w":"Lipase acts on lipids. Enzyme names often show their substrate."}],"trick":"Substrate + -ase = the enzyme that acts on it (lipid → lipase).","tip":"'Every' is a red flag in SATA options."},{"id":"N4-04","unit":"ch4","sec":"ch4-atp","focus":[["ch4-atp",0]],"type":"mcq","stem":"NAD⁺ picks up electrons and becomes NADH. What has happened to NAD⁺?","why":"Oxidation = losing electrons. Reduction = gaining electrons. NAD⁺ and FAD gain electrons during fuel breakdown (becoming NADH and FADH₂) and later donate them to the electron transport chain.","diff":2,"origin":"new","opts":[{"t":"It has been reduced.","c":true},{"t":"It has been oxidized.","w":"Oxidation is LOSING electrons."},{"t":"It has been phosphorylated.","w":"Phosphorylation adds a phosphate group, not electrons."},{"t":"It has been hydrolyzed.","w":"Hydrolysis uses water to break a bond."}],"trick":"OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons).","tip":"Use OIL RIG every time. Don't go by how the word sounds."},{"id":"N4-05","unit":"ch4","sec":"ch4-atp","focus":[["ch4-atp",1]],"type":"mcq","stem":"In the mitochondria, a proton gradient drives ATP synthase to make ATP. Which type of phosphorylation is this?","why":"Oxidative phosphorylation links electron transfer and a proton gradient to ATP synthase and makes most aerobic ATP. Substrate-level phosphorylation transfers phosphate directly to ADP, as in glycolysis and the Krebs cycle.","diff":2,"origin":"new","opts":[{"t":"Oxidative phosphorylation","c":true},{"t":"Substrate-level phosphorylation","w":"Substrate-level transfers a phosphate DIRECTLY to ADP, as in glycolysis."},{"t":"Dehydration synthesis","w":"That joins molecules by removing water. It isn't a type of phosphorylation."},{"t":"Fermentation","w":"Fermentation regenerates NAD⁺ without oxygen."}],"trick":"Oxidative = Oxygen + ATP synthase turbine. Substrate-level = direct hand-off.","tip":"Key phrase match: 'ATP synthase' or 'proton gradient' = oxidative."},{"id":"N4-06","unit":"ch4","sec":"ch4-glycolysis","focus":[["ch4-glycolysis",0]],"type":"mcq","stem":"What does glycolysis produce from one molecule of glucose?","why":"Glycolysis happens in the cytosol. It splits one six-carbon glucose into two three-carbon pyruvates, uses 2 ATP and makes 4 (net 2), and yields 2 NADH. It doesn't directly need oxygen.","diff":2,"origin":"new","opts":[{"t":"2 pyruvate, 2 net ATP, and 2 NADH","c":true},{"t":"About 36 ATP","w":"That is a total for full aerobic respiration (older accounting), not glycolysis."},{"t":"4 net ATP","w":"Glycolysis MAKES 4 ATP but invests 2, so the net gain is 2."},{"t":"6 CO₂","w":"CO₂ is released later, in pyruvate oxidation and the Krebs cycle."}],"trick":"Glycolysis = 'two of everything': 2 pyruvate, 2 ATP, 2 NADH.","tip":"'Net' means subtract what was invested (4 made − 2 used = 2)."},{"id":"N4-07","unit":"ch4","sec":"ch4-glycolysis","focus":[["ch4-glycolysis",1]],"type":"mcq","stem":"During a sprint, muscle cells convert pyruvate into lactate. What does this step accomplish?","why":"Glycolysis needs NAD⁺. When the mitochondria can't reoxidize NADH fast enough, lactate dehydrogenase passes NADH's electrons to pyruvate, making lactate and freeing NAD⁺. Glycolysis continues, but no extra ATP is made by that step.","diff":3,"origin":"new","opts":[{"t":"It regenerates NAD⁺ so glycolysis can keep going, without making extra ATP.","c":true},{"t":"It makes a large amount of extra ATP.","w":"Lactate formation itself produces no additional ATP."},{"t":"It creates a toxic waste with no further use.","w":"Lactate is a usable intermediate that can be oxidized or turned back into glucose."},{"t":"It requires oxygen.","w":"Lactate formation happens when NADH can't be reoxidized fast enough aerobically."}],"trick":"Lactate is the NAD⁺ recycling bin.","tip":"Don't assume a step makes ATP just because it's in an energy pathway."},{"id":"N4-08","unit":"ch4","sec":"ch4-aerobic","focus":[["ch4-aerobic",0]],"type":"order","stem":"Put the stages of aerobic cellular respiration in order.","why":"Glucose is split in the cytosol, pyruvate enters mitochondria and becomes acetyl-CoA, the Krebs cycle strips electrons and releases CO₂, and the electron transport chain uses those electrons to make most of the ATP.","diff":2,"origin":"new","steps":["Glycolysis in the cytosol","Pyruvate oxidation to acetyl-CoA in the mitochondrial matrix","Krebs (citric acid) cycle in the matrix","Electron transport chain and oxidative phosphorylation on the inner membrane"],"trick":"Get Pyruvate, Kick off Krebs, Electrons Exit to oxygen (G, P, K, E).","tip":"Follow the location: cytosol first, then deeper into the mitochondrion."},{"id":"N4-09","unit":"ch4","sec":"ch4-aerobic","focus":[["ch4-aerobic",1]],"type":"mcq","stem":"What is the final electron acceptor in the electron transport chain?","why":"Electrons pass through the chain and pump protons. At the end, oxygen accepts the electrons and forms water. The proton gradient then powers ATP synthase. Without oxygen, the chain backs up and aerobic ATP production falls.","diff":2,"origin":"new","opts":[{"t":"Oxygen, which forms water","c":true},{"t":"NAD⁺","w":"NAD⁺ collects electrons early on. NADH then DONATES them to the chain."},{"t":"Carbon dioxide","w":"CO₂ is a waste product of the Krebs cycle, not an electron acceptor."},{"t":"Glucose","w":"Glucose is the fuel that is oxidized."}],"trick":"Oxygen is the last stop on the electron train, where water is made.","tip":"'Final' means the end of the line. Pick the substance that leaves as a product (water)."},{"id":"N4-10","unit":"ch4","sec":"ch4-fuels","focus":[["ch4-fuels",0]],"type":"mcq","stem":"Which molecule is the body's largest concentrated reserve of fuel?","why":"Fats (triglycerides) are the largest concentrated fuel reserve. Glycogen is a smaller, quicker glucose store in the liver (to keep blood glucose up) and in muscle (for its own use).","diff":1,"origin":"new","opts":[{"t":"Triglycerides (fat)","c":true},{"t":"Glycogen","w":"Glycogen stores glucose in the liver and muscle, but in smaller amounts."},{"t":"Protein","w":"Proteins have structural jobs first and are not the main fuel store."},{"t":"ATP","w":"ATP is for immediate energy transfer, not long-term storage."}],"trick":"Glycogen = the wallet (quick cash). Fat = the savings account (big reserve).","tip":"'Largest' or 'long-term' storage points to fat. 'Quick' storage points to glycogen."},{"id":"N4-11","unit":"ch4","sec":"ch4-fuels","focus":[["ch4-fuels",1]],"type":"sata","stem":"Which statements about using different fuels are accurate? Select all that apply.","why":"Pathways share intermediates. Fatty acids become acetyl-CoA, glycerol enters carbohydrate pathways, and deaminated amino acid skeletons enter energy pathways while the nitrogen is excreted.","diff":3,"origin":"new","opts":[{"t":"Beta-oxidation converts fatty acids into acetyl-CoA.","c":true},{"t":"Glycerol from fats can enter carbohydrate pathways.","c":true},{"t":"After the amino group is removed, an amino acid's carbon skeleton can enter energy pathways.","c":true},{"t":"Humans can make every amino acid, so dietary protein isn't needed.","w":"Humans can't make every amino acid. Essential amino acids must come from food."},{"t":"The nitrogen from amino acids is burned as fuel.","w":"The nitrogen must be handled and excreted."}],"trick":"All roads lead to acetyl-CoA (and the Krebs cycle).","tip":"Watch for options that would mean 'no need to eat something'. They are usually false."},{"id":"N4-12","unit":"ch4","sec":"ch4-replication","focus":[["ch4-replication",0]],"type":"mcq","stem":"DNA replication is called semiconservative. What does this mean?","why":"During S phase, helicase unzips DNA and DNA polymerases build new strands from each template. Each daughter helix keeps one old strand and one new strand: semiconservative.","diff":2,"origin":"new","opts":[{"t":"Each new DNA double helix has one original strand and one newly made strand.","c":true},{"t":"Both strands of each new helix are brand new.","w":"One parental strand is kept in each daughter helix."},{"t":"Only half of the genes are copied.","w":"The whole genome is copied."},{"t":"DNA is copied into RNA.","w":"That is transcription, not replication."}],"trick":"Semi = half: half old, half new.","tip":"Don't confuse replication (DNA → DNA) with transcription (DNA → RNA)."},{"id":"N4-13","unit":"ch4","sec":"ch4-replication","focus":[["ch4-replication",1]],"type":"teaching","stem":"A nurse teaches a client about DNA and genetic changes. Which statement by the client indicates a need for further teaching?","why":"A mutation is a change in DNA sequence. Depending on where it is, it may have no effect, change a protein or its expression, or contribute to disease. Not every mutation causes cancer.","diff":2,"origin":"new","opts":[{"t":"\"Every DNA mutation causes cancer.\"","c":true},{"t":"\"DNA is copied before a cell divides.\"","w":"Accurate. Replication happens in S phase."},{"t":"\"Transcription makes RNA from DNA.\"","w":"Accurate."},{"t":"\"Repair enzymes fix many copying errors.\"","w":"Accurate. Proofreading and repair reduce errors."}],"trick":"A mutation is a typo. Some typos change nothing.","tip":"'Every' statements usually need correcting."},{"id":"N4-14","unit":"ch4","sec":"ch4-expression","focus":[["ch4-expression",0]],"type":"mcq","stem":"Which pairing of process and description is correct?","why":"Transcription (in the nucleus) uses DNA to make RNA, then mRNA exits through nuclear pores. Translation (at ribosomes) reads mRNA codons, and tRNA delivers amino acids to build the polypeptide.","diff":2,"origin":"new","opts":[{"t":"Transcription makes RNA from a DNA template; translation builds a polypeptide at a ribosome.","c":true},{"t":"Translation makes RNA from DNA; transcription builds a polypeptide.","w":"The two processes are swapped."},{"t":"Replication builds a polypeptide at a ribosome.","w":"Replication copies DNA."},{"t":"DNA travels to the ribosome and becomes protein.","w":"DNA stays a template. mRNA carries the message."}],"trick":"TranSCRIPTion = copy the script (same 'language' of nucleotides). TransLATion = translate into a new language (amino acids).","tip":"Swapped-pair questions: anchor one definition firmly, then check the other."},{"id":"N4-15","unit":"ch4","sec":"ch4-expression","focus":[["ch4-expression",1]],"type":"mcq","stem":"A template DNA strand reads 3′-TAC GGA ATT-5′. What is the mRNA made from it?","why":"mRNA is complementary to the template and runs antiparallel: T→A, A→U, C→G, G→C. 3′-TAC GGA ATT-5′ gives 5′-AUG CCU UAA-3′ = methionine (start), proline, stop.","diff":3,"origin":"new","opts":[{"t":"5′-AUG CCU UAA-3′","c":true},{"t":"5′-ATG CCT TAA-3′","w":"This uses T. RNA uses U instead of T."},{"t":"5′-UAC GGA AUU-3′","w":"This copies the template. mRNA is COMPLEMENTARY to the template."},{"t":"3′-AUG CCU UAA-5′","w":"The bases are right, but the direction is reversed. mRNA is written 5′ to 3′."}],"trick":"Pair up and swap T for U: A–U, T–A, C–G, G–C.","tip":"Check three things: complementary bases, U instead of T, and 5′→3′ direction."},{"id":"N5-01","unit":"ch5","sec":"ch5-epithelia","focus":[["ch5-epithelia",0]],"type":"sata","stem":"Which statements about epithelial tissue are accurate? Select all that apply.","why":"Epithelia are polar: an apical surface faces a lumen or the outside, and a basal surface rests on a basement membrane over vascular connective tissue. They have no blood vessels of their own and many replace themselves quickly.","diff":2,"origin":"new","opts":[{"t":"It is avascular, so nutrients diffuse from the connective tissue below.","c":true},{"t":"Its basal surface attaches to a basement membrane.","c":true},{"t":"Its apical surface faces a lumen or the outside.","c":true},{"t":"It has its own network of capillaries.","w":"Epithelia are avascular."},{"t":"It regenerates very slowly.","w":"Many epithelia regenerate rapidly."}],"trick":"Apical = Apex (top, facing out). Basal = Base (bottom, on the basement membrane).","tip":"SATA: check opposites (avascular vs vascular). Only one can be true."},{"id":"N5-02","unit":"ch5","sec":"ch5-epithelia","focus":[["ch5-epithelia",1]],"type":"mcq","stem":"A stratified epithelium has round cells at its base and flat cells at its surface. How is it named?","why":"Simple = one layer, stratified = many layers. The shape name (squamous, cuboidal, columnar) comes from the cells at the free (apical) surface.","diff":2,"origin":"new","opts":[{"t":"Stratified squamous, because it is named for the cells at the free surface","c":true},{"t":"Stratified cuboidal, because it is named for the basal cells","w":"Stratified tissues are named for their apical (surface) cells."},{"t":"Simple squamous, because the top cells are flat","w":"It has multiple layers, so it is stratified, not simple."},{"t":"Pseudostratified, because the cells vary in shape","w":"Pseudostratified is one layer where every cell touches the basement membrane."}],"trick":"Name it by the 'roof' cells, not the 'basement' cells.","tip":"Two decisions: how many layers, then what shape on top."},{"id":"N5-03","unit":"ch5","sec":"ch5-simple","focus":[["ch5-simple",0]],"type":"mcq","stem":"The air sacs (alveoli) of the lungs need a very thin lining for fast gas exchange. Which epithelium lines them?","why":"Simple squamous epithelium is one thin layer of flat cells, ideal for diffusion and filtration. It lines the alveoli, blood vessels (endothelium), and serous membranes (mesothelium).","diff":1,"origin":"new","opts":[{"t":"Simple squamous","c":true},{"t":"Stratified squamous","w":"Multiple layers resist abrasion but would slow diffusion."},{"t":"Simple columnar","w":"Tall columnar cells absorb and secrete. They're too thick for fast diffusion."},{"t":"Transitional","w":"Transitional epithelium lines the stretchy urinary bladder."}],"trick":"Squamous = squashed flat = short diffusion distance.","tip":"Match thickness to job: thin for exchange, thick and layered for protection."},{"id":"N5-04","unit":"ch5","sec":"ch5-simple","focus":[["ch5-simple",0]],"type":"mcq","stem":"Kidney tubules absorb and secrete substances. Which epithelium, a single layer of cells with round central nuclei, lines them?","why":"Simple cuboidal epithelium (one layer of cube-shaped cells) has enough cytoplasm to absorb and secrete. It lines kidney tubules, thyroid follicles, and small gland ducts.","diff":2,"origin":"new","opts":[{"t":"Simple cuboidal","c":true},{"t":"Simple squamous","w":"Simple squamous is for diffusion and filtration, not heavy absorption and secretion."},{"t":"Stratified squamous","w":"Stratified squamous protects against abrasion."},{"t":"Pseudostratified columnar","w":"This ciliated lining is found in the trachea."}],"trick":"Cuboidal = cubes in the kidney tubules.","tip":"Absorption or secretion points to cuboidal or columnar. Diffusion points to squamous."},{"id":"N5-05","unit":"ch5","sec":"ch5-simple","focus":[["ch5-simple",1]],"type":"mcq","stem":"Under the microscope, the lining of the trachea looks multilayered because its nuclei sit at different heights. What is true about this pseudostratified epithelium?","why":"Pseudostratified columnar epithelium looks stratified because the nuclei are at different heights, but it is one layer: all cells contact the basement membrane. In the airways it is ciliated with goblet cells that make mucus.","diff":2,"origin":"new","opts":[{"t":"Every cell touches the basement membrane.","c":true},{"t":"Every cell reaches the free surface (lumen).","w":"Not every cell reaches the lumen, but every cell touches the basement membrane."},{"t":"It truly has several layers of cells.","w":"It only LOOKS layered ('pseudo' means false)."},{"t":"It never has cilia or goblet cells.","w":"The respiratory version is ciliated and has goblet cells."}],"trick":"PSEUDO = fake layers. All feet on the same floor (basement membrane).","tip":"The prefix 'pseudo' tells you the appearance is misleading."},{"id":"N5-06","unit":"ch5","sec":"ch5-stratified","focus":[["ch5-stratified",0]],"type":"mcq","stem":"Which epithelium lines the moist surfaces of the mouth and esophagus?","why":"Stratified squamous resists abrasion. The keratinized form (dead, keratin-filled surface cells) is the epidermis. The nonkeratinized form protects moist surfaces like the mouth, esophagus, and vagina, and its surface cells keep their nuclei.","diff":2,"origin":"new","opts":[{"t":"Nonkeratinized stratified squamous","c":true},{"t":"Keratinized stratified squamous","w":"The keratinized form makes up the epidermis of the skin."},{"t":"Simple squamous","w":"One thin layer couldn't stand up to the abrasion of food."},{"t":"Transitional","w":"Transitional epithelium lines urinary structures."}],"trick":"Keratin = dry skin armor. No keratin = moist inside linings.","tip":"Moist vs dry location decides keratinized vs nonkeratinized."},{"id":"N5-07","unit":"ch5","sec":"ch5-stratified","focus":[["ch5-stratified",1]],"type":"mcq","stem":"The urinary bladder lining must stretch as it fills while still forming a barrier against urine. Which epithelium is this?","why":"Transitional epithelium lines the bladder and ureters. Its surface cells look dome-shaped when relaxed and flatten as the wall stretches, while multiple layers keep a protective barrier.","diff":1,"origin":"new","opts":[{"t":"Transitional epithelium (urothelium)","c":true},{"t":"Simple columnar","w":"Simple columnar lines the intestine for absorption."},{"t":"Simple squamous","w":"Simple squamous is too thin to be a protective urinary barrier."},{"t":"Pseudostratified columnar","w":"This lines the airways."}],"trick":"Transitional = Transforms its shape as the bladder fills.","tip":"The word 'stretch' plus 'urinary' points straight to transitional."},{"id":"N5-08","unit":"ch5","sec":"ch5-glands","focus":[["ch5-glands",0]],"type":"mcq","stem":"The thyroid gland releases hormones into the interstitial fluid and blood, without ducts. Which type of gland is it?","why":"Exocrine glands use ducts (sweat, salivary). Endocrine glands are ductless and release hormones into the fluid around them to circulate in the blood.","diff":1,"origin":"new","opts":[{"t":"Endocrine","c":true},{"t":"Exocrine","w":"Exocrine glands deliver products through ducts onto a surface or into a lumen."},{"t":"Holocrine","w":"Holocrine describes a secretion method (whole cells break down), not whether ducts exist."},{"t":"Goblet cell","w":"A goblet cell is a one-cell exocrine gland that makes mucus."}],"trick":"ENDOcrine = into (endo) the blood. EXOcrine = out (exo) through a duct.","tip":"Separate WHERE the product goes (endo/exo) from HOW it is released (mero/apo/holo)."},{"id":"N5-09","unit":"ch5","sec":"ch5-glands","focus":[["ch5-glands",1]],"type":"mcq","stem":"In sebaceous glands, entire cells fill with product and then disintegrate to release it. What type of secretion is this?","why":"Holocrine secretion releases the contents of whole cells as they break down, as in sebaceous glands. Merocrine uses exocytosis and keeps the cell intact.","diff":2,"origin":"new","opts":[{"t":"Holocrine","c":true},{"t":"Merocrine","w":"Merocrine releases product by exocytosis without losing the cell."},{"t":"Apocrine","w":"Classic apocrine secretion pinches off just the top (apical) part of the cell."},{"t":"Serous","w":"Serous describes a watery product, not the release method."}],"trick":"HOLOcrine = the WHOLE cell is sacrificed.","tip":"Decode the prefix: holo = whole, apo = top part, mero = a part (by exocytosis)."},{"id":"N5-10","unit":"ch5","sec":"ch5-matrix","focus":[["ch5-matrix",0],["ch5-matrix",1]],"type":"sata","stem":"Which statements about connective tissue are accurate? Select all that apply.","why":"Connective tissue = cells scattered in an extracellular matrix of ground substance plus fibers. Collagen = strength against pulling, elastic = stretch and recoil, reticular = fine networks. Fibroblasts build the matrix and macrophages clean up.","diff":2,"origin":"new","opts":[{"t":"The matrix is made of ground substance plus fibers.","c":true},{"t":"Collagen fibers resist tension (pulling).","c":true},{"t":"Elastic fibers stretch and recoil.","c":true},{"t":"Reticular fibers are the main fibers that resist strong pulling forces.","w":"Reticular fibers form fine supportive networks. Collagen resists tension."},{"t":"Fibroblasts engulf microbes.","w":"Macrophages engulf microbes. Fibroblasts make fibers and ground substance."}],"trick":"Collagen = rope, Elastic = rubber band, Reticular = a fine net.","tip":"Give each fiber and cell its own job. One swapped job makes an option false."},{"id":"N5-11","unit":"ch5","sec":"ch5-matrix","focus":[["ch5-matrix",0]],"type":"mcq","stem":"A client has a red, itchy, swollen allergic reaction. Which connective tissue cell releases histamine?","why":"Mast cells release mediators, including histamine, that contribute to inflammation, such as redness, swelling, and itching.","diff":2,"origin":"new","opts":[{"t":"Mast cell","c":true},{"t":"Fibroblast","w":"Fibroblasts produce fibers and ground substance."},{"t":"Macrophage","w":"Macrophages phagocytose debris and microbes."},{"t":"Plasma cell","w":"Plasma cells produce antibodies."}],"trick":"Mast cells = histaMine Makers.","tip":"Link each cell to one signature product: histamine (mast), antibodies (plasma), fibers (fibroblast)."},{"id":"N5-12","unit":"ch5","sec":"ch5-connective","focus":[["ch5-connective",0]],"type":"mcq","stem":"Tendons are pulled mostly in one direction. Which tissue, with parallel collagen bundles, forms them?","why":"Fiber arrangement predicts function. Parallel collagen (dense regular) resists tension along one axis: tendons and many ligaments. Interwoven collagen (dense irregular) resists tension from several directions: the dermis and capsules.","diff":2,"origin":"new","opts":[{"t":"Dense regular connective tissue","c":true},{"t":"Dense irregular connective tissue","w":"Interwoven collagen handles stress from many directions, as in the dermis."},{"t":"Areolar connective tissue","w":"Areolar is loose packing tissue under epithelia."},{"t":"Elastic connective tissue","w":"Elastic tissue recoils, as in large arteries."}],"trick":"REGULAR = rows (parallel). IRREGULAR = in every direction.","tip":"One-direction pull points to regular. Multi-direction points to irregular."},{"id":"N5-13","unit":"ch5","sec":"ch5-connective","focus":[["ch5-connective",1]],"type":"sata","stem":"Which statements about specialized connective tissues are accurate? Select all that apply.","why":"Three cartilages: hyaline (smooth, articular surfaces, trachea, nose), elastic (bendy, ear and epiglottis), and fibrocartilage (tough, discs and pubic symphysis). Cartilage heals slowly because it has no blood vessels. Blood is connective tissue with a liquid matrix.","diff":2,"origin":"new","opts":[{"t":"Hyaline cartilage covers joint surfaces and supports the trachea and nose.","c":true},{"t":"Elastic cartilage gives flexible support to the external ear and epiglottis.","c":true},{"t":"Fibrocartilage forms the intervertebral discs and pubic symphysis.","c":true},{"t":"Blood is not a connective tissue because its matrix is liquid.","w":"Blood IS a connective tissue. Its matrix (plasma) just happens to be liquid."},{"t":"Cartilage heals quickly because it has a rich blood supply.","w":"Cartilage is avascular, so it heals slowly."}],"trick":"Hyaline = glassy joints, Elastic = Ears, Fibro = discs that take a pounding.","tip":"Blood counts as connective tissue. It is a favorite trick question."},{"id":"N5-14","unit":"ch5","sec":"ch5-membranes","focus":[["ch5-membranes",0]],"type":"mcq","stem":"Which tissue membrane lacks a true epithelial layer?","why":"Synovial membranes line movable joint capsules and are made only of connective tissue, with no true epithelium. Cutaneous (skin), mucous (open passages), and serous (closed cavities) membranes all have epithelium.","diff":2,"origin":"new","opts":[{"t":"Synovial membrane","c":true},{"t":"Mucous membrane","w":"Mucous membranes have epithelium over a lamina propria."},{"t":"Serous membrane","w":"Serous membranes have a mesothelium (simple squamous epithelium)."},{"t":"Cutaneous membrane","w":"The skin has a keratinized epithelium (epidermis)."}],"trick":"Synovial = the one with no epithelial 'skin'. Only connective tissue lines the joint.","tip":"'Lacks' questions: find the one that's built differently from the rest."},{"id":"N5-15","unit":"ch5","sec":"ch5-membranes","focus":[["ch5-membranes",1]],"type":"mcq","stem":"A biopsy from the wall of the stomach shows spindle-shaped cells with no striations and one central nucleus. Which tissue is this?","why":"Smooth muscle has spindle-shaped, nonstriated cells with one nucleus. It is found in the walls of hollow organs and vessels and is involuntary.","diff":1,"origin":"new","opts":[{"t":"Smooth muscle","c":true},{"t":"Skeletal muscle","w":"Skeletal fibers are long, striated, and multinucleated."},{"t":"Cardiac muscle","w":"Cardiac cells are striated, branched, and only in the heart."},{"t":"Nervous tissue","w":"Nervous tissue is neurons and glia, not contractile cells."}],"trick":"Smooth = no stripes, and spindle-shaped like a smooth river stone.","tip":"Striations narrow the choice to skeletal or cardiac. No striations means smooth."},{"id":"N6-01","unit":"ch6","sec":"ch6-layers","focus":[["ch6-layers",0]],"type":"order","stem":"Put the layers (strata) of thick skin's epidermis in order, from deepest to most superficial.","why":"New keratinocytes are made in the basale and move outward through the spinosum and granulosum, filling with keratin. Thick skin adds the lucidum, then the dead, flat cells of the corneum shed from the surface.","diff":2,"origin":"new","steps":["Stratum basale","Stratum spinosum","Stratum granulosum","Stratum lucidum","Stratum corneum"],"trick":"Come, Let's Get Sun Burned (surface to deep: Corneum, Lucidum, Granulosum, Spinosum, Basale). Read it backward for this question.","tip":"Check which direction the question asks for (deep to superficial here), then use your mnemonic in that direction."},{"id":"N6-02","unit":"ch6","sec":"ch6-layers","focus":[["ch6-layers",0]],"type":"mcq","stem":"Where would the nurse expect to find a distinct stratum lucidum?","why":"The stratum lucidum is a clear layer found only in thick skin: the palms and soles. Thick skin also has no hair follicles.","diff":2,"origin":"new","opts":[{"t":"Thick skin of the palms and soles","c":true},{"t":"Thin skin of the scalp","w":"Thin skin, like most of the body, lacks a distinct lucidum."},{"t":"The dermis of the back","w":"The lucidum is an epidermal layer, not dermis."},{"t":"Every area of skin equally","w":"The lucidum is specific to thick skin."}],"trick":"Lucidum = Lucid (clear) layer, only on the hands and feet that work hardest.","tip":"Absolute words like 'every area equally' are usually wrong in anatomy questions."},{"id":"N6-03","unit":"ch6","sec":"ch6-layers","focus":[["ch6-layers",1]],"type":"sata","stem":"Which statements about the layers of skin are accurate? Select all that apply.","why":"Epidermis = outer epithelium, no blood vessels. Dermis = vascular connective tissue with sensory structures, follicles, glands. Hypodermis = areolar and adipose tissue underneath that anchors, cushions, stores fuel and insulates.","diff":2,"origin":"new","opts":[{"t":"The epidermis is avascular keratinized stratified squamous epithelium.","c":true},{"t":"The dermis is vascular connective tissue that holds follicles, glands, and nerves.","c":true},{"t":"The hypodermis contains adipose tissue that insulates and cushions.","c":true},{"t":"The epidermis has its own blood vessels.","w":"The epidermis is avascular. Dermal vessels nourish it by diffusion."},{"t":"The hypodermis is the outermost layer of skin.","w":"The hypodermis lies BENEATH the dermis and isn't usually counted as skin proper."}],"trick":"EPI = on top, no blood. DERMis = Deep and vascular. HYPOdermis = under (hypo) everything.","tip":"Prefixes give away the order: epi- (upon), hypo- (below)."},{"id":"N6-04","unit":"ch6","sec":"ch6-dermis","focus":[["ch6-dermis",0]],"type":"mcq","stem":"Which description matches the reticular layer of the dermis?","why":"The papillary dermis (superficial) is areolar with dermal papillae. The reticular dermis (deeper) is dense irregular connective tissue whose collagen and elastic fibers give skin strength and recoil.","diff":2,"origin":"new","opts":[{"t":"Dense irregular connective tissue with interwoven collagen and elastic fibers","c":true},{"t":"Areolar tissue with dermal papillae and capillary loops","w":"That is the superficial papillary dermis."},{"t":"Keratinized stratified squamous epithelium","w":"That describes the epidermis."},{"t":"Mostly adipose tissue for insulation","w":"That describes the hypodermis."}],"trick":"Reticular = a net (reticulum) of tough fibers. Papillary = little bumps (papillae) on top.","tip":"Two layers, two tissue types: lock in one and the other follows."},{"id":"N6-05","unit":"ch6","sec":"ch6-dermis","focus":[["ch6-dermis",1]],"type":"mcq","stem":"Which receptor, found deep in the dermis with onion-like layers, detects vibration and changing deep pressure?","why":"Lamellated (Pacinian) corpuscles lie deep in the dermis or subcutis and sense deep pressure and vibration. Their onion-like lamellae set them apart from superficial tactile corpuscles, which sense light touch.","diff":2,"origin":"new","opts":[{"t":"Lamellated (Pacinian) corpuscle","c":true},{"t":"Tactile (Meissner) corpuscle","w":"Tactile corpuscles sit superficially in the dermal papillae and sense light touch."},{"t":"Free nerve ending","w":"Free nerve endings sense pain and temperature."},{"t":"Melanocyte","w":"Melanocytes make pigment. They are not receptors."}],"trick":"Pacinian = Pressure, deeP. Meissner = Mild touch, near the surface.","tip":"Depth is the clue: deep receptor, deep pressure."},{"id":"N6-06","unit":"ch6","sec":"ch6-accessory","focus":[["ch6-accessory",0],["ch6-accessory",1]],"type":"sata","stem":"Which statements about hair, nails, and glands are accurate? Select all that apply.","why":"Hair and nails are keratinized epidermal derivatives, even though follicles reach into the dermis. Arrector pili are smooth muscle (goosebumps). Sebaceous glands are holocrine: whole cells break down to form sebum.","diff":2,"origin":"new","opts":[{"t":"Hair and nails are made from epidermal cells.","c":true},{"t":"Arrector pili muscles are smooth muscle.","c":true},{"t":"Sebaceous glands use holocrine secretion: whole cells become part of the sebum.","c":true},{"t":"Arrector pili muscles are skeletal muscle under voluntary control.","w":"They are smooth muscle, which is why goosebumps happen on their own."},{"t":"The lunula is the only place where nails grow.","w":"Nails grow from the nail matrix. The lunula is just the visible pale area."}],"trick":"HOLOcrine = the WHOLE cell goes. Goosebumps are involuntary, so smooth muscle.","tip":"If an action happens on its own (like goosebumps), the muscle is not skeletal."},{"id":"N6-07","unit":"ch6","sec":"ch6-sweat","focus":[["ch6-sweat",0]],"type":"mcq","stem":"A client is exercising in a dry, cool gym. Which glands mainly help cool the body by releasing watery sweat onto the skin surface?","why":"Eccrine glands are coiled tubular glands spread over the body. Their ducts open onto the skin surface and release watery sweat. Cooling happens as that sweat evaporates.","diff":1,"origin":"new","opts":[{"t":"Eccrine sweat glands","c":true},{"t":"Apocrine sweat glands","w":"Apocrine glands drain into follicles in the armpits and groin and are linked to odor and emotion."},{"t":"Sebaceous glands","w":"Sebaceous glands make oily sebum, not watery sweat."},{"t":"Ceruminous glands","w":"Ceruminous glands help make earwax."}],"trick":"Eccrine = Everywhere, Evaporates, cools.","tip":"Match the outlet to the job: onto the skin surface means evaporative cooling."},{"id":"N6-08","unit":"ch6","sec":"ch6-sweat","focus":[["ch6-sweat",1]],"type":"mcq","stem":"A teenager asks why underarm odor started at puberty. Which explanation by the nurse is accurate?","why":"Apocrine glands are concentrated in the axillae and groin, drain into follicles, and become more active around puberty. Their secretion starts out nearly odorless. Bacteria metabolize it, which produces the smell.","diff":2,"origin":"new","opts":[{"t":"Bacteria break down apocrine sweat, which starts at puberty.","c":true},{"t":"Sweat smells strongly the moment the glands release it.","w":"Apocrine secretion is initially fairly odorless."},{"t":"Eccrine glands begin releasing oily, smelly sebum at puberty.","w":"Eccrine glands release watery sweat, and sebaceous glands make sebum."},{"t":"Dead skin cells in the stratum corneum start to smell.","w":"Bacterial metabolism of apocrine secretion causes most of the odor."}],"trick":"Apocrine = Armpits, Adolescence, And bacteria.","tip":"Eliminate options that put the right fact in the wrong gland."},{"id":"N6-09","unit":"ch6","sec":"ch6-temperature","focus":[["ch6-temperature",0]],"type":"mcq","stem":"Which structure acts as the control center for body temperature?","why":"The hypothalamus integrates temperature signals and coordinates responses. The effectors, such as skin vessels (vasodilation or constriction), sweat glands and shivering muscles, carry out its orders.","diff":1,"origin":"new","opts":[{"t":"Hypothalamus","c":true},{"t":"Skin blood vessels","w":"Skin vessels are effectors. They change heat transfer when told to."},{"t":"Eccrine sweat glands","w":"Sweat glands are effectors, not the control center."},{"t":"Arrector pili muscles","w":"These raise hairs, a minor effector in humans."}],"trick":"Hypothalamus = the Home thermostat. Vessels and sweat glands are the vents and fans.","tip":"Feedback loops: separate the control center from the effectors before choosing."},{"id":"N6-10","unit":"ch6","sec":"ch6-temperature","focus":[["ch6-temperature",1]],"type":"teaching","stem":"A nurse teaches a construction worker about heat safety on hot, humid days. Which statement by the worker indicates a need for further teaching?","why":"Cooling happens when sweat evaporates, not just when it appears on the skin. Humidity reduces evaporation, so heavy sweating on a humid day doesn't guarantee cooling.","diff":2,"origin":"new","opts":[{"t":"\"As long as I'm sweating a lot, I'm definitely cooling down.\"","c":true},{"t":"\"Sweat cools me only when it evaporates.\"","w":"Accurate."},{"t":"\"High humidity makes it harder for sweat to evaporate.\"","w":"Accurate."},{"t":"\"Taking breaks in the shade helps my body lose heat.\"","w":"Accurate."}],"trick":"Sweat must take off (evaporate) to take heat with it.","tip":"'Needs further teaching' answers often contain an absolute ('definitely')."},{"id":"N6-11","unit":"ch6","sec":"ch6-pigment","focus":[["ch6-pigment",0]],"type":"mcq","stem":"A client's lab results show high bilirubin, and the client's skin and the whites of the eyes look yellow. Which term describes this?","why":"Jaundice reflects bilirubin building up. Other skin-color sources: melanin (pigment), carotene (yellow-orange from diet), hemoglobin and blood flow (redness, pallor), and changes in oxygenation (cyanosis).","diff":2,"origin":"new","opts":[{"t":"Jaundice","c":true},{"t":"Cyanosis","w":"Cyanosis is a bluish color linked to poor oxygenation."},{"t":"Carotene tone","w":"Carotene can tint skin yellow-orange, but the stem points to bilirubin."},{"t":"Vitiligo","w":"Vitiligo is loss of pigment-producing cells in patches."}],"trick":"Jaundice = bilirubin's yellow. Cyanosis = blue (cyan) from low oxygen.","tip":"Use the lab value in the stem. It names the cause."},{"id":"N6-12","unit":"ch6","sec":"ch6-pigment","focus":[["ch6-pigment",1]],"type":"sata","stem":"A nurse is teaching about skin protection. Which statements are accurate? Select all that apply.","why":"Pressure injuries form when pressure and shear impair perfusion, often over bony prominences. UV radiation contributes to skin cancers. Melanin helps but doesn't fully protect.","diff":2,"origin":"new","opts":[{"t":"Sustained pressure and shear can cut off blood flow over bony prominences.","c":true},{"t":"Ultraviolet radiation can damage DNA and raise the risk of skin cancer.","c":true},{"t":"Melanin absorbs some ultraviolet radiation.","c":true},{"t":"Melanin completely prevents UV damage.","w":"Melanin absorbs SOME UV. It doesn't eliminate damage."},{"t":"Redness and warmth always mean an infection.","w":"Inflammation can cause redness and warmth without infection."}],"trick":"Pressure squeezes out blood. UV scrambles DNA.","tip":"Words like 'completely' and 'always' are usually wrong."},{"id":"N6-13","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",0]],"type":"mcq","stem":"A client has a painful burn that extends into the dermis and has formed blisters. How is this burn classified?","why":"Superficial = epidermis only. Partial-thickness = into the dermis, often with blisters, and surviving appendages can help it regenerate. Full-thickness = all layers destroyed, so it can't regenerate normal skin on its own.","diff":1,"origin":"new","opts":[{"t":"Partial-thickness (second-degree) burn","c":true},{"t":"Superficial (first-degree) burn","w":"Superficial burns affect only the epidermis, usually without blisters."},{"t":"Full-thickness (third-degree) burn","w":"Full-thickness burns destroy the entire skin thickness."},{"t":"Pressure injury","w":"Pressure injuries come from pressure and shear, not burns."}],"trick":"1st = top layer, 2nd = blisters into the dermis, 3rd = all the way through.","tip":"Match the depth clue (into the dermis, blisters) to the category."},{"id":"N6-14","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",0]],"type":"priority","stem":"The nurse on the burn unit receives four clients. Which client should the nurse see first?","why":"Full-thickness burns destroy the whole skin and, over a large area, disrupt fluid balance, protection against infection, and temperature control. That makes this client the most unstable.","diff":2,"origin":"new","opts":[{"t":"A client with full-thickness burns over both legs","c":true},{"t":"A client with a superficial sunburn on the shoulders","w":"Superficial burns affect only the epidermis and heal well."},{"t":"A client with a small blistered burn on one finger","w":"A small partial-thickness burn is stable."},{"t":"A client with a healed burn scar asking about lotion","w":"Teaching can wait."}],"trick":"Deeper and bigger burns = bigger loss of the skin's jobs (fluid, defense, temperature).","tip":"Priority: the client who has lost the most body function comes first."},{"id":"N6-15","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",1]],"type":"math","stem":"An adult has burns covering the entire front and back of both legs. Using the rule of nines, what percentage of body surface area is burned?","why":"Each whole leg = 18%. Two legs = 18% + 18% = 36%.","diff":1,"origin":"new","opts":[{"t":"36%","c":true},{"t":"18%","w":"18% is ONE whole leg. The client burned both."},{"t":"9%","w":"9% is one arm, or the head and neck."},{"t":"27%","w":"27% would be one leg plus one arm."}],"trick":"Adult rule of nines: head 9, each arm 9, each leg 18, front trunk 18, back trunk 18, perineum 1 = 100.","tip":"Check your sum: the whole adult body adds up to 100%."},{"id":"N6-16","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",1]],"type":"math","stem":"An adult was burned on the entire front of the trunk and the whole right arm. Using the rule of nines, what is the total body surface area burned?","why":"Anterior trunk = 18%, one arm = 9%. 18 + 9 = 27%.","diff":2,"origin":"new","opts":[{"t":"27%","c":true},{"t":"18%","w":"18% is only the front of the trunk. Add the arm."},{"t":"36%","w":"36% counts the whole trunk front and back. Only the front was burned."},{"t":"45%","w":"Recheck: front trunk 18% + one arm 9%."}],"trick":"Front trunk 18, one arm 9.","tip":"List each burned area and its value
