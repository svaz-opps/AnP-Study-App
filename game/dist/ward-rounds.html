itch","w":"A twitch is one brief contraction from one impulse."},{"t":"The latent period","w":"That is the delay before a twitch begins."}],"trick":"Recruitment = recruiting more workers (motor units) for a heavier job.","tip":"Key phrase match: 'more motor units' = recruitment."},{"id":"N9-22","unit":"ch9","sec":"ch9-responses","focus":[["ch9-responses",3]],"type":"mcq","stem":"A marathon runner has many slow-twitch (red) fibers. Which statement about red fibers is accurate?","why":"Slow-twitch red fibers have lots of myoglobin (the red color), many mitochondria, and a rich blood supply, so they make ATP aerobically and resist fatigue: endurance and posture. White fibers are fast but tire quickly.","diff":2,"origin":"new","opts":[{"t":"They contract more slowly, have more myoglobin and mitochondria, and fatigue slowly.","c":true},{"t":"They have fewer mitochondria than white fibers.","w":"Red fibers have MORE mitochondria. Your guide flags this false comparison."},{"t":"They fatigue quickly from lactic acid buildup.","w":"Fast-twitch white fibers fatigue quickly."},{"t":"They are best for short sprints.","w":"Sprints rely on fast-twitch white fibers."}],"trick":"Red = Running long (marathon). White = Whoosh, then tired (sprint).","tip":"Comparisons: make sure 'more' and 'fewer' point the right way."},{"id":"N9-23","unit":"ch9","sec":"ch9-responses","focus":[],"type":"math","stem":"A muscle fiber's membrane potential must change from about −100 mV to −70 mV for an impulse to begin. What is the size and direction of this change?","why":"Change = end − start = (−70) − (−100) = +30 mV. The inside becomes less negative, which is what a threshold stimulus does.","diff":2,"origin":"new","opts":[{"t":"+30 mV (it becomes less negative)","c":true},{"t":"−30 mV (it becomes more negative)","w":"Going from −100 to −70 moves toward zero, which is a positive change."},{"t":"+170 mV","w":"This adds the two numbers instead of subtracting."},{"t":"−170 mV","w":"Subtract the start from the end: −70 − (−100) = +30."}],"trick":"Minus a minus is a plus: −70 − (−100) = −70 + 100.","tip":"Number-line check: moving from −100 toward zero is moving in the positive direction."},{"id":"N9-24","unit":"ch9","sec":"ch9-disorders","focus":[["ch9-disorders",0]],"type":"sata","stem":"A client's leg was in a cast for 8 weeks, and the calf muscle has atrophied from disuse. Which changes happen in disuse atrophy? Select all that apply.","why":"Disuse atrophy reduces capillary networks, mitochondria, and the size of actin and myosin filaments. On your exam this was an 'all of these' item. Exercise reverses it.","diff":2,"origin":"new","opts":[{"t":"Reduced capillary networks","c":true},{"t":"Fewer mitochondria","c":true},{"t":"Smaller actin and myosin filaments","c":true},{"t":"More capillaries to deliver oxygen","w":"Disuse reduces capillary networks."},{"t":"Enlarged muscle fibers","w":"Enlarged fibers are hypertrophy, from heavy use."}],"trick":"Atrophy shrinks everything: blood supply, power plants (mitochondria), and motors (filaments).","tip":"If every listed change points the same way (all decreases), they are likely all true."},{"id":"N9-25","unit":"ch9","sec":"ch9-actions","focus":[["ch9-actions",0]],"type":"mcq","stem":"What is the name for the end of a muscle attached to the relatively immovable bone?","why":"The origin is the attachment to the relatively stationary bone. The insertion is on the movable bone, and contraction pulls the insertion toward the origin.","diff":1,"origin":"new","opts":[{"t":"Origin","c":true},{"t":"Insertion","w":"The insertion attaches to the movable bone and is pulled toward the origin."},{"t":"Belly","w":"The belly is the thick middle of the muscle."},{"t":"Aponeurosis","w":"An aponeurosis is a flat connective tissue sheet."}],"trick":"Origin = where the muscle Originates and stays put. Insertion = gets pulled In.","tip":"Pairs like origin/insertion: decide which one moves, and the other is your answer."},{"id":"N9-26","unit":"ch9","sec":"ch9-actions","focus":[["ch9-actions",1]],"type":"mcq","stem":"When the biceps brachii contracts to flex the elbow, the triceps brachii relaxes and stretches. What is the triceps' role in this movement?","why":"The antagonist opposes the prime mover's movement. It relaxes or stretches while the prime mover contracts. The quadriceps and hamstrings are another antagonist pair.","diff":2,"origin":"new","opts":[{"t":"Antagonist","c":true},{"t":"Agonist (prime mover)","w":"The biceps is the prime mover for elbow flexion."},{"t":"Synergist","w":"Synergists ASSIST the prime mover, like the brachialis."},{"t":"Fixator","w":"Fixators stabilize the prime mover's origin, like muscles holding the scapula."}],"trick":"ANTagonist = ANTI the move. Agonist = the one in Action. (Don't mix them up!)","tip":"Agonist and antagonist look alike. Read slowly."},{"id":"N9-27","unit":"ch9","sec":"ch9-head","focus":[["ch9-head",0]],"type":"mcq","stem":"During a cranial nerve check, the nurse asks a client to raise the eyebrows. Which muscle does this?","why":"The frontalis sits over the forehead (frontal bone) and raises the eyebrows. Many muscles are named for the bone they cover.","diff":1,"origin":"new","opts":[{"t":"Frontalis","c":true},{"t":"Orbicularis oculi","w":"Orbicularis oculi closes the eye."},{"t":"Zygomaticus","w":"Zygomaticus raises the corners of the mouth (smiling)."},{"t":"Buccinator","w":"Buccinator compresses the cheek."}],"trick":"Frontalis is on the Front of the head: surprised eyebrows.","tip":"Use the location in the name: frontalis is on the frontal bone."},{"id":"N9-28","unit":"ch9","sec":"ch9-arm","focus":[["ch9-arm",0]],"type":"mcq","stem":"A client is lifting the arm straight out to the side. Which muscle is the main abductor of the arm?","why":"The triangular deltoid caps the shoulder and abducts the arm (lifts it away from the body). It also helps flex and extend.","diff":1,"origin":"new","opts":[{"t":"Deltoid","c":true},{"t":"Pectoralis major","w":"Pectoralis major flexes and ADducts the arm."},{"t":"Latissimus dorsi","w":"Latissimus dorsi adducts and extends the humerus."},{"t":"Biceps brachii","w":"The biceps flexes the elbow."}],"trick":"Deltoid = Delta (triangle) on the shoulder that lifts the arm like a wing.","tip":"Abduct = away from the body. Find the muscle that pulls upward and outward."},{"id":"N9-29","unit":"ch9","sec":"ch9-leg","focus":[["ch9-leg",0]],"type":"mcq","stem":"A physical therapist asks a client to bend the knee, bringing the heel toward the buttock. Which muscle group does this?","why":"The hamstrings (biceps femoris, semitendinosus, semimembranosus) on the back of the thigh flex the leg at the knee. The quadriceps on the front extend it. Your instructor flagged 'not the quadriceps.'","diff":1,"origin":"new","opts":[{"t":"Hamstrings","c":true},{"t":"Quadriceps femoris","w":"The quadriceps EXTEND the knee (straighten it)."},{"t":"Gastrocnemius","w":"Gastrocnemius is the prime mover of plantar flexion."},{"t":"Gluteus maximus","w":"Gluteus maximus extends the thigh at the hip."}],"trick":"Quads = four heads that extend the knee. Hamstrings bend the knee (the ham in the back). (From your guide.)","tip":"Front of a limb vs back: opposite sides usually do opposite jobs."},{"id":"N9-30","unit":"ch9","sec":"ch9-overview","focus":[],"type":"mcq","stem":"A biopsy shows branched, striated cells, each with one nucleus, joined by intercalated discs. Which tissue is this?","why":"Cardiac muscle is striated, branched, has one nucleus per cell, and is joined by intercalated discs with gap junctions, so the heart contracts as a unit. It is involuntary and self-exciting.","diff":2,"origin":"new","opts":[{"t":"Cardiac muscle","c":true},{"t":"Skeletal muscle","w":"Skeletal fibers are striated but long, cylindrical, and multinucleated."},{"t":"Smooth muscle","w":"Smooth muscle has no striations and is spindle-shaped."},{"t":"Dense regular connective tissue","w":"This is not muscle tissue."}],"trick":"Intercalated discs = the heart's 'Connected' handshake. Only cardiac has them.","tip":"Find the one unique feature (intercalated discs) and the answer follows."},{"id":"N10-01","unit":"ch10","sec":"ch10-divisions","focus":[["ch10-divisions",0]],"type":"mcq","stem":"Which structure belongs to the peripheral nervous system (PNS)?","why":"The CNS is the brain and spinal cord. The PNS is everything outside it: cranial and spinal nerves, ganglia, and peripheral receptors.","diff":1,"origin":"new","opts":[{"t":"A spinal nerve","c":true},{"t":"The spinal cord","w":"The spinal cord is part of the CNS."},{"t":"The brain","w":"The brain is part of the CNS."},{"t":"The cerebellum","w":"The cerebellum is part of the brain, so it is CNS."}],"trick":"CNS = the Central command (brain + cord). PNS = the Phone lines out to the body.","tip":"If an option is part of the brain or cord, it is CNS. Cross it out."},{"id":"N10-02","unit":"ch10","sec":"ch10-divisions","focus":[["ch10-divisions",1]],"type":"mcq","stem":"A neuron carries a signal from a skin receptor toward the spinal cord. What kind of neuron is it?","why":"Afferent (sensory) pathways carry information toward the CNS. Efferent (motor) pathways carry commands away. Interneurons integrate in between.","diff":1,"origin":"new","opts":[{"t":"Afferent (sensory)","c":true},{"t":"Efferent (motor)","w":"Efferent neurons carry commands AWAY from the CNS to effectors."},{"t":"Interneuron","w":"Interneurons connect neurons inside the CNS."},{"t":"Autonomic motor","w":"Autonomic motor neurons are efferent, going to glands and smooth or cardiac muscle."}],"trick":"Afferent Arrives, Efferent Exits. (SAME: Sensory Afferent, Motor Efferent.)","tip":"Find the direction in the stem (toward the cord), then match the term."},{"id":"N10-03","unit":"ch10","sec":"ch10-neurons","focus":[["ch10-neurons",0]],"type":"order","stem":"Put the path of a signal through one neuron in order.","why":"Dendrites and the cell body receive input, the trigger zone at the start of the axon decides whether to fire, the axon conducts the action potential, and the terminals release transmitter.","diff":2,"origin":"new","steps":["Dendrites receive input.","The signal spreads through the cell body.","The axon initial segment (trigger zone) starts an action potential.","The axon conducts the action potential.","Axon terminals release neurotransmitter."],"trick":"Receive, Decide, Send, Release (dendrite, trigger zone, axon, terminal).","tip":"Follow the signal like water through a pipe: in at the dendrites, out at the terminals."},{"id":"N10-04","unit":"ch10","sec":"ch10-neurons","focus":[["ch10-neurons",1]],"type":"mcq","stem":"A sensory neuron has a single process that splits into a peripheral branch and a central branch, and its cell body sits in a sensory ganglion. Which structural class is this?","why":"Structural classes count processes: multipolar (many), bipolar (two), pseudounipolar (one that splits). Functional classes (sensory, motor, interneuron) describe where information goes.","diff":2,"origin":"new","opts":[{"t":"Pseudounipolar","c":true},{"t":"Multipolar","w":"Multipolar neurons have one axon and many dendrites, like motor neurons and most interneurons."},{"t":"Bipolar","w":"Bipolar neurons have two processes and appear in special-sense pathways."},{"t":"Interneuron","w":"Interneuron is a FUNCTIONAL class, not a structural one."}],"trick":"Pseudo-UNI-polar = one stalk that forks like a T.","tip":"Check whether the question asks about structure or function before choosing."},{"id":"N10-05","unit":"ch10","sec":"ch10-glia","focus":[["ch10-glia",0]],"type":"sata","stem":"Which statements about glial cells are accurate? Select all that apply.","why":"CNS glia: astrocytes (environment, blood-brain barrier support), oligodendrocytes (myelin for many axons), microglia (immune), ependymal cells (line ventricles). PNS glia: Schwann cells (myelin, one segment per cell) and satellite cells (around ganglion cell bodies).","diff":2,"origin":"new","opts":[{"t":"Oligodendrocytes myelinate segments of several CNS axons.","c":true},{"t":"Each Schwann cell forms one myelin segment around one PNS axon.","c":true},{"t":"Microglia provide immune surveillance and phagocytosis.","c":true},{"t":"Astrocytes line the ventricles.","w":"Ependymal cells line the ventricles. Astrocytes regulate the environment around neurons and support the blood-brain barrier."},{"t":"Satellite cells myelinate CNS axons.","w":"Satellite cells surround cell bodies in PNS ganglia."}],"trick":"Oligo = 'few' arms that wrap many CNS axons. Schwann = one wrap for one PNS axon.","tip":"Sort each glial cell into CNS or PNS first. That eliminates most traps."},{"id":"N10-06","unit":"ch10","sec":"ch10-glia","focus":[["ch10-glia",1]],"type":"mcq","stem":"Why does white matter look white?","why":"Myelin is fatty and pale, so tissue packed with myelinated axons looks white. Gray matter holds cell bodies, dendrites and synapses.","diff":1,"origin":"new","opts":[{"t":"It contains many myelinated axons.","c":true},{"t":"It is made mostly of neuron cell bodies.","w":"Cell bodies, dendrites and synapses make up gray matter."},{"t":"It is filled with cerebrospinal fluid.","w":"CSF is in the ventricles and subarachnoid space."},{"t":"It has no blood supply.","w":"Nervous tissue has a blood supply. Color comes from myelin."}],"trick":"White = wires (myelinated axons). Gray = the bodies doing the thinking.","tip":"Match the color to its cause: fatty myelin is pale."},{"id":"N10-07","unit":"ch10","sec":"ch10-impulse","focus":[["ch10-impulse",1],["ch10-glia",1]],"type":"mcq","stem":"Which axon conducts action potentials the fastest?","why":"Myelin lets the action potential jump from node to node (saltatory conduction), and a larger diameter lowers internal resistance. Having both gives the fastest conduction.","diff":2,"origin":"new","opts":[{"t":"A large-diameter myelinated axon","c":true},{"t":"A small-diameter unmyelinated axon","w":"Both small size and no myelin slow conduction."},{"t":"A small-diameter myelinated axon","w":"Myelin helps, but a larger diameter is faster still."},{"t":"A large-diameter unmyelinated axon","w":"Without myelin, it can't use fast saltatory conduction."}],"trick":"Wide and wrapped = fastest highway.","tip":"When two factors each help, the answer is the option with both."},{"id":"N10-08","unit":"ch10","sec":"ch10-resting","focus":[["ch10-resting",0]],"type":"mcq","stem":"Which statement about a resting neuron is accurate?","why":"At rest the inside is about −70 mV. Potassium is concentrated inside and sodium outside, and potassium leak channels create much of the resting voltage. The Na⁺/K⁺ pump maintains the gradients.","diff":2,"origin":"new","opts":[{"t":"The inside is about −70 mV, with potassium concentrated inside and sodium outside.","c":true},{"t":"A resting neuron has no electrical charge.","w":"There is a voltage difference (about −70 mV) across the membrane."},{"t":"Sodium is more concentrated inside the cell.","w":"Sodium is high OUTSIDE. Potassium is high inside."},{"t":"The sodium–potassium pump creates each action potential by itself.","w":"The pump maintains gradients over time. Channels produce the action potential."}],"trick":"K⁺ stays in (Kept inside). Na⁺ is outside (like a salty ocean around the cell).","tip":"Separate long-term gradients (pump) from moment-to-moment currents (channels)."},{"id":"N10-09","unit":"ch10","sec":"ch10-resting","focus":[["ch10-resting",1]],"type":"mcq","stem":"A neuron's membrane potential changes from −70 mV to −55 mV. What is this change called?","why":"Depolarization makes the membrane less negative (closer to zero). Hyperpolarization makes it more negative.","diff":1,"origin":"new","opts":[{"t":"Depolarization","c":true},{"t":"Hyperpolarization","w":"Hyperpolarization makes the inside MORE negative."},{"t":"Repolarization","w":"Repolarization returns toward rest after depolarization."},{"t":"The refractory period","w":"That is the time after an action potential when firing is blocked or harder."}],"trick":"DEpolarize = DEcrease the negativity. HYPERpolarize = Hyper-negative.","tip":"Ask whether the number moves toward zero (depolarization) or away from it (hyperpolarization)."},{"id":"N10-10","unit":"ch10","sec":"ch10-resting","focus":[["ch10-resting",1]],"type":"sata","stem":"Which statements about graded potentials are accurate? Select all that apply.","why":"Graded potentials vary in size and fade with distance. Excitatory inputs depolarize toward threshold, and inhibitory inputs often hyperpolarize away from it. Their combined (summed) effect at the trigger zone decides whether the neuron fires.","diff":2,"origin":"new","opts":[{"t":"Depolarization makes the inside of the membrane less negative.","c":true},{"t":"Hyperpolarization makes the inside more negative.","c":true},{"t":"Excitatory postsynaptic potentials bring the trigger zone closer to threshold.","c":true},{"t":"Hyperpolarization makes a neuron more likely to fire.","w":"Moving away from threshold makes firing LESS likely."},{"t":"Graded potentials never fade with distance.","w":"Graded potentials decay with distance. Action potentials don't."}],"trick":"Toward zero = toward firing. More negative = calmer.","tip":"'Never' is a red flag in SATA."},{"id":"N10-11","unit":"ch10","sec":"ch10-impulse","focus":[["ch10-impulse",0]],"type":"order","stem":"Put the events of an action potential in order.","why":"At threshold, sodium rushes in (depolarization). Sodium channels then shut and potassium leaves (repolarization), often overshooting briefly (after-hyperpolarization) before the membrane returns to rest.","diff":2,"origin":"new","steps":["The trigger zone reaches threshold.","Voltage-gated sodium channels open and Na⁺ rushes in (depolarization).","Sodium channels inactivate and voltage-gated potassium channels open.","K⁺ flows out (repolarization).","A brief hyperpolarization occurs, then the membrane returns to rest."],"trick":"Sodium in, potassium out: 'Na⁺ goes in first, K⁺ kicks out after.'","tip":"Ordering: depolarize before repolarize. 'Re' means again, back to rest."},{"id":"N10-12","unit":"ch10","sec":"ch10-impulse","focus":[["ch10-impulse",0]],"type":"mcq","stem":"Which ion movement causes the repolarization phase of an action potential?","why":"Sodium influx depolarizes. Potassium efflux repolarizes as voltage-gated K⁺ channels open and positive charge leaves the cell.","diff":2,"origin":"new","opts":[{"t":"Potassium ions flowing out of the cell","c":true},{"t":"Sodium ions flowing into the cell","w":"Sodium influx causes DEpolarization."},{"t":"Calcium ions flowing into the axon","w":"Calcium entry matters at the axon terminal for transmitter release."},{"t":"Chloride ions pumped by the Na⁺/K⁺ pump","w":"The pump moves Na⁺ and K⁺, not chloride, and it doesn't produce repolarization."}],"trick":"K⁺ out = Kicks the voltage back down.","tip":"Depolarization and repolarization use different ions. Keep them in separate boxes."},{"id":"N10-13","unit":"ch10","sec":"ch10-synapses","focus":[["ch10-synapses",0]],"type":"order","stem":"Put the events at a chemical synapse in order.","why":"The action potential opens calcium channels, calcium triggers vesicle exocytosis, and the transmitter crosses the cleft and binds receptors. The signal crosses as a chemical, not as an electrical action potential.","diff":2,"origin":"new","steps":["An action potential arrives at the presynaptic terminal.","Voltage-gated calcium channels open and Ca²⁺ enters.","Vesicles fuse and release neurotransmitter (exocytosis).","Neurotransmitter diffuses across the cleft and binds receptors.","Postsynaptic channels or signals change, producing a response."],"trick":"Arrive, Calcium, Release, Bind, Respond.","tip":"Remember calcium is the trigger for release at every synapse."},{"id":"N10-14","unit":"ch10","sec":"ch10-synapses","focus":[["ch10-synapses",1]],"type":"sata","stem":"How can a neurotransmitter's signal be ended at a synapse? Select all that apply.","why":"Signals end by enzymatic breakdown, reuptake into cells, or diffusion away. Many drugs work by changing these steps, such as blocking reuptake.","diff":2,"origin":"new","opts":[{"t":"An enzyme breaks it down (for example, acetylcholinesterase).","c":true},{"t":"Reuptake transporters remove it.","c":true},{"t":"It diffuses away from the synapse.","c":true},{"t":"It travels on through the cleft as an intact action potential.","w":"Transmitters cross the cleft as chemicals, not as action potentials."},{"t":"Calcium entering the terminal destroys it.","w":"Calcium TRIGGERS release. It doesn't destroy the transmitter."}],"trick":"Break it, Bring it back, or let it Blow away.","tip":"SATA: rule out any option that confuses starting the signal with stopping it."},{"id":"N10-15","unit":"ch10","sec":"ch10-synapses","focus":[["ch10-synapses",1]],"type":"mcq","stem":"One neuron receives input from many different neurons. What is this circuit pattern called?","why":"Convergence brings many inputs to one neuron. Divergence spreads one input to many targets. Neuronal pools combine both.","diff":2,"origin":"new","opts":[{"t":"Convergence","c":true},{"t":"Divergence","w":"Divergence is ONE input spreading out to MANY targets."},{"t":"Reuptake","w":"Reuptake removes neurotransmitter."},{"t":"Repolarization","w":"Repolarization is a phase of the action potential."}],"trick":"Converge = come together (many → one). Diverge = spread apart (one → many).","tip":"Picture arrows: many pointing to one means convergence."},{"id":"N11-01","unit":"ch11","sec":"ch11-protection","focus":[["ch11-protection",0]],"type":"mcq","stem":"During a lumbar puncture, cerebrospinal fluid is collected. In which space around the spinal cord is CSF found?","why":"CSF fills the subarachnoid space between the arachnoid mater and the pia mater, plus the ventricles and central canal.","diff":1,"origin":"new","opts":[{"t":"Subarachnoid space","c":true},{"t":"Epidural space","w":"The spinal epidural space is outside the dura and contains fat and vessels, not CSF."},{"t":"Subdural space","w":"CSF is not confined to a subdural space."},{"t":"Inside the dura mater itself","w":"The dura is a membrane, not a fluid space."}],"trick":"CSF sits SUB-ARACHNOID: under the spider-web layer.","tip":"Picture the layers from outside in: epidural, dura, arachnoid, then subarachnoid space with the CSF, then pia."},{"id":"N11-02","unit":"ch11","sec":"ch11-protection","focus":[["ch11-protection",0]],"type":"order","stem":"Put the classic path of cerebrospinal fluid circulation in order.","why":"CSF made by the choroid plexuses flows from the lateral ventricles through the interventricular foramina to the third ventricle, down the cerebral aqueduct to the fourth ventricle, then out through apertures into the subarachnoid space. A blockage can enlarge the ventricles (hydrocephalus).","diff":3,"origin":"new","steps":["Lateral ventricles","Interventricular foramina","Third ventricle","Cerebral aqueduct","Fourth ventricle","Subarachnoid space (through the apertures)"],"trick":"Lateral, Into the 3rd, Aqueduct, 4th, Out: count up 1-2, 3, 4, out.","tip":"The ventricles are numbered in flow order (lateral first, then 3, then 4)."},{"id":"N11-03","unit":"ch11","sec":"ch11-protection","focus":[["ch11-protection",1]],"type":"mcq","stem":"A client in labor receives an epidural. Where is an epidural injection meant to go?","why":"The spinal cord has a real epidural space outside the dura, containing fat and vessels. An epidural targets that space, not the CSF-filled subarachnoid space.","diff":2,"origin":"new","opts":[{"t":"The epidural space, outside the dura","c":true},{"t":"The CSF-filled subarachnoid space","w":"That is where a lumbar puncture (spinal tap) samples CSF, not an epidural."},{"t":"The fluid-filled ventricles of the brain","w":"Ventricles are deep in the brain."},{"t":"The space under the pia mater","w":"The pia clings to the neural tissue. Injections don't go there."}],"trick":"EPI-dural = ON TOP of the dura (outside it).","tip":"Use the prefix: epi- (upon), sub- (under)."},{"id":"N11-04","unit":"ch11","sec":"ch11-protection","focus":[],"type":"mcq","stem":"Which meningeal layer is the outermost?","why":"From outside in: dura mater (tough), arachnoid mater (web-like), pia mater (delicate, follows the brain's surface). Meningitis is inflammation of these coverings.","diff":1,"origin":"new","opts":[{"t":"Dura mater","c":true},{"t":"Arachnoid mater","w":"The arachnoid lies beneath the dura."},{"t":"Pia mater","w":"The pia is innermost, clinging to the brain and cord."},{"t":"Choroid plexus","w":"The choroid plexus makes CSF. It isn't a meningeal layer."}],"trick":"DAP: Dura, Arachnoid, Pia, from outside in. Dura = durable.","tip":"Durable = tough = outer protective layer."},{"id":"N11-05","unit":"ch11","sec":"ch11-cord","focus":[["ch11-cord",0]],"type":"mcq","stem":"A client has damage to the dorsal roots at L4. Which function is most directly affected?","why":"Dorsal roots carry sensory (afferent) input and have the sensory cell bodies in the dorsal root ganglia. Ventral roots carry motor (efferent) output. They join to form a mixed spinal nerve.","diff":2,"origin":"new","opts":[{"t":"Sensory input from that region","c":true},{"t":"Motor output only","w":"Motor output travels through the VENTRAL roots."},{"t":"Nothing, because spinal nerves are mixed","w":"Spinal nerves are mixed, but the dorsal root alone carries only sensory input."},{"t":"Hearing","w":"Hearing uses cranial nerve VIII."}],"trick":"Dorsal = Detect (sensory). Ventral = moVe (motor).","tip":"Roots are pure (sensory or motor). Spinal nerves are mixed."},{"id":"N11-06","unit":"ch11","sec":"ch11-cord","focus":[["ch11-cord",0]],"type":"sata","stem":"Which statements about spinal nerves and roots are accurate? Select all that apply.","why":"31 spinal nerve pairs (8 cervical, 12 thoracic, 5 lumbar, 5 sacral, 1 coccygeal). Each forms from a sensory dorsal root (cell bodies in the dorsal root ganglion) and a motor ventral root, so the nerve and its rami are mixed.","diff":2,"origin":"new","opts":[{"t":"The dorsal root carries sensory input.","c":true},{"t":"The ventral root carries motor output.","c":true},{"t":"Spinal nerves and their rami are mixed (sensory and motor).","c":true},{"t":"The dorsal root ganglion holds motor neuron cell bodies.","w":"It holds SENSORY neuron cell bodies."},{"t":"There are 12 pairs of spinal nerves.","w":"There are 31 pairs of spinal nerves. 12 is the number of cranial nerve pairs."}],"trick":"31 spinal pairs, 12 cranial pairs. Dorsal = detect, ventral = move.","tip":"Number traps: spinal (31) vs cranial (12)."},{"id":"N11-07","unit":"ch11","sec":"ch11-cord","focus":[["ch11-cord",1]],"type":"mcq","stem":"Which statement about the spinal cord's internal structure is accurate?","why":"The cord has central, H-shaped gray matter (dorsal, ventral and lateral horns) surrounded by white matter columns full of tracts. Ascending tracts carry sensory signals up and descending tracts carry motor commands down.","diff":2,"origin":"new","opts":[{"t":"Gray matter forms the horns; white matter forms the columns.","c":true},{"t":"White matter forms the horns; gray matter forms the columns.","w":"Swapped: horns are gray, columns are white."},{"t":"Descending tracts carry sensory information up to the brain.","w":"Descending tracts carry motor commands DOWN. Ascending tracts carry sensory information up."},{"t":"The gray matter is on the outside of the spinal cord.","w":"In the cord, gray matter is central (H-shaped), surrounded by white matter."}],"trick":"Horn = gray (like a gray rhino horn). Column = white. Ascend = sensory goes up.","tip":"Remember that the cord is the reverse of the cerebrum: gray inside, white outside."},{"id":"N11-08","unit":"ch11","sec":"ch11-reflex","focus":[["ch11-reflex",0]],"type":"order","stem":"Put the five parts of a reflex arc in order.","why":"A receptor detects the stimulus, a sensory neuron carries it to an integration center (in the spinal cord or brainstem), a motor neuron carries the command out, and an effector (muscle or gland) responds.","diff":1,"origin":"new","steps":["Receptor","Sensory neuron","Integration center","Motor neuron","Effector"],"trick":"Really Smart Igloos Make Ending (Receptor, Sensory, Integration, Motor, Effector).","tip":"Reflex arcs mirror input, processing, output."},{"id":"N11-09","unit":"ch11","sec":"ch11-reflex","focus":[["ch11-reflex",0],["ch11-reflex",1]],"type":"mcq","stem":"The nurse taps the patellar tendon and the client's leg kicks. Which statement about this reflex is accurate?","why":"Tapping the tendon stretches the quadriceps. Muscle spindles detect the stretch (length) and the sensory neuron synapses directly on the motor neuron (monosynaptic), so the quadriceps contracts.","diff":3,"origin":"new","opts":[{"t":"It is a monosynaptic stretch reflex started by muscle spindles sensing stretch (length).","c":true},{"t":"It is a polysynaptic withdrawal reflex started by Golgi tendon organs.","w":"Withdrawal reflexes respond to pain. Tendon organs sense tension, not stretch length."},{"t":"It needs a conscious decision in the brain before it happens.","w":"Reflexes are integrated in the spinal cord before conscious awareness."},{"t":"Every reflex, including this one, needs an interneuron.","w":"The stretch reflex links sensory and motor neurons directly, with no interneuron in the main pathway."}],"trick":"Spindles sense Stretch. Tendon organs sense Tension.","tip":"Watch absolute words like 'every'. Not every reflex has an interneuron."},{"id":"N11-10","unit":"ch11","sec":"ch11-cerebrum","focus":[["ch11-cerebrum",0]],"type":"sata","stem":"Which pairings of cerebral lobe and function are correct? Select all that apply.","why":"Frontal = motor and planning (prefrontal judgment). Parietal = somatosensory. Temporal = hearing and memory. Occipital = vision. Insula = taste and more.","diff":2,"origin":"new","opts":[{"t":"Frontal lobe: planning and voluntary motor control","c":true},{"t":"Parietal lobe: somatic sensation (touch, pressure)","c":true},{"t":"Occipital lobe: vision","c":true},{"t":"Temporal lobe: vision","w":"The temporal lobe handles hearing and important memory functions."},{"t":"Sphenoid lobe: smell","w":"The sphenoid is a skull BONE, not a lobe of the brain."}],"trick":"Frontal = Future planning, Parietal = Pressure and touch, Temporal = Tunes (hearing), Occipital = Optics.","tip":"Watch for names borrowed from other systems (sphenoid is a bone)."},{"id":"N11-11","unit":"ch11","sec":"ch11-cerebrum","focus":[["ch11-cerebrum",1]],"type":"mcq","stem":"Which statement about the cerebrum's tissue layers is accurate?","why":"The cerebral cortex is a superficial layer of gray matter. Beneath it are white matter tracts and deep gray nuclei such as the basal nuclei, which help regulate movement.","diff":2,"origin":"new","opts":[{"t":"The cortex is superficial gray matter covering white matter and deeper gray nuclei.","c":true},{"t":"The cortex is white matter covering a gray core.","w":"Cerebral cortex is GRAY matter on the surface."},{"t":"The cerebrum has no white matter.","w":"White matter tracts connect cortical areas."},{"t":"Basal nuclei are peripheral ganglia outside the brain.","w":"Basal nuclei are deep gray matter INSIDE the brain."}],"trick":"Brain = gray bark (cortex) on a white trunk.","tip":"Cerebrum vs spinal cord: the gray and white are in opposite positions."},{"id":"N11-12","unit":"ch11","sec":"ch11-brainstem","focus":[["ch11-brainstem",0]],"type":"mcq","stem":"A client with a hypothalamic tumor is most likely to have trouble with which function?","why":"The hypothalamus coordinates homeostasis: temperature, appetite, thirst, autonomic activity, endocrine signals, and daily rhythms. The thalamus next door relays sensory information to the cortex.","diff":2,"origin":"new","opts":[{"t":"Regulating body temperature, thirst, and appetite","c":true},{"t":"Relaying sensory signals to the cortex","w":"The thalamus is the main sensory relay."},{"t":"Coordinating balance and smooth movement","w":"That is the cerebellum."},{"t":"Seeing","w":"Vision is processed in the occipital lobe."}],"trick":"HYPOthalamus = Homeostasis (hunger, hot/cold, H₂O thirst). THALamus = the relay sTATion.","tip":"Neighbors with similar names (thalamus vs hypothalamus) do different jobs. Lock in one."},{"id":"N11-13","unit":"ch11","sec":"ch11-brainstem","focus":[["ch11-brainstem",1]],"type":"priority","stem":"The nurse on the neuro unit receives report. Which client should the nurse see first?","why":"The medulla contains critical cardiovascular and respiratory circuits. Slow, irregular breathing is a breathing (B in ABC) problem and comes first.","diff":3,"origin":"new","opts":[{"t":"A client with a medulla injury whose breathing has become slow and irregular","c":true},{"t":"A client with a cerebellar injury who has an unsteady gait","w":"Coordination problems need safety measures, but breathing comes first."},{"t":"A client with an occipital lobe stroke and stable vision loss on one side","w":"Stable, not an airway or breathing problem."},{"t":"A client with Parkinson disease who has a resting tremor","w":"A chronic, expected finding."}],"trick":"Medulla = the life-support module (breathing and heart).","tip":"Priority: Airway, Breathing, Circulation before everything else."},{"id":"N11-14","unit":"ch11","sec":"ch11-cranial","focus":[["ch11-cranial",0]],"type":"sata","stem":"Which cranial nerve facts are correct? Select all that apply.","why":"I smell, II vision, III/IV/VI eye movements, V facial sensation and chewing, VII facial expression and anterior tongue taste, VIII hearing and balance, IX posterior tongue taste and swallowing, X vagus (visceral, parasympathetic), XI shoulder shrug and head turn, XII tongue movement.","diff":2,"origin":"new","opts":[{"t":"I Olfactory: smell (sensory)","c":true},{"t":"II Optic: vision (sensory)","c":true},{"t":"VIII Vestibulocochlear: hearing and balance (sensory)","c":true},{"t":"XII Hypoglossal: facial expression","w":"XII moves the tongue. Facial expression is VII (facial)."},{"t":"X Vagus: purely sensory","w":"The vagus is mixed, with major parasympathetic output."}],"trick":"Oh Oh Oh To Touch And Feel Very Good Velvet, Ah Heaven (I to XII).","tip":"Learn the number, name, and one action for each, as a set."},{"id":"N11-15","unit":"ch11","sec":"ch11-cranial","focus":[["ch11-cranial",0]],"type":"mcq","stem":"The nurse asks a client to smile, puff the cheeks, and raise the eyebrows. Which cranial nerve is being tested?","why":"The facial nerve (VII) controls the muscles of facial expression and carries taste from the front of the tongue.","diff":2,"origin":"new","opts":[{"t":"VII Facial","c":true},{"t":"V Trigeminal","w":"V handles facial SENSATION and chewing."},{"t":"XI Accessory","w":"XI controls the sternocleidomastoid and trapezius (shrug, head turn)."},{"t":"III Oculomotor","w":"III moves most eye muscles and constricts the pupil."}],"trick":"VII = Seven = Smile.","tip":"Separate motor (moving the face, VII) from sensory (feeling the face, V)."},{"id":"N11-16","unit":"ch11","sec":"ch11-cranial","focus":[["ch11-cranial",1]],"type":"sata","stem":"Which statements about peripheral nerves are accurate? Select all that apply.","why":"Nerve wrappings mirror muscle wrappings: endoneurium (each fiber), perineurium (each fascicle), epineurium (whole nerve). The ventral rami form the cervical (including the phrenic), brachial (upper limb), lumbar and sacral plexuses.","diff":2,"origin":"new","opts":[{"t":"Endoneurium surrounds each individual nerve fiber.","c":true},{"t":"Epineurium surrounds the whole nerve.","c":true},{"t":"The phrenic nerve to the diaphragm comes from the cervical plexus.","c":true},{"t":"The brachial plexus supplies the lower limb.","w":"The brachial plexus serves the upper limb. Lumbar and sacral plexuses serve the lower body."},{"t":"Perineurium surrounds each individual axon.","w":"Perineurium surrounds fascicles (bundles)."}],"trick":"Same prefixes as muscle: Endo = inside, Peri = around bundles, Epi = outside.","tip":"Reuse what you learned for muscle coverings. The prefixes mean the same here."},{"id":"N11-17","unit":"ch11","sec":"ch11-autonomic","focus":[["ch11-autonomic",0]],"type":"mcq","stem":"How does a somatic motor pathway differ from a typical autonomic motor pathway?","why":"A somatic motor neuron runs from the CNS directly to skeletal muscle (releasing ACh). Autonomic output uses a preganglionic neuron (cell body in the CNS) that synapses in a ganglion with a postganglionic neuron to smooth muscle, cardiac muscle, or glands.","diff":2,"origin":"new","opts":[{"t":"Somatic uses one neuron; autonomic uses a chain of two.","c":true},{"t":"Somatic uses two neurons; autonomic uses only one.","w":"This is reversed."},{"t":"Both use a chain of two neurons and a ganglion.","w":"The somatic pathway goes straight from the CNS to skeletal muscle."},{"t":"Autonomic pathways mainly supply skeletal muscle.","w":"Autonomic pathways supply smooth muscle, cardiac muscle, and glands."}],"trick":"Somatic = Single neuron. Autonomic = A relay of two.","tip":"Count the neurons in each pathway. That is the key difference."},{"id":"N11-18","unit":"ch11","sec":"ch11-autonomic","focus":[["ch11-autonomic",1]],"type":"mcq","stem":"Where do the sympathetic and parasympathetic divisions leave the CNS?","why":"Sympathetic output is thoracolumbar (T1–L2), with short preganglionic and long postganglionic fibers. Parasympathetic output is craniosacral (cranial nerves and S2–S4), with long preganglionic fibers and ganglia near the organs.","diff":2,"origin":"new","opts":[{"t":"Sympathetic: thoracolumbar (about T1–L2). Parasympathetic: craniosacral.","c":true},{"t":"Sympathetic: craniosacral. Parasympathetic: thoracolumbar.","w":"This is reversed."},{"t":"Both leave only from the cervical spinal cord.","w":"Neither is limited to the cervical cord."},{"t":"Sympathetic: sacral only. Parasympathetic: thoracic only.","w":"Not the correct origins."}],"trick":"Sympathetic = Spine's middle (thoracolumbar), 'fight or flight'. Parasympathetic = Peripheral ends (cranial + sacral), 'rest and digest'.","tip":"Swapped answers are common here. Anchor 'thoraco-lumbar = sympathetic.'"},{"id":"N11-19","unit":"ch11","sec":"ch11-receptors","focus":[["ch11-receptors",0]],"type":"sata","stem":"Which statements about autonomic neurotransmitters are accurate? Select all that apply.","why":"Preganglionic: ACh at nicotinic receptors (both divisions). Parasympathetic postganglionic: ACh at muscarinic receptors. Most sympathetic postganglionic: norepinephrine at adrenergic receptors, except eccrine sweat glands, which get ACh.","diff":3,"origin":"new","opts":[{"t":"All preganglionic neurons release acetylcholine onto nicotinic receptors in ganglia.","c":true},{"t":"Parasympathetic postganglionic neurons usually release acetylcholine onto muscarinic receptors.","c":true},{"t":"Most sympathetic postganglionic neurons release norepinephrine.","c":true},{"t":"Sympathetic fibers to eccrine sweat glands release norepinephrine.","w":"Sweat glands are the exception: their sympathetic fibers release acetylcholine (cholinergic)."},{"t":"Acetylcholine is always inhibitory.","w":"The effect depends on the receptor subtype and the target."}],"trick":"Sweat is the 'sneaky' sympathetic exception: it uses ACh.","tip":"Exceptions are a favorite exam target. Learn the sweat gland one."},{"id":"N11-20","unit":"ch11","sec":"ch11-receptors","focus":[["ch11-receptors",1],["ch11-disorders",0]],"type":"sata","stem":"Which pairings of neurological disorder and mechanism are correct? Select all that apply.","why":"Match each disorder to the structure affected: MS (CNS myelin), Parkinson (dopamine neurons), stroke (blood supply), myasthenia gravis (neuromuscular junction), hydrocephalus (CSF flow), meningitis (meninges), polio (motor neurons).","diff":2,"origin":"new","opts":[{"t":"Multiple sclerosis: immune-mediated damage to CNS myelin","c":true},{"t":"Parkinson disease: loss of dopamine neurons in movement circuits","c":true},{"t":"Stroke: brain injury from blocked blood flow or bleeding","c":true},{"t":"Myasthenia gravis: demyelination of the brain","w":"Myasthenia gravis impairs neuromuscular transmission (ACh receptors). It is not demyelination."},{"t":"Hydrocephalus: loss of dopamine neurons","w":"Hydrocephalus involves abnormal CSF flow with enlarged ventricles."}],"trick":"Ask 'what part is broken?': myelin, neurons, vessels, junction, or fluid.","tip":"Disorder-matching SATA: check the mechanism word in each option."},{"id":"N11-21","unit":"ch11","sec":"ch11-disorders","focus":[["ch11-disorders",1]],"type":"teaching","stem":"A nurse teaches a family about neurological conditions. Which statement indicates a need for further teaching?","why":"A disorder label alone doesn't describe every cause or symptom. Cerebral palsy covers a range of movement and posture problems that can change over time.","diff":2,"origin":"new","opts":[{"t":"\"Everyone with cerebral palsy has exactly the same symptoms.\"","c":true},{"t":"\"Meningitis is inflammation of the brain's coverings, and it can have different causes.\"","w":"Accurate."},{"t":"\"Hydrocephalus involves abnormal CSF flow and enlarged ventricles.\"","w":"Accurate."},{"t":"\"The polio virus can damage motor neurons.\"","w":"Accurate."}],"trick":"One label, many faces.","tip":"'Everyone' and 'exactly' are red-flag words."},{"id":"N12-01","unit":"ch12","sec":"ch12-receptors","focus":[["ch12-receptors",0]],"type":"mcq","stem":"A sensory receptor converts stimulus energy, such as pressure, into an electrical signal. What is this step called?","why":"Transduction is the receptor converting a stimulus into a cellular signal. Sensation is detecting and representing it in neural pathways. Perception is the conscious interpretation.","diff":2,"origin":"new","opts":[{"t":"Transduction","c":true},{"t":"Perception","w":"Perception is the conscious interpretation, usually in the cerebral cortex."},{"t":"Adaptation","w":"Adaptation is a reduced response during a sustained stimulus."},{"t":"Referred pain","w":"Referred pain is pain felt away from its source."}],"trick":"TRANSduction = TRANSlate the stimulus into nerve language.","tip":"Order of events: detect (transduction), then interpret (perception)."},{"id":"N12-02","unit":"ch12","sec":"ch12-receptors","focus":[["ch12-receptors",1]],"type":"mcq","stem":"A client stops noticing their wristwatch a few minutes after putting it on. What explains this?","why":"Adaptation is a reduced response during sustained stimulation. Rapidly adapting receptors emphasize change. Pain receptors adapt little or slowly.","diff":1,"origin":"new","opts":[{"t":"Sensory adaptation: rapidly adapting receptors respond less to a steady stimulus.","c":true},{"t":"The touch receptors in the wrist were damaged.","w":"The receptors are fine. They respond less to a constant stimulus."},{"t":"Referred pain","w":"Referred pain is pain felt away from its source."},{"t":"Nociceptors sensitizing","w":"Sensitization INCREASES responses, often during inflammation."}],"trick":"Adaptation = 'old news' gets tuned out.","tip":"Pick the normal explanation before assuming damage."},{"id":"N12-03","unit":"ch12","sec":"ch12-receptors","focus":[["ch12-receptors",1]],"type":"sata","stem":"Which receptor-to-stimulus pairings are correct? Select all that apply.","why":"Receptors are classified by stimulus: mechano (deformation), thermo (temperature), chemo (chemicals), photo (light), noci (potentially damaging stimuli), and proprioceptors (position and movement).","diff":2,"origin":"new","opts":[{"t":"Mechanoreceptors: deformation, such as touch and pressure","c":true},{"t":"Chemoreceptors: chemicals","c":true},{"t":"Photoreceptors: light","c":true},{"t":"Nociceptors: temperature only","w":"Nociceptors respond to potentially damaging stimuli. Thermoreceptors sense temperature."},{"t":"Proprioceptors: taste","w":"Proprioceptors sense body position and movement."}],"trick":"The prefix names the stimulus: photo = light, chemo = chemical, noci = harm.","tip":"Decode each prefix and the pairings sort themselves."},{"id":"N12-04","unit":"ch12","sec":"ch12-somatic","focus":[["ch12-somatic",0]],"type":"mcq","stem":"Which pairing of proprioceptor and what it senses is correct?","why":"Muscle spindles (inside the muscle) detect length and stretch. Golgi tendon organs (at the muscle–tendon junction) monitor tension. Together they help coordinate posture and force.","diff":2,"origin":"new","opts":[{"t":"Muscle spindle: muscle length (stretch). Golgi tendon organ: tension.","c":true},{"t":"Muscle spindle: tension. Golgi tendon organ: muscle length.","w":"This swaps the two."},{"t":"Both sense light touch on the skin.","w":"Light touch is sensed by tactile corpuscles."},{"t":"Both sense temperature.","w":"Temperature is sensed by thermoreceptors."}],"trick":"Spindle = Stretch. Tendon organ = Tension.","tip":"Swapped pairs: match the location (inside the muscle vs at the tendon) to the job."},{"id":"N12-05","unit":"ch12","sec":"ch12-somatic","focus":[["ch12-somatic",1]],"type":"mcq","stem":"A client having a heart attack feels pain in the left arm and jaw. Which explanation is accurate?","why":"Referred pain is felt away from its source, partly because visceral and somatic sensory signals converge on the same central circuits.","diff":2,"origin":"new","opts":[{"t":"Referred pain from shared nerve pathways","c":true},{"t":"The heart itself is located in the arm","w":"The heart is in the mediastinum of the thorax."},{"t":"Pain receptors in the arm are damaged","w":"The arm is fine. The brain misreads where the pain comes from."},{"t":"Cardiac pain receptors have adapted","w":"Adaptation reduces responses. It doesn't move pain to another place."}],"trick":"Referred pain = a 'call forwarded' to the wrong address.","tip":"When pain shows up far from the organ, think 'referred'."},{"id":"N12-06","unit":"ch12","sec":"ch12-somatic","focus":[["ch12-somatic",1]],"type":"mcq","stem":"A client stubs a toe and feels a quick sharp pain, followed by a slower, dull ache. Which fibers carry each type?","why":"Myelinated A-delta fibers carry fast, sharp pain. Unmyelinated C fibers carry slower, diffuse pain. Acute vs chronic is a separate idea about duration.","diff":3,"origin":"new","opts":[{"t":"Fast sharp pain: myelinated A-delta fibers. Slow dull ache: unmyelinated C fibers.","c":true},{"t":"Fast sharp pain: unmyelinated C fibers. Slow dull ache: A-delta fibers.","w":"This swaps them. Myelin makes A-delta fibers faster."},{"t":"Both travel on the same fiber type.","w":"Two fiber types explain the two-phase pain."},{"t":"Fast pain is chronic pain; slow pain is acute pain.","w":"Acute vs chronic describes how LONG pain lasts, not fiber speed."}],"trick":"A-delta = fAst (myelin). C = Crawling (no myelin).","tip":"Myelin means speed. Use that to sort fast vs slow."},{"id":"N12-07","unit":"ch12","sec":"ch12-chemical","focus":[["ch12-chemical",0]],"type":"order","stem":"Put the pathway of smell in order.","why":"Smell begins with odorants dissolved in mucus binding olfactory receptor cilia. Axons pass through the ethmoid's cribriform plate to the olfactory bulb, then along the olfactory tract. Smell doesn't need the usual first thalamic relay.","diff":2,"origin":"new","steps":["Odorants dissolve in the nasal mucus.","They bind receptors on olfactory neuron cilia.","Olfactory axons pass through the cribriform plate.","Signals reach the olfactory bulb.","The olfactory tract carries them to olfactory cortex and limbic areas."],"trick":"Mucus, Cilia, Cribriform, Bulb, Tract: 'My Cat Came By Today.'","tip":"Follow the signal from outside the nose to inside the brain."},{"id":"N12-08","unit":"ch12","sec":"ch12-chemical","focus":[["ch12-chemical",1]],"type":"sata","stem":"Which statements about taste are accurate? Select all that apply.","why":"Taste buds detect sweet, sour, salty, bitter, and umami across many areas. Taste travels on VII (front of the tongue), IX (back of the tongue), and X (epiglottis and pharynx).","diff":2,"origin":"new","opts":[{"t":"The five major taste qualities are sweet, sour, salty, bitter, and umami.","c":true},{"t":"The facial nerve (VII) carries taste from the front of the tongue.","c":true},{"t":"The glossopharyngeal nerve (IX) carries taste from the back of the tongue.","c":true},{"t":"Each taste is sensed only in its own zone of the tongue.","w":"The rigid 'tongue map' is inaccurate."},{"t":"The trigeminal nerve (V) is the main taste nerve.","w":"V carries texture and irritation, not the main taste signals."}],"trick":"Taste nerves 7, 9, 10: 'Seven nine ten, taste again.'","tip":"Old myths (the tongue map) show up as distractors."},{"id":"N12-09","unit":"ch12","sec":"ch12-chemical","focus":[],"type":"teaching","stem":"A client with a bad cold complains that food has no flavor. Which statement by the client indicates a need for further teaching?","why":"Flavor combines taste, smell, texture, temperature, and experience. Losing smell can greatly reduce flavor even when the taste receptors work.","diff":1,"origin":"new","opts":[{"t":"\"My cold can't affect flavor, because taste and smell are totally separate.\"","c":true},{"t":"\"Flavor comes from taste and smell working together.\"","w":"Accurate."},{"t":"\"A stuffy nose can make food seem bland.\"","w":"Accurate. Loss of smell greatly reduces flavor."},{"t":"\"Texture and temperature also affect flavor.\"","w":"Accurate."}],"trick":"Flavor = taste + smell (+ texture and temperature).","tip":"'Needs further teaching' = the statement that is false."},{"id":"N12-10","unit":"ch12","sec":"ch12-ear","focus":[["ch12-ear",0]],"type":"order","stem":"Put the path of sound through the ear in order, up to the inner ear.","why":"The auricle funnels sound down the canal to the eardrum. The ossicles (malleus, incus, stapes) carry the vibration across the air-filled middle ear, and the stapes pushes on the oval window of the cochlea.","diff":2,"origin":"new","steps":["Auricle","External auditory canal","Tympanic membrane (eardrum)","Malleus","Incus","Stapes","Oval window"],"trick":"Ossicles in order: MIS (Malleus, Incus, Stapes), like a Hammer, Anvil, Stirrup.","tip":"Outer, then middle, then inner: work from outside in."},{"id":"N12-11","unit":"ch12","sec":"ch12-ear","focus":[["ch12-ear",1]],"type":"mcq","stem":"Which statement about the spaces of the ear is accurate?","why":"The middle ear is an air-filled cavity with the ossicles. The inner ear is fluid-filled: perilymph surrounds the membranous labyrinth and endolymph fills it.","diff":2,"origin":"new","opts":[{"t":"The middle ear is filled with air; perilymph lies outside the membranous labyrinth, and endolymph fills it.","c":true},{"t":"The middle ear is filled with endolymph.","w":"The middle ear is an air space. Endolymph is in the inner ear."},{"t":"Perilymph fills the membranous labyrinth; endolymph surrounds it.","w":"This swaps them."},{"t":"The inner ear is filled with air.","w":"The inner ear is fluid-filled."}],"trick":"PERIlymph = PERImeter (outside). ENDOlymph = inside (endo).","tip":"Air (middle) vs fluid (inner) is the first split. Then sort the two fluids."},{"id":"N12-12","unit":"ch12","sec":"ch12-ear","focus":[],"type":"mcq","stem":"A child's ears hurt as an airplane descends. Which structure equalizes pressure in the middle ear?","why":"The auditory tube connects the middle ear to the nasopharynx. Swallowing or yawning opens it to equalize pressure on both sides of the eardrum.","diff":1,"origin":"new","opts":[{"t":"The auditory (pharyngotympanic) tube","c":true},{"t":"The cochlea","w":"The cochlea senses sound. It doesn't equalize pressure."},{"t":"The semicircular canals","w":"These sense head rotation."},{"t":"The external auditory canal","w":"The external canal leads to the eardrum from outside."}],"trick":"Swallow to open the tube and pop the pressure.","tip":"'Pressure' in an ear question usually points to the auditory tube."},{"id":"N12-13","unit":"ch12","sec":"ch12-hearing","focus":[["ch12-hearing",0]],"type":"mcq","stem":"Where is the spiral organ (organ of Corti) located?","why":"The cochlea has three channels. The spiral organ rests on the basilar membrane in the cochlear duct. When the basilar membrane moves, hair-cell stereocilia bend against the tectorial membrane, opening channels.","diff":3,"origin":"new","opts":[{"t":"On the basilar membrane, with hair cells touching the tectorial membrane","c":true},{"t":"In the middle ear, attached to the stapes","w":"The spiral organ is in the cochlea of the inner ear."},{"t":"In the semicircular canals","w":"The canals contain cristae for balance."},{"t":"On the tympanic membrane","w":"The eardrum is the boundary to the middle ear."}],"trick":"Corti sits on the Basement (basilar membrane) with a Tent (tectorial) overhead.","tip":"Hearing receptors are in the cochlea. Rule out middle-ear and balance structures."},{"id":"N12-14","unit":"ch12","sec":"ch12-hearing","focus":[["ch12-hearing",1]],"type":"mcq","stem":"After hair cells in the cochlea are stimulated, which nerve and cortical area process the sound?","why":"Vibration bends hair cells, which signal the cochlear branch of CN VIII. Signals relay through the brainstem, midbrain, and thalamus to the auditory cortex in the temporal lobe.","diff":2,"origin":"new","opts":[{"t":"Cranial nerve VIII to auditory cortex in the temporal lobe","c":true},{"t":"Cranial nerve II to the occipital lobe","w":"That is the visual pathway."},{"t":"Cranial nerve VII to the parietal lobe","w":"VII is the facial nerve."},{"t":"Cranial nerve V to the frontal lobe","w":"V is the trigeminal nerve."}],"trick":"Cranial nerve VIII serves the ears. The temporal lobe sits by your temples, right next to your ears.","tip":"Pair the nerve and the lobe. Both halves must match the sense."},{"id":"N12-15","unit":"ch12","sec":"ch12-balance","focus":[["ch12-balance",0]],"type":"mcq","stem":"A client spins in a chair. Which structures detect this rotation (angular acceleration) of the head?","why":"Semicircular canals have cristae ampullaris, where endolymph moving during rotation bends the cupula. Maculae (utricle and saccule) use otoliths to detect gravity and straight-line acceleration.","diff":2,"origin":"new","opts":[{"t":"The cristae ampullaris in the semicircular canals","c":true},{"t":"The maculae of the utricle and saccule","w":"Maculae detect gravity and LINEAR acceleration."},{"t":"The cochlea","w":"The cochlea detects sound."},{"t":"The tympanic membrane","w":"The eardrum vibrates with sound."}],"trick":"Canals = Circles = spinning. Maculae = gravity (static, linear).","tip":"Rotation vs straight-line motion decides cristae vs maculae."},{"id":"N12-16","unit":"ch12","sec":"ch12-balance","focus":[["ch12-balance",1]],"type":"mcq","stem":"When a client turns their head, their eyes stay fixed on a target. Which reflex does this?","why":"Vestibular signals travel on CN VIII to the vestibular nuclei and cerebellar circuits, which connect to eye-movement centers. The vestibulo-ocular reflex stabilizes gaze while the head moves.","diff":2,"origin":"new","opts":[{"t":"The vestibulo-ocular reflex","c":true},{"t":"The patellar reflex","w":"This is a spinal stretch reflex in the leg."},{"t":"The acoustic (tympanic) reflex","w":"This tightens middle-ear muscles in response to loud sound."},{"t":"The withdrawal reflex","w":"This pulls a limb away from pain."}],"trick":"Vestibulo (inner-ear balance) + Ocular (eyes) = steady eyes on a moving head.","tip":"Break the reflex name into parts to see what it links."},{"id":"N12-17","unit":"ch12","sec":"ch12-eye","focus":[["ch12-eye",0]],"type":"sata","stem":"Which statements about the layers (tunics) of the eye are accurate? Select all that apply.","why":"Three tunics: fibrous (sclera + cornea), vascular (choroid, ciliary body, iris), and neural (retina). The pupil is a hole in the iris that changes the aperture.","diff":2,"origin":"new","opts":[{"t":"The fibrous tunic is the sclera and cornea.","c":true},{"t":"The vascular tunic includes the choroid, ciliary body, and iris.","c":true},{"t":"The neural tunic is the retina.","c":true},{"t":"The pupil is a solid lens.","w":"The pupil is an opening in the iris."},{"t":"The conjunctiva covers the transparent cornea.","w":"The conjunctiva lines the eyelids and covers the anterior sclera, not the cornea."}],"trick":"Fibrous = the eye's coat, Vascular = blood and muscle middle, Neural = retina film.","tip":"Sort each structure into outer, middle, or inner."},{"id":"N12-18","unit":"ch12","sec":"ch12-eye","focus":[["ch12-eye",1]],"type":"mcq","stem":"Which statement about the eye's fluid-filled spaces is accurate?","why":"The anterior cavity (anterior chamber between cornea and iris, posterior chamber between iris and lens) holds circulating aqueous humor. The much larger vitreous cavity behind the lens holds vitreous humor.","diff":3,"origin":"new","opts":[{"t":"Aqueous humor fills the anterior cavity (in front of the lens); vitreous humor fills the larger cavity behind the lens.","c":true},{"t":"Vitreous humor fills the space between the cornea and the iris.","w":"That space (the anterior chamber) holds aqueous humor."},{"t":"The posterior chamber and the posterior (vitreous) cavity are the same thing.","w":"The posterior chamber is between the iris and the lens and holds aqueous humor. The vitreous cavity is behind the lens."},{"t":"Aqueous humor never circulates.","w":"Aqueous humor circulates and drains at the anterior chamber angle."}],"trick":"Aqueous = watery, in front, flows. Vitreous = glassy gel, in back.","tip":"Don't mix up 'posterior chamber' (front of the eye) and 'posterior cavity' (back of the eye)."},{"id":"N12-19","unit":"ch12","sec":"ch12-vision","focus":[["ch12-vision",0]],"type":"mcq","stem":"A client looks up from a distant sign to read a book. What happens in the eye to focus on the near object?","why":"For near vision the ciliary muscle contracts, the suspensory ligaments (zonules) slacken, and the elastic lens rounds up, which increases its focusing power. For distance the muscle relaxes and the lens flattens.","diff":2,"origin":"new","opts":[{"t":"The ciliary muscle contracts, zonular tension decreases, and the lens becomes rounder.","c":true},{"t":"The ciliary muscle relaxes and the lens flattens.","w":"That is focusing on DISTANT objects."},{"t":"The retina moves forward.","w":"Accommodation changes the lens shape. The retina doesn't move."},{"t":"The cornea changes shape to focus.","w":"The cornea bends light, but accommodation is done by the lens."}],"trick":"Near = muscle tight, lens round ('reading makes the lens chubby').","tip":"Counterintuitive link: muscle CONTRACTS means zonules LOOSEN. Learn it as a chain."},{"id":"N12-20","unit":"ch12","sec":"ch12-vision","focus":[["ch12-vision",1]],"type":"sata","stem":"Which statements about photoreceptors and the retina are accurate? Select all that apply.","why":"Rods favor dim light with little color or detail. Cones give color and acuity in bright light, densest at the fovea. Signals pass photoreceptors → bipolar cells → ganglion cells, whose axons form the optic nerve at the optic disc (blind spot).","diff":2,"origin":"new","opts":[{"t":"Rods are very sensitive in dim light.","c":true},{"t":"Cones provide color and sharp vision and are concentrated in the fovea.","c":true},{"t":"Ganglion cell axons form the optic nerve (CN II).","c":true},{"t":"The optic disc is packed with cones.","w":"The optic disc has NO photoreceptors, which is the blind spot."},{"t":"Rods give the best color vision.","w":"Cones give color vision."}],"trick":"Rods = dim Rooms. Cones = Color.","tip":"Watch the optic disc trap: where the nerve exits, there are no receptors."},{"id":"N12-21","unit":"ch12","sec":"ch12-vision","focus":[],"type":"order","stem":"Put the path of light through the eye in order.","why":"Light passes through the cornea, aqueous humor, pupil, lens, and vitreous humor before reaching the retina. After transduction, the signal travels as nerve impulses, not light.","diff":2,"origin":"new","steps":["Cornea","Aqueous humor","Pupil","Lens","Vitreous humor","Retina"],"trick":"Can All People Love Very Real eyes? (Cornea, Aqueous, Pupil, Lens, Vitreous, Retina)","tip":"Front to back: clear window (cornea) first, film (retina) last."},{"id":"N12-22","unit":"ch12","sec":"ch12-phototransduction","focus":[["ch12-phototransduction",0]],"type":"mcq","stem":"What happens to a photoreceptor when light strikes it?","why":"In darkness, cGMP keeps channels open and the photoreceptor releases transmitter steadily. Light changes the pigment (retinal in an opsin), cGMP falls, channels close, and the cell hyperpolarizes, changing glutamate release onto bipolar cells.","diff":3,"origin":"new","opts":[{"t":"It hyperpolarizes and changes how much glutamate it releases.","c":true},{"t":"It depolarizes and fires an action potential down the optic nerve.","w":"Photoreceptors hyperpolarize and don't send action potentials down the optic nerve. Ganglion cells do."},{"t":"Its cGMP levels rise and more channels open.","w":"Light LOWERS cGMP, which closes channels."},{"t":"Nothing changes until the light is very bright.","w":"Rods respond even in dim light."}],"trick":"Light turns photoreceptors 'down' (hyperpolarize). Darkness keeps them 'on'.","tip":"This is the opposite of most receptors, which is why exams love it."},{"id":"N12-23","unit":"ch12","sec":"ch12-phototransduction","focus":[["ch12-phototransduction",1]],"type":"sata","stem":"Which descriptions of sensory changes are accurate? Select all that apply.","why":"Presbyopia (stiffer lens, harder near focus), cataract (cloudy lens), glaucoma (optic nerve damage, often with high pressure), retinal detachment (retina separates), macular degeneration (central vision loss), and tinnitus (phantom sound) are all different.","diff":2,"origin":"new","opts":[{"t":"Presbyopia: reduced ability to focus up close with age","c":true},{"t":"Cataract: clouding of the lens","c":true},{"t":"Glaucoma: optic nerve damage, often linked to high eye pressure","c":true},{"t":"Presbyopia and cataract are the same condition.","w":"Presbyopia is reduced near focus. Cataract is a cloudy lens. They are different processes."},{"t":"Tinnitus means complete hearing loss.","w":"Tinnitus is hearing a sound with no external source."}],"trick":"Presby = elder (age-related near focus). Cataract = cloudy curtain on the lens.","tip":"Similar-sounding conditions: match each to the structure affected."},{"id":"N12-24","unit":"ch12","sec":"ch12-phototransduction","focus":[["ch12-phototransduction",1]],"type":"priority","stem":"The nurse at the eye clinic receives four phone calls. Which client should the nurse call back first?","why":"A sudden curtain over the vision can signal retinal detachment, where the neural retina separates from its supporting tissue. It is sudden and threatens vision, so it comes first.","diff":3,"origin":"new","opts":[{"t":"A client who suddenly sees a dark curtain over part of their vision","c":true},{"t":"A 50-year-old who needs to hold menus farther away to read","w":"Gradual presbyopia is expected with age and not urgent."},{"t":"A client with a known cataract whose vision is slowly getting cloudier","w":"A slowly progressing, known condition."},{"t":"A client asking about lubricating eye drops","w":"A comfort question that can wait."}],"trick":"Sudden + vision loss = urgent.","tip":"Priority: sudden changes beat gradual, expected ones."},{"id":"P-01","unit":"ch6","sec":"ch6-temperature","focus":[["ch6-temperature",0],["ch6-temperature",1]],"type":"priority","stem":"On a hot, humid afternoon, the nurse at an outdoor event receives four reports. Which client should the nurse see first?","why":"When heat gain exceeds heat loss, core temperature climbs (hyperthermia). High humidity limits evaporative cooling, so sweating may not be enough. A very high core temperature with confusion shows heat balance has failed. That makes it urgent.","diff":2,"origin":"new","opts":[{"t":"A worker with hot skin who is confused and has a core temperature of 40 °C (104 °F)","c":true},{"t":"A spectator who is sweating after walking up the bleachers","w":"Sweating after activity is a normal cooling response."},{"t":"A volunteer with cool hands in an air-conditioned tent","w":"Skin vessels constricting in a cool space is normal heat conservation."},{"t":"A parent asking which sunscreen to use","w":"Teaching can wait."}],"trick":"Hot, humid, and confused = the cooling system has lost.","tip":"Priority: an unstable vital sign plus a change in mental status comes first."},{"id":"P-02","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",0]],"type":"priority","stem":"The nurse checks four IV infusions. Which client needs the nurse first?","why":"Plain water is extremely hypotonic. In the blood, water rushes into red blood cells, which swell and can burst (hemolysis). An isotonic solution keeps cell volume stable.","diff":3,"origin":"new","opts":[{"t":"A client mistakenly receiving plain sterile water through an IV","c":true},{"t":"A client receiving isotonic saline at the prescribed rate","w":"Isotonic fluid causes no net change in cell volume."},{"t":"A client asking for a cup of drinking water","w":"A routine request that can wait."},{"t":"A client whose IV is due to be changed tomorrow","w":"Not urgent."}],"trick":"Hypotonic = hippo: cells swell, then can pop.","tip":"Priority: stop a harmful treatment that is still running before anything else."},{"id":"P-03","unit":"ch7","sec":"ch7-aging","focus":[["ch7-aging",1]],"type":"priority","stem":"On a geriatric unit, which client should the nurse assess first?","why":"Spongy bone weakens sooner than compact bone, and the femoral neck has a lot of it, so hip (upper femur) fractures are common after falls in older adults. A new fall with severe pain and inability to bear weight is acute.","diff":2,"origin":"new","opts":[{"t":"An 82-year-old who fell, cannot bear weight, and has severe pain in the upper thigh and hip","c":true},{"t":"A 70-year-old with osteoporosis asking about vitamin D","w":"Teaching can wait until the possible fracture is assessed."},{"t":"A 75-year-old whose height has decreased slightly over 10 years","w":"Gradual height loss from disc compression is expected with aging."},{"t":"A 68-year-old who walks daily and wants to keep doing it","w":"A healthy goal, not an urgent problem."}],"trick":"Older adult + fall + can't stand on it = check the hip first.","tip":"Priority: a new, acute injury beats chronic, expected changes."},{"id":"P-04","unit":"ch9","sec":"ch9-nmj","focus":[],"type":"priority","stem":"Which client on the neuro unit should the nurse see first?","why":"In myasthenia gravis the immune system attacks acetylcholine receptors at the neuromuscular junction, causing muscle weakness. When it affects the muscles for swallowing and breathing, airway and breathing are at risk.","diff":3,"origin":"new","opts":[{"t":"A client with myasthenia gravis who now has trouble swallowing and breathing deeply","c":true},{"t":"A client with tendinitis of the elbow","w":"Painful but stable."},{"t":"A client with a healing hamstring strain","w":"Stable and improving."},{"t":"A client with Duchenne muscular dystrophy asking about wheelchairs","w":"Important planning, not urgent."}],"trick":"Weak NMJ + weak breathing muscles = airway first.","tip":"Airway and Breathing outrank everything else."},{"id":"P-05","unit":"ch11","sec":"ch11-cranial","focus":[["ch11-cranial",1]],"type":"priority","stem":"Four clients have injuries. Which client is at greatest risk for a breathing problem and should be seen first?","why":"The phrenic nerve, from the cervical plexus, supplies the diaphragm, the main breathing muscle. An injury high in the cervical cord can affect it.","diff":3,"origin":"new","opts":[{"t":"A client with a high cervical spinal cord injury near the origin of the phrenic nerve","c":true},{"t":"A client with a brachial plexus stretch injury in one arm","w":"This affects arm function, not breathing."},{"t":"A client with a sacral nerve injury","w":"Sacral nerves serve the lower body, not the diaphragm."},{"t":"A client with numbness in one finger","w":"A minor, localized nerve problem."}],"trick":"C3, 4, 5 keeps the diaphragm alive (the phrenic nerve's roots).","tip":"Link the nerve to the organ. If the organ is for breathing, that client is the priority."},{"id":"P-06","unit":"ch11","sec":"ch11-receptors","focus":[["ch11-receptors",1]],"type":"priority","stem":"The nurse receives four calls. Which client needs help first?","why":"Sudden one-sided weakness and slurred speech suggest a stroke: brain injury from blocked blood flow or bleeding. It is acute and time-sensitive, unlike the stable chronic conditions.","diff":2,"origin":"new","opts":[{"t":"A client with sudden weakness on one side of the body and slurred speech that started 20 minutes ago","c":true},{"t":"A client with Parkinson disease reporting their usual resting tremor","w":"A chronic, expected symptom."},{"t":"A client with multiple sclerosis asking about a support group","w":"Not urgent."},{"t":"A client with well-controlled epilepsy requesting a refill","w":"Routine."}],"trick":"Sudden + new neuro deficit = think stroke, act fast.","tip":"Priority: sudden new symptoms beat stable, long-term ones."},{"id":"P-07","unit":"ch11","sec":"ch11-protection","focus":[],"type":"priority","stem":"Which client in the clinic waiting room should the nurse see first?","why":"Fever, headache, stiff neck, and confusion can signal meningitis, inflammation of the meninges that protect the brain and spinal cord. Infection near the CNS is urgent.","diff":2,"origin":"new","opts":[{"t":"A college student with fever, a severe headache, a stiff neck, and new confusion","c":true},{"t":"A client with a mild tension headache after studying","w":"Uncomfortable but stable."},{"t":"A client needing a booster vaccine","w":"Routine."},{"t":"A client with seasonal allergies","w":"Not urgent."}],"trick":"Meninges inflamed + mind changing = urgent.","tip":"Any new confusion moves a client up the priority list."},{"id":"P-08","unit":"ch6","sec":"ch6-pigment","focus":[["ch6-pigment",0]],"type":"priority","stem":"Which skin-color finding should the nurse act on first?","why":"Cyanosis (a bluish color) reflects poor oxygenation. With shortness of breath, it is a breathing problem. Jaundice, carotene, and vitiligo are pigment changes, not oxygen emergencies.","diff":2,"origin":"new","opts":[{"t":"New bluish lips and nail beds in a client who is short of breath","c":true},{"t":"Yellowish skin in a client with long-standing, stable liver disease","w":"Jaundice from bilirubin is known and stable here."},{"t":"A yellow-orange tint on the palms of a client who eats lots of carrots","w":"Carotene coloring is harmless."},{"t":"Light patches of skin from vitiligo","w":"Loss of pigment cells. Not urgent."}],"trick":"Blue = Breathing problem.","tip":"Priority: a sign tied to oxygen beats color changes from pigment."},{"id":"P-09","unit":"ch10","sec":"ch10-synapses","focus":[["ch10-synapses",1]],"type":"priority","stem":"A farm clinic nurse has four clients. Which client should be seen first?","why":"Acetylcholinesterase normally breaks down acetylcholine. If it is blocked, ACh builds up and keeps stimulating muscles, which can impair breathing. That is a breathing emergency.","diff":3,"origin":"new","opts":[{"t":"A worker exposed to a pesticide that blocks acetylcholinesterase, now short of breath","c":true},{"t":"A worker with a small cut on the hand that stopped bleeding after a bandage","w":"Minor and stable."},{"t":"A worker with seasonal hay fever whose eyes are itchy and watery this morning","w":"Not urgent."},{"t":"A worker asking which hearing protection to wear near the loud grain dryer","w":"Teaching can wait."}],"trick":"No ACh cleanup = muscles stuck 'on', including the breathing muscles.","tip":"Breathing trouble wins priority questions."},{"id":"P-10","unit":"ch8","sec":"ch8-synovial-structure","focus":[["ch8-synovial-structure",1]],"type":"priority","stem":"Which client in the joint clinic should the nurse see first?","why":"A suddenly hot, swollen joint with fever suggests infection inside the joint cavity. The synovial membrane's phagocytes fight microbes, but an infected joint is acute and can be damaged quickly.","diff":3,"origin":"new","opts":[{"t":"A client with a suddenly hot, red, swollen knee and a fever","c":true},{"t":"A client with osteoarthritis and usual morning stiffness","w":"Chronic and expected."},{"t":"A client with a healing ankle sprain","w":"Stable and improving."},{"t":"A client asking about knee braces for running","w":"Teaching can wait."}],"trick":"Hot joint + fever = possible infection: see first.","tip":"Fever with a new local problem points to infection, which is urgent."},{"id":"T-01","unit":"ch4","sec":"ch4-glycolysis","focus":[["ch4-glycolysis",1]],"type":"teaching","stem":"A nurse teaches a client who just started weight training. Which statement indicates a need for further teaching?","why":"Lactate is a usable intermediate that is cleared and recycled. Soreness days after unfamiliar exercise is not explained by lactate lingering for days.","diff":2,"origin":"new","opts":[{"t":"\"My muscles are sore three days later because lactic acid is still stuck in them.\"","c":true},{"t":"\"Creatine phosphate gives my muscles quick energy for a few seconds.\"","w":"Accurate."},{"t":"\"I keep breathing hard after a sprint to repay my oxygen debt.\"","w":"Accurate."},{"t":"\"Lactate can be used again by my body for energy.\"","w":"Accurate. Lactate is a usable intermediate."}],"trick":"Lactate leaves fast. Days-later soreness is something else.","tip":"Look for the popular myth. It is often the 'needs teaching' answer."},{"id":"T-02","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",0]],"type":"teaching","stem":"A nursing student explains IV fluids to a classmate. Which statement shows the student needs more teaching?","why":"Hypotonic solutions make cells SWELL (water enters). Hypertonic solutions make them shrink (crenation). Isotonic solutions keep volume steady.","diff":2,"origin":"new","opts":[{"t":"\"A hypotonic solution makes red blood cells shrink.\"","c":true},{"t":"\"A hypertonic solution pulls water out of cells.\"","w":"Accurate."},{"t":"\"An isotonic solution keeps cell volume about the same.\"","w":"Accurate."},{"t":"\"Water moves toward the side with more solute that can't cross.\"","w":"Accurate."}],"trick":"Hypo = hippo (swells).","tip":"One swapped direction is a classic error to catch."},{"id":"T-03","unit":"ch6","sec":"ch6-pigment","focus":[["ch6-pigment",1]],"type":"teaching","stem":"A nurse teaches sun safety at a community fair. Which statement indicates a need for further teaching?","why":"Melanin absorbs SOME ultraviolet radiation but doesn't eliminate UV damage. Everyone benefits from sun protection.","diff":2,"origin":"new","opts":[{"t":"\"My darker skin has more melanin, so UV can't damage it at all.\"","c":true},{"t":"\"UV radiation can damage DNA in skin cells.\"","w":"Accurate."},{"t":"\"Melanin absorbs some UV radiation.\"","w":"Accurate."},{"t":"\"Skin cancers can come from different kinds of skin cells.\"","w":"Accurate: basal cell, squamous cell, and melanoma differ."}],"trick":"Melanin = a shield, not a force field.","tip":"Absolute claims ('at all', 'never') usually need correcting."},{"id":"T-04","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",0]],"type":"teaching","stem":"A nurse teaches a client with a large full-thickness burn. Which statement indicates a need for further teaching?","why":"Full-thickness burns destroy the whole skin and many regenerative structures. Large ones can't simply regrow normal skin from their center the way a superficial wound heals.","diff":2,"origin":"new","opts":[{"t":"\"My burn will grow new normal skin from the middle on its own, like a scrape.\"","c":true},{"t":"\"This burn destroyed all the layers of my skin.\"","w":"Accurate."},{"t":"\"Losing this much skin affects my fluid balance and infection risk.\"","w":"Accurate."},{"t":"\"Good nutrition and blood supply help healing.\"","w":"Accurate."}],"trick":"Full thickness = full loss of the skin's repair kit.","tip":"Match the depth of the injury to how it can heal."},{"id":"T-05","unit":"ch1","sec":"ch1-directions","focus":[["ch1-directions",0]],"type":"teaching","stem":"A new nurse is documenting a client's wound location. Which statement shows a need for more teaching?","why":"Right and left always refer to the CLIENT'S right and left, which may be on the viewer's left. Directional terms use anatomical position no matter how the client is lying.","diff":1,"origin":"new","opts":[{"t":"\"Right and left mean MY right and left as I face the client.\"","c":true},{"t":"\"Directional terms assume the client is in anatomical position.\"","w":"Accurate."},{"t":"\"The terms still apply even if the client is lying down.\"","w":"Accurate."},{"t":"\"In anatomical position, the palms face forward.\"","w":"Accurate."}],"trick":"It's their body, so it's their right.","tip":"Perspective errors are common. Always use the client's view."},{"id":"T-06","unit":"ch2","sec":"ch2-carbohydrates","focus":[["ch2-carbohydrates",1]],"type":"teaching","stem":"A nurse teaches a client with diabetes about carbohydrates. Which statement indicates a need for further teaching?","why":"Glycogen is stored mainly in the liver (to support blood glucose) and skeletal muscle (to fuel muscle). Fat tissue stores triglycerides.","diff":2,"origin":"new","opts":[{"t":"\"My body stores glycogen mostly in my fat tissue.\"","c":true},{"t":"\"Liver glycogen helps keep my blood glucose steady.\"","w":"Accurate."},{"t":"\"Fiber comes from cellulose that I can't digest.\"","w":"Accurate."},{"t":"\"Table sugar (sucrose) is glucose joined to fructose.\"","w":"Accurate."}],"trick":"Glycogen lives in the Liver and Muscles: 'LM'.","tip":"Watch for the right substance in the wrong storage place."},{"id":"T-07","unit":"ch2","sec":"ch2-lipids","focus":[["ch2-lipids",0]],"type":"teaching","stem":"A client asks about fats in the diet. Which statement by the client indicates a need for further teaching?","why":"Cholesterol stabilizes animal cell membranes and is a precursor of steroid hormones, bile acids, and vitamin D-related molecules. Its levels matter for health, but it has essential jobs.","diff":2,"origin":"new","opts":[{"t":"\"Cholesterol has no useful job in my body.\"","c":true},{"t":"\"Phospholipids make up my cell membranes.\"","w":"Accurate."},{"t":"\"Triglycerides store energy and insulate.\"","w":"Accurate."},{"t":"\"My body uses cholesterol to make steroid hormones.\"","w":"Accurate."}],"trick":"Cholesterol: membranes, hormones, bile, vitamin D. It's not all bad.","tip":"'No useful job' is an absolute. It is usually wrong in physiology."},{"id":"T-08","unit":"ch5","sec":"ch5-connective","focus":[["ch5-connective",1]],"type":"teaching","stem":"A nurse teaches a client with a cartilage injury in the knee. Which statement indicates a need for further teaching?","why":"Cartilage is avascular, which is part of why it heals slowly. Bone, by contrast, is richly vascular.","diff":2,"origin":"new","opts":[{"t":"\"My cartilage will heal quickly because it has a lot of blood vessels.\"","c":true},{"t":"\"Cartilage heals slowly because it lacks blood vessels.\"","w":"Accurate."},{"t":"\"Hyaline cartilage covers the ends of my bones in the joint.\"","w":"Accurate."},{"t":"\"The menisci in my knee are fibrocartilage.\"","w":"Accurate."}],"trick":"No blood vessels = slow repairs.","tip":"Two statement
