      const desk = $('.station-desk', plan).getBoundingClientRect();
      return { x: desk.right - pr.left + 6, y: cor.top - pr.top + cor.height / 2 - walker.offsetHeight / 2 };
    }
    return { x: cor.left - pr.left + cor.width / 2 - walker.offsetWidth / 2, y: cor.top - pr.top + 6 };
  },
  placeWalker(animate) {
    const walker = $('#walker');
    if (!walker) return;
    const p = this.home();
    if (!animate) walker.style.transition = 'none';
    walker.style.transform = `translate(${p.x}px, ${p.y}px)`;
    if (!animate) { void walker.offsetWidth; walker.style.transition = ''; }
  },
  walkTo(roomEl) {
    return new Promise((resolve) => {
      const plan = $('#floorplan'), walker = $('#walker');
      if (!plan || !walker || reducedMotion()) { resolve(); return; }
      const pr = plan.getBoundingClientRect(), rr = roomEl.getBoundingClientRect(), cor = $('.corridor', plan).getBoundingClientRect();
      let x, y;
      if (App.layout === 'h') {
        x = rr.left - pr.left + rr.width / 2 - walker.offsetWidth / 2;
        y = cor.top - pr.top + cor.height / 2 - walker.offsetHeight / 2;
      } else {
        x = cor.left - pr.left + cor.width / 2 - walker.offsetWidth / 2;
        y = rr.top - pr.top + rr.height / 2 - walker.offsetHeight / 2;
      }
      const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(walker.style.transform) || [0, 0, 0];
      const dist = Math.hypot(x - m[1], y - m[2]);
      const dur = clamp(dist / 700, 0.35, 1.1);
      walker.style.transitionDuration = dur + 's';
      walker.classList.add('walking');
      walker.style.transform = `translate(${x}px, ${y}px)`;
      setTimeout(() => { walker.classList.remove('walking'); resolve(); }, dur * 1000 + 30);
    });
  },
  act: {
    async room(d, el) {
      if (Screens.floor.busy) return;
      Screens.floor.busy = true;
      Sound.play('tap');
      await Screens.floor.walkTo(el);
      el.classList.add('open');
      Sound.play('door');
      await sleep(reducedMotion() ? 0 : 360);
      Screens.floor.busy = false;
      startShift(d.unit);
    },
    codeblue() { startMode('codeblue'); },
    boss() {
      if (!Engine.bossUnlocked() && !WR.debug) {
        App.modal(`<h2>The OR is locked</h2><p class="dim">The Superbug only fights experienced nurses. Earn a star in ${Engine.BOSS_ROOMS} rooms, or finish ${Engine.BOSS_SHIFTS} shifts (you've finished ${Engine.shiftsDone()}). A star means you've answered 60% of a room's patients right at least once.</p><div class="actions"><button class="btn primary" data-m="ok">Back to rounds</button></div>`);
        return;
      }
      startMode('boss');
    },
    exam() {
      App.modal(`<h2>Exam simulation</h2><p class="dim">50 mixed questions from every room, like the real final. No lifelines and no explanations until the end, then a full score report by unit.</p>
        <div class="actions"><button class="btn" data-m="no">Not now</button><button class="btn primary" data-m="go">Start exam</button></div>`,
      (m) => { if (m === 'go') startMode('exam'); return false; });
    },
  },
};

function startShift(unit) {
  App.run = new Run('shift', { unit, queue: Engine.pickShift(unit, 10) });
  App.run.next();
  App.show('chart', {}, 'zoom-in');
}
function startReview(qids, label) {
  if (!qids.length) { App.toast('No missed patients here. Nice work!'); return; }
  App.run = new Run('review', { queue: qids });
  App.run.label = label || 'Missed patients';
  App.run.next();
  App.show('chart', {}, 'zoom-in');
}
function startMode(mode) {
  const queue = mode === 'exam' ? Engine.pickExam(50) : [];
  App.run = new Run(mode, { queue });
  App.run.next();
  if (mode === 'codeblue') Sound.play('alarm');
  App.show('chart', {}, 'zoom-in');
}

// ---------- patient chart (the question screen) ----------
const MODE_TITLE = { codeblue: 'Code Blue', boss: 'Operating Room', exam: 'Exam simulation' };

Screens.chart = {
  cls: 'chart',
  ecg: null,
  timerOff: null,
  autoT: null,

  render() {
    const run = App.run;
    if (!run || !run.cur) return '<p class="dim">No patient loaded.</p>';
    return `<div class="chart-grid">${this.bedsideHTML(run)}${this.chartsideHTML(run)}</div>`;
  },

  // ----- left pane
  livesHTML(run, lostIdx = -1) {

  },
  scoreHTML(run) {
    const mult = Engine.multiplier(run.streak);

  },
  ptMood(run) {

  },

  // ----- right pane
  progHTML(run) {

  optsHTML(run) {
    const q = run.q, c = run.cur;

    let s = `<ol class="opts ${grid ? 'grid2' : ''}" id="opts">`;
    c.order.forEach((i, k) => {
      const o = isOrder ? { t: q.steps[i] } : q.opts[i];
      const selPos = c.sel.indexOf(i);
      const sel = selPos !== -1;
      const cls = ['opt'];
      if (isMulti) cls.push('multi');
      if (c.gone.indexOf(i) !== -1) cls.push('gone');
      let mark = '';
      if (showTruth) {
        if (isOrder) { cls.push(selPos === i ? 'right' : 'wrong'); mark = icon(selPos === i ? 'check' : 'x'); }
        else if (o.c && (sel || !isMulti)) { cls.push('right'); mark = icon('check'); }
        else if (o.c && isMulti) { cls.push('missed'); mark = icon('check'); }

      } else if (sel) cls.push(isOrder ? 'placed' : 'sel');
      const lead = isOrder ? `<span class="ord num">${sel ? selPos + 1 : '·'}</span>` : `<span class="key">${LETTERS[k]}</span>`;
      const pt = q.type === 'priority' ? `<span class="pt-mini">${patientHead(patientFor({ id: q.id + ':' + i, stem: o.t }), 'neutral')}</span>` : '';
      const after = showTruth && isOrder ? `<span class="order-ans">Step ${i + 1}</span>` : '';
      const label = `${isOrder ? '' : 'Option ' + LETTERS[k] + ': '}${o.t}${sel && !showTruth ? (isOrder ? `, placed ${selPos + 1}` : ', selected') : ''}`;
      s += `<li><button class="${cls.join(' ')}" data-action="pick" data-i="${i}" ${c.revealed || c.gone.indexOf(i) !== -1 ? 'disabled' : ''} aria-label="${esc(label)}" ${isMulti ? `aria-pressed="${sel}"` : ''}>${lead}${pt}<span class="t">${esc(o.t)}</span>${after}<span class="mark">${mark}</span></button></li>`;
    });
    return s + '</ol>';
  },
  paperHTML(run) {
    const q = run.q, c = run.cur, sec = Content.section(q.sec);
    const help = q.type === 'sata' ? 'Select all that apply, then tap Submit.' : q.type === 'order' ? 'Tap the steps in order, then tap Submit. Tap a placed step to take it back.' : 'Choose an answer, then tap Submit.';
    return `<div class="paper-head"><span class="qtype ${q.type}">${TYPE_INFO[q.type].label}</span><span class="paper-topic">${q.origin === 'guide' ? 'From your study guide' : 'ATI-style'} · ${esc(sec.num)}</span></div>
      <p class="stem" id="stem">${esc(q.stem)}</p>
      ${help && !c.revealed ? `<p class="paper-help">${help}</p>` : ''}
      ${c.hint && !c.revealed ? `<p class="paper-hint">${icon('users')}${esc(c.hint)}</p>` : ''}

  },
  trayHTML(run) {
    const q = run.q, c = run.cur;
    if (c.revealed) return '';
    let s = '';
    if (run.cfg.lifelines) {
      s += `<button class="life-btn" data-action="colleague" ${run.canColleague() ? '' : 'disabled'} aria-label="Ask a colleague: a 50/50 that leaves the right answer and one wrong one (on select-all questions, half the wrong options go; on ordering, the first step is placed). ${run.lifelines.colleague} left">${icon('users')}<span class="t">Ask a colleague</span><span class="n">${run.lifelines.colleague}</span></button>`;
      s += `<button class="life-btn" data-action="coffee" ${run.lifelines.coffee && run.lives < run.maxLives ? '' : 'disabled'} aria-label="Coffee break: gain one life. ${run.lifelines.coffee} left">${icon('coffee')}<span class="t">Coffee break</span><span class="n">${run.lifelines.coffee}</span></button>`;

    s += `<button class="btn primary big" data-action="submit" ${run.ready() ? '' : 'disabled'}>Submit</button>`;

  },
  chartsideHTML(run) {
    const c = run.cur;
    const fb = c.revealed && run.cfg.feedback;
    return `<main class="chartside">
      <div id="prog">${this.progHTML(run)}</div>
      <article class="clipboard" id="clipboard" aria-label="Patient chart"><div class="clip" aria-hidden="true"></div><div class="paper" id="paper">${this.paperHTML(run)}</div></article>
      <div class="tray" id="tray">${this.trayHTML(run)}</div>
      <div class="feedback" id="feedback" ${fb ? '' : 'hidden'} role="region" aria-label="Explanation">${fb ? this.feedbackHTML(run) : ''}</div>
    </main>`;
  },

  feedbackHTML(run) {
    const q = run.q, c = run.cur, res = c.res, sec = Content.section(q.sec);
    const st = res.correct ? 'ok' : res.frac > 0 ? 'part' : 'bad';
    const r = rng(q.id);
    const title = res.correct ? pick(['Correct!', 'Nice work!', 'Right on!', 'You got it!'], r) : res.frac > 0 ? 'Partly right' : 'Not quite';
    const pts = c.pts.pts ? `+${fmt(c.pts.pts)}${c.pts.mult > 1 ? ` ×${c.pts.mult}` : ''}` : '';
    let answer;
    if (q.type === 'order') answer = `<ol>${q.steps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>`;
    else answer = `<ul>${q.opts.filter((o) => o.c).map((o) => `<li>${esc(o.t)}</li>`).join('')}</ul>`;
    const ansLabel = q.type === 'order' ? 'Correct order' : q.type === 'sata' ? 'Correct answers' : q.type === 'teaching' ? 'Statement that needs more teaching' : 'Correct answer';
    const notes = [];
    if (c.lostLife) notes.push(`${icon('heart')} You lost a life.`);
    if (c.discharged) notes.push(`${icon('bed')} Patient discharged from Missed Patients!`);
    if (!res.correct && run.mode !== 'review') notes.push(`${icon('bed')} Saved to Missed Patients for review.`);
    if (c.bonusCoffee) notes.push(`${icon('coffee')} 10 in a row earned you an extra coffee break.`);
    if (c.dmg) notes.push(`${icon('sparkle')} ${c.dmg} damage to the Superbug.`);
    if (c.heal) notes.push(`${icon('bug')} The Superbug healed 80 HP.`);
    let tips = '';
    if (q.trick) tips += `<div class="tip trick">${icon('bulb')}<div><span class="label">Memory trick</span>${esc(q.trick)}</div></div>`;
    const guideTips = (sec.tips || []).filter((t) => t.kind !== 'note' || !q.trick).slice(0, q.trick ? 1 : 2);
    guideTips.forEach((t) => { tips += `<div class="tip guide">${icon('book')}<div><span class="label">From your guide<span class="src">${esc(t.label)}</span></span>${esc(t.text)}</div></div>`; });
    tips += `<div class="tip ati">${icon('target')}<div><span class="label">ATI test tip</span>${esc(q.tip || TYPE_INFO[q.type].tip)}</div></div>`;
    let others = '';
    if (q.type !== 'order' && q.opts.some((o) => o.w)) {
      others = `<details class="more"><summary>Why the other options are wrong</summary><ul class="why-list">${q.opts.filter((o) => !o.c && o.w).map((o) => `<li><b>${esc(o.t)}</b>${esc(o.w)}</li>`).join('')}</ul></details>`;
    }
    const hit = new Set((q.focus || []).filter((f) => f[0] === q.sec).map((f) => f[1]));
    const focus = sec.focus.length ? `<ul class="focus-list">${sec.focus.map((f, i) => `<li class="${hit.has(i) ? 'hit' : ''}">${esc(f)}</li>`).join('')}</ul>` : '<p class="dim">This section has no instructor focus points.</p>';
    const guide = `<details class="more" ${App.size === 'wide' ? '' : ''}><summary>Read the guide: ${esc(sec.num)} ${esc(sec.title)}</summary><p class="label" style="margin-top:6px">Instructor focus points</p>${focus}</details>`;
    const endLabel = run.isEnd() ? (run.mode === 'boss' ? (run.won ? 'Victory!' : 'See results') : 'See shift report') : 'Next patient';
    return `<div class="fb-head ${st}"><span class="ico">${icon(st === 'ok' ? 'check' : st === 'part' ? 'target' : 'x')}</span><h2>${title}</h2>${pts ? `<span class="pts num">${pts}</span>` : ''}</div>
      ${notes.length ? `<div class="fb-notes">${notes.map((n) => `<p>${n}</p>`).join('')}</div>` : ''}
      <div class="fb-answer"><span class="label">${ansLabel}</span>${answer}</div>
      <p class="fb-why">${esc(q.why)}</p>

  },

  // ----- lifecycle
  mount(el) {
    const run = App.run;
    if (!run) return;
    el.classList.add('mode-' + run.mode);
    const cv = $('#ecg', el);
    if (cv) {
      this.ecg = new ECG(cv, $('#hr', el), $('#monitor', el));

      this.ecg.beep = run.mode === 'codeblue';
    }
    if (run.mode === 'codeblue' && !this.timerOff) {
      this.timerOff = Loop.add((dt) => this.tickTimer(dt));
    }
    if (run.cur.revealed && run.cfg.feedback) { const f = $('#feedback', el); if (f) f.scrollTop = 0; }
  },
  leave() {
    Whimsy.clear();
    if (this.ecg) { this.ecg.destroy(); this.ecg = null; }
    if (this.timerOff && App.name !== 'chart') { this.timerOff(); this.timerOff = null; }
    clearTimeout(this.autoT);
  },
  tickTimer(dt) {
    const run = App.run;
    if (!run || run.mode !== 'codeblue' || run.over) { if (this.timerOff) { this.timerOff(); this.timerOff = null; } return; }
    if (document.getElementById('modal-root').firstChild) return; // paused while a dialog is open
    run.timeLeft = Math.max(0, run.timeLeft - dt);
    const bar = $('#timer-bar'), num = $('#timer-num');
    if (bar) bar.style.width = (run.timeLeft / 60) * 100 + '%';
    if (num) num.textContent = Math.ceil(run.timeLeft);
    if (this.ecg) this.ecg.stress = run.stress();
    if (run.timeLeft <= 0) {
      this.timerOff(); this.timerOff = null;
      run.finish();
      Sound.play('alarm');
      App.show('report');
    }
  },

  // partial refreshes keep the ECG and animations running
  refresh(parts) {
    const run = App.run, el = App.el;
    const set = (id, html) => { const n = $('#' + id, el); if (n) n.innerHTML = html; };
    if (parts.includes('paper')) set('paper', this.paperHTML(run));
    if (parts.includes('tray')) set('tray', this.trayHTML(run));
    if (parts.includes('prog')) set('prog', this.progHTML(run));
    if (parts.includes('score')) set('scorebar', this.scoreHTML(run));
    if (parts.includes('bed')) set('bed', patientInBed(run.cur.patient, this.ptMood(run)));
    if (parts.includes('talk')) {
      const t = $('#talk', el); if (t) { t.textContent = run.talk.text; t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); }
      const n = $('#nurse-row .nurse', el) || $('#arena-nurse', el); if (n) n.innerHTML = nurseSVG(WR.state.profile.avatar, run.talk.mood);
    }
    if (parts.includes('feedback')) {
      const f = $('#feedback', el);
      if (f) {
        const show = run.cur.revealed && run.cfg.feedback;
        f.hidden = !show;
        f.innerHTML = show ? this.feedbackHTML(run) : '';
        if (show) { f.scrollTop = 0; const b = $('[data-action="next"]', f); if (b && !('ontouchstart' in window)) b.focus({ preventScroll: true }); if (App.size === 'wide') f.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' }); }
      }
    }
  },
  say(kind, ctx) { const run = App.run; run.talk = { text: Talk.line(kind, ctx), mood: Talk.mood(kind) }; },

  afterSubmit(res) {
    const run = App.run, c = run.cur, q = run.q, el = App.el;
    if (this.ecg) this.ecg.stress = run.stress();
    if (run.mode === 'exam') {
      this.refresh(['paper', 'tray', 'prog']);
      this.autoT = setTimeout(() => this.advance(), 280);
      return;
    }
    const stem = $('#stem', el);
    const ptsTxt = c.pts.pts ? `+${c.pts.pts}${c.pts.mult > 1 ? ' ×' + c.pts.mult : ''}` : '';
    const prevLives = run.lives + (c.lostLife ? 1 : 0);
    if (res.correct) {
      Sound.play('right');
      FX.float(ptsTxt, stem, 'good');
      if ([3, 6, 10, 15, 20, 25].includes(run.streak)) this.say('streak', { streak: run.streak });
      else if (run.results.length > 1 && !run.results[run.results.length - 2].correct) this.say('back');
      else this.say('right', { trick: q.trick });
    } else if (res.frac > 0) {
      Sound.play('part');
      if (ptsTxt) FX.float(ptsTxt, stem, 'warn');
      this.say('part');
    } else {
      Sound.play('wrong');
      FX.shake($('#clipboard', el));
      FX.flash('bad');
      this.say(run.maxLives && run.lives === 1 ? 'low' : 'wrong');
    }
    if (run.mode === 'boss') this.bossFx(c);
    this.refresh(['paper', 'tray', 'prog', 'score', 'bed', 'talk']);
    Whimsy.react(run, res);
    if (c.lostLife) { const l = $('#lives', el); if (l) l.outerHTML = this.livesHTML(run, run.lives); }
    if (run.mode === 'codeblue') {
      const tm = $('#timer', el);
      if (tm) { const d = document.createElement('span'); d.className = 'timer-delta'; d.style.color = res.correct ? 'var(--good)' : 'var(--bad)'; d.textContent = res.correct ? '+3s' : '−5s'; tm.style.position = 'relative'; tm.appendChild(d); setTimeout(() => d.remove(), 1000); }
      this.autoT = setTimeout(() => this.advance(), res.correct ? 420 : 900);
      return;
    }
    this.refresh(['feedback']);
    celebrate(run);
    if (c.badges && c.badges.length) badgeToast(c.badges);
    void prevLives;
  },

  bossFx(c) {
    const run = App.run, el = App.el;
    const boss = $('#boss', el), nurse = $('#arena-nurse', el);
    if (c.dmg) {
      FX.projectile(nurse, boss).then(() => {
        Sound.play('hit');
        if (boss) { boss.innerHTML = bossSVG(run.phase, 'hurt'); boss.classList.remove('hit'); void boss.offsetWidth; boss.classList.add('hit'); }
        FX.float('−' + c.dmg, boss, 'bad');
        setTimeout(() => { if (boss && boss.isConnected) boss.innerHTML = bossSVG(run.phase); }, 700);
      });
    } else if (c.heal) {
      Sound.play('heal');
      if (boss) { boss.classList.remove('heal'); void boss.offsetWidth; boss.classList.add('heal'); }
      FX.float('+' + c.heal + ' HP', boss, 'good');
    }
    const hpN = $('#hp-num', el), hpB = $('#hp-bar', el);
    if (hpN) hpN.textContent = `${run.hp} / ${run.maxHp}`;
    if (hpB) hpB.style.width = (run.hp / run.maxHp) * 100 + '%';
    if (c.phaseUp && run.hp > 0) {
      const ar = $('#arena', el);
      if (ar) { const b = document.createElement('div'); b.className = 'phase-banner'; b.textContent = run.phase === 1 ? 'It mutated!' : 'Final form!'; ar.appendChild(b); setTimeout(() => b.remove(), 1900); }
      Sound.play('alarm');
      setTimeout(() => { this.say('bossPhase'); this.refresh(['talk']); }, 900);
    }
  },

  advance() {
    const run = App.run;
    clearTimeout(this.autoT);
    if (!run) return;
    if (run.isEnd() || run.over) {
      if (!run.over) run.finish();
      App.show('report');
      return;
    }
    if (!run.next()) { App.show('report'); return; }
    if (run.mode !== 'codeblue' && run.mode !== 'exam' && Math.random() < 0.25) this.say(run.mode === 'boss' ? 'boss' : 'start');
    App.rerender();
    Store.saveRun();
    const sec = App.el;
    if (sec && !reducedMotion()) { const cb = $('#clipboard', sec); if (cb) cb.animate([{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' }); }
    App.el.scrollTop = 0;
  },

  act: {
    pick(d) {
      const run = App.run;
      if (!run || run.cur.revealed) return;
      // every question type waits for Submit; tapping an option only selects it
      run.toggle(+d.i);
      Sound.play('tap');
      Screens.chart.refresh(['paper', 'tray']);
    },
    submit() {
      const run = App.run;
      if (!run || !run.ready()) return;
      const res = run.submit();
      Screens.chart.afterSubmit(res);
    },
    undo() {
      const run = App.run;
      run.cur.sel.pop();
      Screens.chart.refresh(['paper', 'tray']);
    },
    colleague() {
      const run = App.run;
      if (run.useColleague()) { Sound.play('colleague'); Screens.chart.refresh(['paper', 'tray']); }
    },
    coffee() {
      const run = App.run, el = App.el;
      if (run.useCoffee()) {
        Sound.play('coffee');
        FX.float('+1 life', $('#lives', el), 'good');
        const l = $('#lives', el); if (l) l.outerHTML = Screens.chart.livesHTML(run);
        if (Screens.chart.ecg) Screens.chart.ecg.stress = run.stress();
        Screens.chart.refresh(['tray']);
      }
    },
    next() { Screens.chart.advance(); },
    async quit() {
      const run = App.run;
      const msg = run.mode === 'exam' ? 'Your exam answers so far will not be scored.' : 'Answers you already gave are saved. This round will not count as a finished shift.';
      if (await App.confirm('Leave this round?', msg, 'Leave')) {
        if (run.mode === 'codeblue' || run.mode === 'boss') run.finish();
        App.run = null;
        App.show('floor');
      }
    },
  },

  key(e) {
    const run = App.run;
    if (!run || !run.cur || document.getElementById('modal-root').firstChild) return;
    const k = e.key.toUpperCase();
    if (k === 'ENTER') {
      if (run.cur.revealed && run.cfg.feedback) { e.preventDefault(); this.advance(); }
      else if (run.ready()) { e.preventDefault(); this.act.submit(); }
      return;
    }
    let pos = LETTERS.indexOf(k);
    if (pos === -1 && /^[1-6]$/.test(k)) pos = +k - 1;
    if (pos >= 0 && pos < run.cur.order.length && !run.cur.revealed) {
      e.preventDefault();
      const i = run.cur.order[pos];
      if (run.cur.gone.indexOf(i) === -1) this.act.pick({ i });
    }
  },
};

// ---------- end-of-round report ----------
function answerText(q, ans) {
  if (ans == null) return '—';
  if (q.type === 'order') return ans.map((i, k) => `${k + 1}. ${q.steps[i]}`).join('  ');
  if (q.type === 'sata') return ans.map((i) => q.opts[i].t).join('; ') || '—';
  return q.opts[ans] ? q.opts[ans].t : '—';
}
function correctText(q) {
  if (q.type === 'order') return q.steps.map((t, k) => `${k + 1}. ${t}`).join('  ');
  return q.opts.filter((o) => o.c).map((o) => o.t).join('; ');
}

function resultListHTML(run, onlyMissed) {
  const rows = run.results.filter((r) => !onlyMissed || !r.correct);
  if (!rows.length) return '';
  return `<ul class="result-list">${rows.map((r) => {
    const q = Content.byId[r.qid];
    const st = r.correct ? 'ok' : r.frac > 0 ? 'part' : 'bad';
    return `<li class="${st}"><details>
      <summary><span class="ri">${icon(r.correct ? 'check' : 'x')}</span><span class="rq">${esc(q.stem)}</span></summary>
      <div class="rbody">
        ${r.correct ? '' : `<p><span class="label">Your answer</span>${esc(answerText(q, r.ans))}</p>`}
        <p><span class="label">Correct</span>${esc(correctText(q))}</p>
        <p class="dim">${esc(q.why)}</p>
        ${q.trick ? `<p class="rtrick">${icon('bulb')}${esc(q.trick)}</p>` : ''}
      </div></details></li>`;
  }).join('')}</ul>`;
}

};

// ----- locker room
function unlockReq(key) { return UNLOCKS[key]; }
function isUnlocked(key) {
  const u = UNLOCKS[key];
  if (!u || WR.debug) return true;
  if (u.rank != null) return Engine.rankIndex() >= u.rank;
  if (u.badge) return !!WR.state.badges[u.badge];
  return true;
}
function reqText(key) {
  const u = UNLOCKS[key];
  if (!u) return '';
  if (u.rank != null) return `Reach ${RANKS[u.rank].n}`;
  const b = BADGES.find((x) => x.id === u.badge);
  return b ? `Earn "${b.n}"` : '';
}

// ----- report card
function weakFocus() {
  const agg = {};
  for (const q of Content.all()) {
    const r = WR.state.items[q.id];
    if (!r || !r.s || !q.focus || !q.focus.length) continue;
    for (const [sec, i] of q.focus) {
      const k = sec + '#' + i;
      const a = agg[k] || (agg[k] = { sec, i, s: 0, w: 0, qids: [] });
      a.s += r.s; a.w += r.w; a.qids.push(q.id);
    }
  }
  return Object.values(agg).filter((a) => a.w > 0).sort((a, b) => b.w / b.s - a.w / a.s || b.w - a.w).slice(0, 5);
}

    const badges = BADGES.map((b) => `<div class="badge ${s.badges[b.id] ? 'on' : ''}">${icon(s.badges[b.id] ? b.ico : 'lock')}<b>${esc(b.n)}</b><span>${esc(b.d)}</span></div>`).join('');

    return `${topbar('Report card', `${esc(rp.cur.n)} · ${fmt(s.xp)} XP · ${Object.keys(s.badges).length} of ${BADGES.length} badges`)}
      <div class="narrow stack">
        <div class="stat-grid">
          <div class="stat"><span class="label">New ATI-style questions</span><b class="num">${pctOf(s.originStats.new)}</b><span class="faint">your honest readiness score</span></div>
          <div class="stat"><span class="label">Guide questions</span><b class="num">${pctOf(s.originStats.guide)}</b><span class="faint">may include memorized ones</span></div>
          <div class="stat"><span class="label">Discharged</span><b class="num">${s.discharged}</b><span class="faint">missed, then fixed</span></div>
        </div>
        <div class="card"><span class="label">Weakest instructor focus points</span>${weakHTML}</div>
        <div class="card"><span class="label">Rooms <span class="legend"><i></i>right once <i class="solid"></i>mastered</span></span><div class="unit-bars">${units}</div></div>
        <div class="card"><span class="label">Accuracy by question type</span><div class="stat-grid">${types}</div></div>
        <div class="card"><span class="label">Badges</span><div class="badge-row">${badges}</div></div>
        <div class="card"><span class="label">Exam simulations</span>${exams}</div>
      </div>`;
  },
  act: {
    practiceWeak() {
      const ids = [...new Set(weakFocus().flatMap((a) => a.qids))];
      startReview(shuffle(ids).slice(0, 10), 'Weak focus points');
    },
  },
};

// ----- settings
Screens.settings = {
  render() {
    const st = WR.state.settings;
    const cloud = Store.cloud.status === 'cloud' ? 'Progress autosaves to your Claude account after every tap, even mid-round, so it follows you to any device.' : 'Progress autosaves in this browser after every tap, even mid-round. Download a backup now and then to be safe.';
    const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, n]) => `<button class="${String(st[key]) === String(v) ? 'on' : ''}" data-action="setting" data-key="${key}" data-val="${v}" aria-pressed="${String(st[key]) === String(v)}">${n}</button>`).join('')}</div>`;
    return `${topbar('Settings')}
      <div class="narrow stack">
        <div class="card set-row"><div><b>Sound</b><p class="dim">Chimes, buzzers, and the Code Blue alarm.</p></div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
        <div class="card set-row"><div><b>Motion</b><p class="dim">"Calm" turns off walking, shaking, and confetti.</p></div>${seg('motion', [['auto', 'Auto'], ['full', 'Full'], ['reduced', 'Calm']])}</div>
        <div class="card set-row"><div><b>Silly patients</b><p class="dim">How wild patients get on a hot streak (and when things go wrong).</p></div>${seg('whimsy', [['full', 'Full'], ['mild', 'Mild'], ['off', 'Off']])}</div>
        <div class="card set-row"><div><b>Text size</b></div>${seg('text', [[1, 'A'], [1.12, 'A+'], [1.25, 'A++']])}</div>
        <div class="card set-row"><div><b>Exam date</b><p class="dim">Powers the countdown and your daily target.</p></div>
          <input type="date" id="exam-date" value="${esc(st.examDate)}" aria-label="Exam date"></div>
        <div class="card set-row"><div><b>Daily target</b><p class="dim">Auto spreads what's left over the days before your exam.</p></div>${seg('dailyGoal', [[0, 'Auto'], [20, '20'], [40, '40'], [60, '60']])}</div>
        <div class="card"><b>Your progress</b><p class="dim">${cloud}</p>
          <div class="btn-row"><button class="btn" data-action="backup">${icon('download')}Download backup</button>
          <label class="btn file-btn">${icon('upload')}Restore from backup<input type="file" id="restore" accept=".json,application/json"></label>
          <button class="btn" data-action="tutorial">${icon('book')}Show tutorial</button>
          <button class="btn danger" data-action="reset">Reset progress</button></div></div>
        <p class="faint center">Ward Rounds · BIOL 2401 study guide edition · ${Content.all().length} patients</p>
      </div>`;
  },
  mount(el) {
    const d = $('#exam-date', el);
    if (d) d.addEventListener('change', () => { WR.state.settings.examDate = d.value; Store.save(); App.toast(d.value ? 'Exam date saved.' : 'Exam date cleared.'); });
    const f = $('#restore', el);
    if (f) f.addEventListener('change', () => {
      const file = f.files && f.files[0];
      if (!file) return;
      const rd = new FileReader();
      rd.onload = async () => {
        if (!(await App.confirm('Restore this backup?', 'It replaces your current progress on this device and in your account.', 'Restore'))) return;
        try { Store.importText(String(rd.result)); applySettings(); App.toast('Backup restored.'); App.rerender(); } catch (e) { App.toast(e.message || 'That file could not be read.'); }
      };
      rd.readAsText(file);
    });
  },
  act: {
    setting(d) {
      let v = d.val;
      if (v === 'true') v = true; else if (v === 'false') v = false; else if (!isNaN(+v) && d.key !== 'motion' && d.key !== 'whimsy') v = +v;
      WR.state.settings[d.key] = v;
      Store.save(); applySettings(); Sound.play('tap'); App.rerender();
    },
    async backup() {
      const text = Store.exportText();
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) {
        try { await dl.save({ filename: `ward-rounds-backup-${todayStr()}.json`, data: text }); App.toast('Backup saved.'); return; } catch (e) { if (e && e.code === 'declined') return; }
      }
      try { await navigator.clipboard.writeText(text); App.toast('Backup copied. Paste it into a note and save it as a .json file.'); }
      catch (e) { App.toast('Saving files is not available here.'); }
    },
    tutorial() { App.show('onboard', { step: 2 }); },
    async reset() {
      if (await App.confirm('Reset all progress?', 'XP, badges, stars, and missed patients will be erased. Your settings stay.', 'Erase everything', true)) {
        Store.reset(); App.toast('Progress reset.'); App.show('onboard', { step: 0 });
      }
    },
  },
};

function applySettings() {
  document.documentElement.style.setProperty('--text-scale', WR.state.settings.text || 1);
}

// ----- onboarding
const TUTORIAL = [
  { ico: 'bed', t: 'Each room is a ward', d: 'Rooms 101 to 112 match your 12 chapters. Tap a room and your nurse walks in. A shift is 10 patients, and every patient is one question on a chart.' },
  { ico: 'heart', t: 'Lives, streaks, lifelines', d: 'You get 3 lives per shift. Right answers in a row raise your score multiplier up to ×3. Stuck? Ask a colleague to cross out wrong options, or take a coffee break for +1 life.' },
  { ico: 'star', t: 'Learn from every miss', d: 'Every answer explains WHY, with memory tricks and ATI test tips. Missed patients come back until you get them right on 2 different days. That is how stars and real mastery are earned.' },
];

Screens.onboard = {
  cls: 'onboard-screen',
  render(p) {
    const step = p.step || 0, s = WR.state, av = s.profile.avatar;
    const dots = `<div class="ob-dots">${[0, 1, 2, 3, 4].map((i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>`;
    let body;
    if (step === 0) {
      body = `<div class="ob-hero">${nurseSVG(av, 'cheer')}</div>
        <span class="label">BIOL 2401 · Anatomy & Physiology I</span>
        <h1 tabindex="-1">Welcome to Ward Rounds</h1>
        <p class="dim">A hospital study game built from your final exam study guide: ${Content.all().length} patients across 12 rooms.</p>
        <label class="ob-name"><span class="label">What should your patients call you? (optional)</span>
          <input id="nurse-name" type="text" maxlength="18" autocomplete="nickname" value="${esc(s.profile.name)}" placeholder="Nurse name"></label>
        <button class="btn primary big block" data-action="ob" data-to="1">Next: make your nurse</button>`;
    } else if (step === 1) {
      const row = (key, list, isColor) => `<div class="ob-row">${list.map((x, i) => `<button class="swatch small ${av[key] === i ? 'on' : ''}" data-action="obset" data-key="${key}" data-val="${i}" aria-label="${esc(isColor ? (x.n || 'Tone ' + (i + 1)) : x)}">${isColor ? `<span class="dot" style="background:${x.c || x}"></span>` : `<span class="sw-ava">${nurseSVG(Object.assign({}, av, { [key]: i }), 'happy', { headOnly: true })}</span>`}</button>`).join('')}</div>`;
      body = `<div class="ob-hero">${nurseSVG(av, 'happy')}</div><h1 tabindex="-1">Make your nurse</h1>
        <span class="label">Skin</span>${row('skin', AVATAR.skin, true)}
        <span class="label">Hair</span>${row('hair', AVATAR.hair, false)}
        <span class="label">Scrubs</span>${row('scrubs', AVATAR.scrubs.slice(0, 6), true)}
        <p class="faint">More in the Locker room later, including unlockable patterns and extras.</p>
        <button class="btn primary big block" data-action="ob" data-to="2">Looks good!</button>`;
    } else if (step <= 4) {
      const t = TUTORIAL[step - 2];
      body = `<div class="ob-card">${icon(t.ico)}</div><h1 tabindex="-1">${esc(t.t)}</h1><p class="dim ob-text">${esc(t.d)}</p>
        <button class="btn primary big block" data-action="ob" data-to="${step + 1}">${step === 4 ? 'Start my first shift' : 'Next'}</button>
        ${step < 4 ? `<button class="btn ghost block" data-action="ob" data-to="5">Skip</button>` : ''}`;
    }
    return `<div class="onboard narrow">${body}${dots}</div>`;
  },
  mount(el) {
    const n = $('#nurse-name', el);
    if (n) n.addEventListener('input', () => { WR.state.profile.name = n.value.trim().slice(0, 18); });
  },
  act: {
    ob(d) {
      const to = +d.to;
      Sound.play('tap');
      if (to >= 5) {
        const first = !WR.state.profile.onboarded;
        WR.state.profile.onboarded = true; Store.save({ now: true });
        if (first) startShift('ch7'); else App.show('floor');
        return;
      }
      Store.save();
      App.show('onboard', { step: to });
    },
    obset(d) { WR.state.profile.avatar[d.key] = +d.val; Sound.play('tap'); App.rerender(); },
  },
};

/* ---- 90-boot.js ---- */
// ---------- boot ----------
function bindEvents() {
  const root = document.getElementById('app');
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b || !root.contains(b) || b.disabled) return;
    App.act(b.dataset.action, b.dataset, b, e);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (App.name === 'chart') Screens.chart.key(e);
    if (e.key === 'Escape') { const m = document.getElementById('modal-root'); if (m.firstChild) m.innerHTML = ''; }
  });
  const onResize = debounce(() => {
    const changed = App.measure();
    if (changed) App.rerender();
    else {
      if (App.name === 'chart' && Screens.chart.ecg) Screens.chart.ecg.resize();
      if (App.name === 'floor') Screens.floor.placeWalker(false);
    }
  }, 150);
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (App.run) Store.saveRun(); Store._local.flush(); Store._cloud.flush(); } });
  window.addEventListener('pagehide', () => { if (App.run) Store.saveRun(); Store._local.flush(); });
  ['pointerdown', 'keydown'].forEach((t) => window.addEventListener(t, () => Sound.unlock(), { once: true, passive: true }));
}

Object.assign(WR, { App, Engine, Content, Store, Screens, Whimsy, Run });

async function start(hot) {
  App.measure();
  try {
    await Content.load();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="boot"><p>${esc(e.message || 'Could not load the game.')}</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  Store.init();
  applySettings();
  WR.debug = location.hash === '#debug';
  bindEvents();
  Store.onChange(() => {
    applySettings();
    if (App.name === 'floor' || App.name === 'stats' || App.name === 'missed' || App.name === 'locker') App.rerender();
  });
  if (hot && hot.run && hot.screen) {
    try {
      App.run = Run.restore(hot.run);
      App.show(hot.screen === 'chart' && App.run.cur ? 'chart' : hot.screen === 'report' ? 'report' : 'floor');
      return;
    } catch (e) { App.run = null; }
  }
  if (!WR.state.profile.onboarded) { App.show('onboard', { step: 0 }); return; }
  const saved = WR.state.openRun;
  let run = null;
  try { run = saved && Run.resume(saved.run); } catch (e) { run = null; }
  if (!run) {
    if (WR.state.openRun) { WR.state.openRun = null; Store.save(); }
    App.show('floor');
    return;
  }
  Store.holdRun = true;
  App.show('floor');
  offerResume(run);
}

function offerResume(run) {
  const title = run.mode === 'shift' ? Content.unitLabel(run.unit) : run.mode === 'review' ? run.label || 'Missed patients' : MODE_TITLE[run.mode];
  const where = run.total ? `Patient ${run.idx + 1} of ${run.total}` : `Patient ${run.idx + 1}`;
  const extra = run.mode === 'codeblue' ? ` · ${Math.ceil(run.timeLeft)}s left` : run.maxLives ? ` · ${run.lives} of ${run.maxLives} lives` : '';
  App.modal(`<h2>Pick up where you left off?</h2>
    <p class="dim">Your round was autosaved: <b>${esc(title)}</b>, ${where}${extra}. Score ${fmt(run.score)}.</p>
    <div class="actions"><button class="btn" data-m="drop">Discard round</button><button class="btn primary" data-m="go" data-autofocus>Resume</button></div>`,
  (m) => {
    Store.holdRun = false;
    if (m === 'go') {
      App.run = run;
      if (run.mode === 'codeblue') Sound.play('alarm');
      App.show('chart', {}, 'zoom-in');
    } else {
      // answers already given stay saved; timed/boss rounds still count, as with Leave
      if (run.mode === 'codeblue' || run.mode === 'boss') run.finish();
      WR.state.openRun = null;
      Store.save({ now: true });
      App.toast('Round discarded. Answers you gave are still saved.');
    }
    return false;
  });
}

(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    try { hot.snapshot(() => ({ screen: App.name, run: App.run ? App.run.serialize() : null })); } catch (e) { /* optional */ }
  }
  const go = (data) => { start(data || {}); };
  if (hot && hot.ready) hot.ready(go); else go(hot && hot.data);
})();

})();
</script>
