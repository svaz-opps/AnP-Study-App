{"t":"It necessarily produces a full sodium spike.","c":false}],"why":"Hyperpolarization makes the inside more negative and generally reduces immediate firing likelihood under these conditions.","diff":2,"origin":"guide","src":"practice","trick":"HYPER-polarized = extra negative = farther from the firing line.","tip":"More negative than rest = hyperpolarization = less likely to fire. Toward zero = depolarization = more likely."},{"id":"G-F096","unit":"ch10","sec":"ch10-resting","focus":[],"type":"mcq","stem":"A pump maintains sodium and potassium gradients over repeated signaling. Which direction matches its typical ATP cycle?","opts":[{"t":"Two sodium outward and three potassium inward.","c":false},{"t":"Three sodium outward and two potassium inward.","c":true},{"t":"Three potassium outward and two sodium inward.","c":false},{"t":"Three sodium inward and two potassium outward.","c":false}],"why":"The sodium–potassium ATPase exports three Na+ and imports two K+ per ATP.","diff":2,"origin":"guide","src":"practice","trick":"Na+/K+ pump: \"3 Salty Out, 2 Potassium In\" (3 Na+ out, 2 K+ in).","tip":"Remember the ratio 3:2 and the directions: sodium leaves, potassium enters, one ATP per cycle."},{"id":"G-F097","unit":"ch10","sec":"ch10-impulse","focus":[],"type":"mcq","stem":"A strong stimulus produces more spikes per second but each spike remains similar in amplitude. What coding principle is demonstrated?","opts":[{"t":"Frequency coding with all-or-none action potentials.","c":true},{"t":"Loss of all refractory behavior at stronger stimuli.","c":false},{"t":"A decrease in spike frequency as the only intensity code.","c":false},{"t":"Continuous growth of each action potential's amplitude.","c":false}],"why":"Neural systems can encode intensity through firing rate and recruitment rather than increasing each spike's amplitude.","diff":2,"origin":"guide","src":"practice","trick":"Action potentials are like a light switch, not a dimmer: all-or-none. Stronger stimulus = flicks faster.","tip":"A stronger stimulus raises the firing frequency, not the size of each spike."},{"id":"G-F098","unit":"ch10","sec":"ch10-impulse","focus":[],"type":"mcq","stem":"A membrane is repolarizing after its spike peak. Which ion movement commonly contributes strongly?","opts":[{"t":"Sodium influx through rapidly opening channels.","c":false},{"t":"Calcium uptake into synaptic vesicles.","c":false},{"t":"Potassium leaving through voltage-gated channels.","c":true},{"t":"Chloride exit as the universal mechanism of all neuronal spikes.","c":false}],"why":"Delayed potassium conductance supports repolarization and can produce an after-hyperpolarization.","diff":2,"origin":"guide","src":"practice","trick":"Sodium rushes IN to rise; Potassium POURS out to fall.","tip":"Depolarization = Na+ in. Repolarization = K+ out. Overshoot past rest = hyperpolarization."},{"id":"G-F099","unit":"ch10","sec":"ch10-synapses","focus":[],"type":"mcq","stem":"A drug slows a transmitter's reuptake without changing release. Which synaptic change is plausible?","opts":[{"t":"Shorter transmitter availability because reuptake is slower.","c":false},{"t":"Complete elimination of postsynaptic receptor binding.","c":false},{"t":"A receptor-independent identical response in every target.","c":false},{"t":"A longer period of transmitter availability in the cleft.","c":true}],"why":"Reduced clearance can prolong transmitter action; the physiological result depends on transmitter and receptors.","diff":2,"origin":"guide","src":"practice","trick":"Block reuptake = leave the music on longer: the transmitter stays in the cleft.","tip":"This is how SSRIs work: blocking reuptake keeps serotonin acting longer."},{"id":"G-F100","unit":"ch10","sec":"ch10-synapses","focus":[],"type":"mcq","stem":"Several presynaptic neurons deliver signals to one postsynaptic neuron. Which wiring pattern is present?","opts":[{"t":"Saltatory propagation.","c":false},{"t":"Convergence.","c":true},{"t":"Divergence.","c":false},{"t":"Temporal summation by only one presynaptic input.","c":false}],"why":"Convergence combines information from multiple inputs onto a common target.","diff":2,"origin":"guide","src":"practice","trick":"CONvergence = many roads COming together into one town.","tip":"Convergence = many → one. Divergence = one → many."},{"id":"G-F101","unit":"ch11","sec":"ch11-protection","focus":[],"type":"mcq","stem":"A CSF pathway returns fluid from subarachnoid spaces toward a dural venous sinus through classical projections. What structures are involved?","opts":[{"t":"Cerebral aqueduct drainage directly into the stomach.","c":false},{"t":"Choroid plexus secretion alone.","c":false},{"t":"Arachnoid granulations.","c":true},{"t":"Ependymal production of new blood vessels.","c":false}],"why":"Arachnoid granulations participate in classical CSF venous drainage, with additional drainage routes also recognized.","diff":2,"origin":"guide","src":"practice","trick":"Arachnoid granulations = one-way drains that let CSF seep back into the venous sinus blood.","tip":"CSF path ends at the arachnoid granulations → dural venous sinus. Blocked drainage can cause hydrocephalus."},{"id":"G-F102","unit":"ch11","sec":"ch11-cord","focus":[],"type":"mcq","stem":"A central spinal region contains motor cell bodies rather than a long ascending white-matter bundle. Which feature fits?","opts":[{"t":"Dorsal white column.","c":false},{"t":"Lateral white column.","c":false},{"t":"Epidural adipose compartment.","c":false},{"t":"Ventral gray horn.","c":true}],"why":"Ventral horns contain somatic motor neuron cell bodies; columns are white-matter pathway regions.","diff":2,"origin":"guide","src":"practice","trick":"Ventral horn = motor \"Vroom\" neurons that send commands out. Dorsal horn = sensory input.","tip":"Gray horns hold cell bodies. White columns hold long tracts. Ventral = motor, dorsal = sensory."},{"id":"G-F103","unit":"ch11","sec":"ch11-cord","focus":[],"type":"mcq","stem":"A lower lumbar canal image shows nerve roots surrounding the filum below the spinal cord tip. Which name describes the root bundle?","opts":[{"t":"Cauda equina.","c":true},{"t":"Corpus callosum.","c":false},{"t":"Conus medullaris itself.","c":false},{"t":"Cervical enlargement.","c":false}],"why":"The cauda equina contains descending spinal roots below the conus medullaris.","diff":2,"origin":"guide","src":"practice","trick":"CAUDA EQUINA = horse's tail: loose nerve roots below where the cord ends (around L1–L2).","tip":"A lumbar puncture goes below L2 because only floating nerve roots (cauda equina) are there, not the cord."},{"id":"G-F104","unit":"ch11","sec":"ch11-reflex","focus":[],"type":"mcq","stem":"A reflex circuit includes an interneuron contained entirely within spinal gray matter. What role does it provide?","opts":[{"t":"Central integration between neural inputs and outputs.","c":true},{"t":"Conduction exclusively outside the CNS.","c":false},{"t":"Sensory transduction by the peripheral receptor.","c":false},{"t":"Contraction of the final skeletal effector.","c":false}],"why":"Interneurons process and relay signals in central circuits.","diff":2,"origin":"guide","src":"practice","trick":"Interneuron = the middleman connecting incoming sensory and outgoing motor neurons.","tip":"Interneurons live entirely in the CNS and integrate signals. Monosynaptic reflexes skip them."},{"id":"G-F105","unit":"ch11","sec":"ch11-cerebrum","focus":[],"type":"mcq","stem":"A visual cortical response is recorded after light reaches a retina. Which cerebral lobe contains the main primary visual region?","opts":[{"t":"Temporal.","c":false},{"t":"Occipital.","c":true},{"t":"Frontal.","c":false},{"t":"Parietal.","c":false}],"why":"Primary visual cortex lies in occipital cortex, distinct from retinal transduction and optic-nerve conduction.","diff":2,"origin":"guide","src":"practice","trick":"OCCIPITAL = the Optic lobe at the back of your head (\"eyes in the back of your head\").","tip":"Lobes: frontal (planning, motor), parietal (touch), temporal (hearing), occipital (vision)."},{"id":"G-F106","unit":"ch11","sec":"ch11-brainstem","focus":[],"type":"mcq","stem":"A brainstem section is continuous inferiorly with the spinal cord near the skull opening. Which region fits?","opts":[{"t":"Midbrain.","c":false},{"t":"Medulla oblongata.","c":true},{"t":"Thalamus.","c":false},{"t":"Pons as the region immediately continuous with the cord.","c":false}],"why":"The medulla connects the brainstem with spinal cord and contains critical autonomic circuits.","diff":2,"origin":"guide","src":"practice","trick":"MEDULLA = the Main line that connects brain to spinal cord and runs breathing and heart rate.","tip":"Brainstem order, top to bottom: midbrain → pons → medulla oblongata → spinal cord."},{"id":"G-F107","unit":"ch11","sec":"ch11-brainstem","focus":[],"type":"mcq","stem":"An instructor calls a diencephalic relay a gateway for much incoming sensory information. Which region is intended?","opts":[{"t":"Hypothalamus.","c":false},{"t":"Thalamus.","c":true},{"t":"Cerebellum.","c":false},{"t":"Basal nuclei as the universal primary sensory relay.","c":false}],"why":"The thalamus relays/processes much cortical sensory input; olfaction has a distinctive initial route.","diff":2,"origin":"guide","src":"practice","trick":"THALAMUS = the Train station: most sensory trains stop here before going to the cortex.","tip":"Thalamus relays sensation (except smell). Hypothalamus runs homeostasis (temperature, hunger, hormones)."},{"id":"G-F108","unit":"ch11","sec":"ch11-cranial","focus":[],"type":"mcq","stem":"A patient scenario centers on impaired lateral eye movement from loss of lateral rectus innervation. Which cranial nerve should a learner identify?","opts":[{"t":"Abducens VI.","c":true},{"t":"Oculomotor III.","c":false},{"t":"Optic II.","c":false},{"t":"Trochlear IV.","c":false}],"why":"The abducens nerve supplies lateral rectus; other eye muscles receive III or IV.","diff":2,"origin":"guide","src":"practice","trick":"LR6 SO4, the rest are 3: Lateral Rectus = CN VI (abducens ABducts the eye).","tip":"Can't look outward to one side? Think abducens nerve (VI)."},{"id":"G-F109","unit":"ch11","sec":"ch11-autonomic","focus":[],"type":"mcq","stem":"A craniosacral pathway uses a long preganglionic axon and a ganglion near its target. Which division fits?","opts":[{"t":"Sympathetic thoracolumbar output.","c":false},{"t":"A sensory afferent pathway entering a dorsal root.","c":false},{"t":"Direct somatic motor output without an autonomic ganglion.","c":false},{"t":"Parasympathetic.","c":true}],"why":"Parasympathetic ganglia lie near/in targets, supporting the typical long preganglionic, short postganglionic pattern.","diff":2,"origin":"guide","src":"practice","trick":"PARAsympathetic = CRANIOsacral, ganglia right next to the organ (long first neuron, short second).","tip":"Sympathetic = thoracolumbar, ganglia near the spinal cord. Parasympathetic = craniosacral, ganglia near the target."},{"id":"G-F110","unit":"ch11","sec":"ch11-receptors","focus":[],"type":"mcq","stem":"Both divisions of an autonomic system use the same transmitter at their ganglionic synapses. Which receptor/transmitter pairing fits?","opts":[{"t":"Epinephrine at all parasympathetic ganglia.","c":false},{"t":"Acetylcholine at muscarinic ganglionic receptors.","c":false},{"t":"Acetylcholine at nicotinic receptors.","c":true},{"t":"Norepinephrine at nicotinic ganglionic receptors.","c":false}],"why":"Autonomic preganglionic neurons release acetylcholine onto nicotinic ganglionic receptors.","diff":2,"origin":"guide","src":"practice","trick":"At every autonomic ganglion, ACh hits Nicotinic receptors: \"Ganglia go Nic.\"","tip":"Both divisions use ACh on nicotinic receptors at the ganglion. They differ at the target organ."},{"id":"G-F111","unit":"ch12","sec":"ch12-receptors","focus":[],"type":"mcq","stem":"A sustained harmless pressure becomes less noticeable over time while a new pressure change is easily detected. Which principle helps explain this?","opts":[{"t":"A permanent loss of all receptors after any stimulus.","c":false},{"t":"A gradual reduction of each axonal action potential's amplitude.","c":false},{"t":"Sensory adaptation and emphasis on change.","c":true},{"t":"A requirement that every sensory signal stay equally intense forever.","c":false}],"why":"Adaptation can reduce responses to sustained stimuli while preserving sensitivity to change.","diff":2,"origin":"guide","src":"practice","trick":"Sensory adaptation = you stop feeling your socks, but you'd notice a pebble right away.","tip":"Receptors respond most to change. A steady harmless stimulus fades; a new one gets noticed."},{"id":"G-F112","unit":"ch12","sec":"ch12-somatic","focus":[],"type":"mcq","stem":"A receptor in a muscle-tendon junction responds strongly to tension rather than muscle length alone. Which receptor fits?","opts":[{"t":"Pacinian corpuscle.","c":false},{"t":"Golgi tendon organ.","c":true},{"t":"Tactile/Meissner corpuscle.","c":false},{"t":"Muscle spindle.","c":false}],"why":"Golgi tendon organs monitor tension; muscle spindles emphasize length and stretch.","diff":2,"origin":"guide","src":"practice","trick":"Golgi TENDON organ = senses TENSION (both start with T). Muscle spindle = senses stretch/length.","tip":"Tension at the tendon = Golgi tendon organ. Length or stretch in the muscle belly = muscle spindle."},{"id":"G-F113","unit":"ch12","sec":"ch12-somatic","focus":[],"type":"mcq","stem":"A visceral problem is experienced as discomfort at a separate body-surface location. Which explanation is consistent with referred pain?","opts":[{"t":"Visceral sensory signals never enter central processing circuits.","c":false},{"t":"Each visceral pain fiber must terminate directly in the skin.","c":false},{"t":"The pain location always exactly identifies the damaged tissue.","c":false},{"t":"Converging pathways can lead central circuits to attribute signals to a somatic region.","c":true}],"why":"Shared central processing of visceral and somatic input contributes to referred pain.","diff":2,"origin":"guide","src":"practice","trick":"Referred pain = crossed phone lines: the brain blames the skin for the organ's call (heart attack → left arm).","tip":"Visceral and skin nerves share spinal pathways, so the brain mislabels where pain comes from."},{"id":"G-F114","unit":"ch12","sec":"ch12-chemical","focus":[],"type":"mcq","stem":"A person detects basic tastes but food seems less flavorful after loss of smell. Which interpretation fits?","opts":[{"t":"Olfactory signals must travel through the optic nerve.","c":false},{"t":"Flavor normally integrates olfaction with taste and other senses.","c":true},{"t":"Flavor depends only on taste buds and never on smell.","c":false},{"t":"Each basic taste is confined to one exclusive tongue zone.","c":false}],"why":"Olfactory input contributes substantially to flavor even when gustatory receptors remain functional.","diff":2,"origin":"guide","src":"practice","trick":"Flavor = taste + smell. Hold your nose and an apple tastes like a potato.","tip":"Most \"taste\" complaints after a cold are really loss of smell. Taste buds can still sense sweet, salty, sour, bitter, umami."},{"id":"G-F115","unit":"ch12","sec":"ch12-chemical","focus":[],"type":"mcq","stem":"An anterior tongue taste signal is contrasted with touch from the same region. Which distinction is appropriate?","opts":[{"t":"Taste commonly travels through VII, while much somatic input travels through V.","c":true},{"t":"Anterior tongue taste uses only vagus X and no facial pathway.","c":false},{"t":"Taste uses XII motor axons while touch uses optic II.","c":false},{"t":"Taste and touch from the region both use only VII.","c":false}],"why":"Cranial nerves have different modalities; trigeminal somatic sensation differs from facial gustatory input.","diff":2,"origin":"guide","src":"practice","trick":"Front of tongue: Facial (VII) = Flavor (taste); Trigeminal (V) = Touch.","tip":"Same body part, different senses, different nerves. Match the type of sensation to the cranial nerve."},{"id":"G-F116","unit":"ch12","sec":"ch12-ear","focus":[],"type":"mcq","stem":"A middle-ear tube opens to help equalize pressure on the tympanic membrane. What region does it connect with the middle ear?","opts":[{"t":"Nasopharynx.","c":true},{"t":"Subarachnoid space around the brainstem.","c":false},{"t":"External auditory canal directly through the stapes.","c":false},{"t":"Cochlear duct.","c":false}],"why":"The auditory tube connects middle ear to nasopharynx, not directly to inner-ear endolymph.","diff":2,"origin":"guide","src":"practice","trick":"Eustachian (auditory) tube = the ear's pressure valve to the back of the nose (nasopharynx). Pops when you yawn.","tip":"This tube explains why throat infections spread to the middle ear, especially in kids with short, flat tubes."},{"id":"G-F117","unit":"ch12","sec":"ch12-hearing","focus":[],"type":"mcq","stem":"Basilar membrane motion bends sensory projections and changes transmitter release onto a cranial nerve fiber. What transduction is occurring?","opts":[{"t":"Light-to-neural signaling by retinal cones.","c":false},{"t":"Chemical-to-neural signaling by taste receptor cells.","c":false},{"t":"Pressure equalization through the auditory tube without receptor activation.","c":false},{"t":"Mechanical-to-neural signaling by cochlear hair cells.","c":true}],"why":"Hair-cell mechanotransduction converts cochlear mechanical motion into signaling to auditory fibers.","diff":2,"origin":"guide","src":"practice","trick":"Hair cells = tiny microphones that turn wiggles into nerve signals.","tip":"Transduction in hearing happens at cochlear hair cells, which signal CN VIII (vestibulocochlear)."},{"id":"G-F118","unit":"ch12","sec":"ch12-balance","focus":[],"type":"mcq","stem":"A head begins rotating and fluid motion deflects a cupula in an ampulla. Which sensory structure is responding?","opts":[{"t":"Macula of the saccule.","c":false},{"t":"Macula of the utricle.","c":false},{"t":"Spiral organ (of Corti).","c":false},{"t":"Crista ampullaris.","c":true}],"why":"Semicircular duct cristae detect angular acceleration through cupular displacement.","diff":2,"origin":"guide","src":"practice","trick":"Semicircular canals = spinning (\"circles for circling\"); the cupula sways like seaweed in the fluid.","tip":"Rotation = cristae in the semicircular ducts. Tilt or straight-line motion = maculae in the utricle and saccule."},{"id":"G-F119","unit":"ch12","sec":"ch12-eye","focus":[],"type":"mcq","stem":"A label points to fluid between the iris and lens. Which identification is precise?","opts":[{"t":"Aqueous humor in the anterior chamber in front of the iris.","c":false},{"t":"Vitreous humor in the posterior cavity.","c":false},{"t":"Perilymph in the vestibular labyrinth.","c":false},{"t":"Aqueous humor in the posterior chamber.","c":true}],"why":"The posterior chamber is the small aqueous space behind iris and in front of lens, distinct from the large vitreous cavity.","diff":2,"origin":"guide","src":"practice","trick":"Aqueous = watery front fluid. POSTERIOR chamber = the tiny gap behind the iris but in front of the lens.","tip":"Aqueous humor fills both the anterior and posterior chambers. Vitreous humor fills the big space behind the lens."},{"id":"G-F120","unit":"ch12","sec":"ch12-vision","focus":[],"type":"mcq","stem":"A near object is brought into focus after a distant one. Which coordinated change is expected?","opts":[{"t":"Ciliary relaxation with reduced zonular tension and a rounder lens.","c":false},{"t":"Ciliary contraction, less zonular tension, and a rounder lens.","c":true},{"t":"Ciliary contraction with greater zonular tension and a flatter lens.","c":false},{"t":"Ciliary relaxation, greater zonular tension, and a flatter lens.","c":false}],"why":"Near accommodation relaxes zonular pull through ciliary contraction, allowing a more convex lens.","diff":2,"origin":"guide","src":"practice","trick":"Near vision: ciliary muscle Contracts → zonules go slack → lens gets Chubby (round).","tip":"Near focus = rounder lens. Far focus = ciliary muscle relaxes, zonules pull tight, lens flattens."},{"id":"C-ch1-organization","unit":"ch1","sec":"ch1-organization","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Study of body structure.\" Which term fits?","opts":[{"t":"RUQ","c":false},{"t":"Digital","c":false},{"t":"Proximal","c":false},{"t":"Anatomy","c":true}],"why":"Anatomy: Study of body structure. Connect a specific structural feature to its functional advantage. Trace the hierarchy in order; an organ contains multiple tissue types.","diff":2,"origin":"guide","src":"check","trick":"ANATOMY = \"cutting up\" (-tomy = cut, as in tracheotomy): what the body looks like inside. PHYSIOLOGY = how it works.","tip":"Structure vs function: anatomy answers \"what and where\", physiology answers \"how and why\"."},{"id":"C-ch1-life","unit":"ch1","sec":"ch1-life","focus":[],"type":"mcq","stem":"A learner describes this concept: \"All chemical reactions in an organism.\" Which term fits?","opts":[{"t":"Responsiveness","c":false},{"t":"Distal","c":false},{"t":"Retroperitoneal","c":false},{"t":"Metabolism","c":true}],"why":"Metabolism: All chemical reactions in an organism. Distinguish digestion, absorption, assimilation, and excretion. Match nutrients, oxygen, water, heat, and pressure to their contributions.","diff":2,"origin":"guide","src":"check","trick":"METABOLISM comes from the Greek word for change: every chemical change in the body counts.","tip":"\"All chemical reactions\" is the broadest term. Anabolism builds and catabolism breaks down; together they make metabolism."},{"id":"C-ch1-homeostasis","unit":"ch1","sec":"ch1-homeostasis","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Dynamic maintenance of internal conditions within regulated ranges.\" Which term fits?","opts":[{"t":"LUQ","c":false},{"t":"Homeostasis","c":true},{"t":"Mediastinum","c":false},{"t":"Sagittal plane","c":false}],"why":"Homeostasis: Dynamic maintenance of internal conditions within regulated ranges. Negative feedback opposes a deviation; positive feedback amplifies a process. Trace temperature regulation through receptor, control center, and effectors.","diff":2,"origin":"guide","src":"check","trick":"HOMEO = same, STASIS = standing. \"Staying about the same\" by constant adjusting.","tip":"The key word is \"dynamic\". Homeostasis keeps values in a range through constant small corrections."},{"id":"C-ch1-cavities","unit":"ch1","sec":"ch1-cavities","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Relating to a cavity wall.\" Which term fits?","opts":[{"t":"RUQ","c":false},{"t":"Hypogastric","c":false},{"t":"Digital","c":false},{"t":"Parietal","c":true}],"why":"Parietal: Relating to a cavity wall. Distinguish organ location from the potential space between serous layers. Visceral covers an organ; parietal lines a wall.","diff":2,"origin":"guide","src":"check","trick":"PARIETAL = the PARTITION (wall). VISCERAL = the VISCERA (organs).","tip":"Serous membranes always come in pairs: parietal on the wall, visceral on the organ, fluid between them."},{"id":"C-ch1-systems","unit":"ch1","sec":"ch1-systems","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Organs working together to carry out related functions.\" Which term fits?","opts":[{"t":"Proximal","c":false},{"t":"Epigastric","c":false},{"t":"Contralateral","c":false},{"t":"Organ system","c":true}],"why":"Organ system: Organs working together to carry out related functions. Associate each system with organs and a specific function. Bone marrow forms blood cells; kidneys regulate blood composition and produce urine.","diff":2,"origin":"guide","src":"check","trick":"Cell → tissue → organ → SYSTEM: like player → team → league.","tip":"If several organs share one job (e.g., digestion), the answer is an organ system."},{"id":"C-ch1-directions","unit":"ch1","sec":"ch1-directions","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Standard upright reference posture with palms facing forward.\" Which term fits?","opts":[{"t":"Anatomical position","c":true},{"t":"Transverse plane","c":false},{"t":"Proximal","c":false},{"t":"Hypogastric","c":false}],"why":"Anatomical position: Standard upright reference posture with palms facing forward. Apply directional terms from the subject’s anatomical position. Proximal/distal refer to attachment, whereas medial/lateral refer to the midline.","diff":2,"origin":"guide","src":"check","trick":"Anatomical position: stand tall, look ahead, palms out like you're asking for a hug.","tip":"Always describe the body from the patient's anatomical position, even if they are lying down."},{"id":"C-ch1-planes","unit":"ch1","sec":"ch1-planes","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Plane dividing right and left portions.\" Which term fits?","opts":[{"t":"Sagittal plane","c":true},{"t":"RUQ","c":false},{"t":"Epigastric","c":false},{"t":"Coronal plane","c":false}],"why":"Sagittal plane: Plane dividing right and left portions. Sagittal: right/left; coronal: front/back; transverse: upper/lower. Distinguish patellar from popliteal and brachial from antebrachial.","diff":2,"origin":"guide","src":"check","trick":"SAGITTAL splits you like an arrow (sagitta) shot straight through: left and right.","tip":"Sagittal = left/right, frontal (coronal) = front/back, transverse = top/bottom. Picture the cut before choosing."},{"id":"C-ch1-regions","unit":"ch1","sec":"ch1-regions","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Upper middle abdominal region.\" Which term fits?","opts":[{"t":"RUQ","c":false},{"t":"Epigastric","c":true},{"t":"Hypogastric","c":false},{"t":"LUQ","c":false}],"why":"Epigastric: Upper middle abdominal region. Locate all nine regions and four quadrants using the subject’s right/left. Epigastric is superior to umbilical; hypogastric is inferior to it.","diff":2,"origin":"guide","src":"check","trick":"EPI = upon, GASTR = stomach. The epigastric region sits over the stomach, right under the ribs in the middle.","tip":"Use the patient's right and left for regions. Epigastric (top), umbilical (middle), hypogastric (bottom) run down the center."},{"id":"C-ch2-atoms","unit":"ch2","sec":"ch2-atoms","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Smallest unit retaining an element’s chemical identity.\" Which term fits?","opts":[{"t":"Ion","c":false},{"t":"pH","c":false},{"t":"Isotope","c":false},{"t":"Atom","c":true}],"why":"Atom: Smallest unit retaining an element’s chemical identity. Calculate protons, neutrons, and electrons separately. Distinguish isotope, ion, mass number, and average atomic mass.","diff":2,"origin":"guide","src":"check","trick":"ATOM = a-TOM (Greek: uncuttable). Smallest piece that still IS that element.","tip":"Atom = keeps an element's identity. Molecule = two or more atoms bonded. Ion = an atom with a charge."},{"id":"C-ch2-bonds","unit":"ch2","sec":"ch2-bonds","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Positively charged ion.\" Which term fits?","opts":[{"t":"DNA","c":false},{"t":"Cation","c":true},{"t":"Solvent","c":false},{"t":"Bicarbonate","c":false}],"why":"Cation: Positively charged ion. Electron transfer produces ions; sharing produces covalent bonds. Distinguish bonds within water from hydrogen bonds between water molecules.","diff":2,"origin":"guide","src":"check","trick":"CATions are PAWsitive (cats have paws). ANions are A Negative ION.","tip":"A positive ion has lost electrons. Na+, K+, Ca2+ are common body cations."},{"id":"C-ch2-reactions","unit":"ch2","sec":"ch2-reactions","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Energy-requiring synthesis of larger molecules.\" Which term fits?","opts":[{"t":"Steroid","c":false},{"t":"pH","c":false},{"t":"Triglyceride","c":false},{"t":"Anabolism","c":true}],"why":"Anabolism: Energy-requiring synthesis of larger molecules. Recognize synthesis, decomposition, exchange, and reversible equations. Hydrolysis consumes water; dehydration synthesis releases water.","diff":2,"origin":"guide","src":"check","trick":"ANAbolism = ADD on and build. CATAbolism = CUT apart.","tip":"Building big molecules costs energy (anabolism). Breaking them down releases energy (catabolism)."},{"id":"C-ch2-water","unit":"ch2","sec":"ch2-water","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Interacting readily with water.\" Which term fits?","opts":[{"t":"Monosaccharide","c":false},{"t":"ATP","c":false},{"t":"Hydrophilic","c":true},{"t":"Triglyceride","c":false}],"why":"Hydrophilic: Interacting readily with water. Explain water’s solvent, transport, reaction, and thermal roles. A dissolved substance conducts current only when mobile charged particles are available.","diff":2,"origin":"guide","src":"check","trick":"HYDRO-PHILIC = water-LOVING (like \"philosophy\" = love of wisdom).","tip":"Hydrophilic = polar or charged, mixes with water. Hydrophobic = nonpolar, avoids water (like fats)."},{"id":"C-ch2-ph","unit":"ch2","sec":"ch2-ph","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Logarithmic measure related to hydrogen ion activity.\" Which term fits?","opts":[{"t":"Buffer","c":false},{"t":"Bicarbonate","c":false},{"t":"Phospholipid","c":false},{"t":"pH","c":true}],"why":"pH: Logarithmic measure related to hydrogen ion activity. A one-unit pH decrease means roughly ten times more hydrogen ions. Buffers resist change; they do not amplify pH disturbances.","diff":2,"origin":"guide","src":"check","trick":"Lower pH = more H+ = more acid. Each step down is 10× more acidic.","tip":"pH runs backward: as H+ goes up, the pH number goes down. Normal blood pH is 7.35–7.45."},{"id":"C-ch2-carbohydrates","unit":"ch2","sec":"ch2-carbohydrates","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Single sugar unit.\" Which term fits?","opts":[{"t":"Triglyceride","c":false},{"t":"Denaturation","c":false},{"t":"Monosaccharide","c":true},{"t":"DNA","c":false}],"why":"Monosaccharide: Single sugar unit. Distinguish monosaccharides, disaccharides, and polysaccharides with examples. Starch is plant storage; glycogen is animal storage.","diff":2,"origin":"guide","src":"check","trick":"MONO = one sugar. DI = two. POLY = many (a chain like starch).","tip":"Glucose, fructose and galactose are monosaccharides; sucrose and lactose are disaccharides."},{"id":"C-ch2-lipids","unit":"ch2","sec":"ch2-lipids","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Glycerol joined to three fatty acids.\" Which term fits?","opts":[{"t":"ATP","c":false},{"t":"Denaturation","c":false},{"t":"RNA","c":false},{"t":"Triglyceride","c":true}],"why":"Triglyceride: Glycerol joined to three fatty acids. Compare triglyceride, phospholipid, and steroid structure with function. Unsaturation means carbon–carbon double bonds.","diff":2,"origin":"guide","src":"check","trick":"TRI-glyceride = 3 fatty-acid tails on one glycerol, like a 3-pronged fork.","tip":"Triglyceride = energy storage. Phospholipid = 2 tails + phosphate head (membranes). Steroid = rings."},{"id":"C-ch2-proteins","unit":"ch2","sec":"ch2-proteins","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Covalent linkage joining amino acids.\" Which term fits?","opts":[{"t":"DNA","c":false},{"t":"ATP","c":false},{"t":"Peptide bond","c":true},{"t":"ADP","c":false}],"why":"Peptide bond: Covalent linkage joining amino acids. Explain primary through quaternary structure without assuming every protein has all four. Denaturation changes conformation and can impair function.","diff":2,"origin":"guide","src":"check","trick":"PEPTIDE bond = the PEPper-glue between amino acids in a chain.","tip":"Peptide bonds are covalent and hold the primary sequence. Folding is held mostly by weaker bonds like hydrogen bonds."},{"id":"C-ch2-nucleic","unit":"ch2","sec":"ch2-nucleic","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Deoxyribonucleic acid, the principal inherited information molecule.\" Which term fits?","opts":[{"t":"ATP","c":false},{"t":"RNA","c":false},{"t":"DNA","c":true},{"t":"Nucleotide","c":false}],"why":"DNA: Deoxyribonucleic acid, the principal inherited information molecule. DNA: deoxyribose and thymine; RNA: ribose and uracil. Hydrogen bonds connect complementary DNA bases; covalent bonds form the backbone.","diff":2,"origin":"guide","src":"check","trick":"DNA = Deoxyribose, double helix, has Thymine. RNA = Ribose, single strand, has Uracil.","tip":"If the stem says inherited information, pick DNA. RNA carries copies of instructions to make proteins."},{"id":"C-ch3-membrane","unit":"ch3","sec":"ch3-membrane","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Selectively permeable phospholipid/protein boundary of a cell.\" Which term fits?","opts":[{"t":"Plasma membrane","c":true},{"t":"Cytokinesis","c":false},{"t":"Exocytosis","c":false},{"t":"Transcytosis","c":false}],"why":"Plasma membrane: Selectively permeable phospholipid/protein boundary of a cell. Relate selective permeability to solute size, charge, polarity, and transport proteins. Tight junctions seal, desmosomes anchor, gap junctions communicate.","diff":2,"origin":"guide","src":"check","trick":"The plasma membrane is a bouncer: it picks who gets in (selectively permeable).","tip":"\"Selectively permeable\" is the key phrase for the plasma membrane. It is made of phospholipids and proteins."},{"id":"C-ch3-organelles","unit":"ch3","sec":"ch3-organelles","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Specialized intracellular structure with a particular function.\" Which term fits?","opts":[{"t":"Phagocytosis","c":false},{"t":"Organelle","c":true},{"t":"Active transport","c":false},{"t":"Chromatin","c":false}],"why":"Organelle: Specialized intracellular structure with a particular function. Trace a secreted protein from ribosome through ER, Golgi, and vesicles. Distinguish lysosomal digestion, peroxisomal oxidation, and mitochondrial ATP production.","diff":2,"origin":"guide","src":"check","trick":"ORGAN-elle = a tiny organ inside the cell.","tip":"Each organelle has one main job. Know them: ribosome makes protein, mitochondria make ATP, Golgi packages."},{"id":"C-ch3-nucleus","unit":"ch3","sec":"ch3-nucleus","focus":[],"type":"mcq","stem":"A learner describes this concept: \"DNA with associated proteins in the nucleus.\" Which term fits?","opts":[{"t":"Chromatin","c":true},{"t":"Cytokinesis","c":false},{"t":"Differentiation","c":false},{"t":"Apoptosis","c":false}],"why":"Chromatin: DNA with associated proteins in the nucleus. Nuclear pores regulate exchange; the nucleolus assembles ribosomal subunits. Microvilli increase area, cilia move surface material, a sperm flagellum propels the cell.","diff":2,"origin":"guide","src":"check","trick":"CHROMATIN = loose spaghetti DNA; it coils into chromosomes only for division.","tip":"Chromatin = DNA + proteins, spread out between divisions. Chromosomes = condensed chromatin during mitosis."},{"id":"C-ch3-diffusion","unit":"ch3","sec":"ch3-diffusion","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Net movement down a concentration gradient by molecular motion.\" Which term fits?","opts":[{"t":"Diffusion","c":true},{"t":"Filtration","c":false},{"t":"Isotonic","c":false},{"t":"Osmosis","c":false}],"why":"Diffusion: Net movement down a concentration gradient by molecular motion. Diffusion follows a concentration gradient; filtration follows a pressure gradient. Facilitated diffusion uses proteins but remains passive.","diff":2,"origin":"guide","src":"check","trick":"Diffusion = a drop of food coloring spreading in water: high to low, no energy needed.","tip":"Down the gradient = passive (no ATP). Against the gradient = active (needs energy)."},{"id":"C-ch3-osmosis","unit":"ch3","sec":"ch3-osmosis","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Net movement of water across a selectively permeable membrane due to effective solute differences.\" Which term fits?","opts":[{"t":"Hypotonic","c":false},{"t":"Differentiation","c":false},{"t":"Tonicity","c":false},{"t":"Osmosis","c":true}],"why":"Osmosis: Net movement of water across a selectively permeable membrane due to effective solute differences. Hypertonic shrinks cells; hypotonic swells cells; isotonic preserves volume. Tonicity depends on effective, relatively nonpenetrating solutes.","diff":2,"origin":"guide","src":"check","trick":"Osmosis = water chasing solute (like salt) across a membrane.","tip":"Osmosis is only about WATER moving. If a solute moves, it is diffusion or transport instead."},{"id":"C-ch3-active","unit":"ch3","sec":"ch3-active","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Energy-dependent movement against an electrochemical gradient.\" Which term fits?","opts":[{"t":"Active transport","c":true},{"t":"Cytokinesis","c":false},{"t":"Transcytosis","c":false},{"t":"Differentiation","c":false}],"why":"Active transport: Energy-dependent movement against an electrochemical gradient. The sodium–potassium pump uses ATP and maintains ion gradients. Distinguish phagocytosis, pinocytosis, receptor-mediated uptake, exocytosis, and transcytosis.","diff":2,"origin":"guide","src":"check","trick":"Active transport = pushing a cart uphill: it needs fuel (ATP).","tip":"\"Against the gradient\" means active transport. The Na+/K+ pump moves 3 Na+ out and 2 K+ in using ATP."},{"id":"C-ch3-cycle","unit":"ch3","sec":"ch3-cycle","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Cell-cycle interval including G1, DNA-synthesis S phase, and G2.\" Which term fits?","opts":[{"t":"Differentiation","c":false},{"t":"Interphase","c":true},{"t":"Cytokinesis","c":false},{"t":"Sister chromatids","c":false}],"why":"Interphase: Cell-cycle interval including G1, DNA-synthesis S phase, and G2. DNA replication occurs in S phase; sister chromatids separate in anaphase. Mitosis divides nuclear material; cytokinesis divides cytoplasm.","diff":2,"origin":"guide","src":"check","trick":"INTERphase = the cell's \"in-between\" prep time: Grow (G1), Synthesize DNA (S), Get ready (G2).","tip":"DNA copies during the S phase of interphase, not during mitosis."},{"id":"C-ch3-differentiation","unit":"ch3","sec":"ch3-differentiation","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Cell capable of self-renewal and production of differentiated descendants.\" Which term fits?","opts":[{"t":"Stem cell","c":true},{"t":"Metastasis","c":false},{"t":"Differentiation","c":false},{"t":"Apoptosis","c":false}],"why":"Stem cell: Cell capable of self-renewal and production of differentiated descendants. Different gene expression drives much cellular specialization. Distinguish self-renewal, differentiation, benign growth, invasion, and metastasis.","diff":2,"origin":"guide","src":"check","trick":"Stem cell = a blank tree trunk that can grow any branch AND keep the trunk.","tip":"Two features define a stem cell: it renews itself and it can make specialized cells."},{"id":"C-ch4-enzymes","unit":"ch4","sec":"ch4-enzymes","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Reactant acted on by an enzyme.\" Which term fits?","opts":[{"t":"Acetyl-CoA","c":false},{"t":"Glycogenesis","c":false},{"t":"Substrate","c":true},{"t":"Coenzyme","c":false}],"why":"Substrate: Reactant acted on by an enzyme. Explain active site specificity, cofactors/coenzymes, and feedback inhibition. Enzymes lower activation energy and are reused.","diff":2,"origin":"guide","src":"check","trick":"SUBSTRATE = the SUBJECT the enzyme works on. Enzyme + substrate → products.","tip":"The substrate binds the active site. The enzyme comes out unchanged and can be reused."},{"id":"C-ch4-atp","unit":"ch4","sec":"ch4-atp","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Loss of electrons.\" Which term fits?","opts":[{"t":"Pyruvate","c":false},{"t":"Lactate","c":false},{"t":"Oxidation","c":true},{"t":"Reduction","c":false}],"why":"Oxidation: Loss of electrons. Oxidation loses electrons; reduction gains electrons. Contrast substrate-level and oxidative phosphorylation.","diff":2,"origin":"guide","src":"check","trick":"OIL RIG: Oxidation Is Loss of electrons.","tip":"When a molecule is oxidized, another must be reduced. They always happen as a pair (redox)."},{"id":"C-ch4-glycolysis","unit":"ch4","sec":"ch4-glycolysis","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Cytosolic conversion of glucose into pyruvate with net ATP and NADH production.\" Which term fits?","opts":[{"t":"tRNA","c":false},{"t":"Mutation","c":false},{"t":"Transcription","c":false},{"t":"Glycolysis","c":true}],"why":"Glycolysis: Cytosolic conversion of glucose into pyruvate with net ATP and NADH production. One glucose yields two pyruvate, two net ATP, and two NADH in glycolysis. Lactate formation regenerates NAD+ without adding extra ATP.","diff":2,"origin":"guide","src":"check","trick":"GLYCO-LYSIS = sugar-splitting. 1 glucose → 2 pyruvate, in the cytosol, no oxygen needed.","tip":"Glycolysis happens in the cytoplasm and doesn't need oxygen. Krebs and the electron transport chain are in the mitochondria."},{"id":"C-ch4-aerobic","unit":"ch4","sec":"ch4-aerobic","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Matrix pathway oxidizing acetyl groups and regenerating oxaloacetate.\" Which term fits?","opts":[{"t":"Translation","c":false},{"t":"mRNA","c":false},{"t":"Krebs cycle","c":true},{"t":"Beta-oxidation","c":false}],"why":"Krebs cycle: Matrix pathway oxidizing acetyl groups and regenerating oxaloacetate. Locate each stage and account for carbon, electron carriers, and ATP. Oxygen is the final acceptor; the proton gradient powers ATP synthase.","diff":2,"origin":"guide","src":"check","trick":"Krebs cycle = the mitochondrial merry-go-round that strips electrons off acetyl groups.","tip":"Location matters: Krebs is in the matrix; the electron transport chain is on the inner membrane."},{"id":"C-ch4-fuels","unit":"ch4","sec":"ch4-fuels","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Successive removal of two-carbon acetyl units from fatty acids.\" Which term fits?","opts":[{"t":"tRNA","c":false},{"t":"Beta-oxidation","c":true},{"t":"DNA polymerase","c":false},{"t":"Codon","c":false}],"why":"Beta-oxidation: Successive removal of two-carbon acetyl units from fatty acids. Compare glycogen storage with triglyceride reserve fuel. Fatty acids and amino acid carbon skeletons enter shared energy pathways.","diff":2,"origin":"guide","src":"check","trick":"BETA-oxidation chops fat into 2-carbon pieces, like slicing a baguette.","tip":"Fatty acids are broken down by beta-oxidation into acetyl-CoA, which then enters the Krebs cycle."},{"id":"C-ch4-replication","unit":"ch4","sec":"ch4-replication","focus":[],"type":"mcq","stem":"A learner describes this concept: \"DNA region contributing information for a functional RNA or protein product.\" Which term fits?","opts":[{"t":"Gene","c":true},{"t":"Transcription","c":false},{"t":"Mutation","c":false},{"t":"rRNA","c":false}],"why":"Gene: DNA region contributing information for a functional RNA or protein product. Replication makes DNA from DNA and preserves one old strand per daughter helix. Separate replication from transcription and mutation from an inevitable disease outcome.","diff":2,"origin":"guide","src":"check","trick":"Gene = one recipe in the DNA cookbook.","tip":"A gene is a DNA segment that codes for a protein or a functional RNA. It is not the whole chromosome."},{"id":"C-ch4-expression","unit":"ch4","sec":"ch4-expression","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Synthesis of RNA using a DNA template.\" Which term fits?","opts":[{"t":"mRNA","c":false},{"t":"Codon","c":false},{"t":"Transcription","c":true},{"t":"tRNA","c":false}],"why":"Transcription: Synthesis of RNA using a DNA template. Transcription makes RNA; translation builds a polypeptide. Read mRNA codons in the correct direction and distinguish template from coding DNA.","diff":2,"origin":"guide","src":"check","trick":"TRANSCRIPTION = TRANSCRIBE (copy in the same language: DNA→RNA). TRANSLATION = TRANSLATE to a new language (RNA→protein).","tip":"Transcription happens in the nucleus; translation happens at ribosomes in the cytoplasm."},{"id":"C-ch5-epithelia","unit":"ch5","sec":"ch5-epithelia","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Closely packed tissue covering surfaces, lining spaces, or forming glands.\" Which term fits?","opts":[{"t":"Mesenchyme","c":false},{"t":"Mast cell","c":false},{"t":"Epithelium","c":true},{"t":"Urothelium","c":false}],"why":"Epithelium: Closely packed tissue covering surfaces, lining spaces, or forming glands. Relate epithelial polarity, basement membrane, avascularity, and regeneration. Classify stratified tissue by the shape of its apical cells.","diff":2,"origin":"guide","src":"check","trick":"EPI-thelium = ON TOP: it covers and lines every surface.","tip":"Epithelium has no blood vessels (avascular), sits on a basement membrane, and regenerates quickly."},{"id":"C-ch5-simple","unit":"ch5","sec":"ch5-simple","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Simple squamous lining of blood and lymphatic vessels.\" Which term fits?","opts":[{"t":"Endothelium","c":true},{"t":"Mesothelium","c":false},{"t":"Platelet","c":false},{"t":"Urothelium","c":false}],"why":"Endothelium: Simple squamous lining of blood and lymphatic vessels. Link thin squamous layers to exchange and cuboidal/columnar layers to secretion or absorption. Pseudostratified means every cell contacts the basement membrane.","diff":2,"origin":"guide","src":"check","trick":"ENDO-thelium = lining INSIDE vessels: a single, smooth, thin layer.","tip":"Thin simple squamous layers are for fast exchange (vessels, alveoli)."},{"id":"C-ch5-stratified","unit":"ch5","sec":"ch5-stratified","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Structural protein prominent in epidermis, hair, and nails.\" Which term fits?","opts":[{"t":"Keratin","c":true},{"t":"Exocrine gland","c":false},{"t":"Neuroglia","c":false},{"t":"Endocrine gland","c":false}],"why":"Keratin: Structural protein prominent in epidermis, hair, and nails. Keratinized stratified squamous forms epidermis; nonkeratinized protects moist surfaces. Transitional epithelium stretches while maintaining a urinary barrier.","diff":2,"origin":"guide","src":"check","trick":"KERATIN comes from the Greek word for horn: the same tough protein makes hair, nails and the outer skin.","tip":"Keratin waterproofs and toughens. Its presence makes stratified squamous \"keratinized\"."},{"id":"C-ch5-glands","unit":"ch5","sec":"ch5-glands","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Gland delivering secretion through a duct to a surface or lumen.\" Which term fits?","opts":[{"t":"Exocrine gland","c":true},{"t":"Chondrocyte","c":false},{"t":"Endocrine gland","c":false},{"t":"Intercalated disc","c":false}],"why":"Exocrine gland: Gland delivering secretion through a duct to a surface or lumen. Exocrine uses ducts; endocrine releases hormones without ducts. Holocrine loses the entire secretory cell.","diff":2,"origin":"guide","src":"check","trick":"EXOcrine = EXIT through a duct (sweat, saliva).","tip":"Duct = exocrine. No duct, into the blood = endocrine."},{"id":"C-ch5-matrix","unit":"ch5","sec":"ch5-matrix","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Ground substance and fibers surrounding cells.\" Which term fits?","opts":[{"t":"Collagen","c":false},{"t":"Neuroglia","c":false},{"t":"Fibroblast","c":false},{"t":"Extracellular matrix","c":true}],"why":"Extracellular matrix: Ground substance and fibers surrounding cells. Matrix equals ground substance plus fibers; cell types contribute different functions. Collagen resists tension, elastic fibers recoil, reticular fibers form a network.","diff":2,"origin":"guide","src":"check","trick":"Matrix = the Jell-O (ground substance) with fruit strings (fibers) holding the cells.","tip":"Extracellular matrix = ground substance + fibers. It decides how a connective tissue behaves."},{"id":"C-ch5-connective","unit":"ch5","sec":"ch5-connective","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Mature cartilage cell residing in a lacuna.\" Which term fits?","opts":[{"t":"Chondrocyte","c":true},{"t":"Platelet","c":false},{"t":"Synovial membrane","c":false},{"t":"Plasma","c":false}],"why":"Chondrocyte: Mature cartilage cell residing in a lacuna. Predict function from fiber arrangement and matrix composition. Distinguish all three cartilages, compact bone, and blood.","diff":2,"origin":"guide","src":"check","trick":"CHONDRO = cartilage (like the chondral in costochondral). -cyte = cell.","tip":"Chondrocyte = cartilage, osteocyte = bone. Both live in little spaces called lacunae."},{"id":"C-ch5-membranes","unit":"ch5","sec":"ch5-membranes","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Connective tissue lining of a synovial joint capsule.\" Which term fits?","opts":[{"t":"Synovial membrane","c":true},{"t":"Contractility","c":false},{"t":"Neuroglia","c":false},{"t":"Intercalated disc","c":false}],"why":"Synovial membrane: Connective tissue lining of a synovial joint capsule. Synovial membranes are connective tissue membranes without true epithelium. Compare skeletal, cardiac, and smooth muscle by structure, location, and control.","diff":2,"origin":"guide","src":"check","trick":"SYNOVIAL = like egg white (syn + ovum): slippery joint fluid made by this lining.","tip":"Synovial membranes are connective tissue only, with no epithelium. They line freely movable joints."},{"id":"C-ch6-layers","unit":"ch6","sec":"ch6-layers","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Avascular outer epithelial layer of skin.\" Which term fits?","opts":[{"t":"Hypodermis","c":false},{"t":"Epidermis","c":true},{"t":"Cutaneous","c":false},{"t":"Pacinian corpuscle","c":false}],"why":"Epidermis: Avascular outer epithelial layer of skin. Order epidermal strata from basale to corneum; lucidum is specific to thick skin. Distinguish epidermis, dermis, and hypodermis.","diff":2,"origin":"guide","src":"check","trick":"EPI-dermis = ON the dermis. Top layer, no blood vessels.","tip":"Strata from surface to deep: \"Come, Let's Get Sun Burned\" = Corneum, Lucidum (thick skin only), Granulosum, Spinosum, Basale."},{"id":"C-ch6-dermis","unit":"ch6","sec":"ch6-dermis","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Superficial encapsulated receptor for light touch and low-frequency vibration.\" Which term fits?","opts":[{"t":"Melanin","c":false},{"t":"Arrector pili","c":false},{"t":"Cutaneous","c":false},{"t":"Meissner corpuscle","c":true}],"why":"Meissner corpuscle: Superficial encapsulated receptor for light touch and low-frequency vibration. Papillary dermis is areolar; reticular dermis is dense irregular connective tissue. Compare superficial tactile receptors with deeper lamellated corpuscles.","diff":2,"origin":"guide","src":"check","trick":"MEISSNER = Mini touch near the surface (fingertips, lips).","tip":"Meissner = superficial, light touch. Pacinian = deep, pressure and fast vibration."},{"id":"C-ch6-accessory","unit":"ch6","sec":"ch6-accessory","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Lipid-rich secretion of sebaceous glands.\" Which term fits?","opts":[{"t":"Arrector pili","c":false},{"t":"Hypothermia","c":false},{"t":"Jaundice","c":false},{"t":"Sebum","c":true}],"why":"Sebum: Lipid-rich secretion of sebaceous glands. Hair/nails arise from epidermal cells despite follicle structures extending into dermis. Arrector pili is smooth muscle; sebaceous secretion is holocrine.","diff":2,"origin":"guide","src":"check","trick":"SEBUM = oil (think \"sebaceous = slippery\"). It keeps hair and skin soft.","tip":"Sebaceous glands release sebum into hair follicles. Blocked glands contribute to acne."},{"id":"C-ch6-sweat","unit":"ch6","sec":"ch6-sweat","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Sweat gland opening onto the surface and important for cooling.\" Which term fits?","opts":[{"t":"Rule of nines","c":false},{"t":"Eccrine gland","c":true},{"t":"Apocrine sweat gland","c":false},{"t":"Vasoconstriction","c":false}],"why":"Eccrine gland: Sweat gland opening onto the surface and important for cooling. Eccrine glands open to surface and support evaporative cooling. Apocrine sweat commonly drains into follicles; bacterial metabolism contributes odor.","diff":2,"origin":"guide","src":"check","trick":"ECCRINE = Everywhere, Evaporative cooling. APOCRINE = Armpits, odor (with bacteria).","tip":"Eccrine sweat opens onto the skin and cools you. Apocrine sweat drains into follicles in the armpits and groin."},{"id":"C-ch6-temperature","unit":"ch6","sec":"ch6-temperature","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Increase in vessel diameter.\" Which term fits?","opts":[{"t":"Melanin","c":false},{"t":"Vasodilation","c":true},{"t":"Evaporation","c":false},{"t":"Hypothermia","c":false}],"why":"Vasodilation: Increase in vessel diameter. Separate hypothalamic control from skin vessel and sweat responses. Evaporation depends on environmental conditions, including humidity.","diff":2,"origin":"guide","src":"check","trick":"Vaso-DILATION = vessels get wider (dilate like pupils in the dark).","tip":"Vasodilation = heat loss and flushed skin. Vasoconstriction = heat saved and pale, cool skin."},{"id":"C-ch6-pigment","unit":"ch6","sec":"ch6-pigment","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Pigment produced by melanocytes that contributes color and absorbs UV radiation.\" Which term fits?","opts":[{"t":"Cyanosis","c":false},{"t":"Melanin","c":true},{"t":"Jaundice","c":false},{"t":"Full-thickness burn","c":false}],"why":"Melanin: Pigment produced by melanocytes that contributes color and absorbs UV radiation. Distinguish melanin, carotene, hemoglobin, and bilirubin contributions. Link pressure/shear to tissue ischemia and UV exposure to DNA damage risk.","diff":2,"origin":"guide","src":"check","trick":"Melanin = the skin's built-in sunscreen.","tip":"Melanin absorbs UV and protects DNA in the nucleus. Everyone has about the same number of melanocytes; activity differs."},{"id":"C-ch6-repair","unit":"ch6","sec":"ch6-repair","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Restoration of an epithelial covering during repair.\" Which term fits?","opts":[{"t":"Full-thickness burn","c":false},{"t":"Re-epithelialization","c":true},{"t":"Rule of nines","c":false}],"why":"Re-epithelialization: Restoration of an epithelial covering during repair. Compare superficial, partial-thickness, and full-thickness depth and regenerative capacity. Rule of nines estimates adult surface area, not burn depth.","diff":2,"origin":"guide","src":"check","trick":"Re-EPITHELIALIZATION = re-roofing the house: new epithelium creeps over the wound.","tip":"Shallow wounds re-epithelialize from surviving basal cells and hair follicles. Full-thickness wounds scar or need grafts."},{"id":"C-ch7-overview","unit":"ch7","sec":"ch7-overview","focus":[],"type":"mcq","stem":"A student lists the bones of the axial skeleton. Which item does NOT belong on the list?","opts":[{"t":"Hyoid bone","c":false},{"t":"Sternum","c":false},{"t":"Scapula","c":true},{"t":"Sacrum","c":false}],"why":"The scapula is part of the pectoral girdle, which belongs to the appendicular skeleton. The hyoid, sternum (thoracic cage), and sacrum (vertebral column) are all axial.","diff":2,"origin":"guide","src":"check","trick":"AXIAL = the AXIS down your middle: skull, spine, ribs, sternum (plus the hyoid). Limbs and girdles hang off it.","tip":"\"Does NOT belong\" questions: find the one bone that attaches a limb. Girdles (scapula, clavicle, hip bones) are appendicular."},{"id":"C-ch7-shape","unit":"ch7","sec":"ch7-shape","focus":[],"type":"mcq","stem":"A small, rounded bone is found embedded inside the tendon of a muscle at the base of the big toe. How would you classify it?","opts":[{"t":"Short bone","c":false},{"t":"Irregular bone","c":false},{"t":"Sesamoid bone","c":true},{"t":"Sutural bone","c":false}],"why":"Bones that develop inside a tendon are sesamoid bones. The patella is the classic example; small sesamoid bones are also common near the big toe and thumb.","diff":2,"origin":"guide","src":"check","trick":"SESAMOID = shaped like a sesame seed, sitting inside a tendon (patella = the big one).","tip":"Bone inside a tendon = sesamoid. The kneecap is the classic example."},{"id":"C-ch7-long-bone","unit":"ch7","sec":"ch7-long-bone","focus":[],"type":"mcq","stem":"A surgeon drills into the middle of a femur shaft and reaches a cavity filled with fatty tissue. Which structures did the drill pass through, in order?","opts":[{"t":"Articular cartilage, spongy bone, red marrow","c":false},{"t":"Periosteum, compact bone, medullary cavity","c":true},{"t":"Endosteum, periosteum, epiphyseal plate","c":false},{"t":"Spongy bone, compact bone, articular cartilage","c":false}],"why":"The shaft (diaphysis) is covered by periosteum, made of a thick collar of compact bone, and surrounds the medullary cavity, which holds fatty yellow marrow.","diff":2,"origin":"guide","src":"check","trick":"Drill order = Peel, Crust, Center: Periosteum → Compact bone → Medullary cavity.","tip":"For \"in order\" questions, picture the drill path from the outside in before reading the options."},{"id":"C-ch7-marrow","unit":"ch7","sec":"ch7-marrow","focus":[],"type":"mcq","stem":"A patient's bone marrow stops producing platelets and white blood cells. Which tissue is failing?","opts":[{"t":"Red bone marrow in spongy bone","c":true},{"t":"Yellow bone marrow in the medullary cavity","c":false},{"t":"The periosteum","c":false},{"t":"Articular cartilage","c":false}],"why":"All blood cells, including platelets and white blood cells, are formed by red marrow (hematopoiesis). In adults, red marrow lives in the spongy bone of flat bones and some epiphyses.","diff":2,"origin":"guide","src":"check","trick":"RED marrow = makes blood (RED for blood). YELLOW marrow = fat.","tip":"All blood cell lines failing at once points to red marrow, which lives in spongy bone in adults."},{"id":"C-ch7-cells","unit":"ch7","sec":"ch7-cells","focus":[],"type":"mcq","stem":"A drug blocks the cells that dissolve bone matrix. Which cells are blocked, and what happens to bone density?","opts":[{"t":"Osteoblasts; bone density decreases","c":false},{"t":"Osteoclasts; bone density increases or is preserved","c":true},{"t":"Osteocytes; bone density decreases","c":false},{"t":"Osteoprogenitor cells; no change","c":false}],"why":"Osteoclasts resorb bone. Blocking them shifts the balance toward bone building by osteoblasts, which is how many osteoporosis drugs work.","diff":2,"origin":"guide","src":"check","trick":"Block the Clasts (Chewers) = less chewing = denser bone.","tip":"Many osteoporosis drugs (like bisphosphonates) work by slowing osteoclasts."},{"id":"C-ch7-compact-spongy","unit":"ch7","sec":"ch7-compact-spongy","focus":[],"type":"mcq","stem":"Under the microscope, a sample shows bony rings arranged around central canals. Where in a long bone was the sample most likely taken?","opts":[{"t":"The wall of the diaphysis","c":true},{"t":"The center of the epiphysis","c":false},{"t":"The articular cartilage","c":false},{"t":"The red marrow of the epiphysis","c":false}],"why":"Rings of lamellae around central canals are osteons, the structural units of compact bone. Compact bone forms the thick wall of the diaphysis.","diff":2,"origin":"guide","src":"check","trick":"Osteon rings = compact bone = the hard walls of the shaft.","tip":"Compact bone = osteons, thick in the diaphysis. Spongy bone = trabeculae, inside the ends and flat bones."},{"id":"C-ch7-ossification","unit":"ch7","sec":"ch7-ossification","focus":[],"type":"mcq","stem":"In a fetus, a bone is developing from a cartilage model, and a collar of periosteum is forming around its middle. Which bone could this be?","opts":[{"t":"Parietal bone","c":false},{"t":"Frontal bone","c":false},{"t":"Humerus","c":true},{"t":"Occipital bone","c":false}],"why":"A cartilage model means endochondral ossification, which forms most bones, including long bones like the humerus. The flat skull bones form by intramembranous ossification.","diff":2,"origin":"guide","src":"check","trick":"ENDOchondral = bone made INSIDE a cartilage model (most bones). INTRAmembranous = flat skull bones and clavicle.","tip":"Cartilage model mentioned? Think endochondral → long bone. Membrane sheet? Think flat skull bone."},{"id":"C-ch7-growth","unit":"ch7","sec":"ch7-growth","focus":[],"type":"mcq","stem":"Two X-rays of the tibia are compared. Film 1 shows a dark band near the end of the bone; Film 2 shows only a thin white line. What is the best conclusion?","opts":[{"t":"Film 1 belongs to a growing child; Film 2 to an adult whose plate has closed","c":true},{"t":"Film 1 shows a fracture; Film 2 is normal","c":false},{"t":"Both show adults; Film 1 has osteoporosis","c":false},{"t":"Film 2 belongs to a child; Film 1 to an adult","c":false}],"why":"The dark band is the cartilage epiphyseal plate of a growing bone. After growth stops, it ossifies into a thin epiphyseal line.","diff":2,"origin":"guide","src":"check","trick":"Dark band on an X-ray = cartilage plate still open = still growing. Thin white line = done growing.","tip":"Epiphyseal plate (kids) vs epiphyseal line (adults). The line is the scar of a closed plate."},{"id":"C-ch7-factors","unit":"ch7","sec":"ch7-factors","focus":[],"type":"mcq","stem":"A 30-year-old notices that his jaw, hands, and feet are slowly getting larger, but he is not getting taller. A tumor is found in his pituitary gland. What explains the pattern?","opts":[{"t":"Gigantism, because his epiphyseal plates are still open","c":false},{"t":"Acromegaly, because his epiphyseal plates have already ossified","c":true},{"t":"Rickets, from lack of vitamin D","c":false},{"t":"Dwarfism, from lack of growth hormone","c":false}],"why":"Excess growth hormone after the epiphyseal plates have closed cannot make bones longer, so bones thicken instead: acromegaly. Before the plates close, the same excess would cause gigantism.","diff":2,"origin":"guide","src":"check","trick":"Too much GH: Gigantism if Growing (plates open); Acromegaly in Adults (plates closed) = big hands, feet, jaw.","tip":"Check whether the growth plates are open. Same hormone excess, different result."},{"id":"C-ch7-functions","unit":"ch7","sec":"ch7-functions","focus":[],"type":"mcq","stem":"Which situation best shows the skeleton acting as a mineral reservoir?","opts":[{"t":"The ribs shielding the lungs during a fall","c":false},{"t":"Bone releasing calcium into the blood when dietary calcium is low","c":true},{"t":"The femur acting as a lever during walking","c":false},{"t":"Yellow marrow storing fat","c":false}],"why":"Bone stores inorganic salts, especially calcium and phosphate, and releases them into the blood to maintain homeostasis.","diff":2,"origin":"guide","src":"check","trick":"Bone = a calcium bank: deposits when you have extra, withdrawals when blood is low.","tip":"\"Mineral reservoir\" = bone storing or releasing calcium and phosphate to keep blood levels normal."},{"id":"C-ch7-remodeling","unit":"ch7","sec":"ch7-remodeling","focus":[],"type":"mcq","stem":"After a large calcium-rich meal, blood calcium rises above normal. Which response restores balance?","opts":[{"t":"The parathyroid glands secrete more PTH, stimulating osteoclasts","c":false},{"t":"The thyroid releases calcitonin; osteoclasts are inhibited and calcium is deposited in bone","c":true},{"t":"Osteoclasts become more active to store calcium","c":false},{"t":"The kidneys reabsorb more calcium","c":false}],"why":"High blood calcium triggers calcitonin from the thyroid. Calcitonin inhibits osteoclasts, so less calcium leaves bone, and osteoblasts deposit calcium, lowering blood calcium.","diff":2,"origin":"guide","src":"check","trick":"CalciTONin TONes DOWN blood calcium. PTH Pulls calcium out of bone (raises blood calcium).","tip":"High blood calcium → calcitonin. Low blood calcium → PTH. They do opposite jobs."},{"id":"C-ch7-fractures","unit":"ch7","sec":"ch7-fractures","focus":[],"type":"mcq","stem":"A toddler arrives in the emergency department with a fracture that winds around the shaft of the humerus. The caregiver says the child \"fell off the couch.\" Why should the care team be concerned?","opts":[{"t":"Greenstick fractures are only caused by abuse","c":false},{"t":"A spiral fracture results from twisting force, which a simple fall rarely produces","c":true},{"t":"A comminuted fracture shows the bone is diseased","c":false},{"t":"Transverse fractures never happen in children","c":false}],"why":"A spiral fracture wraps around the bone because of excessive twisting. This mechanism does not match a simple fall and is a red flag for child abuse.","diff":2,"origin":"guide","src":"check","trick":"Spiral = twist. Toddlers don't twist their own arm falling off a couch.","tip":"When the injury doesn't match the story, think abuse. Nurses are mandated reporters."},{"id":"C-ch7-axial","unit":"ch7","sec":"ch7-axial","focus":[],"type":"mcq","stem":"During a school screening, a 13-year-old girl bends forward and one shoulder blade sticks out higher than the other. Which condition is suspected?","opts":[{"t":"Kyphosis","c":false},{"t":"Lordosis","c":false},{"t":"Scoliosis","c":true},{"t":"Osteomalacia","c":false}],"why":"Scoliosis is a lateral curvature of the spine that makes one shoulder or hip higher than the other. It is most often detected in adolescent girls.","diff":2,"origin":"guide","src":"check","trick":"SCOLIOSIS = S-shaped spine (Side curve). Kyphosis = hunchback. Lordosis = swayback.","tip":"Uneven shoulders or hips on the forward-bend test = scoliosis. Screening is common in teen girls."},{"id":"C-ch7-appendicular","unit":"ch7","sec":"ch7-appendicular","focus":[],"type":"mcq","stem":"A cyclist falls on an outstretched hand and breaks the \"collarbone.\" Which part of the skeleton is injured?","opts":[{"t":"The axial skeleton, thoracic cage","c":false},{"t":"The pectoral girdle of the appendicular skeleton","c":true},{"t":"The pelvic girdle","c":false},{"t":"The upper limb proper (arm)","c":false}],"why":"The clavicle (collarbone) and scapula form the pectoral girdle, which belongs to the appendicular skeleton.","diff":2,"origin":"guide","src":"check","trick":"Collarbone = clavicle = pectoral girdle = appendicular (it hangs the arm on the body).","tip":"Girdles attach limbs to the axial skeleton, so they count as appendicular."},{"id":"C-ch7-aging","unit":"ch7","sec":"ch7-aging","focus":[],"type":"mcq","stem":"Two 68-year-old patients have the same diet and activity. Who has the higher risk of an osteoporotic hip fracture, and why?","opts":[{"t":"A dark-skinned man, because men have thinner bones","c":false},{"t":"A light-skinned woman, because of lower peak bone mass and estrogen loss after menopause","c":true},{"t":"A dark-skinned woman, because spongy bone is stronger in women","c":false},{"t":"They have equal risk at every age","c":false}],"why":"Light-skinned women start with less bone mass and lose bone faster after menopause. Hip fractures happen where spongy (trabecular) bone is plentiful, such as the femoral neck.","diff":2,"origin":"guide","src":"check","trick":"Osteoporosis risk: Thin, White, Older Woman after menopause (estrogen loss).","tip":"Hip fractures happen in spongy-bone-rich spots like the femoral neck. Estrogen protects bone."},{"id":"C-ch7-disorders","unit":"ch7","sec":"ch7-disorders","focus":[],"type":"mcq","stem":"A child with bowed legs lives indoors most of the year and drinks little milk. Which condition and cause fit best?","opts":[{"t":"Rickets caused by vitamin D deficiency","c":true},{"t":"Scurvy caused by vitamin C deficiency","c":false},{"t":"Gigantism caused by excess growth hormone","c":false},{"t":"Osteoporosis caused by menopause","c":false}],"why":"Without enough vitamin D (made in sunlight-exposed skin, also found in fortified milk), calcium is poorly absorbed and bones soften. In children this is rickets, which causes bowed legs.","diff":2,"origin":"guide","src":"check","trick":"Rickets = Rickety bowed legs from no sunshine vitamin (D).","tip":"Vitamin D is needed to absorb calcium. Kids → rickets (bowed legs); adults → osteomalacia (soft bones)."},{"id":"C-ch8-overview","unit":"ch8","sec":"ch8-overview","focus":[],"type":"mcq","stem":"A student describes a joint as \"freely movable.\" Which classification system is she using?","opts":[{"t":"Functional classification","c":true},{"t":"Structural classification","c":false},{"t":"Both equally","c":false},{"t":"Neither","c":false}],"why":"Describing how much movement a joint allows is functional. Structural classification describes the tissue that joins the bones.","diff":2,"origin":"guide","src":"check","trick":"FUNCTIONAL = how much it FUNCTIONS (moves). STRUCTURAL = what it's made of.","tip":"Words about movement (freely, slightly, immovable) = functional classification."},{"id":"C-ch8-functional","unit":"ch8","sec":"ch8-functional","focus":[],"type":"mcq","stem":"The joint between the two pubic bones moves only slightly during childbirth. How is it classified functionally?","opts":[{"t":"Synarthrotic","c":false},{"t":"Amphiarthrotic","c":true},{"t":"Diarthrotic","c":false},{"t":"Synovial","c":false}],"why":"Slightly movable joints are amphiarthroses. (Synovial is a structural term, not a functional one.)","diff":2,"origin":"guide","src":"check","trick":"Syn = Stuck, Amphi = A bit, Di = Do anything (synarthrosis, amphiarthrosis, diarthrosis).","tip":"\"Slightly movable\" = amphiarthrotic. Watch out for structural words like \"synovial\" in a functional question."},{"id":"C-ch8-fibrous","unit":"ch8","sec":"ch8-fibrous","focus":[],"type":"mcq","stem":"A dentist describes the joint that anchors a molar in the jaw. Which type is it?","opts":[{"t":"Suture","c":false},{"t":"Syndesmosis","c":false},{"t":"Gomphosis","c":true},{"t":"Symphysis","c":false}],"why":"A peg-in-socket fibrous joint held by the periodontal ligament is a gomphosis.","diff":2,"origin":"guide","src":"check","trick":"GOMPHOSIS = a tooth bolted (gomphos = bolt) into its socket.","tip":"Fibrous joints: suture (skull), syndesmosis (ligament between bones), gomphosis (tooth)."},{"id":"C-ch8-cartilaginous","unit":"ch8","sec":"ch8-cartilaginous","focus":[],"type":"mcq","stem":"Which joint is classified as a synchondrosis?","opts":[{"t":"The pubic symphysis","c":false},{"t":"An epiphyseal plate in a growing femur","c":true},{"t":"The knee joint","c":false},{"t":"A skull suture","c":false}],"why":"Hyaline cartilage joining bones in a growing child, as in the epiphyseal plate, is a synchondrosis. The pubic symphysis has fibrocartilage; the knee is synovial; sutures are fibrous.","diff":2,"origin":"guide","src":"check","trick":"SynCHONDROsis = joined by hyaline cartilage (chondro). SymPHYSIS = fibrocartilage pad.","tip":"Epiphyseal plate and first rib–sternum = synchondrosis. Pubic symphysis and discs = symphysis."},{"id":"C-ch8-synovial-structure","unit":"ch8","sec":"ch8-synovial-structure","focus":[],"type":"mcq","stem":"A runner has pain at the front of the knee where the skin slides over the kneecap. Which structure, when inflamed, would most likely cause this?","opts":[{"t":"Joint capsule","c":false},{"t":"Bursa","c":true},{"t":"Meniscus","c":false},{"t":"Periodontal ligament","c":false}],"why":"Bursae are fluid-filled sacs that reduce friction between skin, tendons, and bone. Inflammation of a bursa is bursitis.","diff":2,"origin":"guide","src":"check","trick":"BURSA = a little purse (bursa) of fluid that stops rubbing.","tip":"Kneeling pain over the kneecap suggests bursitis. Bursae reduce friction between skin, tendon and bone."},{"id":"C-ch8-types","unit":"ch8","sec":"ch8-types","focus":[],"type":"mcq","stem":"A dancer swings her leg in a wide circle and rotates it outward. Which joint type allows both?","opts":[{"t":"Hinge","c":false},{"t":"Condyloid","c":false},{"t":"Ball-and-socket","c":true},{"t":"Gliding","c":false}],"why":"Only ball-and-socket (and to a lesser extent pivot) joints permit rotation. The hip is a ball-and-socket joint that allows circumduction and rotation.","diff":2,"origin":"guide","src":"check","trick":"Wide circles + rotation = ball-and-socket (hip or shoulder).","tip":"Circumduction plus rotation narrows it to ball-and-socket joints."},{"id":"C-ch8-movements","unit":"ch8","sec":"ch8-movements","focus":[],"type":"mcq","stem":"A patient stands on his heels with the toes lifted off the floor. What movement is at the ankle?","opts":[{"t":"Plantar flexion","c":false},{"t":"Dorsiflexion","c":true},{"t":"Inversion","c":false},{"t":"Hyperextension of the knee","c":false}],"why":"Dorsiflexion decreases the angle between the top of the foot and the shin. Plantar flexion would point the toes.","diff":2,"origin":"guide","src":"check","trick":"Heels down, toes up = DORSiflexion (toward the top/dorsum).","tip":"Standing on heels = dorsiflexion. Standing on tiptoes = plantar flexion."},{"id":"C-ch8-examples","unit":"ch8","sec":"ch8-examples","focus":[],"type":"mcq","stem":"A football player is tackled and the front of the knee gives way, so his tibia slides forward under the femur. Which structure is most likely torn?","opts":[{"t":"Posterior cruciate ligament","c":false},{"t":"Anterior cruciate ligament","c":true},{"t":"Rotator cuff","c":false},{"t":"Radial collateral ligament","c":false}],"why":"The ACL prevents the tibia from sliding forward. The rotator cuff is in the shoulder and the radial collateral ligament is in the elbow.","diff":2,"origin":"guide","src":"check","trick":"ACL = Anterior Cruciate: stops the tibia from sliding Anteriorly (forward).","tip":"Name tells direction: the anterior cruciate stops forward slide; the posterior cruciate stops backward slide."},{"id":"C-ch8-aging","unit":"ch8","sec":"ch8-aging","focus":[],"type":"mcq","stem":"A 55-year-old complains that his knees and back feel stiffer each year, even though he has no injury. Which age-related change most likely contributes?","opts":[{"t":"Growth of the epiphyseal plates","c":false},{"t":"Fibrocartilage losing water and collagen stiffening","c":true},{"t":"Closure of the fontanels","c":false},{"t":"Loss of articular cartilage in infancy","c":false}],"why":"With age, fibrocartilage dries and collagen stiffens, reducing flexibility. Regular exercise helps slow this process.","diff":2,"origin":"guide","src":"check","trick":"Aging cartilage is like an old sponge: drier and stiffer.","tip":"Gradual stiffness with no injury in older adults points to normal aging of cartilage and collagen."},{"id":"C-ch8-disorders","unit":"ch8","sec":"ch8-disorders","focus":[],"type":"mcq","stem":"A hiker develops a swollen knee a few weeks after a tick bite and a bull's-eye rash. Which condition is most likely?","opts":[{"t":"Osteoarthritis","c":false},{"t":"Rheumatoid arthritis","c":false},{"t":"Gout","c":false},{"t":"Lyme arthritis","c":true}],"why":"Lyme arthritis follows infection with *Borrelia burgdorferi* from a tick bite. OA is from aging, RA is autoimmune, and gout comes from uric acid crystals.","diff":2,"origin":"guide","src":"check","trick":"Tick + bull's-eye rash + swollen knee = Lyme.","tip":"Clue words decide arthritis type: tick (Lyme), autoimmune (RA), uric acid (gout), wear-and-tear (OA)."},{"id":"C-ch8-summary","unit":"ch8","sec":"ch8-summary","focus":[],"type":"mcq","stem":"Which pair of joints are both classified as amphiarthroses?","opts":[{"t":"Skull suture and shoulder","c":false},{"t":"Intervertebral disc and symphysis pubis","c":true},{"t":"Hip and knee","c":false},{"t":"Gomphosis and elbow","c":false}],"why":"Both discs and the pubic symphysis are fibrocartilage symphyses that allow slight movement.","diff":2,"origin":"guide","src":"check","trick":"AMPHI = A bit of movement. Discs and the pubic symphysis give a little.","tip":"Both answers must match. Rule out any pair that includes a freely movable (synovial) joint."},{"id":"C-ch9-overview","unit":"ch9","sec":"ch9-overview","focus":[],"type":"mcq","stem":"A biopsy shows long, cylindrical, striated cells with many nuclei located at the edges of each cell. Which tissue is this?","opts":[{"t":"Skeletal muscle","c":true},{"t":"Smooth muscle","c":false},{"t":"Cardiac muscle","c":false},{"t":"Dense regular connective tissue","c":false}],"why":"Multiple nuclei in one fiber plus striations identify skeletal muscle. Smooth muscle lacks striations, and cardiac cells have a single nucleus and intercalated discs.","diff":2,"origin":"guide","src":"check","trick":"Skeletal fibers = long cables with many nuclei pushed to the sides, plus stripes.","tip":"Striated + many peripheral nuclei = skeletal. Striated + one nucleus + intercalated discs = cardiac. No stripes = smooth."},{"id":"C-ch9-structure","unit":"ch9","sec":"ch9-structure","focus":[],"type":"mcq","stem":"A surgeon exposes a muscle and sees thin white connective tissue wrapped around small bundles of fibers. Which layer is this?","opts":[{"t":"Epimysium","c":false},{"t":"Perimysium","c":true},{"t":"Endomysium","c":false},{"t":"Tendon","c":false}],"why":"Perimysium surrounds each fascicle (bundle). Epimysium surrounds the whole muscle and endomysium surrounds individual fibers.","diff":2,"origin":"guide","src":"check","trick":"PERImysium = the PERImeter around each bundle (fascicle).","tip":"Bundle = fascicle = perimysium. Whole muscle = epimysium. Single fiber = endomysium."},{"id":"C-ch9-fiber","unit":"ch9","sec":"ch9-fiber","focus":[],"type":"mcq","stem":"When a muscle contracts, which of the following DOES NOT shorten?","opts":[{"t":"The distance between Z lines","c":false},{"t":"The I band","c":false},{"t":"The A band","c":true},{"t":"The H zone","c":false}],"why":"The A band equals the length of the thick filaments, which do not change length. The filaments slide, so the Z lines move closer and the I band and H zone shrink.","diff":2,"origin":"guide","src":"check","trick":"The A band stays the sAme length. The I band and H zone shrInk.","tip":"Filaments slide; they don't shorten. So the A band (thick-filament length) never changes."},{"id":"C-ch9-nmj","unit":"ch9","sec":"ch9-nmj","focus":[],"type":"mcq","stem":"A farm worker is exposed to an insecticide that blocks acetylcholinesterase. What happens at her neuromuscular junctions?","opts":[{"t":"ACh is never released","c":false},{"t":"ACh builds up in the cleft and the muscle stays stimulated","c":true},{"t":"Calcium stays in the sarcoplasmic reticulum","c":false},{"t":"ATP is no longer produced","c":false}],"why":"Without the enzyme, ACh is not broken down, so the motor end plate is stimulated continuously and the muscle cannot relax.","diff":2,"origin":"guide","src":"check","trick":"AChE = the ACh Eraser. Block the eraser and the message keeps shouting \"contract!\"","tip":"Organophosphate insecticides block acetylcholinesterase, causing continuous stimulation (twitching, spasm)."},{"id":"C-ch9-contraction","unit":"ch9","sec":"ch9-contraction","focus":[],"type":"mcq","stem":"Put these in order: (1) calcium released from the SR, (2) ACh released from the motor neuron, (3) impulse travels down the T tubules, (4) myosin heads pull on actin.","opts":[{"t":"1, 2, 3, 4","c":false},
