,"focus":[],"type":"priority","stem":"The nurse on a neuro unit hears four call lights. Which client should the nurse see first?","why":"A seizure is abnormal, uncontrolled firing of brain neurons. A seizure lasting more than 5 minutes (status epilepticus) can starve the brain of oxygen and is an emergency.","diff":2,"origin":"new","opts":[{"t":"A client who has been having a seizure for more than 5 minutes","c":true},{"t":"A client with epilepsy who had a brief seizure an hour ago and is now sleepy but easy to wake","w":"Expected after a seizure."},{"t":"A client asking when the next dose of seizure medicine is due","w":"Can wait briefly."},{"t":"A client with a mild headache","w":"Stable."}],"trick":"Seizure over 5 minutes = emergency.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-08","unit":"ch4","sec":"ch4-glycolysis","focus":[["ch4-glycolysis",1]],"type":"priority","stem":"The nurse reviews four clients with infections. Which client should the nurse see first?","why":"When tissues don't get enough blood and oxygen, cells rely on glycolysis and turn pyruvate into lactate. A rising lactate with low blood pressure suggests tissues are being starved of oxygen (septic shock).","diff":2,"origin":"new","opts":[{"t":"A client with an infection whose blood pressure is 82/48 mm Hg and whose lactate level is rising","c":true},{"t":"A client with an infection on antibiotics whose vital signs are normal","w":"Stable and being treated."},{"t":"A client with a low-grade fever of 37.9 °C (100.2 °F) who is eating","w":"Mild."},{"t":"A client asking when the IV antibiotic will finish","w":"Can wait."}],"trick":"Low BP + rising lactate = cells running without oxygen.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-09","unit":"ch9","sec":"ch9-contraction","focus":[["ch9-contraction",2]],"type":"priority","stem":"The nurse in the recovery room receives four clients after surgery. Which client should the nurse see first?","why":"Calcium released from the sarcoplasmic reticulum triggers contraction. In malignant hyperthermia, certain anesthetics cause uncontrolled calcium release, so muscles stay contracted, make huge amounts of heat, and temperature climbs fast.","diff":2,"origin":"new","opts":[{"t":"A client after general anesthesia whose temperature is rising quickly, with rigid muscles and a fast heart rate","c":true},{"t":"A client who is shivering slightly and asks for a warm blanket","w":"Common after anesthesia."},{"t":"A client with a sore throat from the breathing tube","w":"Expected."},{"t":"A client who is drowsy but wakes easily and has stable vital signs","w":"Expected recovery."}],"trick":"Anesthesia + rigid muscles + soaring temperature = malignant hyperthermia.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-10","unit":"ch1","sec":"ch1-systems","focus":[["ch1-systems",0]],"type":"priority","stem":"The nurse on a gastrointestinal unit receives four reports. Which client should the nurse see first?","why":"Bright red blood in vomit means active bleeding in the upper digestive tract. Light-headedness suggests blood volume is dropping, which is a circulation emergency.","diff":2,"origin":"new","opts":[{"t":"A client who is vomiting bright red blood and feels light-headed","c":true},{"t":"A client with mild nausea after breakfast","w":"Mild."},{"t":"A client who has not had a bowel movement in 2 days","w":"Can be addressed later."},{"t":"A client with heartburn after a large meal","w":"Common and mild."}],"trick":"Vomiting fresh blood + light-headed = circulation first.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-11","unit":"ch11","sec":"ch11-receptors","focus":[["ch11-receptors",0]],"type":"priority","stem":"The school nurse receives four students. Which client should the nurse see first?","why":"Anaphylaxis is a severe allergic reaction that narrows the airway and drops blood pressure. Epinephrine, acting on adrenergic receptors, opens the airways and tightens blood vessels, so it is given right away.","diff":2,"origin":"new","opts":[{"t":"A student with hives, swollen lips and tongue, and wheezing after a bee sting","c":true},{"t":"A student with a red, itchy bump at the sting site only","w":"A local reaction."},{"t":"A student with a scraped elbow from recess","w":"Minor."},{"t":"A student who feels nervous before a test","w":"Not urgent."}],"trick":"Sting + swollen tongue + wheeze = anaphylaxis: epinephrine now.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-12","unit":"ch5","sec":"ch5-connective","focus":[["ch5-connective",1]],"type":"priority","stem":"The nurse on a hematology unit reviews lab results. Which client should the nurse see first?","why":"Blood is a connective tissue, and its red cells carry oxygen using hemoglobin. A very low hemoglobin with dizziness and chest pain means the heart and brain aren't getting enough oxygen.","diff":2,"origin":"new","opts":[{"t":"A client with a hemoglobin of 6.5 g/dL who is dizzy and has chest pain","c":true},{"t":"A client with a hemoglobin of 13.5 g/dL","w":"Within the normal range."},{"t":"A client with a hemoglobin of 11 g/dL who is resting comfortably","w":"Mildly low but stable."},{"t":"A client asking about iron-rich foods","w":"Teaching can wait."}],"trick":"Very low hemoglobin + chest pain = organs starving for oxygen.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-13","unit":"ch3","sec":"ch3-differentiation","focus":[["ch3-differentiation",1]],"type":"priority","stem":"The oncology nurse receives four phone calls. Which client should the nurse call back first?","why":"Metastasis is cancer spreading to new sites. Cancer that spreads to the spine can press on the spinal cord. New back pain with leg weakness is an emergency, because delays can cause permanent paralysis.","diff":2,"origin":"new","opts":[{"t":"A client with known cancer who has new back pain and new weakness in both legs","c":true},{"t":"A client with cancer who feels tired after treatment","w":"Expected side effect."},{"t":"A client asking about a support group","w":"Can wait."},{"t":"A client with mild nausea controlled by medicine","w":"Being managed."}],"trick":"Cancer + new back pain + weak legs = spinal cord compression.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P3-14","unit":"ch11","sec":"ch11-protection","focus":[["ch11-protection",1]],"type":"priority","stem":"The nurse caring for four clients after abdominal surgery receives report. Which client should the nurse see first?","why":"The epidural space lies outside the dura around the spinal cord. Bleeding there (an epidural hematoma) can press on the cord. New back pain with leg weakness needs to be reported immediately.","diff":2,"origin":"new","opts":[{"t":"A client with an epidural catheter for pain control who has new back pain and new weakness in both legs","c":true},{"t":"A client with an epidural catheter whose pain is controlled and who can move both legs","w":"Expected."},{"t":"A client with mild itching from pain medicine","w":"Common and minor."},{"t":"A client asking when the catheter will be removed","w":"Can wait."}],"trick":"Epidural catheter + new leg weakness = check for bleeding pressing on the cord.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"G-F001","unit":"ch1","sec":"ch1-organization","focus":[],"type":"mcq","stem":"A lung sample contains epithelium, connective tissue, vessels, and nerves cooperating in gas exchange. What makes the intact lung an organ?","opts":[{"t":"Multiple tissue types coordinate a specialized function.","c":true},{"t":"The presence of several organs makes the lung an entire organism.","c":false},{"t":"Only one tissue type defines every organ.","c":false},{"t":"An organ and an organelle are equivalent organizational levels.","c":false}],"why":"An organ integrates several tissues; each contributes to the coordinated whole.","diff":2,"origin":"guide","src":"practice","trick":"Organ = a team of tissues. One tissue alone is just a player, not the team.","tip":"When an option names only one tissue type, it is too small to be an organ. Look for the answer with several tissues working together."},{"id":"G-F002","unit":"ch1","sec":"ch1-life","focus":[],"type":"mcq","stem":"Absorbed amino acids are joined into a cell's new transport proteins. Which process specifically describes incorporating these building materials?","opts":[{"t":"Digestion of dietary protein into smaller units.","c":false},{"t":"Absorption across the intestinal boundary.","c":false},{"t":"Excretion of nitrogen-containing waste.","c":false},{"t":"Assimilation.","c":true}],"why":"Assimilation incorporates absorbed material into living structures rather than merely moving nutrients across the gut.","diff":2,"origin":"guide","src":"practice","trick":"ASSIMilation = ASSEMBLE into you. Absorption only brings it in the door.","tip":"The stem says \"specifically\". Pick the most exact process, not a nearby one like absorption or digestion."},{"id":"G-F003","unit":"ch1","sec":"ch1-life","focus":[],"type":"mcq","stem":"A breathing model works only when pressure differs between two compartments. Which survival requirement is being illustrated as a physical condition?","opts":[{"t":"Pressure.","c":true},{"t":"Oxygen as an electron acceptor.","c":false},{"t":"Water as a reaction solvent.","c":false},{"t":"Nutrients as chemical building blocks.","c":false}],"why":"Pressure gradients support ventilation and other physiological flows, even though pressure is not a chemical nutrient.","diff":2,"origin":"guide","src":"practice","trick":"Breathing runs on a pressure slope: air flows downhill from high to low.","tip":"Not every survival need is something you eat or drink. Read the stem for the physical condition being described."},{"id":"G-F004","unit":"ch1","sec":"ch1-homeostasis","focus":[],"type":"mcq","stem":"A temperature control loop activates a fan after warming, then reduces fan output as temperature returns toward its target range. What feature identifies negative feedback?","opts":[{"t":"The response amplifies the original temperature error.","c":false},{"t":"The response reduces the original error.","c":true},{"t":"The system operates without any sensor input.","c":false},{"t":"The effector acts independently of the regulated variable.","c":false}],"why":"Negative feedback counteracts deviations; its components can adjust response strength as the error changes.","diff":2,"origin":"guide","src":"practice","trick":"Negative feedback = \"NEGATE the change\". The response shrinks the error.","tip":"To spot negative feedback, ask: does the response push the variable back toward normal? If yes, it is negative."},{"id":"G-F005","unit":"ch1","sec":"ch1-homeostasis","focus":[],"type":"mcq","stem":"A learner says homeostasis means every internal measurement remains perfectly constant. Which revision is best?","opts":[{"t":"Regulation operates only after every organ has stopped functioning.","c":false},{"t":"All variables are held at exact unchanging values.","c":false},{"t":"Homeostasis concerns external weather but no internal measurements.","c":false},{"t":"Variables fluctuate within regulated ranges while mechanisms counter disturbances.","c":true}],"why":"Homeostasis is dynamic regulation, not a frozen internal state.","diff":2,"origin":"guide","src":"practice","trick":"Homeostasis is a thermostat, not a statue: it wobbles inside a safe range.","tip":"Watch for absolute words like \"every\" and \"perfectly\". They usually signal the wrong idea."},{"id":"G-F006","unit":"ch1","sec":"ch1-cavities","focus":[],"type":"mcq","stem":"A teaching instrument enters a fluid space between the heart's covering and its sac lining. Which serous space is modeled?","opts":[{"t":"Spinal subarachnoid space.","c":false},{"t":"Peritoneal cavity.","c":false},{"t":"Pericardial cavity.","c":true},{"t":"Pleural cavity.","c":false}],"why":"The pericardial cavity is the potential space between serous pericardial layers.","diff":2,"origin":"guide","src":"practice","trick":"PERI-cardial = AROUND the heart. The cavity is the thin fluid gap inside the sac.","tip":"Match the location in the stem to the organ named in the term. Heart → pericardial, lungs → pleural, gut → peritoneal."},{"id":"G-F007","unit":"ch1","sec":"ch1-cavities","focus":[],"type":"mcq","stem":"A model shows a kidney behind the parietal peritoneal lining rather than suspended within its sac. Which location term fits?","opts":[{"t":"Retroperitoneal.","c":true},{"t":"Intraperitoneal.","c":false},{"t":"Intrapleural.","c":false},{"t":"Within the pericardial space.","c":false}],"why":"Retroperitoneal structures lie posterior to the peritoneal lining.","diff":2,"origin":"guide","src":"practice","trick":"RETRO = behind. Kidneys hide BEHIND the peritoneum, like a poster behind a curtain.","tip":"Location words often carry their meaning in the prefix. Break the term apart before choosing."},{"id":"G-F008","unit":"ch1","sec":"ch1-systems","focus":[],"type":"mcq","stem":"A student traces metabolic wastes from tissue blood into urine. Which system directly forms the urine?","opts":[{"t":"The skeletal system through marrow filtration.","c":false},{"t":"The digestive system through bile secretion.","c":false},{"t":"Urinary system.","c":true},{"t":"The reproductive system through gamete ducts.","c":false}],"why":"Kidneys filter and modify tubular fluid to form urine; ureters, bladder, and urethra transport/store/eliminate it.","diff":2,"origin":"guide","src":"practice","trick":"Kidneys MAKE urine; the tubes and bladder only MOVE and STORE it.","tip":"\"Directly forms\" points to the organ doing the work, not the system that transports the product."},{"id":"G-F009","unit":"ch1","sec":"ch1-directions","focus":[],"type":"mcq","stem":"Two sensors lie on opposite forearms. Which relationship describes their sides?","opts":[{"t":"Proximal.","c":false},{"t":"Contralateral.","c":true},{"t":"Superficial.","c":false},{"t":"Ipsilateral.","c":false}],"why":"Contralateral means opposite sides; ipsilateral means the same side.","diff":2,"origin":"guide","src":"practice","trick":"CONTRA = against/opposite (like contrary). IPSI = itself, same side.","tip":"Paired opposites (ipsi/contra, proximal/distal) are common distractors. Decide same side or opposite side first."},{"id":"G-F010","unit":"ch1","sec":"ch1-planes","focus":[],"type":"mcq","stem":"A section divides a cylindrical limb perpendicular to its long axis. Which description fits the section relative to that limb?","opts":[{"t":"A tangential surface view that does not cross the limb.","c":false},{"t":"Longitudinal section.","c":false},{"t":"A section parallel to the limb's long axis.","c":false},{"t":"Cross-section.","c":true}],"why":"A cross-section is perpendicular to the long axis of the object being described.","diff":2,"origin":"guide","src":"practice","trick":"Cross-section = slicing a hot dog into coins: across the long axis.","tip":"For sections of a limb or organ, use the object's own long axis, not the whole body's planes."},{"id":"G-F011","unit":"ch2","sec":"ch2-atoms","focus":[],"type":"mcq","stem":"A neutral atom has 11 protons and loses one electron. What changes while elemental identity is preserved?","opts":[{"t":"Its mass number must fall by one neutron.","c":false},{"t":"Its atomic number falls by one.","c":false},{"t":"Its charge becomes −1 while proton number stays fixed.","c":false},{"t":"Its charge becomes +1 while atomic number stays 11.","c":true}],"why":"Ionization changes electrons and charge, while proton number defines the element.","diff":2,"origin":"guide","src":"practice","trick":"Protons = Personal ID (never change). Electrons come and go and change the charge.","tip":"In atom questions, count each particle separately. Losing a negative electron makes the charge MORE positive."},{"id":"G-F012","unit":"ch2","sec":"ch2-atoms","focus":[],"type":"mcq","stem":"Two samples have equal proton numbers but different mass numbers. What difference most directly accounts for the mass numbers?","opts":[{"t":"A change only in the number of valence electrons.","c":false},{"t":"A different bonding partner with identical nuclear composition.","c":false},{"t":"A different proton number defining a new element.","c":false},{"t":"Different neutron numbers.","c":true}],"why":"Mass number counts protons plus neutrons; equal protons with different mass numbers imply different neutron counts.","diff":2,"origin":"guide","src":"practice","trick":"Isotopes = same Protons, different Neutrons. \"Neutrons make the Number heavier.\"","tip":"Mass number = protons + neutrons. If protons match, any mass difference must come from neutrons."},{"id":"G-F013","unit":"ch2","sec":"ch2-bonds","focus":[],"type":"mcq","stem":"A molecule carries separated partial positive and partial negative regions caused by unequal electron sharing. Which description fits?","opts":[{"t":"Complete electron transfer producing separated whole ions only.","c":false},{"t":"Polar covalent character.","c":true},{"t":"Perfectly equal electron sharing in every bond.","c":false},{"t":"A change in neutron number without any electron interaction.","c":false}],"why":"Unequal sharing in polar bonds produces partial charges; molecular geometry determines the overall dipole.","diff":2,"origin":"guide","src":"practice","trick":"POLAR = a tug-of-war one atom is winning. The winner gets a little negative charge.","tip":"\"Unequal sharing\" means polar covalent. Equal sharing means nonpolar, and electrons fully given away make an ionic bond."},{"id":"G-F014","unit":"ch2","sec":"ch2-reactions","focus":[],"type":"mcq","stem":"Two smaller molecules join and the product-forming process removes water components. How is this relationship described?","opts":[{"t":"Decomposition using added water.","c":false},{"t":"Hydrolysis.","c":false},{"t":"Dissociation of an ionic salt in water.","c":false},{"t":"Dehydration synthesis.","c":true}],"why":"Dehydration synthesis joins subunits with removal of water; hydrolysis reverses many such linkages.","diff":2,"origin":"guide","src":"practice","trick":"DEHYDRATION synthesis = building by taking water OUT. HYDROlysis = breaking by putting water IN.","tip":"Look at what happens to water in the stem. Water removed means joining; water added means splitting."},{"id":"G-F015","unit":"ch2","sec":"ch2-water","focus":[],"type":"mcq","stem":"A glucose solution dissolves readily yet does not supply ions in the same way as a salt solution. What distinction matters?","opts":[{"t":"Dissolution does not always mean ion formation.","c":true},{"t":"Every dissolved substance must separate into ions.","c":false},{"t":"Nonelectrolytes cannot interact with water.","c":false},{"t":"A dissolved glucose molecule necessarily becomes a cation.","c":false}],"why":"Some polar nonelectrolytes dissolve without dissociating into mobile ions.","diff":2,"origin":"guide","src":"practice","trick":"Sugar dissolves but stays whole; salt dissolves AND splits into ions. Only ions carry current.","tip":"Don't assume \"dissolved\" means \"ionized\". Electrolytes split into ions; nonelectrolytes like glucose do not."},{"id":"G-F016","unit":"ch2","sec":"ch2-ph","focus":[],"type":"mcq","stem":"A buffer receives a modest acid load. What response helps limit the pH fall?","opts":[{"t":"The buffer can absorb an unlimited acid load without changing pH.","c":false},{"t":"The buffer prevents any chemistry from occurring.","c":false},{"t":"The buffer amplifies the hydrogen ion rise.","c":false},{"t":"A buffer component binds some added hydrogen ions.","c":true}],"why":"Reversible binding of hydrogen ions reduces the immediate free hydrogen change within buffer capacity.","diff":2,"origin":"guide","src":"practice","trick":"A buffer is a sponge for H+: it soaks up extra acid so pH barely moves.","tip":"Buffers resist pH change. They don't stop it completely and they never make it bigger."},{"id":"G-F017","unit":"ch2","sec":"ch2-carbohydrates","focus":[],"type":"mcq","stem":"A label compares a plant glucose store with a liver glucose store. Which pairing is appropriate?","opts":[{"t":"Starch and cellulose.","c":false},{"t":"Glycogen and starch.","c":false},{"t":"Starch and glycogen.","c":true},{"t":"Cellulose and starch.","c":false}],"why":"Starch and glycogen are storage polysaccharides in plants and animals respectively.","diff":2,"origin":"guide","src":"practice","trick":"Plants store STARCH (think potatoes); animals store GLYCOGEN in the liver and muscles.","tip":"Storage questions often pair plant vs animal forms. Cellulose is plant structure, not storage."},{"id":"G-F018","unit":"ch2","sec":"ch2-lipids","focus":[],"type":"mcq","stem":"A membrane diagram includes a four-ring lipid that affects membrane properties and supplies precursors for hormones. Which molecule fits?","opts":[{"t":"A phospholipid with two fatty acid tails.","c":false},{"t":"Cholesterol.","c":true},{"t":"A triglyceride.","c":false},{"t":"Glycogen.","c":false}],"why":"Cholesterol is a steroid lipid with structural and precursor roles.","diff":2,"origin":"guide","src":"practice","trick":"Four rings = steroid. CHOLESTEROL is the parent ring that steroid hormones are made from.","tip":"If the stem mentions rings plus hormone precursors, think steroid lipid: cholesterol."},{"id":"G-F019","unit":"ch2","sec":"ch2-proteins","focus":[],"type":"mcq","stem":"A protein combines several folded polypeptide subunits. Which structural level describes their association?","opts":[{"t":"Secondary backbone helices alone.","c":false},{"t":"Quaternary structure.","c":true},{"t":"Tertiary structure of one chain alone.","c":false},{"t":"Primary amino acid sequence.","c":false}],"why":"Quaternary structure refers to the organization of multiple polypeptide subunits.","diff":2,"origin":"guide","src":"practice","trick":"QUATernary = a QUARTET of chains playing together (like hemoglobin's 4 subunits).","tip":"Primary = sequence, secondary = coils/sheets, tertiary = one chain's 3-D fold, quaternary = more than one chain."},{"id":"G-F020","unit":"ch2","sec":"ch2-nucleic","focus":[],"type":"mcq","stem":"A molecule contains ribose, adenine, and three phosphates and is consumed during membrane pumping. Which role fits?","opts":[{"t":"Immediate energy coupling through ATP.","c":true},{"t":"Long-term energy storage in triglycerides.","c":false},{"t":"A connective matrix structural polymer.","c":false},{"t":"Long-term storage of inherited sequence in DNA.","c":false}],"why":"ATP's structure supports rapid energy transfer; it is not the principal long-term fuel store.","diff":2,"origin":"guide","src":"practice","trick":"ATP = the cell's cash in hand. Fat and glycogen are the savings account.","tip":"ATP is immediate energy for work like pumps. Pick it over long-term fuel stores when the stem describes active work."},{"id":"G-F021","unit":"ch3","sec":"ch3-membrane","focus":[],"type":"mcq","stem":"A small nonpolar gas crosses a lipid bilayer without a carrier. Which property explains the route?","opts":[{"t":"All solutes cross the lipid region equally regardless of chemistry.","c":false},{"t":"Its chemistry permits diffusion through the hydrophobic membrane interior.","c":true},{"t":"Its entry necessarily requires ATP-driven uphill transport.","c":false},{"t":"Its charge requires a voltage-gated ion channel for this route.","c":false}],"why":"Small nonpolar molecules can dissolve in and diffuse across lipid relatively readily.","diff":2,"origin":"guide","src":"practice","trick":"Like dissolves like: small, oily (nonpolar) molecules slip right through the oily membrane.","tip":"O2 and CO2 cross by simple diffusion. Ions and big polar molecules need a protein channel or carrier."},{"id":"G-F022","unit":"ch3","sec":"ch3-membrane","focus":[],"type":"mcq","stem":"A tissue must prevent material from leaking between neighboring cells. Which junction best supports this requirement?","opts":[{"t":"A cell-surface recognition glycoprotein.","c":false},{"t":"Tight junction.","c":true},{"t":"Desmosome.","c":false},{"t":"Gap junction.","c":false}],"why":"Tight junctions form selective seals between adjacent cells rather than communication channels.","diff":2,"origin":"guide","src":"practice","trick":"TIGHT junction = a zip-lock seal. Desmosome = a rivet. GAP junction = a doorway.","tip":"Match the junction to the job: seal (tight), hold together under stress (desmosome), pass signals (gap)."},{"id":"G-F023","unit":"ch3","sec":"ch3-organelles","focus":[],"type":"mcq","stem":"A cell accumulates undigested worn organelles because acidic digestive compartments malfunction. Which structure is implicated?","opts":[{"t":"Smooth endoplasmic reticulum.","c":false},{"t":"Nucleolus.","c":false},{"t":"Golgi sorting vesicle as the main acidic digestive compartment.","c":false},{"t":"Lysosome.","c":true}],"why":"Lysosomal enzymes support breakdown and recycling of cellular material.","diff":2,"origin":"guide","src":"practice","trick":"LYSOsome = LYSE (break apart). It's the cell's recycling and garbage center.","tip":"Undigested debris building up points to lysosomes. Peroxisomes detoxify; mitochondria make ATP."},{"id":"G-F024","unit":"ch3","sec":"ch3-nucleus","focus":[],"type":"mcq","stem":"An absorptive cell has many short actin-supported surface projections. What benefit do they provide?","opts":[{"t":"Propulsion through a flagellar axoneme.","c":false},{"t":"Increased membrane surface area.","c":true},{"t":"Formation of the mitotic spindle through microtubules.","c":false},{"t":"Movement of mucus along an airway by motile cilia.","c":false}],"why":"Microvilli amplify surface area for absorption rather than acting as motile cilia.","diff":2,"origin":"guide","src":"practice","trick":"MICROvilli = a fuzzy bath towel: lots of little folds = lots of surface to soak things up.","tip":"Microvilli absorb (more surface), cilia sweep (motion), a flagellum swims. Don't mix up absorption and movement."},{"id":"G-F025","unit":"ch3","sec":"ch3-diffusion","focus":[],"type":"mcq","stem":"A barrier becomes thicker while area and concentration difference remain unchanged. What happens to simple diffusion across it?","opts":[{"t":"Diffusion rate generally increases with a longer path.","c":false},{"t":"A thicker passive barrier automatically converts diffusion into primary active transport.","c":false},{"t":"The rate generally decreases.","c":true},{"t":"Thickness cannot affect diffusion under any conditions.","c":false}],"why":"Longer diffusion distance reduces flux under otherwise similar conditions.","diff":2,"origin":"guide","src":"practice","trick":"Diffusion hates distance: a thicker wall = a longer trip = slower rate.","tip":"Diffusion is faster with more area, a bigger concentration difference, and a thinner barrier."},{"id":"G-F026","unit":"ch3","sec":"ch3-osmosis","focus":[],"type":"mcq","stem":"A cell swells in a bath and later ruptures. Which interpretation is consistent with a sustained osmotic effect?","opts":[{"t":"The bath was effectively hypotonic to the cell.","c":true},{"t":"The cell had lost water continuously to the bath.","c":false},{"t":"The bath was isotonic with no sustained volume change.","c":false},{"t":"The bath was effectively hypertonic.","c":false}],"why":"A hypotonic environment promotes net water entry; excessive swelling can cause lysis.","diff":2,"origin":"guide","src":"practice","trick":"HYPO-tonic = the cell swells like a HIPPO (water rushes in).","tip":"Water moves toward more solute. A cell that swells or bursts was in a hypotonic solution."},{"id":"G-F027","unit":"ch3","sec":"ch3-active","focus":[],"type":"mcq","stem":"A membrane protein uses an existing sodium gradient to drive another solute uphill without hydrolyzing ATP at that carrier. Which category fits?","opts":[{"t":"Primary active transport with direct ATP hydrolysis at that carrier.","c":false},{"t":"Secondary active transport.","c":true},{"t":"Osmosis of water without solute coupling.","c":false},{"t":"Facilitated diffusion of both solutes downhill independently.","c":false}],"why":"The carrier couples downhill ion movement to uphill solute transport; maintaining the gradient ultimately requires energy.","diff":2,"origin":"guide","src":"practice","trick":"SECONDARY active = riding someone else's wave. Sodium rolls downhill and drags the other solute up.","tip":"If the carrier itself doesn't use ATP but moves something uphill using an ion gradient, it is secondary active transport."},{"id":"G-F028","unit":"ch3","sec":"ch3-active","focus":[],"type":"mcq","stem":"A secretory vesicle merges with the cell surface and releases its contents outside. Which process occurred?","opts":[{"t":"Exocytosis.","c":true},{"t":"Receptor-mediated endocytosis.","c":false},{"t":"Pinocytosis.","c":false},{"t":"Phagocytosis.","c":false}],"why":"Exocytosis is vesicle fusion with the plasma membrane and release of luminal contents.","diff":2,"origin":"guide","src":"practice","trick":"EXOcytosis = EXIT the cell. ENDOcytosis = ENTER the cell.","tip":"Vesicle fusing with the membrane and dumping contents outside = exocytosis (how hormones and neurotransmitters leave)."},{"id":"G-F029","unit":"ch3","sec":"ch3-cycle","focus":[],"type":"mcq","stem":"Two groups of chromosomes arrive at opposite poles and new nuclear envelopes form. Which mitotic stage is being modeled?","opts":[{"t":"Prophase.","c":false},{"t":"Metaphase.","c":false},{"t":"Anaphase.","c":false},{"t":"Telophase.","c":true}],"why":"Telophase includes reformation of daughter nuclei after chromosome separation.","diff":2,"origin":"guide","src":"practice","trick":"PMAT order. TELOphase = TWO new nuclei form at the far ends (telo = end).","tip":"Prophase condenses, metaphase lines up, anaphase pulls apart, telophase rebuilds the nuclei."},{"id":"G-F030","unit":"ch3","sec":"ch3-differentiation","focus":[],"type":"mcq","stem":"A localized tumor does not invade adjacent tissues or spread, yet compresses a nearby structure. Which statement is sound?","opts":[{"t":"Every localized mass has already invaded all nearby tissues.","c":false},{"t":"Benign masses cannot impair any adjacent structure.","c":false},{"t":"A benign growth can still cause harm through location and compression.","c":true},{"t":"A benign mass is defined by distant metastases.","c":false}],"why":"Benign tumors do not metastasize, but mechanical effects can still be important.","diff":2,"origin":"guide","src":"practice","trick":"Benign = stays put, but even a quiet tenant can crowd the house.","tip":"Benign means no invasion and no spread. It can still cause harm by pressing on nearby structures."},{"id":"G-F031","unit":"ch4","sec":"ch4-enzymes","focus":[],"type":"mcq","stem":"Two reactions have the same energy difference with and without an enzyme, but one proceeds faster. What did the enzyme change?","opts":[{"t":"The activation-energy barrier.","c":true},{"t":"The total amount of matter conserved in the reaction.","c":false},{"t":"The equilibrium position of the reaction.","c":false},{"t":"The overall energy difference between reactants and products.","c":false}],"why":"Catalysts lower the barrier to reaction without changing the overall thermodynamic difference.","diff":2,"origin":"guide","src":"practice","trick":"An enzyme digs a tunnel through the hill: same start and end, easier path (lower activation energy).","tip":"Enzymes speed reactions by lowering activation energy. They don't change how much energy the reaction releases overall."},{"id":"G-F032","unit":"ch4","sec":"ch4-enzymes","focus":[],"type":"mcq","stem":"An inhibitor occupies a substrate-binding region and reduces productive substrate access. Which feature explains why the effect is selective?","opts":[{"t":"All pathway enzymes share one identical active site.","c":false},{"t":"Each enzyme binds every substrate equally.","c":false},{"t":"Substrate fit depends only on substrate color.","c":false},{"t":"Active-site interactions depend on molecular compatibility.","c":true}],"why":"Enzyme specificity reflects shape and chemical interactions at binding/catalytic sites.","diff":2,"origin":"guide","src":"practice","trick":"Lock and key: an inhibitor is a wrong key jammed in the lock, so the right key can't fit.","tip":"Selective effects come from shape fit at the active site. Specific shape = specific substrate."},{"id":"G-F033","unit":"ch4","sec":"ch4-atp","focus":[],"type":"mcq","stem":"A reduced carrier donates electrons to a membrane chain and becomes oxidized. Which description is accurate?","opts":[{"t":"It gains electrons.","c":false},{"t":"Oxidation requires loss of a neutron from the nucleus.","c":false},{"t":"It loses electrons during donation.","c":true},{"t":"It becomes reduced during electron donation.","c":false}],"why":"Oxidation is electron loss; reduction is electron gain, whether or not oxygen is directly added.","diff":2,"origin":"guide","src":"practice","trick":"OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons).","tip":"Don't let the word \"oxidation\" fool you into thinking oxygen must be added. Focus on electrons."},{"id":"G-F034","unit":"ch4","sec":"ch4-glycolysis","focus":[],"type":"mcq","stem":"A pathway invests two ATP and later produces four ATP from one glucose. What is its net direct ATP yield?","opts":[{"t":"Zero ATP net.","c":false},{"t":"Four ATP net.","c":false},{"t":"Six ATP net.","c":false},{"t":"Two ATP.","c":true}],"why":"Net yield subtracts the ATP invested from the ATP produced.","diff":2,"origin":"guide","src":"practice","trick":"Glycolysis: spend 2, earn 4, keep 2.","tip":"\"Net\" means subtract what was invested. Always check whether a question asks gross or net yield."},{"id":"G-F035","unit":"ch4","sec":"ch4-aerobic","focus":[],"type":"mcq","stem":"A labeled acetyl group enters a mitochondrial cycle, while a four-carbon acceptor is regenerated. Which cycle is modeled?","opts":[{"t":"Glycolysis.","c":false},{"t":"Lactate formation.","c":false},{"t":"The electron transport chain.","c":false},{"t":"Citric acid cycle.","c":true}],"why":"Acetyl-CoA contributes carbon to the citric acid cycle while oxaloacetate is regenerated.","diff":2,"origin":"guide","src":"practice","trick":"Citric acid (Krebs) cycle: acetyl (2C) + oxaloacetate (4C) = citrate (6C), and the 4C comes back around.","tip":"If a cycle in the mitochondrial matrix regenerates its starting molecule, it is the Krebs/citric acid cycle."},{"id":"G-F036","unit":"ch4","sec":"ch4-aerobic","focus":[],"type":"mcq","stem":"A membrane becomes leaky to protons so they return without passing through ATP synthase. What is expected?","opts":[{"t":"More ATP captured per oxygen without any proton gradient.","c":false},{"t":"Less ATP capture despite possible continued electron transfer.","c":true},{"t":"A growing proton gradient despite unrestricted proton return.","c":false},{"t":"No effect because ATP synthase uses only direct phosphate transfer.","c":false}],"why":"Uncoupling dissipates the proton gradient and reduces its use for ATP synthesis.","diff":2,"origin":"guide","src":"practice","trick":"Proton gradient = water behind a dam. A leak lets water bypass the turbine (ATP synthase): less power.","tip":"Electron transport builds the gradient; ATP synthase uses it. Break the gradient and ATP output falls."},{"id":"G-F037","unit":"ch4","sec":"ch4-fuels","focus":[],"type":"mcq","stem":"An amino acid contributes its carbon skeleton to energy pathways after its nitrogen group is removed. Which process is involved?","opts":[{"t":"Direct transfer of the intact amino acid into DNA replication.","c":false},{"t":"Phosphorylation of the amino group into ATP.","c":false},{"t":"Conversion of every nitrogen atom directly to glucose carbon.","c":false},{"t":"Deamination followed by metabolic entry.","c":true}],"why":"Amino-group removal permits selected carbon skeletons to enter shared metabolic pathways while nitrogen requires handling.","diff":2,"origin":"guide","src":"practice","trick":"DE-amination = remove the AMINE (nitrogen) tag, then burn the carbon body.","tip":"Proteins become fuel only after deamination. The removed nitrogen becomes ammonia, then urea."},{"id":"G-F038","unit":"ch4","sec":"ch4-replication","focus":[],"type":"mcq","stem":"A model shows discontinuous short DNA segments later joined on one side of a replication fork. What explains the pattern?","opts":[{"t":"DNA synthesis proceeds equally in both chemical directions.","c":false},{"t":"The lagging strand is made only after cell division finishes.","c":false},{"t":"Polymerase directionality requires lagging-strand fragments.","c":true},{"t":"Complementary pairing is absent on the lagging strand.","c":false}],"why":"DNA synthesis proceeds 5′ to 3′; fork geometry leads to discontinuous lagging-strand synthesis.","diff":2,"origin":"guide","src":"practice","trick":"Lagging strand = building a fence walking backward: short pieces (Okazaki fragments) glued by ligase.","tip":"DNA polymerase only builds 5′→3′. That one rule explains the leading strand and the lagging-strand fragments."},{"id":"G-F039","unit":"ch4","sec":"ch4-expression","focus":[],"type":"mcq","stem":"A ribosome reaches an in-frame termination codon. What normally follows?","opts":[{"t":"Release of the completed polypeptide through termination machinery.","c":true},{"t":"Addition of a stop amino acid by an ordinary tRNA.","c":false},{"t":"Replication of the mRNA into chromosomal DNA.","c":false},{"t":"Continued elongation through every stop codon.","c":false}],"why":"Stop codons recruit termination factors rather than an ordinary aminoacyl-tRNA specifying another amino acid.","diff":2,"origin":"guide","src":"practice","trick":"Stop codon = the period at the end of the sentence. UAA, UAG, UGA: \"U Are Away, U Are Gone, U Go Away\".","tip":"Stop codons don't code an amino acid. They bring release factors that free the finished chain."},{"id":"G-F040","unit":"ch4","sec":"ch4-expression","focus":[],"type":"mcq","stem":"A DNA alteration changes one codon but leaves the encoded amino acid unchanged. What principle permits this?","opts":[{"t":"Several codons can specify the same amino acid.","c":true},{"t":"Every DNA sequence change necessarily changes its amino acid.","c":false},{"t":"The codon is read using amino acid rather than nucleotide triplets.","c":false},{"t":"A change in a codon cannot occur in a coding sequence.","c":false}],"why":"Degeneracy of the genetic code permits some sequence changes without an amino acid substitution.","diff":2,"origin":"guide","src":"practice","trick":"The code has synonyms: several codons \"spell\" the same amino acid, like color and colour.","tip":"A silent mutation changes DNA but not the protein. This works because the code is redundant (degenerate)."},{"id":"G-F041","unit":"ch5","sec":"ch5-epithelia","focus":[],"type":"mcq","stem":"A stratified tissue has cuboidal basal cells and flattened surface cells. Which shape determines its epithelial name?","opts":[{"t":"The flattened apical cells.","c":true},{"t":"The shape of the underlying connective tissue cells.","c":false},{"t":"The number of vessels in the underlying dermis.","c":false},{"t":"The shape of the deepest basal cells.","c":false}],"why":"Stratified epithelia are named by their apical cell shape, so this arrangement is stratified squamous.","diff":2,"origin":"guide","src":"practice","trick":"Name a stratified tissue by its TOP layer, like naming a cake by its frosting.","tip":"For stratified epithelium, only the apical (surface) cell shape counts toward the name."},{"id":"G-F042","unit":"ch5","sec":"ch5-simple","focus":[],"type":"mcq","stem":"An airway's cilia fail while mucus production continues. Which consequence follows directly?","opts":[{"t":"Conversion of airway epithelium directly into cartilage.","c":false},{"t":"More efficient mucus clearance despite immobile cilia.","c":false},{"t":"Impaired movement of mucus and trapped particles.","c":true},{"t":"Complete cessation of secretion by every goblet cell.","c":false}],"why":"Cilia move material along the airway surface; goblet-cell secretion alone does not provide clearance.","diff":2,"origin":"guide","src":"practice","trick":"Mucus is the flypaper; cilia are the conveyor belt. No belt = sticky gunk stays put.","tip":"Separate the jobs: goblet cells make mucus, cilia move it. Lose the cilia and clearance fails."},{"id":"G-F043","unit":"ch5","sec":"ch5-stratified","focus":[],"type":"mcq","stem":"A moist abrasion-prone lining has many layers but lacks a thick dead keratinized surface. Which tissue fits?","opts":[{"t":"Keratinized stratified squamous epithelium.","c":false},{"t":"Nonkeratinized stratified squamous epithelium.","c":true},{"t":"Pseudostratified ciliated columnar epithelium.","c":false},{"t":"Simple cuboidal epithelium.","c":false}],"why":"Multiple layers resist abrasion, while nonkeratinized apical cells remain suited to moist surfaces.","diff":2,"origin":"guide","src":"practice","trick":"Wet and rubbed (mouth, esophagus, vagina) = many layers, NO dead keratin cap.","tip":"Keratinized = dry skin surface. Nonkeratinized = moist linings that still face friction."},{"id":"G-F044","unit":"ch5","sec":"ch5-glands","focus":[],"type":"mcq","stem":"A gland releases a hormone without a duct into surrounding fluid for transport in blood. Which category fits?","opts":[{"t":"A gland defined solely by an unbranched surface duct.","c":false},{"t":"Holocrine as a destination category.","c":false},{"t":"Exocrine.","c":false},{"t":"Endocrine.","c":true}],"why":"Endocrine secretion uses interstitial fluid and circulation rather than a duct to a surface/lumen.","diff":2,"origin":"guide","src":"practice","trick":"ENDOcrine = released INTO the blood, no duct. EXOcrine = EXITs through a duct.","tip":"Hormones in the bloodstream = endocrine. Sweat, saliva and digestive enzymes through a duct = exocrine."},{"id":"G-F045","unit":"ch5","sec":"ch5-matrix","focus":[],"type":"mcq","stem":"A fiber stretches and returns toward its original length after unloading. Which matrix component best supplies this property?","opts":[{"t":"Calcium phosphate mineral deposits.","c":false},{"t":"Collagen fibers specialized mainly for tensile strength.","c":false},{"t":"Elastic fibers.","c":true},{"t":"Reticular fibers as the main source of elastic recoil.","c":false}],"why":"Elastic fibers support recoil, whereas collagen chiefly provides tensile strength.","diff":2,"origin":"guide","src":"practice","trick":"ELASTIC fibers are rubber bands: stretch and snap back. Collagen is rope: strong, doesn't stretch.","tip":"Recoil = elastic fibers. Strength against pulling = collagen. Mesh framework = reticular."},{"id":"G-F046","unit":"ch5","sec":"ch5-connective","focus":[],"type":"mcq","stem":"A support tissue must resist multidirectional pulling beneath epidermis. Which arrangement is appropriate?","opts":[{"t":"Parallel collagen in dense regular tissue.","c":false},{"t":"Avascular hyaline cartilage replacing all dermis.","c":false},{"t":"Interwoven collagen in dense irregular tissue.","c":true},{"t":"Sparse fibers in areolar tissue as the main tensile framework.","c":false}],"why":"Dense irregular collagen networks distribute tensile resistance across multiple directions.","diff":2,"origin":"guide","src":"practice","trick":"Dense IRREGULAR = a woven basket: fibers run every way, so it resists pulls from every way.","tip":"Regular = parallel fibers, one direction (tendons). Irregular = many directions (dermis)."},{"id":"G-F047","unit":"ch5","sec":"ch5-connective","focus":[],"type":"mcq","stem":"A tissue framework supports many mobile immune cells through a delicate branching fiber network. Which type fits?","opts":[{"t":"Reticular connective tissue.","c":true},{"t":"Dense regular connective tissue.","c":false},{"t":"Elastic cartilage.","c":false},{"t":"Stratified cuboidal epithelium.","c":false}],"why":"Reticular fibers provide supporting stroma in lymphoid organs and marrow.","diff":2,"origin":"guide","src":"practice","trick":"RETICular = a neT (reticulum = little net) that holds immune cells in place.","tip":"Lymph nodes, spleen and bone marrow are framed by reticular tissue."},{"id":"G-F048","unit":"ch5","sec":"ch5-connective","focus":[],"type":"mcq","stem":"A specimen contains erythrocytes, leukocytes, and platelets suspended in extracellular fluid. What explains its connective-tissue classification?","opts":[{"t":"All connective tissue must have a mineralized matrix.","c":false},{"t":"It contains no extracellular matrix.","c":false},{"t":"Its cells form one continuous tight epithelial sheet.","c":false},{"t":"Its cells and fragments are suspended in a specialized liquid matrix.","c":true}],"why":"Blood is a connective tissue with plasma as its liquid matrix.","diff":2,"origin":"guide","src":"practice","trick":"Blood is connective tissue in liquid form: cells floating in a fluid matrix (plasma).","tip":"Every connective tissue = cells + matrix. In blood, the matrix is plasma."},{"id":"G-F049","unit":"ch5","sec":"ch5-membranes","focus":[],"type":"mcq","stem":"A ring of tissue narrows an intestinal lumen through gradual involuntary contractions. Which tissue is best suited to this visceral wall function?","opts":[{"t":"Skeletal muscle.","c":false},{"t":"Smooth muscle.","c":true},{"t":"Dense elastic connective tissue.","c":false},{"t":"Cardiac muscle.","c":false}],"why":"Smooth muscle is common in hollow-organ walls and lacks the striation pattern of skeletal/cardiac muscle.","diff":2,"origin":"guide","src":"practice","trick":"SMOOTH muscle = slow, steady squeezing you can't control, like the gut's toothpaste-tube push.","tip":"Hollow organ walls + involuntary = smooth muscle. Striated + voluntary = skeletal. Striated + involuntary = cardiac."},{"id":"G-F050","unit":"ch5","sec":"ch5-membranes","focus":[],"type":"mcq","stem":"A covering consists of mesothelium over thin connective tissue and reduces friction around a ventral organ. Which membrane fits?","opts":[{"t":"Synovial membrane.","c":false},{"t":"Serous membrane.","c":true},{"t":"Mucous membrane.","c":false},{"t":"Cutaneous membrane.","c":false}],"why":"Serous membranes combine mesothelium with connective tissue and provide lubricated organ surfaces.","diff":2,"origin":"guide","src":"practice","trick":"SERous = SERUM-like slippery fluid between organ and wall so organs glide.","tip":"Serous membranes line closed ventral cavities. Mucous membranes line tubes that open to the outside."},{"id":"G-F051","unit":"ch6","sec":"ch6-layers","focus":[],"type":"mcq","stem":"A skin sample contains vascular collagen-rich connective tissue beneath an avascular epithelium. Which layer is collagen-rich and vascular?","opts":[{"t":"The entire epidermis.","c":false},{"t":"Dermis.","c":true},{"t":"Stratum lucidum.","c":false},{"t":"Stratum corneum.","c":false}],"why":"The dermis contains blood vessels and connective matrix; epidermis is avascular epithelium.","diff":2,"origin":"guide","src":"practice","trick":"DERMIS = the \"Deep\" layer with the plumbing (vessels). EPIdermis on top has none.","tip":"If it has blood vessels, it is not epithelium. Epidermis is avascular; dermis is vascular connective tissue."},{"id":"G-F052","unit":"ch6","sec":"ch6-layers","focus":[],"type":"mcq","stem":"Keratinocytes move from a dividing basal population toward a shedding surface. What maintains normal thickness over time?","opts":[{"t":"Replacement solely through pigment production.","c":false},{"t":"Permanent retention of every superficial cell.","c":false},{"t":"Balanced production, differentiation, and cell loss.","c":true},{"t":"Division of mature corneocytes as the only renewal source.","c":false}],"why":"Normal epidermal homeostasis coordinates basal production with surface shedding.","diff":2,"origin":"guide","src":"practice","trick":"Epidermis = an escalator: new cells step on at the bottom while old ones fall off the top.","tip":"Normal thickness needs balance. Too much production or too little shedding thickens the skin."},{"id":"G-F053","unit":"ch6","sec":"ch6-dermis","focus":[],"type":"mcq","stem":"An instructor compares a superficial tactile corpuscle with a deep lamellated corpuscle. Which distinction is accurate?","opts":[{"t":"They differ only in pigment production, not neural function.","c":false},{"t":"They are both pain-specific free endings without encapsulation.","c":false},{"t":"They occur at identical depths and detect exactly the same stimulus dynamics.","c":false},{"t":"They occupy different depths and emphasize different mechanical stimulus features.","c":true}],"why":"Meissner and Pacinian corpuscles differ in location, encapsulation, and stimulus sensitivity.","diff":2,"origin":"guide","src":"practice","trick":"MEISSNER = light touch, near the surface (\"Mice step lightly\"). PACINIAN = deep Pressure and vibration.","tip":"Receptor questions usually turn on depth and stimulus type: superficial light touch vs deep pressure/vibration."},{"id":"G-F054","unit":"ch6","sec":"ch6-accessory","focus":[],"type":"mcq","stem":"A hair shaft protrudes above the surface while its growing matrix remains deep in a follicle. What is true about the visible shaft?","opts":[{"t":"Living smooth muscle fibers that directly raise the hair.","c":false},{"t":"A layer of cells actively secreting melanin into blood.","c":false},{"t":"It consists largely of dead keratinized cells.","c":true},{"t":"Dividing basal matrix cells throughout the exposed shaft.","c":false}],"why":"Hair growth occurs in living follicular regions; the exposed shaft is keratinized material.","diff":2,"origin":"guide","src":"practice","trick":"Hair you see is dead, like a nail clipping. Only the root in the follicle is alive.","tip":"That's why cutting hair doesn't hurt: the visible shaft is dead keratinized cells."},{"id":"G-F055","unit":"ch6","sec":"ch6-sweat","focus":[],"type":"mcq","stem":"A sebaceous gland empties oily product into a follicle. How does this differ from ordinary eccrine sweat release?","opts":[{"t":"Sebaceous glands are primarily the body's evaporative cooling glands.","c":false},{"t":"Sebaceous product includes whole-cell breakdown; eccrine product is released mainly by exocytosis.","c":true},{"t":"Both release only water through the same duct type.","c":false},{"t":"Eccrine glands use whole-cell breakdown while sebaceous glands use only exocytosis.","c":false}],"why":"Holocrine sebaceous secretion differs from merocrine eccrine release.","diff":2,"origin":"guide","src":"practice","trick":"SEBACEOUS = holocrine: the Whole cell bursts (\"holo\" = whole). ECCRINE = merocrine: just squirts out.","tip":"Holocrine glands lose the whole cell. Merocrine glands release product by exocytosis and the cell survives."},{"id":"G-F056","unit":"ch6","sec":"ch6-temperature","focus":[],"type":"mcq","stem":"A warm hand is placed against a cooler metal surface and transfers heat by direct contact. Which transfer mode is emphasized?","opts":[{"t":"Convection.","c":false},{"t":"Conduction.","c":true},{"t":"Evaporation.","c":false},{"t":"Radiation.","c":false}],"why":"Conduction transfers thermal energy through physical contact.","diff":2,"origin":"guide","src":"practice","trick":"CONDUCTION = Contact. Touching a cold rail pulls heat straight out of your hand.","tip":"Conduction = direct touch, convection = moving air/water, radiation = infrared waves, evaporation = sweat drying."},{"id":"G-F057","unit":"ch6","sec":"ch6-temperature","focus":[],"type":"mcq","stem":"A person's skin blood flow increases in a cooler environment while core temperature is high. What is the likely heat-transfer effect?","opts":[{"t":"No effect on thermal transfer because only sweating matters.","c":false},{"t":"Reduced outward heat transfer solely because vessel diameter increased.","c":false},{"t":"Greater transfer of heat from blood to the environment.","c":true},{"t":"Guaranteed inward heat transfer regardless of environmental temperature.","c":false}],"why":"Cutaneous vasodilation commonly increases heat loss when environmental conditions permit outward transfer.","diff":2,"origin":"guide","src":"practice","trick":"Dilated skin vessels = rolling down the car windows to let heat out.","tip":"Vasodilation brings warm blood to the skin to lose heat. It works best when the air is cooler than the skin."},{"id":"G-F058","unit":"ch6","sec":"ch6-pigment","focus":[],"type":"mcq","stem":"A superficial skin color change results from a pigment produced in basal epidermal cells and transferred to keratinocytes. Which pigment fits?","opts":[{"t":"Melanin.","c":true},{"t":"Carotene.","c":false},{"t":"Bilirubin.","c":false},{"t":"Hemoglobin.","c":false}],"why":"Melanocytes produce melanin and transfer pigment-containing material to surrounding epidermal cells.","diff":2,"origin":"guide","src":"practice","trick":"MELANOcytes make MELANin and hand it up to keratinocytes like umbrellas over the nucleus.","tip":"Melanin = brown-black UV shield made in the stratum basale. Carotene (yellow) and hemoglobin (red) also color skin."},{"id":"G-F059","unit":"ch6","sec":"ch6-repair","focus":[],"type":"mcq","stem":"A deep wound fills with collagen-producing cells during repair. Which cell type is performing this matrix-building role?","opts":[{"t":"Mast cell releasing histamine.","c":false},{"t":"Fibroblast.","c":true},{"t":"Macrophage performing phagocytosis.","c":false},{"t":"Melanocyte transferring pigment.","c":false}],"why":"Fibroblasts produce connective matrix and collagen during repair and scar formation.","diff":2,"origin":"guide","src":"practice","trick":"FIBROblasts BUILD FIBERS: the construction crew that lays down collagen and scar.","tip":"-blast = builder. Fibroblasts build connective tissue; osteoblasts build bone."},{"id":"G-F060","unit":"ch6","sec":"ch6-repair","focus":[],"type":"mcq","stem":"A burn diagram reports affected surface percentage but omits depth. Which conclusion is justified?","opts":[{"t":"The area percentage proves identical tissue depth.","c":false},{"t":"A small area excludes full-thickness injury.","c":false},{"t":"Area alone cannot establish which regenerative structures survived.","c":true},{"t":"Area alone specifies the survival of all hair follicles.","c":false}],"why":"Depth and extent are separate dimensions; both influence physiological consequences and repair.","diff":2,"origin":"guide","src":"practice","trick":"Rule of nines tells you HOW MUCH skin, not HOW DEEP. You need both.","tip":"Don't over-conclude. Burn size (%TBSA) and burn depth are separate pieces of information."},{"id":"G-F061","unit":"ch7","sec":"ch7-shape","focus":[],"type":"mcq","stem":"A bone has a shaft with expanded ends and supports a limb lever. Which classification fits?","opts":[{"t":"Irregular bone.","c":false},{"t":"Long bone.","c":true},{"t":"Flat bone.","c":false},{"t":"Short bone.","c":false}],"why":"Long bones have an elongated shaft and ends; classification is based on shape rather than absolute size alone.","diff":2,"origin":"guide","src":"practice","trick":"Long bone = longer than it is wide, with a shaft and two knobby ends (even finger bones!).","tip":"Bone shape is about proportions, not size. Small finger phalanges are still long bones."},{"id":"G-F062","unit":"ch7","sec":"ch7-long-bone","focus":[],"type":"mcq","stem":"A learner labels the long central shaft separately from an end region. Which label belongs on the shaft?","opts":[{"t":"Epiphysis.","c":false},{"t":"Periosteum.","c":false},{"t":"Diaphysis.","c":true},{"t":"Metaphysis.","c":false}],"why":"The diaphysis is the shaft of a long bone; epiphyses are its ends.","diff":2,"origin":"guide","src":"practice","trick":"DIAPHYSIS = the shaft is the \"Divider\" between the two ends. EPIphysis = the ends on top.","tip":"Shaft = diaphysis, ends = epiphyses, the flared region between = metaphysis."},{"id":"G-F063","unit":"ch7","sec":"ch7-compact-spongy","focus":[],"type":"mcq","stem":"A microscopic unit contains concentric lamellae around a vessel-bearing passage. Which structure is modeled?","opts":[{"t":"A cartilage isogenous group.","c":false},{"t":"Osteon around a central canal.","c":true},{"t":"A trabecula without an osteon.","c":false},{"t":"A sarcomere between Z discs.","c":false}],"why":"Compact bone osteons organize lamellae around central canals containing vessels and nerves.","diff":2,"origin":"guide","src":"practice","trick":"Osteon = tree rings around a central pipe (the central canal with vessels and nerves).","tip":"Concentric rings + central canal = osteon = compact bone. Spongy bone has trabeculae instead."},{"id":"G-F064","unit":"ch7","sec":"ch7-compact-spongy","focus":[],"type":"mcq","stem":"A learner describes mature bone cells communicating through small channels in a mineralized matrix. Which pairing is accurate?","opts":[{"t":"Fibroblasts and dense regular fascicles.","c":false},{"t":"Osteocytes and canaliculi.","c":true},{"t":"Chondrocytes and perichondrium.","c":false},{"t":"Osteoblasts and medullary cavity as intercellular channels.","c":false}],"why":"Osteocytes reside in lacunae and communicate through canaliculi across bone matrix.","diff":2,"origin":"guide","src":"practice","trick":"Osteocytes live in lacunae (\"little lakes\") and talk through canaliculi (\"little canals\").","tip":"Canaliculi connect osteocytes so they can share nutrients and signals through hard matrix."},{"id":"G-F065","unit":"ch7","sec":"ch7-growth","focus":[],"type":"mcq","stem":"A growth plate closes as cartilage is replaced by bone. Which type of growth is most directly limited afterward?","opts":[{"t":"All lifelong remodeling.","c":false},{"t":"All marrow hematopoiesis.","c":false},{"t":"All appositional thickening.","c":false},{"t":"Further longitudinal growth at that plate.","c":true}],"why":"Epiphyseal plates permit lengthening; closure limits additional longitudinal growth at that site.","diff":2,"origin":"guide","src":"practice","trick":"Growth plate = the \"grow zone\". Once it turns to bone, the bone can't get longer.","tip":"After the epiphyseal plate closes, bones can still get thicker, but not longer."},{"id":"G-F066","unit":"ch7","sec":"ch7-fractures","focus":[],"type":"mcq","stem":"After a fracture callus forms, excess bony material is removed during remodeling. Which cell activity contributes?","opts":[{"t":"Osteoblastic matrix deposition alone.","c":false},{"t":"Fibroblast secretion of only dense regular tendon.","c":false},{"t":"Osteoclastic resorption.","c":true},{"t":"Chondrocyte proliferation without mineral remodeling.","c":false}],"why":"Osteoclasts resorb bone while osteoblasts form new matrix, reshaping the repair region.","diff":2,"origin":"guide","src":"practice","trick":"Osteo-CLASTS = Clean up / Chew bone. Osteo-BLASTS = Build bone.","tip":"In remodeling and fracture repair, osteoclasts remove extra callus while osteoblasts lay new bone."},{"id":"G-F067","unit":"ch7","sec":"ch7-axial","focus":[],"type":"mcq","stem":"A student builds a lumbar-only model with eight movable vertebrae. To represent the usual adult lumbar count, how many pieces should be removed?","opts":[{"t":"Two.","c":false},{"t":"One.","c":false},{"t":"Five.","c":false},{"t":"Three.","c":true}],"why":"The usual lumbar count is five, so an eight-piece model contains three extra pieces.","diff":2,"origin":"guide","src":"practice","trick":"Breakfast at 7, lunch at 12, dinner at 5: 7 cervical, 12 thoracic, 5 lumbar.","tip":"For number questions, write the real count first (5 lumbar), then do the math (8 − 5 = 3)."},{"id":"G-F068","unit":"ch7","sec":"ch7-axial","focus":[],"type":"mcq","stem":"A side-view skull model marks the junction between temporal and parietal regions. Which joint type characterizes this connection?","opts":[{"t":"A freely movable ball-and-socket joint.","c":false},{"t":"A cartilaginous symphysis.","c":false},{"t":"A synovial hinge joint.","c":false},{"t":"Fibrous suture.","c":true}],"why":"Cranial bones meet at fibrous sutures; named sutures identify particular skull boundaries.","diff":2,"origin":"guide","src":"practice","trick":"Skull bones are zipped together by sutures, like stitches in a baseball.","tip":"Sutures are fibrous joints that barely move. The squamous suture joins temporal and parietal bones."},{"id":"G-F069","unit":"ch7","sec":"ch7-appendicular","focus":[],"type":"mcq","stem":"A replica has a rounded proximal head fitting the scapular socket and a distal end articulating with radius and ulna. Which bone is represented?","opts":[{"t":"Humerus.","c":true},{"t":"Radius.","c":false},{"t":"Ulna.","c":false},{"t":"Clavicle.","c":false}],"why":"The humerus is the arm bone; radius and ulna occupy the forearm, and femur the thigh.","diff":2,"origin":"guide","src":"practice","trick":"HUMERUS: the only bone in the upper arm (it's \"humorous\" when you hit your funny bone near it).","tip":"Arm = humerus. Forearm = radius (thumb side) and ulna (pinky side). Thigh = femur."},{"id":"G-F070","unit":"ch7","sec":"ch7-marrow","focus":[],"type":"mcq","stem":"A skeleton model emphasizes red marrow as well as mineralized support. Which additional function belongs to the skeleton?","opts":[{"t":"Hormone storage in an endocrine follicle.","c":false},{"t":"Bile production.","c":false},{"t":"Urine filtration.","c":false},{"t":"Blood cell production.","c":true}],"why":"Red marrow supports hematopoiesis, complementing support, protection, movement, and mineral storage.","diff":2,"origin":"guide","src":"practice","trick":"Bones are a blood factory: red marrow makes red cells, white cells and platelets.","tip":"Skeleton functions: support, protection, movement, blood cell formation, and storage of minerals (calcium, phosphate) and fat (yellow marrow)."},{"id":"G-F071","unit":"ch8","sec":"ch8-overview","focus":[],"type":"mcq","stem":"An articulation has a fluid-filled space, capsule, and articular cartilage. Which structural class fits?","opts":[{"t":"Cartilaginous.","c":false},{"t":"Fibrous.","c":false},{"t":"A solid bony fusion.","c":false},{"t":"Synovial.","c":true}],"why":"A synovial cavity and capsule distinguish synovial joints from fibrous and cartilaginous classes.","diff":2,"origin":"guide","src":"practice","trick":"SYNOVIAL = a joint with a fluid-filled \"bubble\" (cavity) wrapped in a capsule.","tip":"Cavity + capsule + cartilage + fluid = synovial. Fibrous and cartilaginous joints have no cavity."},{"id":"G-F072","unit":"ch8","sec":"ch8-synovial-structure","focus":[],"type":"mcq","stem":"A joint model has dense bands connecting bone to bone around its capsule. Which structures reinforce stability?","opts":[{"t":"Ligaments.","c":true},{"t":"Articular cartilage replacing every external restraint.","c":false},{"t":"Synovial fluid acting as a tensile band.","c":false},{"t":"Tendons joining muscle to bone.","c":false}],"why":"Ligaments generally connect bone to bone and help stabilize joints.","diff":2,"origin":"guide","src":"practice","trick":"LIGAMENTS Link bone to bone. TENDONS Tie muscle to bone.","tip":"Ligament vs tendon is a favorite distractor. Bone-to-bone always means ligament."},{"id":"G-F073","unit":"ch8","sec":"ch8-types","focus":[],"type":"mcq","stem":"A model allows rotation around one longitudinal axis, as in the atlas-axis region. Which joint type best fits?","opts":[{"t":"Hinge.","c":false},{"t":"Pivot.","c":true},{"t":"Saddle.","c":false},{"t":"Condylar.","c":false}],"why":"Pivot joints permit axial rotation around a central axis.","diff":2,"origin":"guide","src":"practice","trick":"PIVOT = shaking your head \"no\" at the atlas and axis.","tip":"Rotation around one axis = pivot (atlas–axis, radius–ulna). A hinge only bends and straightens."},{"id":"G-F074","unit":"ch8","sec":"ch8-types","focus":[],"type":"mcq","stem":"An articulation needs multiaxial motion and circumduction like a shoulder. Which form is suited to this?","opts":[{"t":"Plane.","c":false},{"t":"Ball-and-socket.","c":true},{"t":"Hinge.","c":false},{"t":"Pivot.","c":false}],"why":"Ball-and-socket geometry allows movement in several planes, including rotation.","diff":2,"origin":"guide","src":"practice","trick":"Ball-and-socket = a joystick: moves every direction and can draw circles.","tip":"Only the shoulder and hip are ball-and-socket. They allow movement in all planes plus rotation."},{"id":"G-F075","unit":"ch8","sec":"ch8-movements","focus":[],"type":"mcq","stem":"A person raises the upper limb laterally away from the trunk. Which movement occurs at the shoulder?","opts":[{"t":"Adduction.","c":false},{"t":"Medial rotation without abduction.","c":false},{"t":"Flexion at the elbow.","c":false},{"t":"Abduction.","c":true}],"why":"Abduction moves a segment away from the reference midline.","diff":2,"origin":"guide","src":"practice","trick":"ABduction = ABduct (take away) from the body. ADDuction = ADD back to the body.","tip":"Movement away from the midline is abduction. Picture doing a jumping jack."},{"id":"G-F076","unit":"ch8","sec":"ch8-movements","focus":[],"type":"mcq","stem":"With the elbow bent, a person rotates an empty hand into a palm-up position to receive a handful of coins. Which forearm movement is being demonstrated?","opts":[{"t":"Plantar flexion.","c":false},{"t":"Supination.","c":true},{"t":"Pronation.","c":false},{"t":"Abduction of the wrist.","c":false}],"why":"Supination turns the forearm/palm toward the anatomical-position orientation.","diff":2,"origin":"guide","src":"practice","trick":"SUPination = holding a bowl of SOUP. Pronation = palm down, pouring it out.","tip":"Supination = palm up (anatomical position). Pronation = palm down."},{"id":"G-F077","unit":"ch8","sec":"ch8-movements","focus":[],"type":"mcq","stem":"A foot moves so its dorsal surface approaches the anterior leg. Which movement is being practiced?","opts":[{"t":"Dorsiflexion.","c":true},{"t":"Eversion.","c":false},{"t":"Inversion.","c":false},{"t":"Plantar flexion.","c":false}],"why":"Dorsiflexion brings the top of the foot toward the shin.","diff":2,"origin":"guide","src":"practice","trick":"DORSiflexion = toes up toward the DORSum (top), like walking on your heels.","tip":"Dorsiflexion = top of foot toward shin. Plantar flexion = pointing toes, like pressing a gas pedal."},{"id":"G-F078","unit":"ch8","sec":"ch8-examples","focus":[],"type":"mcq","stem":"A knee model includes fibrocartilage pads between femur and tibia. What is one important role of these pads?","opts":[{"t":"Serving as the vascular red marrow of the knee.","c":false},{"t":"Distributing load and improving joint congruence.","c":true},{"t":"Replacing cruciate ligaments in limiting every translation.","c":false},{"t":"Producing synovial fluid as their sole role.","c":false}],"why":"Menisci help spread forces and improve congruence; they are not substitutes for all stabilizing structures.","diff":2,"origin":"guide","src":"practice","trick":"Menisci = shock-absorbing cushions that make the round femur sit better on the flat tibia.","tip":"Menisci spread the load and improve fit. Ligaments, not menisci, are the main stabilizers."},{"id":"G-F079","unit":"ch8","sec":"ch8-examples","focus":[],"type":"mcq","stem":"A deep socket and strong supporting structures favor stability in a weight-bearing ball-and-socket joint. Which example fits?","opts":[{"t":"Hip.","c":true},{"t":"Proximal radioulnar joint.","c":false},{"t":"Elbow.","c":false},{"t":"A sagittal skull suture.","c":false}],"why":"The hip balances mobility with weight-bearing stability through its deep acetabulum and supporting tissues.","diff":2,"origin":"guide","src":"practice","trick":"Hip = a deep cup (acetabulum) for stability. Shoulder = a shallow saucer for range of motion.","tip":"Weight-bearing joints trade mobility for stability. The hip is more stable but less mobile than the shoulder."},{"id":"G-F080","unit":"ch8","sec":"ch8-disorders","focus":[],"type":"mcq","stem":"An articular surface loses cartilage over time and joint mechanics deteriorate. Which tissue property helps explain limited spontaneous repair?","opts":[{"t":"Rapid turnover identical to basal epidermis.","c":false},{"t":"A complete absence of any extracellular matrix.","c":false},{"t":"Extensive vascular canals throughout all articular cartilage.","c":false},{"t":"Articular cartilage has little intrinsic vascular supply.","c":true}],"why":"Limited vascularity and specialized cartilage biology restrict intrinsic healing.","diff":2,"origin":"guide","src":"practice","trick":"Cartilage has no blood supply, so its repair crew can't get there.","tip":"Avascular tissues heal slowly. That's why cartilage damage (like osteoarthritis) tends to progress."},{"id":"G-F081","unit":"ch9","sec":"ch9-structure","focus":[],"type":"mcq","stem":"A connective sheath surrounds a whole skeletal muscle, while thinner sheaths separate fascicles and fibers. Which sheath surrounds the whole muscle?","opts":[{"t":"Perimysium.","c":false},{"t":"Endomysium.","c":false},{"t":"Deep fascia only, outside the epimysial sheath.","c":false},{"t":"Epimysium.","c":true}],"why":"Epimysium surrounds the whole muscle; perimysium fascicles and endomysium individual fibers.","diff":2,"origin":"guide","src":"practice","trick":"EPI = on top of everything (whole muscle), PERI = around a bundle (fascicle), ENDO = inside, on each fiber.","tip":"Wrap order from outside in: epimysium → perimysium → endomysium. Match the size of what's wrapped."},{"id":"G-F082","unit":"ch9","sec":"ch9-fiber","focus":[],"type":"mcq","stem":"A fiber's repeating dark/light pattern follows organized thick and thin filaments. Which structural unit underlies this organization?","opts":[{"t":"A motor end plate alone.","c":false},{"t":"Osteon.","c":false},{"t":"Myofibril as a single nonrepeating unit.","c":false},{"t":"Sarcomere.","c":true}],"why":"Sarcomeres organize actin and myosin into repeating contractile units that produce striation.","diff":2,"origin":"guide","src":"practice","trick":"SARCO-MERE = muscle (sarco) part (mere): the smallest repeating unit that contracts, Z line to Z line.","tip":"The sarcomere is the functional unit of contraction. Its repeating pattern makes the striations."},{"id":"G-F083","unit":"ch9","sec":"ch9-nmj","focus":[],"type":"mcq","stem":"A motor neuron releases transmitter at a skeletal muscle junction. Which transmitter initiates the usual postsynaptic response?","opts":[{"t":"Norepinephrine.","c":false},{"t":"Acetylcholine.","c":true},{"t":"Dopamine.","c":false},{"t":"Glycine.","c":false}],"why":"Acetylcholine activates nicotinic receptors at the skeletal neuromuscular junction.","diff":2,"origin":"guide","src":"practice","trick":"ACh = \"Activate Contraction, hey!\" It's the go signal at every skeletal neuromuscular junction.","tip":"Skeletal muscle is always triggered by acetylcholine binding nicotinic receptors on the motor end plate."},{"id":"G-F084","unit":"ch9","sec":"ch9-contraction","focus":[],"type":"mcq","stem":"Calcium binds a thin-filament regulatory complex and moves a blocking protein away from actin sites. Which sequence fits?","opts":[{"t":"Calcium binds troponin and shifts tropomyosin.","c":true},{"t":"Troponin removes calcium from the sarcoplasm to start contraction.","c":false},{"t":"Myosin stores calcium in place of the sarcoplasmic reticulum.","c":false},{"t":"Calcium binds directly to tropomyosin without a regulatory change.","c":false}],"why":"Calcium-troponin interaction changes thin-filament regulation, allowing cross-bridge cycling.","diff":2,"origin":"guide","src":"practice","trick":"Calcium is the key: it turns the TROPONIN lock, and the TROPOMYOSIN chain slides off actin's sites.","tip":"Order matters: Ca2+ binds troponin → tropomyosin moves → myosin binds actin."},{"id":"G-F085","unit":"ch9","sec":"ch9-contraction","focus":[],"type":"mcq","stem":"A myosin head remains tightly attached when ATP becomes unavailable. Which normal ATP role explains the attachment?","opts":[{"t":"ATP binding locks the attached head permanently.","c":false},{"t":"ATP binding promotes cross-bridge detachment.","c":true},{"t":"ATP is needed only to synthesize actin, not cross-bridge cycling.","c":false},{"t":"ATP release alone moves calcium into the extracellular space.","c":false}],"why":"ATP binding allows myosin to detach; hydrolysis helps reenergize the head for another cycle.","diff":2,"origin":"guide","src":"practice","trick":"ATP = the \"let go\" button for myosin. No ATP = rigor mortis (stuck grip).","tip":"People often think ATP only powers the pull. Its binding is also what releases the myosin head."},{"id":"G-F086","unit":"ch9","sec":"ch9-responses","focus":[],"type":"mcq","stem":"A muscle develops force while its total length remains nearly constant. Which contraction description fits?","opts":[{"t":"Isometric.","c":true},{"t":"Passive recoil without active tension.","c":false},{"t":"Eccentric lengthening.","c":false},{"t":"Concentric shortening.","c":false}],"why":"Isometric contraction develops tension without substantial overall length change.","diff":2,"origin":"guide","src":"practice","trick":"ISO-METRIC = same (iso) length (metric). Pushing a wall: lots of effort, no movement.","tip":"Isometric = tension, no length change. Isotonic = length changes and the load moves."},{"id":"G-F087","unit":"ch9","sec":"ch9-energy","focus":[],"type":"mcq","stem":"A muscle briefly uses phosphocreatine to replenish ATP during rapid demand. What is the immediate advantage?","opts":[{"t":"It removes the need for ATP during contraction.","c":false},{"t":"Rapid phosphate transfer helps buffer ATP availability.","c":true},{"t":"It produces oxygen for the electron transport chain.","c":false},{"t":"It supplies the largest long-term fuel reserve for days.","c":false}],"why":"Phosphocreatine provides a rapid limited reserve for ATP regeneration.","diff":2,"origin":"guide","src":"practice","trick":"Creatine phosphate = a phone's emergency battery pack: instant recharge, but it runs out in seconds.","tip":"Order of energy use: stored ATP → creatine phosphate (seconds) → anaerobic glycolysis → aerobic respiration."},{"id":"G-F088","unit":"ch9","sec":"ch9-smooth-cardiac","focus":[],"type":"mcq","stem":"A laboratory compound reduces involuntary vessel-wall constriction while leaving striated limb muscle fibers directly unaffected. Which tissue is the intended contractile target?","opts":[{"t":"Smooth muscle.","c":true},{"t":"A voluntary striated fiber with peripheral nuclei.","c":false},{"t":"Cardiac muscle.","c":false},{"t":"Skeletal muscle.","c":false}],"why":"Smooth muscle has a nonstriated spindle-shaped organization suited to many visceral walls.","diff":2,"origin":"guide","src":"practice","trick":"Vessel walls squeeze with SMOOTH muscle: no stripes, no voluntary control.","tip":"Involuntary + hollow organ or vessel wall + nonstriated = smooth muscle."},{"id":"G-F089","unit":"ch9","sec":"ch9-actions","focus":[],"type":"mcq","stem":"Two muscles produce opposite movements at a joint. How can their relationship be described?","opts":[{"t":"They can act as antagonists.","c":true},{"t":"They must act as the same agonist in every movement.","c":false},{"t":"They cannot be activated in a coordinated stabilizing pattern.","c":false},{"t":"They are synergists simply because their actions oppose.","c":false}],"why":"Antagonistic actions permit controlled opposing movements and stabilization.","diff":2,"origin":"guide","src":"practice","trick":"ANTAGONIST = the opponent: biceps bends, triceps straightens.","tip":"Prime mover (agonist) does the action; the antagonist does the opposite; synergists help."},{"id":"G-F090","unit":"ch9","sec":"ch9-structure","focus":[],"type":"mcq","stem":"A strong connective structure transmits muscle pull to bone. Which structure provides this linkage?","opts":[{"t":"Ligament.","c":false},{"t":"Synovial joint capsule.","c":false},{"t":"Tendon.","c":true},{"t":"Articular hyaline cartilage.","c":false}],"why":"Tendons connect muscle with bone and transmit tensile force.","diff":2,"origin":"guide","src":"practice","trick":"TENDON Ties muscle to bone (\"T for tie\"). Ligament links bone to bone.","tip":"Muscle pull reaches the bone through a tendon. Don't confuse it with a ligament."},{"id":"G-F091","unit":"ch10","sec":"ch10-divisions","focus":[],"type":"mcq","stem":"A pathway carries stretch information from a limb toward the spinal cord. Which functional direction applies?","opts":[{"t":"Efferent.","c":false},{"t":"Afferent.","c":true},{"t":"Postganglionic motor.","c":false},{"t":"A descending motor tract by definition.","c":false}],"why":"Sensory information traveling toward CNS is afferent regardless of where it appears on a drawing.","diff":2,"origin":"guide","src":"practice","trick":"SAME DAVE: Sensory = Afferent (Arrives), Motor = Efferent (Exits).","tip":"Direction is about the CNS: toward it = afferent, away from it = efferent. Ignore how the drawing is laid out."},{"id":"G-F092","unit":"ch10","sec":"ch10-neurons","focus":[],"type":"mcq","stem":"A neuronal cell region contains prominent rough ER supporting protein production. What is the material commonly called?","opts":[{"t":"A node of Ranvier.","c":false},{"t":"A Golgi stack in an axon terminal.","c":false},{"t":"Nissl substance.","c":true},{"t":"A myelin sheath.","c":false}],"why":"Nissl substance corresponds to rough ER and ribosomal material in soma and dendrites.","diff":2,"origin":"guide","src":"practice","trick":"NISSL bodies = rough ER \"nibbles\" in the cell body making proteins.","tip":"Nissl substance is rough ER found in the soma and dendrites, never in the axon."},{"id":"G-F093","unit":"ch10","sec":"ch10-glia","focus":[],"type":"mcq","stem":"A single peripheral glial cell wraps one segment of one axon in many membrane layers. Which cell fits?","opts":[{"t":"Oligodendrocyte.","c":false},{"t":"Schwann cell.","c":true},{"t":"Astrocyte.","c":false},{"t":"Microglial cell.","c":false}],"why":"Schwann cells produce individual PNS myelin segments; oligodendrocytes form CNS myelin.","diff":2,"origin":"guide","src":"practice","trick":"Schwann = Single segment, PNS. Oligodendrocyte = One cell, many CNS axons (oligo = few branches).","tip":"Myelin maker: Schwann cells in the PNS, oligodendrocytes in the CNS."},{"id":"G-F094","unit":"ch10","sec":"ch10-glia","focus":[],"type":"mcq","stem":"A fluid-filled neural cavity is lined by ciliated glial cells. Which CNS cell class is most relevant?","opts":[{"t":"Oligodendrocytes.","c":false},{"t":"Schwann cells.","c":false},{"t":"Ependymal cells.","c":true},{"t":"Astrocytes.","c":false}],"why":"Ependymal cells line ventricles and the central canal and contribute to the CSF environment.","diff":2,"origin":"guide","src":"practice","trick":"EPENDYMAL cells = the lining of the brain's fluid caves (ventricles), with cilia to stir CSF.","tip":"CNS glia: astrocytes (support, blood–brain barrier), microglia (immune), oligodendrocytes (myelin), ependymal (line ventricles, CSF)."},{"id":"G-F095","unit":"ch10","sec":"ch10-resting","focus":[],"type":"mcq","stem":"A graded response shifts from −70 to −80 mV. What effect does this change commonly have relative to a depolarizing threshold?","opts":[{"t":"It is depolarization because its magnitude increased.","c":false},{"t":"It moves the membrane closer to a depolarizing threshold.","c":false},{"t":"It moves the membrane farther from that threshold.","c":true},
