s that contradict each other: one of them is the answer."},{"id":"T-09","unit":"ch7","sec":"ch7-remodeling","focus":[["ch7-remodeling",0]],"type":"teaching","stem":"A nurse reviews calcium regulation with a client. Which statement indicates a need for further teaching?","why":"Calcitonin (from the thyroid) LOWERS blood calcium by inhibiting osteoclasts and helping osteoblasts deposit calcium in bone. PTH raises it.","diff":2,"origin":"new","opts":[{"t":"\"Calcitonin raises my blood calcium.\"","c":true},{"t":"\"Parathyroid hormone raises my blood calcium.\"","w":"Accurate."},{"t":"\"Vitamin D helps me absorb calcium from food.\"","w":"Accurate."},{"t":"\"Osteoclasts release calcium from bone.\"","w":"Accurate."}],"trick":"CalciTONEin TONES it down. PTH Pulls it up.","tip":"Opposing hormones: check which way each one pushes."},{"id":"T-10","unit":"ch11","sec":"ch11-autonomic","focus":[["ch11-autonomic",1]],"type":"teaching","stem":"A nursing student describes the autonomic nervous system. Which statement shows a need for more teaching?","why":"Sympathetic = mobilizes resources ('fight or flight'). Parasympathetic = digestion and energy conservation ('rest and digest'). Both work all the time.","diff":1,"origin":"new","opts":[{"t":"\"The sympathetic division is the 'rest and digest' system.\"","c":true},{"t":"\"The sympathetic division often raises heart rate during a challenge.\"","w":"Accurate."},{"t":"\"The parasympathetic division supports digestion and saving energy.\"","w":"Accurate."},{"t":"\"Both divisions are active in normal daily regulation.\"","w":"Accurate."}],"trick":"Sympathetic = Stress. Parasympathetic = Peace.","tip":"Swapped labels are the classic autonomic error."},{"id":"T-11","unit":"ch12","sec":"ch12-phototransduction","focus":[["ch12-phototransduction",1]],"type":"teaching","stem":"A 50-year-old client now needs reading glasses. Which statement by the client indicates a need for further teaching?","why":"Presbyopia (reduced near focus with age) and cataract (clouding of the lens) are different processes. Needing reading glasses is presbyopia.","diff":2,"origin":"new","opts":[{"t":"\"Needing reading glasses means I have cataracts.\"","c":true},{"t":"\"With age, my lens has a harder time focusing up close.\"","w":"Accurate: presbyopia."},{"t":"\"A cataract is a clouding of the lens.\"","w":"Accurate."},{"t":"\"Glaucoma involves damage to the optic nerve.\"","w":"Accurate."}],"trick":"Presbyopia = arms too short to read. Cataract = foggy window.","tip":"Similar age-related conditions: match each to its exact change."},{"id":"T-12","unit":"ch12","sec":"ch12-ear","focus":[],"type":"teaching","stem":"A nurse teaches hearing protection to factory workers. Which statement indicates a need for further teaching?","why":"The acoustic (tympanic) reflex tightens middle-ear muscles, but it has a delay and does not reliably protect against sudden loud impulses. Hearing protection is still needed.","diff":2,"origin":"new","opts":[{"t":"\"My middle-ear muscles fully protect me from any sudden loud bang.\"","c":true},{"t":"\"The middle-ear reflex can soften some steady loud sounds.\"","w":"Accurate."},{"t":"\"Damage to hair cells can cause sensorineural hearing loss.\"","w":"Accurate."},{"t":"\"Wearing ear protection around loud machines is important.\"","w":"Accurate."}],"trick":"The ear's reflex is a slow door. Sudden bangs get in first.","tip":"'Fully' and 'any' signal the false statement."},{"id":"T-13","unit":"ch10","sec":"ch10-synapses","focus":[["ch10-synapses",1]],"type":"teaching","stem":"A student reviews neurotransmitters. Which statement shows a need for more teaching?","why":"Glutamate is the major excitatory CNS transmitter. GABA is a major INHIBITORY one. Glycine commonly mediates spinal inhibition.","diff":2,"origin":"new","opts":[{"t":"\"GABA is the brain's main excitatory neurotransmitter.\"","c":true},{"t":"\"Glutamate is a major excitatory transmitter in the CNS.\"","w":"Accurate."},{"t":"\"Acetylcholinesterase breaks down acetylcholine.\"","w":"Accurate."},{"t":"\"Endorphins help modulate pain.\"","w":"Accurate."}],"trick":"GABA = 'Go Away, Brain Activity' (inhibitory).","tip":"Excitatory vs inhibitory pairs are easy to swap. Lock in one."},{"id":"T-14","unit":"ch3","sec":"ch3-differentiation","focus":[["ch3-differentiation",1]],"type":"teaching","stem":"A client is told a growth is benign. Which statement by the client indicates a need for further teaching?","why":"A benign tumor stays local and doesn't metastasize, but its location can still make it harmful, for example by pressing on nearby structures.","diff":2,"origin":"new","opts":[{"t":"\"Since it's benign, it can never cause any harm.\"","c":true},{"t":"\"A benign tumor doesn't spread to other parts of the body.\"","w":"Accurate."},{"t":"\"A malignant tumor can invade nearby tissue.\"","w":"Accurate."},{"t":"\"Where a tumor is located can matter, even if it's benign.\"","w":"Accurate."}],"trick":"Benign = stays put, but 'put' can still be a bad spot.","tip":"'Never' and 'any' are red flags."},{"id":"T-15","unit":"ch9","sec":"ch9-disorders","focus":[["ch9-disorders",0]],"type":"teaching","stem":"A client's leg muscles shrank while in a cast for 8 weeks. Which statement indicates a need for further teaching?","why":"Disuse atrophy shrinks capillary networks, mitochondria, and actin and myosin filaments. Exercise is the best way to rebuild and maintain muscle.","diff":1,"origin":"new","opts":[{"t":"\"Exercise won't help my muscle come back.\"","c":true},{"t":"\"My muscle shrank because I couldn't use it.\"","w":"Accurate: disuse atrophy."},{"t":"\"Disuse reduces the blood vessels and mitochondria in muscle.\"","w":"Accurate."},{"t":"\"Regular exercise helps keep muscles working as I age.\"","w":"Accurate."}],"trick":"Muscle follows 'use it or lose it', and you can use it to get it back.","tip":"A statement that would stop a client from getting better needs correcting."},{"id":"P2-01","unit":"ch1","sec":"ch1-homeostasis","focus":[["ch1-homeostasis",1]],"type":"priority","stem":"The nurse at a winter shelter receives four reports. Which client should the nurse see first?","why":"Shivering is an effector that makes heat. When a cold client STOPS shivering and becomes confused, temperature control is failing: shivering usually stops once core temperature falls below about 32 °C (90 °F), so this client is dangerously cold.","diff":2,"origin":"new","opts":[{"t":"A client with a temperature of 31 °C (87.8 °F) who has stopped shivering and is confused","c":true},{"t":"A client who is shivering after coming in from the cold, temperature 36.4 °C (97.5 °F)","w":"Shivering is the normal response that makes heat."},{"t":"A client who is sweating after carrying boxes upstairs","w":"Sweating after activity is normal cooling."},{"t":"A client asking for an extra blanket at bedtime","w":"A comfort request can wait."}],"trick":"Cold + no shivering + confused = the thermostat has given up.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-02","unit":"ch1","sec":"ch1-systems","focus":[["ch1-systems",1]],"type":"priority","stem":"The nurse on a medical unit reviews intake and output. Which client should the nurse see first?","why":"The kidneys regulate blood composition and make urine. Almost no urine for hours can mean the kidneys are failing or the client is severely dehydrated. Wastes and potassium can build up quickly.","diff":2,"origin":"new","opts":[{"t":"A client who has made almost no urine in the last 12 hours","c":true},{"t":"A client who urinated four times this morning after drinking a lot of water","w":"More fluid in means more urine out: expected."},{"t":"A client whose first urine of the morning is dark yellow","w":"Morning urine is often concentrated: expected."},{"t":"A client asking when the next meal tray arrives","w":"Can wait."}],"trick":"No urine = the body's filter has stopped.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-03","unit":"ch1","sec":"ch1-regions","focus":[["ch1-regions",0]],"type":"priority","stem":"Four clients call the clinic about abdominal pain. Which client should the nurse speak to first?","why":"Pain that moves from around the navel to the right lower quadrant, with fever and vomiting, is the classic pattern of appendicitis. An inflamed appendix can rupture, so this client needs care first.","diff":2,"origin":"new","opts":[{"t":"A client whose pain started near the navel, moved to the right lower quadrant, and now has fever and vomiting","c":true},{"t":"A client with mild epigastric burning after spicy food that eases with antacids","w":"Mild, relieved by antacids: less urgent."},{"t":"A client with left lower quadrant cramping before a bowel movement that eases afterward","w":"Relieved by a bowel movement: less urgent."},{"t":"A client with fullness in the hypogastric region who needs to urinate","w":"Bladder fullness is expected."}],"trick":"Navel → RLQ + fever = think appendix.","tip":"Use the client's right and left. Pain that is spreading, with fever, beats pain that is mild and relieved."},{"id":"P2-04","unit":"ch1","sec":"ch1-cavities","focus":[["ch1-cavities",0]],"type":"priority","stem":"The emergency nurse receives four clients after a car crash. Which client should the nurse see first?","why":"The pleural cavity is a thin space between two layers. If air enters it, the layers separate and the lung can collapse (pneumothorax). Missing breath sounds and fast breathing are a breathing emergency.","diff":2,"origin":"new","opts":[{"t":"A client with sharp chest pain, rapid breathing, and no breath sounds on one side","c":true},{"t":"A client with a bruise on the knee who can walk","w":"Stable injury."},{"t":"A client with a mild headache who is alert and talking","w":"Stable for now; reassess."},{"t":"A client with a small cut on the forearm that has stopped bleeding","w":"Bleeding is controlled."}],"trick":"Breathing problems beat bruises.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-05","unit":"ch2","sec":"ch2-carbohydrates","focus":[["ch2-carbohydrates",0]],"type":"priority","stem":"The nurse on a medical unit receives four reports before lunch. Which client should the nurse see first?","why":"Glucose, a monosaccharide, is the brain's main fuel. Sweating, shaking and confusion suggest low blood sugar (hypoglycemia), which can quickly lead to seizures or loss of consciousness.","diff":2,"origin":"new","opts":[{"t":"A client with diabetes who is sweaty, shaky, and suddenly confused","c":true},{"t":"A client with diabetes whose fasting blood glucose is 110 mg/dL","w":"Close to normal."},{"t":"A client asking which foods contain starch","w":"Teaching can wait."},{"t":"A client whose glucose is 150 mg/dL an hour after breakfast","w":"A mild rise after a meal is expected."}],"trick":"Sweaty, shaky, confused = feed the brain sugar now.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-06","unit":"ch2","sec":"ch2-water","focus":[["ch2-water",0]],"type":"priority","stem":"The home health nurse reviews four phone messages. Which client should the nurse call back first?","why":"Water carries nutrients, removes wastes and helps control temperature. Losing a lot of fluid causes low blood volume: dizziness on standing and little urine are signs of serious dehydration. Older adults get worse quickly.","diff":2,"origin":"new","opts":[{"t":"An older adult with 2 days of vomiting and diarrhea who is dizzy when standing and making very little urine","c":true},{"t":"A client who felt thirsty after gardening and is now drinking water","w":"Thirst that is being treated is expected."},{"t":"A client with mildly dry lips","w":"Mild and stable."},{"t":"A client asking how much water to drink each day","w":"Teaching can wait."}],"trick":"Losing fluid both ends + dizzy + little urine = dangerously dry.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-07","unit":"ch3","sec":"ch3-diffusion","focus":[["ch3-diffusion",0]],"type":"priority","stem":"The nurse on a respiratory unit receives report. Which client should the nurse see first?","why":"Oxygen crosses into the blood by diffusion through the thin alveolar wall. Fluid from pneumonia makes the barrier thicker, which slows diffusion. A falling oxygen level means gas exchange is getting worse.","diff":2,"origin":"new","opts":[{"t":"A client with pneumonia whose oxygen saturation dropped from 95% to 86%","c":true},{"t":"A client with pneumonia who has a productive cough and oxygen saturation of 95%","w":"Expected for pneumonia and stable."},{"t":"A client with a mild sore throat","w":"Not urgent."},{"t":"A client using an incentive spirometer as taught","w":"Doing what was taught."}],"trick":"Thicker barrier = slower diffusion = falling oxygen.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-08","unit":"ch4","sec":"ch4-aerobic","focus":[["ch4-aerobic",1]],"type":"priority","stem":"The emergency nurse receives four new clients. Which client should the nurse see first?","why":"Carbon monoxide blocks oxygen delivery to tissues. Without oxygen as the final electron acceptor, cells can't make enough ATP, and the brain is affected first (headache, confusion).","diff":2,"origin":"new","opts":[{"t":"A client found in a closed garage with a running car who has a headache and is confused","c":true},{"t":"A client with a headache after skipping morning coffee","w":"Caffeine withdrawal is uncomfortable but not dangerous."},{"t":"A client who feels tired after a double shift","w":"Expected fatigue."},{"t":"A client with sore muscles 2 days after lifting weights","w":"Delayed soreness is expected."}],"trick":"Car + closed garage + confusion = carbon monoxide. Cells are starving for oxygen.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-09","unit":"ch4","sec":"ch4-fuels","focus":[["ch4-fuels",1]],"type":"priority","stem":"The nurse on a medical unit receives four reports. Which client should the nurse see first?","why":"When cells can't use glucose, the body breaks down fat for fuel and makes ketone acids. Fruity breath, deep fast breathing and vomiting suggest the blood is becoming acidic (diabetic ketoacidosis), which is an emergency.","diff":2,"origin":"new","opts":[{"t":"A client with type 1 diabetes who has fruity-smelling breath, deep rapid breathing, and vomiting","c":true},{"t":"A client fasting for a lab test who says they feel hungry","w":"Expected while fasting."},{"t":"A client on a low-carbohydrate diet asking about healthy fats","w":"Teaching can wait."},{"t":"A client with type 2 diabetes whose glucose is 140 mg/dL after dinner","w":"A mild rise after a meal."}],"trick":"Fruity breath + deep breathing = burning fat, making acid.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-10","unit":"ch6","sec":"ch6-pigment","focus":[["ch6-pigment",1]],"type":"priority","stem":"The nurse on a medical unit checks the skin of four clients. Which client should the nurse see first?","why":"Pressure over a bony area squeezes blood vessels and starves the tissue of oxygen (ischemia). A deep purple area that does not blanch suggests deep tissue injury, so the client needs pressure relief now.","diff":2,"origin":"new","opts":[{"t":"A client on bed rest with a deep purple area over the sacrum that does not blanch when pressed","c":true},{"t":"A client with a red area on the elbow that blanches and fades within 20 minutes","w":"Blanching redness that fades is not yet tissue damage."},{"t":"A client with dry, flaky skin on both shins","w":"Common and not urgent."},{"t":"A client with an old, healed scar on the abdomen","w":"Healed tissue."}],"trick":"Blanches = blood can still get in. Doesn't blanch = tissue is being damaged.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-11","unit":"ch6","sec":"ch6-pigment","focus":[["ch6-pigment",0]],"type":"priority","stem":"The nurse in the newborn nursery assesses four infants and children. Which client should the nurse see first?","why":"Yellow skin comes from bilirubin. Jaundice in the first 24 hours of life is not the normal newborn pattern and can mean bilirubin is rising too fast, which can harm the brain.","diff":2,"origin":"new","opts":[{"t":"A newborn, 18 hours old, with yellow skin spreading down to the legs","c":true},{"t":"A newborn with bluish hands and feet but a pink body","w":"Acrocyanosis is common in newborns."},{"t":"A toddler with orange-tinged palms who eats a lot of carrots","w":"Carotene coloring is harmless."},{"t":"A school-age child with mild sunburn on the shoulders","w":"Mild and not urgent."}],"trick":"Yellow = bilirubin. Orange palms = carrots (carotene). Blue hands only = normal newborn.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-12","unit":"ch7","sec":"ch7-marrow","focus":[["ch7-marrow",1]],"type":"priority","stem":"The nurse on an oncology unit receives four reports. Which client should the nurse see first?","why":"Red marrow makes platelets. Chemotherapy can suppress marrow, and a very low platelet count means blood can't clot well. Active bleeding that won't stop is an emergency.","diff":2,"origin":"new","opts":[{"t":"A client receiving chemotherapy with a platelet count of 15,000/mm³ and a nosebleed that won't stop","c":true},{"t":"A client receiving chemotherapy who says they feel tired","w":"Expected side effect."},{"t":"A client with mild nausea who is keeping fluids down","w":"Being managed."},{"t":"A client asking whether their hair will grow back","w":"Teaching can wait."}],"trick":"Low platelets + bleeding that won't stop = circulation first.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-13","unit":"ch7","sec":"ch7-remodeling","focus":[["ch7-remodeling",1]],"type":"priority","stem":"The nurse on a surgical unit receives four reports. Which client should the nurse see first?","why":"The parathyroid glands sit on the thyroid and can be injured during surgery. Without parathyroid hormone, blood calcium drops. Tingling and twitching are early signs of low calcium, which can progress to spasm of the airway.","diff":2,"origin":"new","opts":[{"t":"A client who had thyroid surgery and now has tingling around the mouth and muscle twitching","c":true},{"t":"A client after thyroid surgery with a sore throat","w":"Expected after neck surgery and intubation."},{"t":"A client taking calcium supplements who has mild constipation","w":"A common, minor side effect."},{"t":"A client asking which foods have vitamin D","w":"Teaching can wait."}],"trick":"Neck surgery + tingling lips = check calcium (parathyroids).","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-14","unit":"ch11","sec":"ch11-cord","focus":[["ch11-cord",0]],"type":"priority","stem":"The nurse in a spine clinic receives four calls. Which client should the nurse speak to first?","why":"Below the end of the spinal cord, the nerve roots of the cauda equina control the bladder, bowel and groin sensation. New numbness in the groin with bladder problems suggests these roots are being compressed, which needs urgent treatment.","diff":2,"origin":"new","opts":[{"t":"A client with low back pain who now has numbness in the groin and new trouble controlling the bladder","c":true},{"t":"A client with low back pain after lifting boxes who walks normally","w":"Uncomfortable but stable."},{"t":"A client with back stiffness in the morning that improves with movement","w":"Chronic and stable."},{"t":"A client asking about safe lifting posture","w":"Teaching can wait."}],"trick":"Back pain + saddle numbness + bladder change = red flag for nerve root compression.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-15","unit":"ch11","sec":"ch11-disorders","focus":[["ch11-disorders",0]],"type":"priority","stem":"The pediatric clinic nurse has four infants and children waiting. Which client should the nurse see first?","why":"When CSF can't drain, it builds up in the ventricles (hydrocephalus) and pressure rises. In infants, the skull bones aren't fused, so the head grows and the fontanel bulges. Vomiting is a sign of high pressure in the skull.","diff":2,"origin":"new","opts":[{"t":"An infant whose head has grown quickly, with a bulging fontanel and repeated vomiting","c":true},{"t":"An infant with a soft, flat fontanel who is feeding well","w":"Normal findings."},{"t":"A toddler with a runny nose and no fever","w":"Mild illness."},{"t":"An infant with a mild diaper rash","w":"Minor."}],"trick":"Bulging fontanel + growing head + vomiting = pressure in the skull.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-16","unit":"ch12","sec":"ch12-somatic","focus":[["ch12-somatic",1]],"type":"priority","stem":"The nurse at an urgent care clinic triages four clients. Which client should the nurse see first?","why":"Pain from the heart can be felt in the left arm and jaw because heart and skin nerves share spinal pathways (referred pain). Chest pressure spreading this way, with sweating, may be a heart attack.","diff":2,"origin":"new","opts":[{"t":"A 58-year-old with chest pressure spreading to the left arm and jaw","c":true},{"t":"A client with a paper cut on one finger that stings when washing hands","w":"Minor."},{"t":"A client with a sore lower back after a weekend of gardening","w":"Stable muscle strain."},{"t":"A client with a chronic arthritis knee ache that is worse in cold weather","w":"Chronic and stable."}],"trick":"Referred pain: the heart \"calls\" from the arm and jaw.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-17","unit":"ch12","sec":"ch12-eye","focus":[["ch12-eye",0]],"type":"priority","stem":"The occupational health nurse receives four calls. Which client should the nurse respond to first?","why":"Chemicals can burn the cornea, the clear front part of the eye's fibrous layer, within minutes. The eye needs flushing with water right away to limit damage.","diff":2,"origin":"new","opts":[{"t":"A worker who splashed a cleaning chemical into one eye 2 minutes ago","c":true},{"t":"A worker with mild itchy eyes from seasonal allergies","w":"Uncomfortable but not urgent."},{"t":"A worker whose reading glasses feel weaker","w":"Not urgent."},{"t":"A worker with a small stye on the eyelid","w":"Minor."}],"trick":"Chemical in the eye = flush first, ask questions later.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-18","unit":"ch12","sec":"ch12-phototransduction","focus":[["ch12-phototransduction",1]],"type":"priority","stem":"The nurse at an eye clinic reviews four phone messages. Which client should the nurse call back first?","why":"Sudden eye pain, halos and nausea suggest acute glaucoma, where fluid pressure in the eye rises quickly and can damage the optic nerve within hours. Presbyopia, cataract and age-related hearing loss develop slowly.","diff":2,"origin":"new","opts":[{"t":"A client with sudden severe eye pain, blurred vision, halos around lights, and nausea","c":true},{"t":"A 50-year-old who now needs reading glasses","w":"Presbyopia is a normal age change."},{"t":"An older adult whose vision has slowly become cloudy over several years","w":"A slowly developing cataract is not an emergency."},{"t":"An older adult who has trouble hearing high-pitched voices","w":"Age-related hearing loss is gradual."}],"trick":"Sudden + painful = emergency. Slow + painless = schedule an appointment.","tip":"Compare the timeline. A sudden change outranks a slow one that has developed over years."},{"id":"P2-19","unit":"ch11","sec":"ch11-protection","focus":[],"type":"priority","stem":"The emergency nurse receives four clients with head bumps. Which client should the nurse see first?","why":"Bleeding between the skull and the dura mater (the outer meningeal layer) can press on the brain. A client who was knocked out and then gets sleepier is showing a drop in level of consciousness, which is an emergency.","diff":2,"origin":"new","opts":[{"t":"A client who was briefly knocked out and is becoming more drowsy and harder to wake","c":true},{"t":"A client with a bump on the forehead who is alert and talking","w":"Stable; keep monitoring."},{"t":"A client with a mild headache after reading all day","w":"Not related to injury."},{"t":"A client asking for an ice pack for a sore elbow","w":"Minor."}],"trick":"Getting sleepier after a head injury = pressure on the brain.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-20","unit":"ch10","sec":"ch10-resting","focus":[["ch10-resting",0]],"type":"priority","stem":"The nurse on a renal unit reviews lab results. Which client should the nurse see first?","why":"The resting membrane potential depends on the potassium gradient across cell membranes. A very high blood potassium changes that gradient, which disturbs nerve, muscle and heart signals and can cause dangerous heart rhythms.","diff":2,"origin":"new","opts":[{"t":"A client with kidney failure whose potassium level is 6.8 mEq/L and who has new muscle weakness","c":true},{"t":"A client whose potassium level is 4.2 mEq/L","w":"Within the normal range (about 3.5 to 5.0)."},{"t":"A client taking a prescribed potassium supplement who asks about bananas","w":"Teaching can wait."},{"t":"A client with leg cramps after exercise who is drinking fluids","w":"Being managed."}],"trick":"High potassium = the electrical system of muscles and heart goes haywire.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-21","unit":"ch8","sec":"ch8-disorders","focus":[["ch8-disorders",0]],"type":"priority","stem":"The nurse on an orthopedic unit receives four reports. Which client should the nurse see first?","why":"A dislocation moves the bones out of their joint, so the limb looks deformed. A suddenly shorter, rotated leg with severe pain after hip surgery suggests the new hip has dislocated. It needs urgent care to protect nerves and blood vessels.","diff":2,"origin":"new","opts":[{"t":"A client 1 day after hip replacement whose operated leg is suddenly shorter and turned outward, with severe pain","c":true},{"t":"A client 1 day after hip replacement with pain 3 out of 10 who is using a walker","w":"Expected and controlled."},{"t":"A client after knee surgery who is doing leg exercises","w":"Following the plan."},{"t":"A client asking when the dressing will be changed","w":"Can wait."}],"trick":"Shorter + turned + sudden pain = joint out of place.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-22","unit":"ch9","sec":"ch9-nmj","focus":[["ch9-nmj",1]],"type":"priority","stem":"The emergency nurse receives four clients after a family picnic. Which client should the nurse see first?","why":"Acetylcholine is stored in vesicles at the end of motor neurons. Botulinum toxin (from poorly canned food) stops its release, so muscles become weak. Trouble swallowing can progress to breathing failure.","diff":2,"origin":"new","opts":[{"t":"A client who ate home-canned beans and now has droopy eyelids and trouble swallowing","c":true},{"t":"A client with mild stomach upset after eating a lot at the picnic buffet","w":"Uncomfortable but stable."},{"t":"A client with tired, dry eyes after spending hours looking at a phone","w":"Eye strain."},{"t":"A client with a scratchy sore throat who is swallowing food and drinks normally","w":"Stable airway."}],"trick":"Home-canned food + droopy eyes + trouble swallowing = botulism, protect the airway.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-23","unit":"ch10","sec":"ch10-glia","focus":[["ch10-glia",1]],"type":"priority","stem":"The nurse on a neuro unit receives report. Which client should the nurse see first?","why":"Myelin lets signals jump quickly along nerves. When an autoimmune attack strips myelin from peripheral nerves (as in Guillain-Barré syndrome), weakness often climbs upward. Once it reaches the breathing muscles, it is an emergency.","diff":2,"origin":"new","opts":[{"t":"A client whose leg weakness has climbed to the chest over 3 days, now breathing shallowly","c":true},{"t":"A client with tingling in one hand that started after sleeping on that arm all night","w":"Temporary pressure on a nerve."},{"t":"A client with long-term numbness in both feet that has not changed in a year","w":"Chronic and unchanged."},{"t":"A client asking what time physical therapy will come to help with walking","w":"Can wait."}],"trick":"Climbing weakness that reaches the chest = watch the breathing.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-24","unit":"ch11","sec":"ch11-autonomic","focus":[["ch11-autonomic",1]],"type":"priority","stem":"The nurse on a rehabilitation unit receives four calls. Which client needs the nurse first?","why":"Sympathetic nerves leave the spinal cord at the thoracic and lumbar levels. With an injury at T6 or above, a trigger below the injury (like a full bladder) can set off an uncontrolled sympathetic response: dangerously high blood pressure (autonomic dysreflexia).","diff":2,"origin":"new","opts":[{"t":"A client with a spinal cord injury at T4 who has a pounding headache, a flushed face, and very high blood pressure","c":true},{"t":"A client with a T4 injury doing arm exercises in the gym","w":"Following the plan."},{"t":"A client with chronic low back pain","w":"Stable."},{"t":"A client with a spinal cord injury asking about wheelchair cushions","w":"Teaching can wait."}],"trick":"High cord injury + pounding headache + very high BP = find the trigger now (often the bladder).","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-25","unit":"ch12","sec":"ch12-hearing","focus":[["ch12-hearing",1]],"type":"priority","stem":"The nurse at an ear, nose, and throat clinic reviews four messages. Which client should the nurse call first?","why":"Hearing depends on cochlear hair cells sending signals along cranial nerve VIII. Sudden hearing loss in one ear can mean damage to that pathway and needs prompt treatment for the best chance of recovery.","diff":2,"origin":"new","opts":[{"t":"A client who woke up with sudden hearing loss in one ear","c":true},{"t":"An older adult with gradual trouble hearing high-pitched sounds","w":"Slow, age-related change."},{"t":"A client who feels fullness from earwax","w":"Common and minor."},{"t":"A client asking which earplugs block the most noise","w":"Teaching can wait."}],"trick":"Sudden + one-sided hearing loss = urgent.","tip":"Compare the timeline. A sudden change outranks a slow one that has developed over years."},{"id":"P2-26","unit":"ch6","sec":"ch6-dermis","focus":[["ch6-dermis",1]],"type":"priority","stem":"The nurse in a diabetes clinic sees four clients. Which client should the nurse see first?","why":"Skin receptors warn us about injury. When diabetes damages the nerves, the client can't feel wounds, so they get worse unnoticed. A draining blister on a numb foot may be infected.","diff":2,"origin":"new","opts":[{"t":"A client with diabetes who can't feel the monofilament test on one foot and has a new draining blister","c":true},{"t":"A client with diabetes whose feet have normal sensation and no wounds","w":"Normal findings."},{"t":"A client with diabetes asking about properly fitting shoes","w":"Teaching can wait."},{"t":"A client with diabetes who has dry skin on the heels","w":"Common; teach moisturizing."}],"trick":"Can't feel it + open wound = infection risk the client won't notice.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P2-27","unit":"ch1","sec":"ch1-life","focus":[["ch1-life",1]],"type":"priority","stem":"The nurse is eating in the hospital cafeteria. Which person should the nurse help first?","why":"Oxygen is a survival requirement. Someone who can't speak or cough has a blocked airway and no air is moving, so they need help right away.","diff":2,"origin":"new","opts":[{"t":"A person clutching the throat who can't speak or cough","c":true},{"t":"A person coughing forcefully after a drink went down the wrong way","w":"A strong cough moves air: let them keep coughing."},{"t":"A person with hiccups","w":"Harmless."},{"t":"A person asking for a glass of water","w":"Can wait."}],"trick":"Can't talk, can't cough = no air moving. Act now.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-28","unit":"ch7","sec":"ch7-axial","focus":[],"type":"priority","stem":"The emergency nurse receives four clients after falls. Which client should the nurse see first?","why":"The cervical vertebrae protect the spinal cord in the neck. Neck pain with tingling in both arms suggests the cord may be injured, so the neck must be kept still until imaging is done.","diff":2,"origin":"new","opts":[{"t":"A client who fell from a ladder and has neck pain with tingling in both arms","c":true},{"t":"A client with a sprained wrist who can move all fingers","w":"Stable injury."},{"t":"A client with lower back soreness who walks normally","w":"Stable."},{"t":"A client with a scraped knee","w":"Minor."}],"trick":"Neck pain + tingling in the arms = protect the spine.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P2-29","unit":"ch3","sec":"ch3-diffusion","focus":[["ch3-diffusion",0]],"type":"priority","stem":"The nurse on a cardiac unit receives four reports. Which client should the nurse see first?","why":"Filtration moves fluid out of capillaries when pressure inside them is high. In heart failure, pressure backs up into the lung capillaries, and fluid leaks into the lungs. Sudden weight gain and breathlessness lying flat mean fluid is building up.","diff":2,"origin":"new","opts":[{"t":"A client with heart failure who gained 2 kg (4.4 lb) overnight and is short of breath when lying flat","c":true},{"t":"A client with heart failure whose weight is unchanged and who is walking the hall","w":"Stable."},{"t":"A client with mild ankle swelling at the end of the day that goes down overnight","w":"Mild and stable."},{"t":"A client asking about a low-salt diet","w":"Teaching can wait."}],"trick":"Fast weight gain = fluid. Short of breath lying flat = fluid in the lungs.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"T2-01","unit":"ch1","sec":"ch1-homeostasis","focus":[["ch1-homeostasis",0]],"type":"teaching","stem":"A nurse explains feedback loops to a client. Which statement by the client indicates a need for further teaching?","why":"Shivering makes heat to push a LOW temperature back up toward normal. Because it opposes the change, it is negative feedback. Positive feedback makes a change bigger, like labor contractions or blood clotting.","diff":2,"origin":"new","opts":[{"t":"\"Shivering when I'm cold is an example of positive feedback.\"","c":true},{"t":"\"Sweating when I'm hot helps bring my temperature back down.\"","w":"Accurate. Sweating opposes the rise in temperature: negative feedback."},{"t":"\"Stronger and stronger labor contractions are positive feedback.\"","w":"Accurate. Each contraction triggers more oxytocin, which amplifies the process."},{"t":"\"Most of my body's control systems use negative feedback.\"","w":"Accurate. Negative feedback keeps most variables in a normal range."}],"trick":"Negative feedback Nudges back to Normal. Positive feedback Pushes further.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-02","unit":"ch1","sec":"ch1-cavities","focus":[["ch1-cavities",1]],"type":"teaching","stem":"A nurse teaches a client with pleurisy (inflamed pleura). Which statement by the client indicates a need for further teaching?","why":"The visceral pleura covers the lung itself. The parietal pleura lines the chest wall. In pleurisy, the two inflamed layers rub together, so breathing in hurts.","diff":2,"origin":"new","opts":[{"t":"\"The visceral pleura is the layer that lines the inside of my chest wall.\"","c":true},{"t":"\"Fluid between the two layers lets my lungs glide when I breathe.\"","w":"Accurate. Serous fluid reduces friction."},{"t":"\"When the layers are inflamed, they rub and it hurts to take a deep breath.\"","w":"Accurate. That rubbing causes the sharp pain of pleurisy."},{"t":"\"The space between the layers is very thin, not a big open hole.\"","w":"Accurate. The pleural cavity is a potential space with a thin film of fluid."}],"trick":"Visceral hugs the Viscera (organ). Parietal paints the wall (partition).","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-03","unit":"ch1","sec":"ch1-regions","focus":[["ch1-regions",0],["ch1-regions",1]],"type":"teaching","stem":"A nursing student describes the abdominal regions. Which statement by the student needs correction?","why":"The epigastric region sits ABOVE the umbilical region, just under the ribs in the middle. The hypogastric region sits below it.","diff":2,"origin":"new","opts":[{"t":"\"The epigastric region is below the umbilical region.\"","c":true},{"t":"\"I use the client's right and left, not my own.\"","w":"Accurate. Regions are named from the client's point of view."},{"t":"\"The hypogastric region is below the umbilical region.\"","w":"Accurate. Hypo = below."},{"t":"\"The four quadrants are made by two lines crossing at the umbilicus.\"","w":"Accurate."}],"trick":"EPI = above (like epidermis on top). HYPO = below.","tip":"Location errors are easy to miss. Picture the 3-by-3 grid on the client's body before you choose."},{"id":"T2-04","unit":"ch1","sec":"ch1-planes","focus":[["ch1-planes",1]],"type":"teaching","stem":"A nurse reviews body landmarks with a student before a pulse check. Which statement by the student needs correction?","why":"The popliteal area is the BACK of the knee, where the popliteal pulse is felt. The front of the knee is the patellar region.","diff":2,"origin":"new","opts":[{"t":"\"The popliteal area is the front of the knee.\"","c":true},{"t":"\"The antebrachial region is the forearm.\"","w":"Accurate. Ante = before, brachial = arm."},{"t":"\"The brachial region is the upper arm.\"","w":"Accurate. The brachial pulse is felt here."},{"t":"\"The patellar region is the front of the knee.\"","w":"Accurate. The patella is the kneecap."}],"trick":"Popliteal = the pit behind the knee. Patella = the plate in front.","tip":"Nurses use these terms to find pulses. Expect landmark questions tied to assessment."},{"id":"T2-05","unit":"ch2","sec":"ch2-ph","focus":[["ch2-ph",0]],"type":"teaching","stem":"A nurse teaches a client about blood pH. Which statement by the client indicates a need for further teaching?","why":"A pH of 7.2 is LOWER than 7.4, so it is MORE acidic. pH runs backward: as hydrogen ions go up, the pH number goes down. Each whole step is about 10 times more acid.","diff":2,"origin":"new","opts":[{"t":"\"A pH of 7.2 is a little less acidic than a pH of 7.4.\"","c":true},{"t":"\"Normal blood pH is about 7.35 to 7.45.\"","w":"Accurate."},{"t":"\"A lower pH means more hydrogen ions.\"","w":"Accurate. pH and hydrogen ions move in opposite directions."},{"t":"\"Buffers in my blood help keep the pH from changing too fast.\"","w":"Accurate. Buffers resist pH change."}],"trick":"Lower number = more acid (think: lemon juice has a low pH).","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-06","unit":"ch2","sec":"ch2-proteins","focus":[["ch2-proteins",1]],"type":"teaching","stem":"A nurse explains why a very high fever can be dangerous. Which statement by the client indicates a need for further teaching?","why":"Denaturing changes a protein's shape. Because shape and job go together, a denatured protein usually works worse or not at all.","diff":2,"origin":"new","opts":[{"t":"\"Denatured proteins work better because they are unfolded.\"","c":true},{"t":"\"Very high heat can change the shape of my proteins.\"","w":"Accurate. Heat can denature proteins."},{"t":"\"A protein's shape is tied to its job.\"","w":"Accurate. Function depends on conformation."},{"t":"\"Enzymes are proteins, so extreme heat can affect them too.\"","w":"Accurate."}],"trick":"Shape = job. Lose the shape, lose the job (like a bent key).","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-07","unit":"ch2","sec":"ch2-water","focus":[["ch2-water",1]],"type":"teaching","stem":"A client asks about electrolytes in sports drinks. Which statement by the client indicates a need for further teaching?","why":"Sugar dissolves but does NOT split into ions, so it can't carry an electric current. It is a nonelectrolyte. Salts like sodium chloride split into ions and are electrolytes.","diff":2,"origin":"new","opts":[{"t":"\"Sugar dissolved in water is an electrolyte, because it dissolves.\"","c":true},{"t":"\"Electrolytes break apart into charged ions in water.\"","w":"Accurate."},{"t":"\"Sodium and potassium are electrolytes.\"","w":"Accurate."},{"t":"\"Ions in my body fluids carry the current for nerves and muscles.\"","w":"Accurate."}],"trick":"Dissolves is not the same as ionizes. Only ions carry current.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-08","unit":"ch3","sec":"ch3-membrane","focus":[["ch3-membrane",0]],"type":"teaching","stem":"A nursing student explains how substances cross a cell membrane. Which statement by the student needs correction?","why":"The middle of the membrane is oily (nonpolar). Charged ions are blocked by it and need channel or carrier proteins. Small nonpolar gases like oxygen slip straight through.","diff":2,"origin":"new","opts":[{"t":"\"Large charged ions pass straight through the lipid layer easily.\"","c":true},{"t":"\"Oxygen and carbon dioxide can pass right through the lipid layer.\"","w":"Accurate. Small nonpolar molecules diffuse through it."},{"t":"\"Channel and carrier proteins help ions cross.\"","w":"Accurate."},{"t":"\"The membrane is selectively permeable.\"","w":"Accurate."}],"trick":"Like dissolves like: oily things pass the oily layer; charged things need a door.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-09","unit":"ch3","sec":"ch3-active","focus":[["ch3-active",0]],"type":"teaching","stem":"A nurse reviews the sodium-potassium pump with a client. Which statement by the client indicates a need for further teaching?","why":"The pump moves ions AGAINST their gradients, so it uses ATP every cycle. That makes it active transport.","diff":2,"origin":"new","opts":[{"t":"\"The sodium-potassium pump moves ions without using any energy.\"","c":true},{"t":"\"It moves 3 sodium ions out and 2 potassium ions in.\"","w":"Accurate."},{"t":"\"It keeps more potassium inside my cells than outside.\"","w":"Accurate."},{"t":"\"Its ion gradients are needed for nerve and muscle signals.\"","w":"Accurate."}],"trick":"Pump = needs power. 3 sodium out, 2 potassium in, 1 ATP.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-10","unit":"ch3","sec":"ch3-cycle","focus":[["ch3-cycle",0],["ch3-cycle",1]],"type":"teaching","stem":"A nurse explains cell division to a client starting chemotherapy. Which statement by the client indicates a need for further teaching?","why":"DNA is copied during the S phase of interphase, BEFORE mitosis. Mitosis then separates the copies, and cytokinesis splits the cytoplasm.","diff":2,"origin":"new","opts":[{"t":"\"My DNA is copied during mitosis, right as the cell splits.\"","c":true},{"t":"\"DNA is copied in the S phase, before mitosis begins.\"","w":"Accurate."},{"t":"\"Cytokinesis divides the cytoplasm into two cells.\"","w":"Accurate."},{"t":"\"Many chemotherapy drugs target cells that divide quickly.\"","w":"Accurate."}],"trick":"S phase = Synthesis of DNA. Mitosis only splits what was already copied.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-11","unit":"ch4","sec":"ch4-enzymes","focus":[["ch4-enzymes",1]],"type":"teaching","stem":"A client with lactose intolerance takes lactase enzyme tablets with dairy. Which statement by the client indicates a need for further teaching?","why":"Enzymes are not used up. After a reaction, the enzyme is released unchanged and can work again. They speed reactions by lowering activation energy.","diff":2,"origin":"new","opts":[{"t":"\"Each enzyme molecule can only be used once, then it's gone.\"","c":true},{"t":"\"Lactase speeds up breaking lactose into simpler sugars.\"","w":"Accurate."},{"t":"\"Enzymes lower the energy needed to start a reaction.\"","w":"Accurate."},{"t":"\"Each enzyme fits only certain substrates.\"","w":"Accurate. Enzymes are specific."}],"trick":"Enzymes are reusable tools, not fuel.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-12","unit":"ch4","sec":"ch4-aerobic","focus":[["ch4-aerobic",1]],"type":"teaching","stem":"A nurse explains why cells need oxygen. Which statement by the client indicates a need for further teaching?","why":"Glycolysis does NOT need oxygen. Oxygen is needed at the end of the electron transport chain, where it accepts electrons. Without it, most ATP production stops.","diff":2,"origin":"new","opts":[{"t":"\"Oxygen is mainly needed to make glycolysis run.\"","c":true},{"t":"\"Oxygen is the last stop for electrons in the electron transport chain.\"","w":"Accurate. Oxygen is the final electron acceptor."},{"t":"\"Without oxygen, my cells make much less ATP.\"","w":"Accurate."},{"t":"\"Mitochondria make most of my cells' ATP.\"","w":"Accurate."}],"trick":"Oxygen = the electron chain's catcher at the end of the line.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-13","unit":"ch5","sec":"ch5-epithelia","focus":[["ch5-epithelia",0]],"type":"teaching","stem":"A nurse explains skin tissue to a client with a shallow scrape. Which statement by the client indicates a need for further teaching?","why":"Epithelium is avascular: it has no blood vessels of its own. A scrape that stays in the epidermis may not bleed. Bleeding means the injury reached the dermis.","diff":2,"origin":"new","opts":[{"t":"\"The top epithelial layer of my skin is full of blood vessels.\"","c":true},{"t":"\"Epithelial cells get nutrients from the tissue underneath.\"","w":"Accurate. Nutrients diffuse up from the dermis."},{"t":"\"Epithelium sits on a basement membrane.\"","w":"Accurate."},{"t":"\"Epithelial cells replace themselves quickly.\"","w":"Accurate."}],"trick":"Epithelium has no plumbing. It gets supplies from below.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-14","unit":"ch5","sec":"ch5-glands","focus":[["ch5-glands",0]],"type":"teaching","stem":"A nursing student compares types of glands. Which statement by the student needs correction?","why":"Sweat glands release sweat through ducts onto the skin, so they are exocrine. Endocrine glands release hormones into the blood without ducts.","diff":2,"origin":"new","opts":[{"t":"\"Sweat glands are endocrine glands.\"","c":true},{"t":"\"Endocrine glands release hormones into the blood without ducts.\"","w":"Accurate."},{"t":"\"Salivary glands are exocrine and use ducts.\"","w":"Accurate."},{"t":"\"The thyroid is an endocrine gland.\"","w":"Accurate."}],"trick":"EXOcrine = EXIT through a duct. ENDOcrine = into the blood.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-15","unit":"ch6","sec":"ch6-layers","focus":[["ch6-layers",1]],"type":"teaching","stem":"A nurse explains the skin layers before giving a subcutaneous injection. Which statement by the client indicates a need for further teaching?","why":"The epidermis is the OUTERMOST layer, not the deepest. A subcutaneous injection goes below the dermis into the hypodermis (subcutaneous layer).","diff":2,"origin":"new","opts":[{"t":"\"The medicine goes into the epidermis, the deepest skin layer.\"","c":true},{"t":"\"Subcutaneous means under the skin, into the hypodermis.\"","w":"Accurate."},{"t":"\"The hypodermis has fat that helps insulate me.\"","w":"Accurate."},{"t":"\"The dermis has blood vessels and nerves.\"","w":"Accurate."}],"trick":"From outside in: Epidermis → Dermis → Hypodermis (\"Every Day Healthy\").","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-16","unit":"ch6","sec":"ch6-sweat","focus":[["ch6-sweat",0],["ch6-sweat",1]],"type":"teaching","stem":"A client asks about sweat and body odor. Which statement by the client indicates a need for further teaching?","why":"Eccrine sweat is mostly water and salt and is for cooling. Body odor comes mainly from bacteria breaking down apocrine sweat in the armpits and groin.","diff":2,"origin":"new","opts":[{"t":"\"Fresh eccrine sweat is what makes me smell.\"","c":true},{"t":"\"Eccrine sweat cools me as it evaporates.\"","w":"Accurate."},{"t":"\"Apocrine glands in my armpits drain into hair follicles.\"","w":"Accurate."},{"t":"\"Bacteria breaking down apocrine sweat cause most body odor.\"","w":"Accurate."}],"trick":"Eccrine = Evaporative cooling. Apocrine = Armpits and odor.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-17","unit":"ch6","sec":"ch6-accessory","focus":[["ch6-accessory",1]],"type":"teaching","stem":"A child asks why goosebumps happen. Which statement by the child's parent indicates a need for further teaching?","why":"Arrector pili muscles are smooth muscle, so they contract automatically, not on purpose. When they pull on hairs, goosebumps form.","diff":2,"origin":"new","opts":[{"t":"\"Goosebumps happen when the skeletal muscles in the skin contract on purpose.\"","c":true},{"t":"\"The tiny muscles that raise hairs are smooth muscle.\"","w":"Accurate. Arrector pili are smooth muscle."},{"t":"\"Goosebumps can happen when we're cold or scared.\"","w":"Accurate."},{"t":"\"Oil glands empty into the hair follicles.\"","w":"Accurate. Sebaceous glands release sebum there."}],"trick":"Arrector pili = smooth and automatic. You can't make goosebumps on command.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-18","unit":"ch7","sec":"ch7-marrow","focus":[["ch7-marrow",1],["ch7-marrow",2]],"type":"teaching","stem":"A client is scheduled for a bone marrow biopsy from the hip bone. Which statement by the client indicates a need for further teaching?","why":"RED marrow makes all blood cells (hematopoiesis). Yellow marrow is mostly fat. In adults, red marrow is mainly found in spongy bone of flat bones like the hip bone.","diff":2,"origin":"new","opts":[{"t":"\"Yellow marrow is where my blood cells are made.\"","c":true},{"t":"\"Red marrow makes red cells, white cells, and platelets.\"","w":"Accurate."},{"t":"\"In adults, red marrow is mostly in spongy bone, like the hip bone.\"","w":"Accurate."},{"t":"\"Yellow marrow is mostly stored fat.\"","w":"Accurate."}],"trick":"RED marrow makes blood (red for blood). YELLOW marrow = fat.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-19","unit":"ch7","sec":"ch7-growth","focus":[["ch7-growth",2],["ch7-growth",0]],"type":"teaching","stem":"A nurse explains bone growth to the parents of a teenager. Which statement by the client indicates a need for further teaching?","why":"Closed growth plates stop bones from getting LONGER. Bones can still get thicker by adding compact bone under the periosteum, for example with exercise.","diff":2,"origin":"new","opts":[{"t":"\"Once the growth plates close, bones can never get any thicker.\"","c":true},{"t":"\"Bones get longer at the growth plates.\"","w":"Accurate."},{"t":"\"Bones get thicker when new bone is added under the periosteum.\"","w":"Accurate."},{"t":"\"Most bones finish ossifying by about age 25.\"","w":"Accurate."}],"trick":"Plates closed = no more length. Thickness can still grow.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-20","unit":"ch7","sec":"ch7-fractures","focus":[["ch7-fractures",1]],"type":"teaching","stem":"A client with a fractured tibia asks how bones heal. Which statement by the client indicates a need for further teaching?","why":"The order is hematoma → granulation tissue → callus → remodeling. The blood clot comes first, not after the callus.","diff":2,"origin":"new","opts":[{"t":"\"First a callus forms, and then the blood clot forms.\"","c":true},{"t":"\"A blood clot (hematoma) forms first.\"","w":"Accurate."},{"t":"\"Granulation tissue and then a callus bridge the break.\"","w":"Accurate."},{"t":"\"Remodeling reshapes the bone over the following months.\"","w":"Accurate."}],"trick":"Healing order: Hematoma, Granulation, Callus, Remodel (\"Have Good Cold Root beer\").","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-21","unit":"ch8","sec":"ch8-movements","focus":[["ch8-movements",1],["ch8-movements",0]],"type":"teaching","stem":"A physical therapy student describes joint movements. Which statement by the student needs correction?","why":"Adduction moves a body part TOWARD the midline. Abduction moves it away.","diff":2,"origin":"new","opts":[{"t":"\"Adduction moves my arm away from my body.\"","c":true},{"t":"\"Abduction moves my arm away from my body.\"","w":"Accurate."},{"t":"\"Dorsiflexion brings my foot closer to my shin.\"","w":"Accurate."},{"t":"\"Flexion makes the angle at a joint smaller.\"","w":"Accurate."}],"trick":"ADDuction ADDs the limb back to the body.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-22","unit":"ch8","sec":"ch8-examples","focus":[["ch8-examples",3],["ch8-examples",1]],"type":"teaching","stem":"A client is recovering from a shoulder dislocation. Which statement by the client indicates a need for further teaching?","why":"The shoulder is the MOST mobile joint, and that freedom makes it the LEAST stable and the most likely to dislocate. The rotator cuff helps hold it in place.","diff":2,"origin":"new","opts":[{"t":"\"My shoulder dislocated because it is the most stable joint in my body.\"","c":true},{"t":"\"My shoulder has the most range of motion of any joint.\"","w":"Accurate."},{"t":"\"The rotator cuff muscles help hold my shoulder together.\"","w":"Accurate."},{"t":"\"The medical name for my shoulder joint is the glenohumeral joint.\"","w":"Accurate."}],"trick":"Mobility vs stability is a trade-off: the more it moves, the easier it pops out.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-23","unit":"ch8","sec":"ch8-types","focus":[["ch8-types",4],["ch8-types",2]],"type":"teaching","stem":"A nursing student describes types of synovial joints. Which statement by the student needs correction?","why":"The knee is mainly a hinge joint: it bends and straightens. The ball-and-socket joints are the shoulder and hip.","diff":2,"origin":"new","opts":[{"t":"\"The knee is a ball-and-socket joint.\"","c":true},{"t":"\"The elbow and knee are mainly hinge joints.\"","w":"Accurate."},{"t":"\"The base of the thumb is a saddle joint.\"","w":"Accurate."},{"t":"\"The atlas and axis form a pivot joint.\"","w":"Accurate."}],"trick":"Hinge = door (elbow, knee). Ball-and-socket = joystick (shoulder, hip).","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-24","unit":"ch9","sec":"ch9-nmj","focus":[["ch9-nmj",2],["ch9-nmj",0]],"type":"teaching","stem":"A client with myasthenia gravis starts a drug that blocks cholinesterase. Which statement by the client indicates a need for further teaching?","why":"Acetylcholine (ACh) is the signal that starts contraction. Cholinesterase is the enzyme that breaks ACh down. Blocking it keeps more ACh available, which can strengthen weak muscles.","diff":2,"origin":"new","opts":[{"t":"\"Cholinesterase is the chemical that tells my muscles to contract.\"","c":true},{"t":"\"Acetylcholine is released from the nerve to start a contraction.\"","w":"Accurate."},{"t":"\"Cholinesterase normally breaks down acetylcholine.\"","w":"Accurate."},{"t":"\"Blocking cholinesterase lets acetylcholine work longer.\"","w":"Accurate."}],"trick":"ACh = the messenger. AChE = the eraser.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-25","unit":"ch9","sec":"ch9-energy","focus":[["ch9-energy",0],["ch9-energy",2]],"type":"teaching","stem":"A runner asks how muscles get energy. Which statement by the client indicates a need for further teaching?","why":"Creatine phosphate is a fast but tiny energy reserve that lasts only seconds. Long exercise depends on aerobic respiration in the mitochondria.","diff":2,"origin":"new","opts":[{"t":"\"Creatine phosphate can power my muscles for a whole marathon.\"","c":true},{"t":"\"Creatine phosphate quickly helps remake ATP.\"","w":"Accurate."},{"t":"\"A muscle cramp can happen when ATP runs low.\"","w":"Accurate."},{"t":"\"Breathing hard after a race helps repay my oxygen debt.\"","w":"Accurate."}],"trick":"Creatine phosphate = a sprint battery, not a marathon tank.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-26","unit":"ch9","sec":"ch9-actions","focus":[["ch9-actions",0],["ch9-actions",1]],"type":"teaching","stem":"A student explains how muscles produce movement. Which statement by the student needs correction?","why":"The origin is attached to the bone that stays still. The insertion is on the bone that moves.","diff":2,"origin":"new","opts":[{"t":"\"The origin is the end of the muscle attached to the bone that moves.\"","c":true},{"t":"\"The origin attaches to the more stationary bone.\"","w":"Accurate."},{"t":"\"The insertion attaches to the bone that moves.\"","w":"Accurate."},{"t":"\"An antagonist opposes the prime mover.\"","w":"Accurate."}],"trick":"Origin = Original spot that stays put. Insertion = moves.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-27","unit":"ch10","sec":"ch10-glia","focus":[["ch10-glia",1],["ch10-glia",0]],"type":"teaching","stem":"A client with multiple sclerosis (MS) asks about myelin. Which statement by the client indicates a need for further teaching?","why":"Myelin speeds up conduction by letting the signal jump between nodes. Losing myelin, as in MS, slows or blocks signals.","diff":2,"origin":"new","opts":[{"t":"\"Losing myelin makes my nerve signals travel faster.\"","c":true},{"t":"\"Myelin helps signals jump from node to node.\"","w":"Accurate. This is saltatory conduction."},{"t":"\"In my brain and spinal cord, oligodendrocytes make myelin.\"","w":"Accurate."},{"t":"\"Myelin is why white matter looks white.\"","w":"Accurate."}],"trick":"Myelin = insulation. Strip the insulation and the signal slows down.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-28","unit":"ch10","sec":"ch10-impulse","focus":[["ch10-impulse",0],["ch10-impulse",1]],"type":"teaching","stem":"A student explains an action potential. Which statement by the student needs correction?","why":"Depolarization is caused by SODIUM rushing IN. Potassium flowing OUT brings the membrane back down (repolarization).","diff":2,"origin":"new","opts":[{"t":"\"Potassium rushing into the cell causes depolarization.\"","c":true},{"t":"\"Sodium entering the cell depolarizes the membrane.\"","w":"Accurate."},{"t":"\"Potassium leaving the cell repolarizes it.\"","w":"Accurate."},{"t":"\"Thick, myelinated axons conduct faster.\"","w":"Accurate."}],"trick":"Sodium In to rise; Potassium Out to fall.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-29","unit":"ch11","sec":"ch11-cord","focus":[["ch11-cord",0]],"type":"teaching","stem":"A client with a spinal cord injury asks about spinal nerve roots. Which statement by the client indicates a need for further teaching?","why":"Dorsal (back) roots are SENSORY and carry information in. Ventral (front) roots are MOTOR and carry commands out.","diff":2,"origin":"new","opts":[{"t":"\"The dorsal roots carry motor commands out to my muscles.\"","c":true},{"t":"\"The dorsal roots carry sensory information in.\"","w":"Accurate."},{"t":"\"The ventral roots carry motor signals out.\"","w":"Accurate."},{"t":"\"Spinal nerves carry both sensory and motor fibers.\"","w":"Accurate. Spinal nerves are mixed."}],"trick":"SAME DAVE: Sensory Afferent, Motor Efferent; Dorsal Afferent, Ventral Efferent.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-30","unit":"ch11","sec":"ch11-reflex","focus":[["ch11-reflex",0]],"type":"teaching","stem":"A nurse tests a client's knee-jerk reflex while a student watches. Which statement by the student needs correction?","why":"The knee-jerk is handled in the spinal cord, with one synapse between the sensory and motor neuron. The brain is not needed for the kick, which is why reflexes are so fast.","diff":2,"origin":"new","opts":[{"t":"\"The brain has to decide to kick before the leg can move.\"","c":true},{"t":"\"The knee-jerk is a monosynaptic reflex.\"","w":"Accurate. One synapse in the spinal cord."},{"t":"\"A reflex arc starts at a receptor and ends at an effector.\"","w":"Accurate."},{"t":"\"Tapping the tendon stretches muscle spindles in the quadriceps.\"","w":"Accurate."}],"trick":"Reflex = the spinal cord answers before the brain even hears the question.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-31","unit":"ch12","sec":"ch12-vision","focus":[["ch12-vision",1]],"type":"teaching","stem":"A client asks why it is hard to see colors at night. Which statement by the client indicates a need for further teaching?","why":"RODS work in dim light but don't see color. CONES need brighter light and give color and detail. That's why colors fade at night.","diff":2,"origin":"new","opts":[{"t":"\"Cones are the cells that work best in dim light.\"","c":true},{"t":"\"Rods work best in dim light.\"","w":"Accurate."},{"t":"\"Cones give me color and sharp detail.\"","w":"Accurate."},{"t":"\"The optic nerve is made of ganglion cell axons.\"","w":"Accurate."}],"trick":"Rods = dim Rooms (night vision, gray). Cones = Color.","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"T2-32","unit":"ch12","sec":"ch12-balance","focus":[["ch12-balance",0],["ch12-balance",1]],"type":"teaching","stem":"A client with motion sickness learns about the balance organs. Which statement by the client indicates a need for further teaching?","why":"The cochlea is for HEARING. Spinning is sensed by the semicircular canals, and tilt and gravity by the utricle and saccule.","diff":2,"origin":"new","opts":[{"t":"\"The cochlea is what senses my head spinning.\"","c":true},{"t":"\"The semicircular canals sense my head rotating.\"","w":"Accurate."},{"t":"\"The utricle and saccule sense tilting and gravity.\"","w":"Accurate."},{"t":"\"Balance signals travel on cranial nerve VIII.\"","w":"Accurate."}],"trick":"Cochlea = hearing (snail). Semicircular canals = spinning (circles).","tip":"In \"needs further teaching\" questions, you are looking for the FALSE statement. Check each option against the rule and pick the one that is wrong."},{"id":"M2-01","unit":"ch2","sec":"ch2-atoms","focus":[["ch2-atoms",0]],"type":"math","stem":"A calcium atom has an atomic number of 20 and a mass number of 40. How many neutrons does it have?","why":"Neutrons = mass number − atomic number = 40 − 20 = 20.","diff":2,"origin":"new","opts":[{"t":"20","c":true},{"t":"40","w":"40 is the mass number (protons + neutrons), not the neutron count."},{"t":"60","w":"You added instead of subtracting."},{"t":"10","w":"Check the subtraction: 40 − 20."}],"trick":"Mass − Atomic = Neutrons (\"MAN\").","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-02","unit":"ch2","sec":"ch2-atoms","focus":[["ch2-atoms",0],["ch2-atoms",1]],"type":"math","stem":"A calcium ion has a charge of 2+ (Ca²⁺) and 20 protons. How many electrons does it have?","why":"A 2+ charge means the atom lost 2 electrons. A neutral calcium atom has 20 electrons, so the ion has 20 − 2 = 18.","diff":2,"origin":"new","opts":[{"t":"18","c":true},{"t":"20","w":"That's a neutral calcium atom."},{"t":"22","w":"A positive ion has LOST electrons, not gained them."},{"t":"2","w":"2 is the charge, not the number of electrons."}],"trick":"Positive ion = lost electrons (\"positive people lose negativity\").","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-03","unit":"ch2","sec":"ch2-ph","focus":[["ch2-ph",0]],"type":"math","stem":"A solution's pH drops from 7.4 to 5.4. How many times more hydrogen ions does it have now?","why":"Each 1-unit drop in pH is about 10 times more hydrogen ions. A 2-unit drop is 10 × 10 = 100 times more.","diff":2,"origin":"new","opts":[{"t":"100 times more","c":true},{"t":"2 times more","w":"pH is logarithmic: each unit is 10×, not 1×."},{"t":"20 times more","w":"Multiply, don't add: 10 × 10."},{"t":"1,000 times more","w":"That would be a 3-unit drop."}],"trick":"Every pH step = ×10. Two steps = ×100.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-04","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",1]],"type":"math","stem":"An adult is burned on the head and neck, the entire left arm, and the entire front of the trunk. Using the rule of nines, what percent of body surface is burned?","why":"Rule of nines (adult): head and neck 9% + whole arm 9% + front of trunk 18% = 36%.","diff":2,"origin":"new","opts":[{"t":"36%","c":true},{"t":"27%","w":"You left out one region."},{"t":"45%","w":"The front of the trunk is 18%, not 27%."},{"t":"18%","w":"That is only the front of the trunk."}],"trick":"Head 9, each arm 9, each leg 18, front trunk 18, back trunk 18, groin 1.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-05","unit":"ch6","sec":"ch6-repair","focus":[["ch6-repair",1]],"type":"math","stem":"An adult is burned on the entire back of the trunk and the back of the right leg. Using the rule of nines, what percent of body surface is burned?","why":"Back of trunk 18% + back of one leg 9% (half of 18%) = 27%.","diff":2,"origin":"new","opts":[{"t":"27%","c":true},{"t":"36%","w":"The back of one leg is 9%, not 18%."},{"t":"18%","w":"You left out the leg."},{"t":"45%","w":"Check each region again."}],"trick":"Each whole leg is 18%, so the front or back alone is 9%.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-06","unit":"ch7","sec":"ch7-aging","focus":[["ch7-aging",0]],"type":"math","stem":"A client with osteoporosis is prescribed calcium citrate 600 mg by mouth twice a day. Each tablet contains 300 mg. How many tablets will the client take in one day?","why":"Per dose: 600 mg ÷ 300 mg = 2 tablets. Twice a day: 2 × 2 = 4 tablets.","diff":2,"origin":"new","opts":[{"t":"4 tablets","c":true},{"t":"2 tablets","w":"That is one dose. The client takes it twice a day."},{"t":"1 tablet","w":"One tablet is only 300 mg."},{"t":"6 tablets","w":"Check the math: 600 ÷ 300 = 2 per dose."}],"trick":"Desired over Have, then times how many doses.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-07","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",0]],"type":"math","stem":"Normal saline is 0.9% sodium chloride (0.9 g per 100 mL) and is isotonic. How many grams of sodium chloride are in a 1,000 mL bag?","why":"1,000 mL is 10 times 100 mL, so 0.9 g × 10 = 9 g.","diff":2,"origin":"new","opts":[{"t":"9 g","c":true},{"t":"0.9 g","w":"That's the amount in 100 mL, not 1,000 mL."},{"t":"90 g","w":"Moved the decimal one place too far."},{"t":"0.09 g","w":"Moved the decimal the wrong way."}],"trick":"Percent solution = grams per 100 mL.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-08","unit":"ch10","sec":"ch10-resting","focus":[["ch10-resting",1]],"type":"math","stem":"A neuron rests at −70 mV and fires when it reaches −55 mV. How much must the membrane potential change, and in which direction?","why":"From −70 to −55 is a change of 15 mV toward zero (depolarization): −55 − (−70) = +15 mV.","diff":2,"origin":"new","opts":[{"t":"+15 mV (it becomes less negative)","c":true},{"t":"−15 mV (more negative)","w":"Going more negative is hyperpolarization, away from threshold."},{"t":"+125 mV","w":"You added the two numbers instead of finding the difference."},{"t":"+55 mV","w":"55 is the threshold value, not the change."}],"trick":"Toward zero = depolarizing = closer to firing.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"M2-09","unit":"ch4","sec":"ch4-glycolysis","focus":[["ch4-glycolysis",0]],"type":"math","stem":"Glycolysis makes a net of 2 ATP per glucose. How many net ATP does glycolysis make from 3 glucose molecules?","why":"Net ATP = 2 per glucose × 3 glucose = 6 ATP.","diff":2,"origin":"new","opts":[{"t":"6 ATP","c":true},{"t":"12 ATP","w":"12 is the gross amount (4 per glucose); the question asks net."},{"t":"2 ATP","w":"That's for one glucose."},{"t":"3 ATP","w":"Multiply the net yield by 3."}],"trick":"Glycolysis: spend 2, make 4, keep 2.","tip":"Med math: write what you know, then do one step at a time. Check that your answer makes sense."},{"id":"P3-01","unit":"ch1","sec":"ch1-cavities","focus":[["ch1-cavities",0]],"type":"priority","stem":"A trauma nurse receives four clients from a highway collision. Which client should the nurse see first?","why":"The pericardial cavity is a thin space between the layers around the heart. If blood fills it, it squeezes the heart so it can't fill (cardiac tamponade). Muffled heart sounds, low blood pressure and bulging neck veins are the warning signs.","diff":2,"origin":"new","opts":[{"t":"A client with muffled heart sounds, low blood pressure, and bulging neck veins","c":true},{"t":"A client with a seat-belt bruise across the chest and normal vital signs","w":"Stable; keep monitoring."},{"t":"A client with a sprained ankle","w":"Stable injury."},{"t":"A client who is anxious and asking to call family","w":"Emotional support can follow."}],"trick":"Muffled heart + low BP + big neck veins = the sac is squeezing the heart.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-02","unit":"ch3","sec":"ch3-osmosis","focus":[["ch3-osmosis",0]],"type":"priority","stem":"The nurse at a marathon medical tent receives four runners. Which client should the nurse see first?","why":"Drinking too much plain water dilutes blood sodium, making the blood hypotonic. Water then moves into cells, and swelling brain cells cause headache, vomiting and confusion.","diff":2,"origin":"new","opts":[{"t":"A runner who drank large amounts of plain water, now confused with a headache and vomiting","c":true},{"t":"A runner with sore thighs who is walking and talking normally","w":"Expected after a race."},{"t":"A runner who is thirsty and drinking a sports drink","w":"Being managed."},{"t":"A runner with a blister on one heel","w":"Minor."}],"trick":"Too much plain water = hypotonic blood = swollen brain cells.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-03","unit":"ch2","sec":"ch2-ph","focus":[],"type":"priority","stem":"The nurse checks four clients 30 minutes after pain medicine was given. Which client should the nurse see first?","why":"Slow breathing lets carbon dioxide build up in the blood. Carbon dioxide forms carbonic acid, so the pH falls (respiratory acidosis). Breathing this slowly is an airway and breathing emergency.","diff":2,"origin":"new","opts":[{"t":"A client who received an opioid and is very drowsy with 8 breaths per minute","c":true},{"t":"A client who received an opioid, is resting comfortably, and has 16 breaths per minute","w":"Expected response."},{"t":"A client who says pain is now 3 out of 10","w":"Pain is controlled."},{"t":"A client who feels mildly itchy after the opioid","w":"A common, minor side effect."}],"trick":"Slow breathing = CO2 piles up = acid.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-04","unit":"ch6","sec":"ch6-repair","focus":[],"type":"priority","stem":"The emergency nurse receives four clients from a house fire. Which client should the nurse see first?","why":"Hot air and smoke can burn the airway. Singed nose hairs, soot and a hoarse voice warn that the airway may swell shut within hours, so this client is seen first even though the skin burns of others look worse.","diff":2,"origin":"new","opts":[{"t":"A client with singed nose hairs, soot around the mouth, and a hoarse voice","c":true},{"t":"A client with a red, painful superficial burn on one hand","w":"Painful but stable."},{"t":"A client with a partial-thickness burn on the forearm with blisters","w":"Needs care, but the airway comes first."},{"t":"A client who is coughing a little but speaking in full sentences with normal breathing","w":"Moving air well; reassess."}],"trick":"Hoarse voice + soot + singed nose hair = airway burn.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-05","unit":"ch7","sec":"ch7-marrow","focus":[["ch7-marrow",0]],"type":"priority","stem":"Four clients on the orthopedic unit call for help at the same time. Which client should the nurse see first?","why":"Yellow marrow in long bones stores fat. After a long-bone fracture, fat droplets can enter the blood and lodge in the lungs and brain (fat embolism). Sudden breathlessness, confusion and tiny red spots are the warning signs.","diff":2,"origin":"new","opts":[{"t":"A client with a femur fracture who is suddenly short of breath and confused, with tiny red spots on the chest","c":true},{"t":"A client with a femur fracture whose pain is 4 out of 10 after medication","w":"Controlled."},{"t":"A client in a cast asking how long it will stay on","w":"Teaching can wait."},{"t":"A client with a wrist fracture whose fingers are pink and warm","w":"Good circulation."}],"trick":"Long-bone break + breathless + confused + red dots = fat embolism.","tip":"Priority: think airway, breathing, circulation, then a sudden change in mental status. Expected or stable findings can wait."},{"id":"P3-06","unit":"ch9","sec":"ch9-responses","focus":[["ch9-responses",3]],"type":"priority","stem":"The nurse at a sports clinic receives four calls. Which client should the nurse speak to first?","why":"Muscle fibers, especially red fibers, contain myoglobin. When many fibers break down (rhabdomyolysis), myoglobin spills into the blood and urine, turning it dark, and it can damage the kidneys.","diff":2,"origin":"new","opts":[{"t":"A client with severe muscle pain and cola-colored urine after an extreme workout","c":true},{"t":"A client with mild muscle soreness 2 days after starting a new routine","w":"Delayed soreness is expected."},{"t":"A client with a muscle cramp that went away after stretching","w":"Resolved."},{"t":"A client asking about protein shakes","w":"Teaching can wait."}],"trick":"Dark cola urine after a brutal workout = muscle breaking down.","tip":"Priority: pick the finding that is unexpected and getting worse. A normal body response is not the emergency."},{"id":"P3-07","unit":"ch11","sec":"ch11-cerebrum"
