{"t":"3, 2, 1, 4","c":false},{"t":"2, 3, 1, 4","c":true},{"t":"2, 1, 3, 4","c":false}],"why":"ACh release comes first, then the impulse spreads through the T tubules, calcium is released from the SR, and cross-bridges pull the filaments.","diff":2,"origin":"guide","src":"check","trick":"Nerve → Tubules → Calcium → Pull: \"Never Take Candy, Please.\"","tip":"For sequence questions, start with the trigger (the nerve releasing ACh) and end with the result (the pull)."},{"id":"C-ch9-energy","unit":"ch9","sec":"ch9-energy","focus":[],"type":"mcq","stem":"A sprinter finishes a 200 m race and continues to breathe heavily for several minutes. Which concept explains this?","opts":[{"t":"Refractory period","c":false},{"t":"Oxygen debt","c":true},{"t":"Muscle tone","c":false},{"t":"Hypertrophy","c":false}],"why":"Oxygen debt is the extra oxygen needed after exercise to convert lactic acid back to glucose, rebuild ATP and creatine phosphate, and restore oxygen stores.","diff":2,"origin":"guide","src":"check","trick":"Oxygen debt = paying back the oxygen \"loan\" you took out while sprinting.","tip":"Heavy breathing after exercise repays oxygen debt: clearing lactic acid and rebuilding ATP and creatine phosphate."},{"id":"C-ch9-responses","unit":"ch9","sec":"ch9-responses","focus":[],"type":"mcq","stem":"A weightlifter holds a barbell motionless at chest level. What type of contraction are the arm muscles performing?","opts":[{"t":"Isotonic concentric","c":false},{"t":"Isotonic eccentric","c":false},{"t":"Isometric","c":true},{"t":"Twitch","c":false}],"why":"Tension is high but the muscle length does not change and no movement occurs, which defines an isometric contraction.","diff":2,"origin":"guide","src":"check","trick":"Holding still under load = ISOMETRIC (same length, no motion).","tip":"If nothing moves but the muscle is working hard, the contraction is isometric."},{"id":"C-ch9-disorders","unit":"ch9","sec":"ch9-disorders","focus":[],"type":"mcq","stem":"A patient's leg is in a cast for eight weeks. After removal, the calf is visibly smaller. Which statement is correct?","opts":[{"t":"The muscle fibers increased in number","c":false},{"t":"Disuse caused the muscle fibers to shrink (atrophy)","c":true},{"t":"Hypertrophy occurred because of immobility","c":false},{"t":"The motor units were recruited more","c":false}],"why":"Without use, muscle fibers shrink: myofilaments get smaller, mitochondria decrease, and capillary networks decline.","diff":2,"origin":"guide","src":"check","trick":"Use it or lose it: no use = atrophy (shrinking fibers).","tip":"Disuse atrophy shrinks fibers. Muscle fibers don't disappear; they get smaller with fewer mitochondria and capillaries."},{"id":"C-ch9-smooth-cardiac","unit":"ch9","sec":"ch9-smooth-cardiac","focus":[],"type":"mcq","stem":"Which tissue is striated, involuntary, and has intercalated discs?","opts":[{"t":"Skeletal muscle","c":false},{"t":"Smooth muscle","c":false},{"t":"Cardiac muscle","c":true},{"t":"Visceral smooth muscle","c":false}],"why":"Cardiac muscle is striated and involuntary with intercalated discs. Skeletal muscle is voluntary, and smooth muscle lacks striations.","diff":2,"origin":"guide","src":"check","trick":"Cardiac = striped + involuntary + intercalated discs (\"the heart's handshakes\").","tip":"Intercalated discs are unique to cardiac muscle. They let the heart beat as one unit."},{"id":"C-ch9-actions","unit":"ch9","sec":"ch9-actions","focus":[],"type":"mcq","stem":"When you straighten your elbow, the triceps brachii contracts. What is the biceps brachii called in this movement?","opts":[{"t":"Prime mover","c":false},{"t":"Fixator","c":false},{"t":"Synergist","c":false},{"t":"Antagonist","c":true}],"why":"The biceps opposes elbow extension, so it is the antagonist while the triceps is the prime mover.","diff":2,"origin":"guide","src":"check","trick":"Triceps straightens (the agonist); biceps relaxes and opposes, so it's the antagonist.","tip":"The antagonist is the muscle that does the opposite of the movement described."},{"id":"C-ch9-naming","unit":"ch9","sec":"ch9-naming","focus":[],"type":"mcq","stem":"A muscle named \"extensor digitorum longus\" is described. What can you infer?","opts":[{"t":"It has three heads","c":false},{"t":"It is a triangular shoulder muscle","c":false},{"t":"It extends the digits and is relatively long","c":true},{"t":"It runs diagonally across the abdomen","c":false}],"why":"\"Extensor\" names the action (extends), \"digitorum\" the location (digits), and \"longus\" the size (long).","diff":2,"origin":"guide","src":"check","trick":"Read muscle names like a label: ACTION + LOCATION + SIZE (extensor / digitorum / longus).","tip":"Muscle names give clues: action (flexor), location (femoris), size (maximus), shape (deltoid), direction (rectus)."},{"id":"C-ch9-head","unit":"ch9","sec":"ch9-head","focus":[],"type":"mcq","stem":"A patient with facial nerve damage cannot raise one eyebrow or wrinkle that side of the forehead. Which muscle is affected?","opts":[{"t":"Frontalis","c":true},{"t":"Orbicularis oculi","c":false},{"t":"Masseter","c":false},{"t":"Platysma","c":false}],"why":"The frontalis lies over the forehead and raises the eyebrows. The orbicularis oculi closes the eye and the masseter elevates the mandible.","diff":2,"origin":"guide","src":"check","trick":"FRONTALIS = the FRONT of the head: raises eyebrows in surprise.","tip":"Facial expression muscles are supplied by the facial nerve (CN VII). Damage causes one-sided weakness."},{"id":"C-ch9-arm","unit":"ch9","sec":"ch9-arm","focus":[],"type":"mcq","stem":"A swimmer raises both arms out to the sides to form a \"T.\" Which muscle is the prime mover?","opts":[{"t":"Latissimus dorsi","c":false},{"t":"Biceps brachii","c":false},{"t":"Deltoid","c":true},{"t":"Brachioradialis","c":false}],"why":"The deltoid abducts the humerus. The latissimus dorsi would bring the arms back down (adduction).","diff":2,"origin":"guide","src":"check","trick":"DELToid = Delta-shaped shoulder cap that lifts the arm out to the side (abduction).","tip":"Arm out to the side = abduction = deltoid. Pulling it back down = latissimus dorsi and pectoralis major."},{"id":"C-ch9-trunk","unit":"ch9","sec":"ch9-trunk","focus":[],"type":"mcq","stem":"Which abdominal muscle lies deepest and has fibers running horizontally?","opts":[{"t":"Rectus abdominis","c":false},{"t":"External oblique","c":false},{"t":"Internal oblique","c":false},{"t":"Transversus abdominis","c":true}],"why":"Transversus abdominis (\"transverse\") is the deepest layer of the abdominal wall.","diff":2,"origin":"guide","src":"check","trick":"TRANSversus runs TRANSverse (side to side) like a corset, deepest layer.","tip":"From superficial to deep: external oblique → internal oblique → transversus abdominis."},{"id":"C-ch9-leg","unit":"ch9","sec":"ch9-leg","focus":[],"type":"mcq","stem":"A sprinter pulls a muscle on the back of the thigh while pushing off. Which group is injured, and what movement does it normally produce?","opts":[{"t":"Quadriceps; extension of the knee","c":false},{"t":"Hamstrings; flexion of the knee","c":true},{"t":"Gastrocnemius; dorsiflexion","c":false},{"t":"Tibialis anterior; eversion","c":false}],"why":"The hamstrings (biceps femoris, semitendinosus, semimembranosus) are on the posterior thigh and flex the leg at the knee.","diff":2,"origin":"guide","src":"check","trick":"Hamstrings hang on the back of the thigh and bend the knee (flex) like pulling your heel to your butt.","tip":"Posterior thigh = hamstrings = knee flexion. Anterior thigh = quadriceps = knee extension."},{"id":"C-ch10-divisions","unit":"ch10","sec":"ch10-divisions","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Central nervous system: brain and spinal cord.\" Which term fits?","opts":[{"t":"Divergence","c":false},{"t":"CNS","c":true},{"t":"Convergence","c":false},{"t":"Interneuron","c":false}],"why":"CNS: Central nervous system: brain and spinal cord. CNS is brain/spinal cord; PNS includes peripheral nerves and ganglia. Afferent arrives, efferent exits; integration links input to output.","diff":2,"origin":"guide","src":"check","trick":"CNS = the Central command (brain + cord). PNS = the Phone lines out to the body.","tip":"Brain and spinal cord only = CNS. Nerves and ganglia outside them = PNS."},{"id":"C-ch10-neurons","unit":"ch10","sec":"ch10-neurons","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Excitable cell specialized for receiving and transmitting information.\" Which term fits?","opts":[{"t":"Acetylcholine","c":false},{"t":"Dendrite","c":false},{"t":"Schwann cell","c":false},{"t":"Neuron","c":true}],"why":"Neuron: Excitable cell specialized for receiving and transmitting information. Locate receptive regions, trigger zone, conducting axon, and secretory terminal. Distinguish structural neuron classes from sensory/motor/interneuron roles.","diff":2,"origin":"guide","src":"check","trick":"Neuron = the body's messenger wire: dendrites listen, axon talks.","tip":"Neurons send signals; glial cells support them. Mature neurons rarely divide."},{"id":"C-ch10-glia","unit":"ch10","sec":"ch10-glia","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Multilayer glial membrane insulating selected axon segments.\" Which term fits?","opts":[{"t":"Synapse","c":false},{"t":"Hyperpolarization","c":false},{"t":"Neurotransmitter","c":false},{"t":"Myelin","c":true}],"why":"Myelin: Multilayer glial membrane insulating selected axon segments. Compare Schwann cells with oligodendrocytes and distinguish the four CNS glial types. Myelin explains white matter and supports saltatory conduction.","diff":2,"origin":"guide","src":"check","trick":"Myelin = insulation tape on a wire that lets the signal jump node to node (saltatory = leaping).","tip":"Myelin makes white matter white and speeds conduction. Loss of myelin (as in MS) slows signals."},{"id":"C-ch10-resting","unit":"ch10","sec":"ch10-resting","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Resting membrane potential, the voltage across an undisturbed cell membrane.\" Which term fits?","opts":[{"t":"RMP","c":true},{"t":"Threshold","c":false},{"t":"Action potential","c":false},{"t":"Depolarization","c":false}],"why":"RMP: Resting membrane potential, the voltage across an undisturbed cell membrane. Distinguish maintained ion gradients from moment-to-moment channel currents. Depolarization approaches zero; hyperpolarization becomes more negative.","diff":2,"origin":"guide","src":"check","trick":"RMP ≈ −70 mV: the inside of a resting neuron is negative, like a charged battery.","tip":"Resting potential is kept by the Na+/K+ pump and K+ leak channels."},{"id":"C-ch10-impulse","unit":"ch10","sec":"ch10-impulse","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Trigger voltage at which regenerative action potential initiation occurs.\" Which term fits?","opts":[{"t":"Action potential","c":false},{"t":"Neurotransmitter","c":false},{"t":"Synapse","c":false},{"t":"Threshold","c":true}],"why":"Threshold: Trigger voltage at which regenerative action potential initiation occurs. Sodium influx depolarizes; potassium efflux repolarizes. Predict conduction speed from myelination and diameter.","diff":2,"origin":"guide","src":"check","trick":"Threshold ≈ −55 mV: the point of no return, like a toilet that flushes once you push past the click.","tip":"Reach threshold and a full action potential fires. Below threshold, nothing fires."},{"id":"C-ch10-synapses","unit":"ch10","sec":"ch10-synapses","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Functional junction between a neuron and another cell.\" Which term fits?","opts":[{"t":"Divergence","c":false},{"t":"Neurotransmitter","c":false},{"t":"Acetylcholine","c":false},{"t":"Synapse","c":true}],"why":"Synapse: Functional junction between a neuron and another cell. Trace calcium-triggered exocytosis and receptor-dependent postsynaptic response. Explain transmitter removal and distinguish convergence from divergence.","diff":2,"origin":"guide","src":"check","trick":"SYN-apse = where two cells \"clasp\" (synapse = junction) without touching.","tip":"Chemical synapse order: impulse arrives → Ca2+ enters → vesicles release transmitter → receptors respond."},{"id":"C-ch11-protection","unit":"ch11","sec":"ch11-protection","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Cerebrospinal fluid surrounding and circulating within the CNS.\" Which term fits?","opts":[{"t":"ANS","c":false},{"t":"CSF","c":true},{"t":"Dorsal root ganglion","c":false},{"t":"Corpus callosum","c":false}],"why":"CSF: Cerebrospinal fluid surrounding and circulating within the CNS. Locate the CSF-filled subarachnoid space and trace ventricular circulation. Distinguish spinal epidural space from subarachnoid space.","diff":2,"origin":"guide","src":"check","trick":"CSF = the brain's water cushion and shock absorber.","tip":"CSF is made by choroid plexuses in the ventricles and flows in the subarachnoid space."},{"id":"C-ch11-cord","unit":"ch11","sec":"ch11-cord","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Tapered terminal portion of the spinal cord.\" Which term fits?","opts":[{"t":"Conus medullaris","c":true},{"t":"Fascicle","c":false},{"t":"Hydrocephalus","c":false},{"t":"Muscle spindle","c":false}],"why":"Conus medullaris: Tapered terminal portion of the spinal cord. Dorsal root is sensory; ventral root is motor; spinal nerves and rami are mixed. Differentiate gray horns from white columns and ascending from descending pathways.","diff":2,"origin":"guide","src":"check","trick":"CONUS = cone-shaped tip where the cord ends (about L1–L2).","tip":"Below the conus medullaris lie the cauda equina and the filum terminale."},{"id":"C-ch11-reflex","unit":"ch11","sec":"ch11-reflex","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Receptor-to-effector pathway producing a relatively rapid automatic response.\" Which term fits?","opts":[{"t":"Reflex arc","c":true},{"t":"Muscle spindle","c":false},{"t":"Sympathetic division","c":false},{"t":"EEG","c":false}],"why":"Reflex arc: Receptor-to-effector pathway producing a relatively rapid automatic response. Trace the five components of a reflex and distinguish monosynaptic from polysynaptic circuits. A spindle monitors muscle length, not simply tendon tension.","diff":2,"origin":"guide","src":"check","trick":"Reflex arc in 5 steps: Receptor → Sensory neuron → Integration center → Motor neuron → Effector (\"Real Smart Interns Make Errors\").","tip":"Reflexes are fast and automatic. Know all five parts and their order."},{"id":"C-ch11-cerebrum","unit":"ch11","sec":"ch11-cerebrum","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Outer gray matter of the cerebral hemispheres.\" Which term fits?","opts":[{"t":"Hypothalamus","c":false},{"t":"ANS","c":false},{"t":"Hydrocephalus","c":false},{"t":"Cerebral cortex","c":true}],"why":"Cerebral cortex: Outer gray matter of the cerebral hemispheres. Associate frontal with planning/motor, parietal with somatic sensation, temporal with hearing, occipital with vision. Cortex is gray matter; deeper pathways include white matter and gray nuclei.","diff":2,"origin":"guide","src":"check","trick":"CORTEX = the bark (cortex) on the outside of the brain: thin gray matter.","tip":"Gray matter = cell bodies (cortex, nuclei). White matter = myelinated tracts underneath."},{"id":"C-ch11-brainstem","unit":"ch11","sec":"ch11-brainstem","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Diencephalic region relaying and processing much sensory information.\" Which term fits?","opts":[{"t":"Postganglionic neuron","c":false},{"t":"Fascicle","c":false},{"t":"Thalamus","c":true},{"t":"Vagus nerve","c":false}],"why":"Thalamus: Diencephalic region relaying and processing much sensory information. Separate thalamic relay from hypothalamic homeostasis. Identify midbrain, pons, medulla, and cerebellar coordination roles.","diff":2,"origin":"guide","src":"check","trick":"THALAMUS = sensory switchboard (relay to cortex).","tip":"Thalamus = relay. Hypothalamus = homeostasis. Cerebellum = coordination and balance."},{"id":"C-ch11-cranial","unit":"ch11","sec":"ch11-cranial","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Interweaving network redistributing peripheral nerve fibers.\" Which term fits?","opts":[{"t":"Postganglionic neuron","c":false},{"t":"Plexus","c":true},{"t":"Parasympathetic division","c":false},{"t":"Sympathetic division","c":false}],"why":"Plexus: Interweaving network redistributing peripheral nerve fibers. Know cranial nerve numbers, names, sensory/motor categories, and major actions. Compare endoneurium, perineurium, epineurium and four major plexuses.","diff":2,"origin":"guide","src":"check","trick":"PLEXUS = a braided rope: nerves weave and regroup (cervical, brachial, lumbar, sacral).","tip":"A plexus mixes fibers from several spinal nerves, so one root injury rarely paralyzes a whole limb."},{"id":"C-ch11-autonomic","unit":"ch11","sec":"ch11-autonomic","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Autonomic nervous system, motor regulation of smooth/cardiac muscle and glands.\" Which term fits?","opts":[{"t":"Sympathetic division","c":false},{"t":"Parasympathetic division","c":false},{"t":"Hydrocephalus","c":false},{"t":"ANS","c":true}],"why":"ANS: Autonomic nervous system, motor regulation of smooth/cardiac muscle and glands. Somatic output uses one neuron; typical autonomic output uses a two-neuron chain. Compare thoracolumbar sympathetic with craniosacral parasympathetic origins.","diff":2,"origin":"guide","src":"check","trick":"ANS = Automatic Nervous System: heart, smooth muscle, glands, without you thinking.","tip":"Autonomic = involuntary targets with a two-neuron chain. Somatic = skeletal muscle with one neuron."},{"id":"C-ch11-receptors","unit":"ch11","sec":"ch11-receptors","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Using acetylcholine signaling.\" Which term fits?","opts":[{"t":"Hydrocephalus","c":false},{"t":"Cholinergic","c":true},{"t":"Meningitis","c":false},{"t":"Nicotinic receptor","c":false}],"why":"Cholinergic: Using acetylcholine signaling. Trace transmitters and receptor classes at ganglia and targets, including sweat gland exceptions. Distinguish demyelinating, vascular, degenerative, and neuromuscular mechanisms.","diff":2,"origin":"guide","src":"check","trick":"CHOLINergic = uses aCetylCHOLINe.","tip":"Cholinergic = ACh. Adrenergic = norepinephrine/epinephrine."},{"id":"C-ch11-disorders","unit":"ch11","sec":"ch11-disorders","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Disordered CSF dynamics associated with enlarged cerebral ventricles.\" Which term fits?","opts":[{"t":"Meningitis","c":false},{"t":"Hydrocephalus","c":true}],"why":"Hydrocephalus: Disordered CSF dynamics associated with enlarged cerebral ventricles. Differentiate myelin, vascular, developmental, infectious, degenerative, and CSF-flow mechanisms. A disorder label alone does not describe all causes or manifestations.","diff":2,"origin":"guide","src":"check","trick":"HYDRO-CEPHALUS = water (hydro) on the brain (cephalus): CSF builds up and ventricles swell.","tip":"In infants, hydrocephalus shows as a growing head and bulging fontanels because skull sutures aren't fused."},{"id":"C-ch12-receptors","unit":"ch12","sec":"ch12-receptors","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Conversion of stimulus energy into a cellular signal.\" Which term fits?","opts":[{"t":"Optic disc","c":false},{"t":"Transduction","c":true},{"t":"Gustation","c":false},{"t":"Phototransduction","c":false}],"why":"Transduction: Conversion of stimulus energy into a cellular signal. Distinguish detection/transduction from conscious interpretation. Classify receptors by stimulus and compare adaptation patterns.","diff":2,"origin":"guide","src":"check","trick":"TRANSduction = TRANSlating a stimulus (light, sound, pressure) into a nerve signal.","tip":"Transduction happens at the receptor. Perception (knowing what it is) happens in the brain."},{"id":"C-ch12-somatic","unit":"ch12","sec":"ch12-somatic","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Sense of body position and movement.\" Which term fits?","opts":[{"t":"Lysozyme","c":false},{"t":"Proprioception","c":true},{"t":"Presbycusis","c":false},{"t":"A-delta fiber","c":false}],"why":"Proprioception: Sense of body position and movement. Contrast muscle length sensing by spindles with tension sensing by tendon organs. Explain referred pain and separate fast/slow fibers from acute/chronic duration.","diff":2,"origin":"guide","src":"check","trick":"PROPRIOception = knowing your own (proprio) position, like touching your nose with eyes closed.","tip":"Proprioceptors include muscle spindles, Golgi tendon organs and joint receptors."},{"id":"C-ch12-chemical","unit":"ch12","sec":"ch12-chemical","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Sense of smell.\" Which term fits?","opts":[{"t":"Olfaction","c":true},{"t":"Stereocilia","c":false},{"t":"Otoconia","c":false},{"t":"Sensorineural hearing loss","c":false}],"why":"Olfaction: Sense of smell. Trace smell through receptor cilia, bulb, and tract. Identify five taste qualities and cranial nerves VII, IX, and X without a rigid tongue map.","diff":2,"origin":"guide","src":"check","trick":"OLFACTion = the OLFACTory nerve (CN I): \"Oh, what's that smell?\"","tip":"Smell is the only sense that doesn't relay through the thalamus first."},{"id":"C-ch12-ear","unit":"ch12","sec":"ch12-ear","focus":[],"type":"mcq","stem":"A learner describes this concept: \"External ear structure helping collect sound.\" Which term fits?","opts":[{"t":"Presbycusis","c":false},{"t":"Tinnitus","c":false},{"t":"Auricle","c":true},{"t":"Phototransduction","c":false}],"why":"Auricle: External ear structure helping collect sound. Trace auricle → canal → tympanic membrane → ossicles → oval window. Distinguish middle-ear air space, perilymph, and endolymph.","diff":2,"origin":"guide","src":"check","trick":"AURicle = the AURal (ear) flap you can see; it funnels sound into the canal.","tip":"Sound path: auricle → ear canal → eardrum → ossicles (malleus, incus, stapes) → oval window."},{"id":"C-ch12-hearing","unit":"ch12","sec":"ch12-hearing","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Inner-ear structure containing the hearing apparatus.\" Which term fits?","opts":[{"t":"Crista ampullaris","c":false},{"t":"Otoconia","c":false},{"t":"Cochlea","c":true},{"t":"Rhodopsin","c":false}],"why":"Cochlea: Inner-ear structure containing the hearing apparatus. Locate scalae, basilar membrane, hair cells, and tectorial membrane. Trace mechanical vibration to CN VIII signaling and temporal cortical processing.","diff":2,"origin":"guide","src":"check","trick":"COCHLEA = snail shell (cochlea = snail) where hearing happens.","tip":"Cochlea = hearing. Vestibule and semicircular canals = balance."},{"id":"C-ch12-balance","unit":"ch12","sec":"ch12-balance","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Vestibular sensory patch in utricle or saccule detecting gravity and linear acceleration.\" Which term fits?","opts":[{"t":"Fovea","c":false},{"t":"Accommodation","c":false},{"t":"Macula","c":true},{"t":"Tinnitus","c":false}],"why":"Macula: Vestibular sensory patch in utricle or saccule detecting gravity and linear acceleration. Maculae detect gravity/linear acceleration; cristae detect angular acceleration. Trace vestibular input through CN VIII and central balance/gaze circuits.","diff":2,"origin":"guide","src":"check","trick":"MACULA = Moving in a straight line or tilting (gravity). Crista = spinning.","tip":"Maculae sit in the utricle and saccule and sense head position and linear acceleration."},{"id":"C-ch12-eye","unit":"ch12","sec":"ch12-eye","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Neural eye layer containing photoreceptors and processing circuits.\" Which term fits?","opts":[{"t":"Lysozyme","c":false},{"t":"Accommodation","c":false},{"t":"Retina","c":true},{"t":"Aqueous humor","c":false}],"why":"Retina: Neural eye layer containing photoreceptors and processing circuits. Identify fibrous, vascular, and neural tunics and their components. Distinguish aqueous-filled chambers from the vitreous cavity.","diff":2,"origin":"guide","src":"check","trick":"RETINA = the movie screen at the back of the eye, covered in rods and cones.","tip":"Eye tunics: fibrous (sclera, cornea), vascular (choroid, ciliary body, iris), neural (retina)."},{"id":"C-ch12-vision","unit":"ch12","sec":"ch12-vision","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Adjustment of lens shape to focus at different distances.\" Which term fits?","opts":[{"t":"Accommodation","c":true},{"t":"Optic disc","c":false},{"t":"Phototransduction","c":false},{"t":"Rod","c":false}],"why":"Accommodation: Adjustment of lens shape to focus at different distances. Near focus: ciliary contraction, reduced zonular tension, rounder lens. Rods favor dim light; cones favor color/acuity; ganglion axons form CN II.","diff":2,"origin":"guide","src":"check","trick":"ACCOMMODATION = the lens accommodates (adjusts its shape) for near vs far.","tip":"Losing accommodation with age is presbyopia, which is why many adults over 40 need reading glasses."},{"id":"C-ch12-phototransduction","unit":"ch12","sec":"ch12-phototransduction","focus":[],"type":"mcq","stem":"A learner describes this concept: \"Conversion of light into photoreceptor electrical and chemical responses.\" Which term fits?","opts":[{"t":"Presbyopia","c":false},{"t":"Phototransduction","c":true},{"t":"Rhodopsin","c":false},{"t":"Tinnitus","c":false}],"why":"Phototransduction: Conversion of light into photoreceptor electrical and chemical responses. Light hyperpolarizes photoreceptors and changes their transmitter release. Distinguish presbyopia, cataract, glaucoma, retinal disease, and age-related hearing loss.","diff":2,"origin":"guide","src":"check","trick":"PHOTO-transduction = light (photo) changed into a nerve signal by rods and cones.","tip":"Unusual fact: light HYPERpolarizes photoreceptors and reduces their transmitter release."}],"version":"390501ff57"}</script>

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) { // mulberry32
  let a = typeof seed === 'number' ? seed : hashStr(String(seed));
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

function shuffle(arr, rand = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

}

function weightedSample(items, weightFn, n, rand = Math.random) {
  const pool = items.map((it) => ({ it, w: Math.max(0, weightFn(it)) })).filter((x) => x.w > 0);
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, x) => s + x.w, 0);
    let r = rand() * total, i = 0;
    for (; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) break; }
    out.push(pool.splice(Math.min(i, pool.length - 1), 1)[0].it);
  }
  return out;
}

function dayNum(s = todayStr()) {

  return Math.round(Date.UTC(y, m - 1, d) / 86400000);
}

function debounce(fn, ms) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };

// ---------- saved progress ----------
// Saved in this browser right away, and to the artifact's private per-viewer store
// (claude.ai) when the page runs there, so progress survives Safari clearing site data.
const SAVE_KEY = 'ward-rounds-save-v1';
const SAVE_VERSION = 1;

function defaultState() {
  return {
    v: SAVE_VERSION,
    updatedAt: 0,
    profile: {
      name: '',
      onboarded: false,
      avatar: { skin: 2, hair: 0, hairColor: 1, eyes: 0, scrubs: 0, pattern: 0, acc: ['stethoscope'], shoes: 0 },
    },
    xp: 0,
    points: 0,
    bestStreak: 0,
    badges: {},
    items: {},          // qid -> { s: seen, r: right, w: wrong, ok: right-days streak, od: last right day, ld: last day seen, miss: bool }
    units: {},          // uid -> { shifts, perfect, best }
    typeStats: {},      // type -> { n, r }
    originStats: {},    // new|guide -> { n, r }
    discharged: 0,
    codeBlueBest: 0,
    boss: { wins: 0, best: 0, noLifelineWin: false },
    exams: [],
    days: { last: '', streak: 0, today: '', answered: 0, active: [] },
    recent: [],
    unlocks: {},
    settings: { sound: true, motion: 'auto', whimsy: 'full', text: 1, examDate: '', dailyGoal: 0 },
    openRun: null,      // autosaved round in progress: { at, run }
  };
}

function mergeDefaults(base, saved) {
  if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return base;
  for (const k of Object.keys(saved)) {
    const b = base[k], s = saved[k];
    if (b && typeof b === 'object' && !Array.isArray(b) && s && typeof s === 'object' && !Array.isArray(s)) base[k] = mergeDefaults(b, s);
    else base[k] = s;
  }
  return base;
}

const Store = {
  state: null,
  cloud: { status: 'local', ref: null, writing: false, pending: false, lastWritten: 0 },
  listeners: [],

  init() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { saved = null; }
    this.state = mergeDefaults(defaultState(), saved);
    WR.state = this.state;
    this.connectCloud();
  },

  onChange(fn) { this.listeners.push(fn); },

  save(opts = {}) {
    this.state.updatedAt = Date.now();
    this._local();
    if (opts.now) this._cloud.flush(); else this._cloud();
  },

  // autosave the round in progress (or clear it once the round is over / left)
  holdRun: false,       // a saved round is waiting on Resume / Discard: don't clear it yet
  saveRun() {
    const run = App.run;
    if (this.holdRun) { if (!run) return; this.holdRun = false; } // starting a new round replaces it
    const next = run && !run.over && run.cur ? { at: Date.now(), run: run.serialize() } : null;
    if (!next && !this.state.openRun) return;
    this.state.openRun = next;
    this.save();
  },

  _local: debounce(function () {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(Store.state)); } catch (e) { /* storage blocked: cloud save still runs */ }
  }, 250),

  _cloud: debounce(function () { Store._cloudWrite(); }, 2500),

  async _cloudWrite() {
    const c = this.cloud;
    if (!c.ref) return;
    if (c.writing) { c.pending = true; return; }
    if (this.state.updatedAt <= c.lastWritten) return;
    c.writing = true;
    const snapshot = JSON.parse(JSON.stringify(this.state));
    try {
      await c.ref.set(snapshot);
      c.lastWritten = snapshot.updatedAt;
      c.status = 'cloud';
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { c.ref = null; c.status = 'local'; }
      else c.status = 'offline';
    } finally {
      c.writing = false;
      if (c.pending) { c.pending = false; this._cloudWrite(); }
    }
  },

  async connectCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/save');
      const snap = await Promise.race([ref.get(), sleep(10000).then(() => null)]);
      this.cloud.ref = ref;
      this.cloud.status = 'cloud';
      if (snap && snap.exists) {
        const remote = snap.data();
        if (remote && (remote.updatedAt || 0) > (this.state.updatedAt || 0)) {
          this.state = mergeDefaults(defaultState(), JSON.parse(JSON.stringify(remote)));
          WR.state = this.state;
          this.cloud.lastWritten = remote.updatedAt;
          this._local();
          this.listeners.forEach((fn) => fn('remote'));
          return;
        }
        this.cloud.lastWritten = remote ? remote.updatedAt || 0 : 0;
      }
      if (this.state.updatedAt > this.cloud.lastWritten) this._cloudWrite();
    } catch (e) {
      this.cloud.status = 'local';
    }
  },

  exportText() {
    return JSON.stringify({ app: 'ward-rounds', exported: new Date().toISOString(), save: this.state }, null, 1);
  },

  importText(text) {
    const obj = JSON.parse(text);
    const save = obj && obj.app === 'ward-rounds' ? obj.save : obj;
    if (!save || typeof save !== 'object' || !save.profile || !save.items) throw new Error('That file is not a Ward Rounds backup.');
    this.state = mergeDefaults(defaultState(), save);
    WR.state = this.state;
    this.save({ now: true });
  },

  reset() {
    const keepSettings = this.state.settings;
    this.state = defaultState();
    this.state.settings = keepSettings;
    WR.state = this.state;
    this.save({ now: true });
  },
};

// ---------- synthesized sound (no audio files) ----------
const Sound = {
  ctx: null,
  master: null,

  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },

  on() { return !!(this.ctx && WR.state && WR.state.settings.sound); },

  tone(freq, start, dur, type = 'sine', vol = 1, slideTo) {
    const t0 = this.ctx.currentTime + start;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },

  // short filtered noise burst (the sneeze)
  noise(start, dur, vol = 0.5, freq = 2400) {
    const ctx = this.ctx, t0 = ctx.currentTime + start;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },

  play(name, delay = 0) {
    if (delay) { setTimeout(() => this.play(name), delay); return; }
    if (!this.on()) return;
    try {
      switch (name) {
        case 'tap': this.tone(660, 0, 0.06, 'triangle', 0.35); break;
        case 'right': this.tone(784, 0, 0.14, 'triangle', 0.8); this.tone(1175, 0.09, 0.22, 'triangle', 0.7); break;
        case 'wrong': this.tone(220, 0, 0.22, 'sawtooth', 0.35, 150); this.tone(196, 0.12, 0.25, 'square', 0.18, 140); break;
        case 'part': this.tone(523, 0, 0.12, 'triangle', 0.6); this.tone(494, 0.1, 0.18, 'triangle', 0.5); break;
        case 'beep': this.tone(1046, 0, 0.07, 'sine', 0.25); break;
        case 'alarm': [0, 0.28, 0.56].forEach((s) => this.tone(880, s, 0.18, 'square', 0.35, 660)); break;
        case 'hit': this.tone(180, 0, 0.18, 'square', 0.5, 70); this.tone(900, 0, 0.08, 'triangle', 0.5); break;
        case 'heal': this.tone(392, 0, 0.3, 'sine', 0.5, 784); break;
        case 'coffee': this.tone(587, 0, 0.12, 'sine', 0.6); this.tone(880, 0.1, 0.2, 'sine', 0.6); break;
        case 'colleague': this.tone(440, 0, 0.1, 'triangle', 0.5); this.tone(554, 0.08, 0.1, 'triangle', 0.5); break;
        case 'door': this.tone(300, 0, 0.12, 'triangle', 0.3, 420); break;
        case 'win': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.11, 0.3, 'triangle', 0.7)); break;
        case 'rank': [392, 523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, i * 0.09, 0.32, 'triangle', 0.6)); break;
        case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, i * 0.16, 0.3, 'triangle', 0.5)); break;
        case 'boing': this.tone(180, 0, 0.32, 'sine', 0.7, 620); this.tone(620, 0.16, 0.2, 'sine', 0.3, 400); break;
        case 'kazoo': [523, 587, 659, 523, 784].forEach((f, i) => this.tone(f, i * 0.1, 0.12, 'sawtooth', 0.18, f * 1.03)); break;
        case 'slide': this.tone(300, 0, 0.5, 'sine', 0.55, 1400); break;
        case 'slidedown': this.tone(1300, 0, 0.55, 'sine', 0.5, 220); break;
        case 'honk': this.tone(330, 0, 0.16, 'square', 0.3, 300); this.tone(330, 0.2, 0.22, 'square', 0.3, 290); break;
        case 'sneeze': this.tone(500, 0, 0.18, 'triangle', 0.25, 900); this.noise(0.2, 0.28, 0.6, 3000); break;
        case 'pop': this.tone(900, 0, 0.06, 'sine', 0.5, 1500); break;
        case 'tada': [523, 659, 784].forEach((f, i) => this.tone(f, i * 0.08, 0.14, 'triangle', 0.6)); [523, 659, 784, 1046].forEach((f) => this.tone(f, 0.3, 0.55, 'triangle', 0.4)); break;
        case 'badge': this.tone(988, 0, 0.12, 'sine', 0.6); this.tone(1318, 0.1, 0.3, 'sine', 0.6); break;
      }
    } catch (e) { /* audio is optional */ }
  },
};

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.round(amt > 0 ? c + (255 - c) * amt : c * (1 + amt));
  r = f(r); g = f(g); b = f(b);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

    if (acc.has('stethoscope')) s += `<path d="M47 80 q-4 18 6 24 q7 4 7 12" stroke="#3b4b63" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M73 80 q4 18 -6 24" stroke="#3b4b63" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="60" cy="118" r="4.5" fill="#cfd8e3" stroke="#3b4b63" stroke-width="2"/>`;

  // neck + head
  s += `<rect x="53" y="72" width="14" height="12" rx="5" fill="${skinShade}"/>`;

  s += `<circle cx="${cx - 33}" cy="${cy + 4}" r="6" fill="${skinShade}"/><circle cx="${cx + 33}" cy="${cy + 4}" r="6" fill="${skinShade}"/>`;
  if (acc.has('earrings') && !isHijab) s += `<circle cx="${cx - 33}" cy="${cy + 11}" r="2.6" fill="#f6d36b"/><circle cx="${cx + 33}" cy="${cy + 11}" r="2.6" fill="#f6d36b"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="33" fill="${skin}"/>`;
  s += face(cx, cy, mood, av.eyes);
  if (acc.has('glasses')) s += `<g fill="none" stroke="#3b3044" stroke-width="2.2"><circle cx="${cx - 12}" cy="${cy + 2}" r="8.5"/><circle cx="${cx + 12}" cy="${cy + 2}" r="8.5"/><path d="M${cx - 3.5} ${cy + 1} q3.5 -3 7 0"/></g>`;
  s += hairFront(av.hair, hcol, cx, cy);
  if (acc.has('cap') && !isHijab) {
    const capC = lighten(scrub, 0.12);
    s += `<path d="M${cx - 35} ${cy - 6} q0 -34 35 -34 q35 0 35 34 q-35 -10 -70 0z" fill="${capC}"/>`;
    if (pat) s += `<path d="M${cx - 35} ${cy - 6} q0 -34 35 -34 q35 0 35 34 q-35 -10 -70 0z" fill="url(#${uid}p)" opacity=".9"/>`;
    s += `<path d="M${cx - 35} ${cy - 6} q35 -10 70 0" stroke="${scrubDark}" stroke-width="3" fill="none"/>`;
  }
  s += `</svg>`;
  return s;
}

const PT_INITIALS = 'ABCDEGHJKLMNOPRSTVW';

function patientFor(q, salt = '') {
  const r = rng(q.id + salt);
  const m = /(\d{1,3})-year-old/.exec(q.stem);
  let age = m ? +m[1] : 0;
  if (!age) age = 19 + Math.floor(r() * 66);
  const old = age >= 65, kid = age < 14;
  const p = {
    name: pick(PT_NAMES, r) + ' ' + pick(PT_INITIALS.split(''), r) + '.',
    age,
    bed: 'ABCD'[Math.floor(r() * 4)],
    skin: Math.floor(r() * AVATAR.skin.length),
    hair: old ? 6 : Math.floor(r() * 6),
    hairStyle: Math.floor(r() * 7),
    gown: ['#9cc6e8', '#a8d8c8', '#c9b6e8', '#f1c0b6'][Math.floor(r() * 4)],
    old, kid,
    glasses: old ? r() < 0.6 : r() < 0.15,
  };
  return p;
}

function patientHead(p, mood = 'neutral', size = 'bust') {
  const skin = AVATAR.skin[p.skin];
  const hcol = AVATAR.hairColor[p.hair].c;
  const cx = 50, cy = p.kid ? 52 : 46;
  const r = p.kid ? 26 : 28;
  let s = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  s += `<path d="M14 100 q2 -26 36 -28 q34 2 36 28z" fill="${p.gown}"/><path d="M14 100 q2 -26 36 -28 q34 2 36 28z" fill="none" stroke="#0002"/>`;

  const style = p.hairStyle;
  if (style === 3 || style === 6) s += `<path d="M${cx - r - 3} ${cy - 2} q-3 34 6 40 h${2 * r - 6} q9 -6 6 -40z" fill="${hcol}"/>`;
  if (style === 4) s += [[-20, -12], [20, -12], [-26, 4], [26, 4], [0, -26]].map(([x, y]) => `<circle cx="${cx + x}" cy="${cy + y}" r="12" fill="${hcol}"/>`).join('');
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${skin}"/>`;

window.WHIMSY_LIST = WHIMSY;
const Whimsy = {
  timer: null,

  setting() { return (WR.state.settings && WR.state.settings.whimsy) || 'full'; },

  // streak tier: 0 below 3, then the score multiplier's steps (×1.5, ×2, ×3), then 15+
  tier(streak) {
    if (streak >= 15) return 4;
    const m = Engine.multiplier(streak);
    return m >= 3 ? 3 : m >= 2 ? 2 : m > 1 ? 1 : 0;
  },
  chaos(wrongRun) { return Math.min(3, wrongRun); },

  // which reaction (or null) this answer earns
  choose(run, res) {
    const mode = this.setting();
    if (mode === 'off' || run.mode === 'exam' || run.mode === 'boss') return null;
    let kind, level;
    if (res.correct) { kind = 'good'; level = this.tier(run.streak); }
    else if (res.frac > 0) return null; // partly right: stay calm, read the why
    else { kind = 'chaos'; level = this.chaos(run.wrongRun); }
    const cap = run.mode === 'codeblue' ? 1 : mode === 'mild' ? (kind === 'good' ? 2 : 1) : 4;
    level = Math.min(level, cap);
    if (!level) return null;
    let pool = WHIMSY.filter((w) => w.kind === kind && w.tier === level);
    if (pool.length > 1) pool = pool.filter((w) => w.id !== run.lastWh);
    return pick(pool);
  },

  clear(bed) {
    clearTimeout(this.timer);
    const el = bed || document.getElementById('bed');
    if (!el) return;
    el.className = el.className.split(/\s+/).filter((c) => c && c !== 'wh' && c !== 'wh-still' && !c.startsWith('wh-')).join(' ');
    const props = el.querySelector('.pt-props'); if (props) props.innerHTML = '';
    const card = el.closest('.patient-card'); if (card) card.querySelectorAll('.wh-banner').forEach((b) => b.remove());
    const mon = document.getElementById('monitor'); if (mon) mon.classList.remove('wh-sneeze');
  },

  // stage a reaction on the bedside patient; returns the reaction (or null)
  react(run, res) {
    const bed = document.getElementById('bed');
    if (!bed || !run.cur) return null;
    const w = this.choose(run, res);
    if (!w) return null;
    this.clear(bed);
    run.lastWh = w.id;
    run.cur.wh = w.id;
    bed.innerHTML = patientInBed(run.cur.patient, w.mood);
    const props = bed.querySelector('.pt-props');
    if (w.props && props) props.innerHTML = WH_PROPS[w.props](run.cur.patient);
    const still = reducedMotion();
    bed.classList.add('wh', 'wh-' + w.id);
    if (still) bed.classList.add('wh-still');
    const card = bed.closest('.patient-card');
    if (w.banner && card) { const b = document.createElement('div'); b.className = 'wh-banner'; b.textContent = w.banner; b.setAttribute('aria-hidden', 'true'); card.appendChild(b); }
    if (w.sneeze && !still) { const mon = document.getElementById('monitor'); if (mon) { mon.classList.remove('wh-sneeze'); void mon.offsetWidth; mon.classList.add('wh-sneeze'); } }
    if (w.sound) Sound.play(w.sound, 260); // after the right/wrong chime
    this.timer = setTimeout(() => this.clear(bed), w.ms);
    return w;
  },
};

// ---------- one animation loop for everything that ticks ----------
const Loop = {
  fns: new Set(),
  running: false,
  last: 0,
  add(fn) { this.fns.add(fn); this.start(); return () => this.fns.delete(fn); },
  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    const step = (t) => {
      if (!this.running) return;
      const dt = Math.min(0.05, (t - this.last) / 1000);
      this.last = t;
      if (!document.hidden) this.fns.forEach((fn) => { try { fn(dt, t); } catch (e) { console.error(e); } });
      if (this.fns.size) requestAnimationFrame(step); else this.running = false;
    };
    requestAnimationFrame(step);
  },
};

// ---------- ECG monitor ----------
function gauss(t, mu, sd) { return Math.exp(-((t - mu) ** 2) / (2 * sd * sd)); }
function pqrst(t) {
  return 0.12 * gauss(t, 0.16, 0.025) - 0.14 * gauss(t, 0.27, 0.008) + 1.0 * gauss(t, 0.30, 0.011)
    - 0.28 * gauss(t, 0.335, 0.011) + 0.26 * gauss(t, 0.56, 0.045);
}

class ECG {
  constructor(canvas, hrEl, monitorEl) {
    this.c = canvas; this.hrEl = hrEl; this.mon = monitorEl;
    this.ctx = canvas.getContext('2d');
    this.stress = 0.15; this.shown = 0.15;
    this.phase = 0; this.x = 0; this.ys = []; this.beep = false;
    this.lastBpm = 0;
    this.resize();
    this.off = Loop.add((dt) => this.tick(dt));
  }
  resize() {
    const r = this.c.getBoundingClientRect();
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    this.w = Math.max(40, Math.round(r.width)); this.h = Math.max(30, Math.round(r.height));
    this.c.width = this.w * dpr; this.c.height = this.h * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ys = new Array(this.w).fill(this.h * 0.62);
    this.x = 0;
  }
  bpm() { return Math.round(62 + 92 * this.shown); }
  color() { return this.shown > 0.72 ? '#ff4757' : this.shown > 0.45 ? '#f6bd52' : '#52f0a4'; }
  tick(dt) {
    if (!this.c.isConnected) { this.destroy(); return; }
    this.shown += (this.stress - this.shown) * Math.min(1, dt * 1.5);
    const bpm = this.bpm();
    if (bpm !== this.lastBpm) {
      this.lastBpm = bpm;
      if (this.hrEl) this.hrEl.textContent = bpm;
      if (this.mon) { this.mon.classList.toggle('amber', this.shown > 0.45 && this.shown <= 0.72); this.mon.classList.toggle('red', this.shown > 0.72); }
    }
    const still = reducedMotion();
    const speed = this.w / 3.2; // one sweep every ~3 s
    const adv = still ? 0 : speed * dt;
    const base = this.h * 0.62, amp = this.h * 0.5;
    let n = Math.max(1, Math.round(adv));
    if (still && !this.drewStill) { this.drawStill(); this.drewStill = true; return; }
    if (still) return;
    this.drewStill = false;
    for (let i = 0; i < n; i++) {
      const prev = this.phase;
      this.phase = (this.phase + (bpm / 60) * (dt / n)) % 1;
      if (this.beep && prev < 0.3 && this.phase >= 0.3) Sound.play('beep');
      this.x = (this.x + 1) % this.w;
      this.ys[this.x] = base - amp * pqrst(this.phase);
    }
    this.draw();
  }
  drawStill() {
    const base = this.h * 0.62, amp = this.h * 0.5;
    for (let x = 0; x < this.w; x++) this.ys[x] = base - amp * pqrst(((x / this.w) * 3.2 * (this.bpm() / 60)) % 1);
    this.x = this.w - 1;
    this.draw(true);
  }
  draw(noGap) {
    const { ctx, w, h } = this;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(82,240,164,.08)'; ctx.lineWidth = 1;
    for (let gx = 0; gx < w; gx += 16) { ctx.beginPath(); ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, h); ctx.stroke(); }
    for (let gy = 0; gy < h; gy += 16) { ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(w, gy + 0.5); ctx.stroke(); }
    const col = this.color();
    ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.shadowColor = col; ctx.shadowBlur = 6;
    const gap = noGap ? 0 : 14;
    ctx.beginPath();
    let pen = false;
    for (let x = 0; x < w; x++) {
      const d = (x - this.x + w) % w;
      if (d > 0 && d <= gap) { pen = false; continue; }
      if (!pen) { ctx.moveTo(x, this.ys[x]); pen = true; } else ctx.lineTo(x, this.ys[x]);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    if (!noGap) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(this.x, this.ys[this.x], 2.6, 0, Math.PI * 2); ctx.fill(); }
  }
  destroy() { if (this.off) this.off(); this.off = null; }
}

// ---------- floating text, shake, confetti ----------
const FX = {
  layer() { return document.getElementById('fx-layer'); },

  float(text, anchor, cls = '') {
    const layer = this.layer();
    if (!layer || !anchor) return;
    const r = anchor.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float-text ' + cls;
    el.textContent = text;
    el.style.left = r.left + r.width / 2 + 'px';
    el.style.top = r.top + r.height / 3 + 'px';
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  },

  shake(el) {
    if (!el || reducedMotion()) return;
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 600);
  },

  flash(kind) {
    const layer = this.layer();
    if (!layer || reducedMotion()) return;
    const el = document.createElement('div');
    el.className = 'screen-flash ' + kind;
    layer.appendChild(el);
    setTimeout(() => el.remove(), 500);
  },

  confetti(amount = 140) {
    if (reducedMotion()) return;
    const layer = this.layer();
    const c = document.createElement('canvas');
    c.className = 'confetti';
    layer.appendChild(c);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#5cd6c0', '#f6bd52', '#ff6b7a', '#8fa8ff', '#52f0a4', '#ffffff', '#e7889f'];
    const ps = Array.from({ length: amount }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35,
      vx: (Math.random() - 0.5) * 900, vy: -Math.random() * 900 - 250,
      r: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
      col: pick(colors), shape: Math.random() < 0.3 ? 'c' : 'r',
    }));
    let life = 0;
    const off = Loop.add((dt) => {
      life += dt;
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.vy += 1400 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col;
        if (p.shape === 'c') { ctx.beginPath(); ctx.arc(0, 0, p.r * 0.6, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.r, -p.r / 2.5, p.r * 2, p.r / 1.25);
        ctx.restore();
      }
      if (life > 3.2) { off(); c.remove(); }
    });
  },

  projectile(from, to, color) {
    if (!from || !to || reducedMotion()) return Promise.resolve();
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'projectile';
    if (color) el.style.background = `radial-gradient(circle, #fff, ${color} 60%, transparent 70%)`;
    this.layer().appendChild(el);
    const x0 = a.left + a.width * 0.7, y0 = a.top + a.height * 0.4, x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
    el.style.left = '0px'; el.style.top = '0px';
    const anim = el.animate([
      { transform: `translate(${x0}px, ${y0}px) scale(.6)` },
      { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 60}px) scale(1.1)` },
      { transform: `translate(${x1}px, ${y1}px) scale(1.4)`, opacity: 0.9 },
    ], { duration: 420, easing: 'ease-in' });
    return anim.finished.then(() => el.remove()).catch(() => el.remove());
  },
};

];

const Engine = {
  // ----- ranks + xp
  rankIndex(xp = WR.state.xp) { let i = 0; RANKS.forEach((r, k) => { if (xp >= r.xp) i = k; }); return i; },
  rank(xp) { return RANKS[this.rankIndex(xp)]; },
  rankProgress(xp = WR.state.xp) {
    const i = this.rankIndex(xp), cur = RANKS[i], nxt = RANKS[i + 1];
    if (!nxt) return { i, cur, nxt: null, frac: 1, toGo: 0 };
    return { i, cur, nxt, frac: (xp - cur.xp) / (nxt.xp - cur.xp), toGo: nxt.xp - xp };
  },
  addXP(n) {
    const before = this.rankIndex();
    WR.state.xp += Math.max(0, Math.round(n));
    const after = this.rankIndex();
    return after > before ? after : null;
  },

  // ----- per-question review records
  rec(qid) { return WR.state.items[qid]; },
  touchDay() {
    const d = WR.state.days, t = todayStr();
    if (d.today !== t) {
      const yesterday = todayStr(new Date(Date.now() - 86400000));
      d.streak = d.last === yesterday ? d.streak + 1 : 1;
      d.last = t; d.today = t; d.answered = 0;
      d.active = (d.active || []).concat(t).slice(-90);
    }
  },
  record(q, res) {
    this.touchDay();
    const s = WR.state, t = todayStr();
    const r = s.items[q.id] || (s.items[q.id] = { s: 0, r: 0, w: 0, ok: 0, od: '', ld: '', miss: false });
    const first = r.s === 0;
    r.s++; r.ld = t;
    let discharged = false;
    if (res.correct) {
      r.r++;
      if (r.od !== t) { r.ok++; r.od = t; }
      if (r.miss && r.ok >= 2) { r.miss = false; s.discharged++; discharged = true; }
    } else {
      r.w++; r.ok = 0; r.miss = true;
    }
    const ts = s.typeStats[q.type] || (s.typeStats[q.type] = { n: 0, r: 0 });
    ts.n++; if (res.correct) ts.r++;
    const os = s.originStats[q.origin] || (s.originStats[q.origin] = { n: 0, r: 0 });
    os.n++; if (res.correct) os.r++;
    s.days.answered++;
    s.recent = [q.id].concat(s.recent.filter((x) => x !== q.id)).slice(0, 40);
    return { first, discharged };
  },

  // ----- mastery
  mastery(uid) {
    const qs = Content.byUnit[uid] || [];
    let ever = 0, solid = 0, missed = 0, seen = 0;
    for (const q of qs) {
      const r = WR.state.items[q.id];
      if (!r) continue;
      if (r.s) seen++;
      if (r.r) ever++;
      if (r.ok >= 2) solid++;
      if (r.miss) missed++;
    }
    const total = qs.length || 1;
    const stars = solid / total >= 0.9 ? 3 : ever / total >= 0.8 ? 2 : ever / total >= 0.6 ? 1 : 0;
    return { total: qs.length, ever, solid, missed, seen, stars, everFrac: ever / total, solidFrac: solid / total };
  },
  missed(uid) {
    return Content.all().filter((q) => (!uid || q.unit === uid) && WR.state.items[q.id] && WR.state.items[q.id].miss);
  },
  // The OR opens after a star in 4 rooms, or after 12 finished shifts, whichever comes first.
  BOSS_ROOMS: 4,
  BOSS_SHIFTS: 12,
  shiftsDone() { return Object.values(WR.state.units).reduce((a, u) => a + (u.shifts || 0), 0); },
  bossUnlocked() {
    const rooms = Content.units.filter((u) => this.mastery(u.id).stars >= 1).length;
    return rooms >= this.BOSS_ROOMS || this.shiftsDone() >= this.BOSS_SHIFTS;
  },

  // ----- picking patients
  weight(q, opts = {}) {
    const r = WR.state.items[q.id], t = todayStr();
    let w;
    if (!r || !r.s) w = q.origin === 'new' ? 3.6 : 3;
    else if (r.miss) w = r.ld === t ? 1.4 : 4.5;
    else if (r.ok < 2) w = r.od === t ? 0.6 : 1.8;
    else w = 0.35;
    if (WR.state.recent.indexOf(q.id) !== -1) w *= 0.12;
    if (opts.weakBias) w *= 1 + 1.2 * (1 - this.mastery(q.unit).everFrac);
    return w;
  },
  pickShift(uid, n = 10) {
    return weightedSample(Content.byUnit[uid] || [], (q) => this.weight(q), n).map((q) => q.id);
  },
  pickReview(uid, n = 10) {
    const pool = this.missed(uid);
    return weightedSample(pool, (q) => (WR.state.items[q.id].ld === todayStr() ? 1 : 3), n).map((q) => q.id);
  },
  pickOne(filter, exclude = [], weakBias = true) {
    const pool = Content.all().filter((q) => filter(q) && exclude.indexOf(q.id) === -1);
    const got = weightedSample(pool.length ? pool : Content.all().filter(filter), (q) => this.weight(q, { weakBias }), 1);
    return got.length ? got[0].id : null;
  },
  pickExam(n = 50) {
    const out = [];
    for (const u of Content.units) out.push(...weightedSample(Content.byUnit[u.id], (q) => this.weight(q), 2).map((q) => q.id));
    const rest = Content.all().filter((q) => out.indexOf(q.id) === -1);
    out.push(...weightedSample(rest, (q) => this.weight(q, { weakBias: true }) * (q.origin === 'new' ? 1.3 : 1), n - out.length).map((q) => q.id));
    return shuffle(out);
  },

  // ----- grading + points
  grade(q, ans) {
    if (q.type === 'sata') {
      const sel = ans || [];
      const nOk = q.opts.filter((o) => o.c).length;
      const good = sel.filter((i) => q.opts[i].c).length, bad = sel.length - good;
      const frac = Math.max(0, good - bad) / nOk;
      return { correct: good === nOk && bad === 0, frac };
    }
    if (q.type === 'order') {
      const seq = ans || [];
      const right = seq.filter((v, i) => v === i).length;
      return { correct: right === q.steps.length && seq.length === q.steps.length, frac: right / q.steps.length };
    }
    const ok = ans != null && q.opts[ans] && !!q.opts[ans].c;
    return { correct: ok, frac: ok ? 1 : 0 };
  },
  multiplier(streak) { return streak >= 10 ? 3 : streak >= 6 ? 2 : streak >= 3 ? 1.5 : 1; },
  points(q, frac, streak) {
    const base = TYPE_INFO[q.type].base;
    const mult = frac === 1 ? this.multiplier(streak) : 1;
    return { base, mult, pts: Math.round(base * frac * mult) };
  },

  // ----- exam countdown + daily target
  daysToExam() {
    const d = WR.state.settings.examDate;
    if (!d) return null;
    return dayNum(d) - dayNum(todayStr());
  },
  dailyTarget() {
    if (WR.state.settings.dailyGoal) return WR.state.settings.dailyGoal;
    const left = this.daysToExam();
    if (left == null || left <= 0) return 20;
    const solid = Object.values(WR.state.items).filter((r) => r.ok >= 2).length;
    const todo = Content.all().length - solid;
    return clamp(Math.ceil(todo / left), 10, 150);
  },

  // ----- badges
  award(id) {
    if (WR.state.badges[id]) return false;
    WR.state.badges[id] = Date.now();
    return true;
  },
  checkBadges(ctx = {}) {
    const s = WR.state, got = [];
    const give = (id, cond) => { if (cond && this.award(id)) got.push(id); };
    const shifts = Object.values(s.units).reduce((a, u) => a + (u.shifts || 0), 0);
    give('first_shift', shifts >= 1);
    give('shift3', shifts >= 3);
    give('streak10', s.bestStreak >= 10);
    give('streak25', s.bestStreak >= 25);
    const ts = (t) => (s.typeStats[t] ? s.typeStats[t].r : 0);
    give('sata', ts('sata') >= 10);
    give('priority', ts('priority') >= 10);
    give('teaching', ts('teaching') >= 10);
    give('math', ts('math') >= 5);
    give('order', ts('order') >= 5);
    give('discharge25', s.discharged >= 25);
    give('daystreak3', s.days.streak >= 3);
    give('daystreak7', s.days.streak >= 7);
    give('night', new Date().getHours() >= 22);
    give('chief', this.rankIndex() >= RANKS.length - 1);
    if (ctx.endOfRun) {
      const ms = Content.units.map((u) => this.mastery(u.id).stars);
      give('allrooms1', ms.every((x) => x >= 1));
      give('allrooms3', ms.every((x) => x >= 3));
    }
    (ctx.extra || []).forEach((id) => give(id, true));
    return got;
  },
};

// ---------- a play session: shift, review, code blue, boss, exam ----------
const MODES = {
  shift: { lives: 3, n: 10, feedback: true, lifelines: true },
  review: { lives: 0, n: 10, feedback: true, lifelines: false },
  codeblue: { lives: 0, n: Infinity, feedback: false, lifelines: false, time: 60 },
  boss: { lives: 3, n: Infinity, feedback: true, lifelines: true, hp: 1500 },
  exam: { lives: 0, n: 50, feedback: false, lifelines: false },
};

class Run {
  constructor(mode, opts = {}) {
    const m = MODES[mode];
    this.mode = mode;
    this.cfg = m;
    this.unit = opts.unit || null;
    this.seed = Math.floor(Math.random() * 1e9);
    this.queue = opts.queue || [];
    this.idx = -1;
    this.maxLives = m.lives;
    this.lives = m.lives;
    this.score = 0;
    this.streak = 0;
    this.wrongRun = 0;
    this.best = 0;
    this.results = [];
    this.lifelines = m.lifelines ? { colleague: 1, coffee: 1 } : { colleague: 0, coffee: 0 };
    this.usedLifeline = false;
    this.timeLeft = m.time || 0;
    this.hp = m.hp || 0;
    this.maxHp = m.hp || 0;
    this.phase = 0;
    this.over = false;
    this.won = false;
    this.cur = null;
    this.xpStart = WR.state.xp;
    this.rankUp = null;
    this.newBadges = [];
  }

  get q() { return this.cur ? Content.byId[this.cur.qid] : null; }
  get total() { return this.cfg.n === Infinity ? null : this.queue.length; }

  next() {
    if (this.over) return false;
    this.idx++;
    let qid;
    if (this.mode === 'codeblue') {
      qid = Engine.pickOne((q) => Content.isQuick(q), this.results.map((r) => r.qid).concat(WR.state.recent.slice(0, 10)));
    } else if (this.mode === 'boss') {
      const hard = this.phase >= 1;
      qid = Engine.pickOne((q) => (hard ? q.diff >= 2 || q.type !== 'mcq' : true), this.results.map((r) => r.qid));
    } else {
      if (this.idx >= this.queue.length) { this.finish(); return false; }
      qid = this.queue[this.idx];
    }
    if (!qid) { this.finish(); return false; }
    const q = Content.byId[qid];
    const r = rng(this.seed + ':' + qid);
    const n = q.type === 'order' ? q.steps.length : q.opts.length;
    this.cur = {
      qid,
      order: shuffle([...Array(n).keys()], r),
      sel: [],
      gone: [],
      revealed: false,
      res: null,
      pts: null,
      patient: patientFor(q, String(this.seed)),
    };
    return true;
  }

  toggle(i) {
    const c = this.cur, q = this.q;
    if (!c || c.revealed || c.gone.indexOf(i) !== -1) return;
    if (q.type === 'sata') {
      const k = c.sel.indexOf(i);
      if (k === -1) c.sel.push(i); else c.sel.splice(k, 1);
    } else if (q.type === 'order') {
      const k = c.sel.indexOf(i);
      if (k === -1) c.sel.push(i); else c.sel.splice(k);
    } else {
      c.sel = [i];
    }
  }

  ready() {
    const c = this.cur, q = this.q;
    if (!c || c.revealed) return false;
    if (q.type === 'sata') return c.sel.length > 0;
    if (q.type === 'order') return c.sel.length === q.steps.length;
    return c.sel.length === 1;
  }

  submit() {
    const c = this.cur, q = this.q;
    const ans = q.type === 'sata' || q.type === 'order' ? c.sel.slice() : c.sel[0];
    const res = Engine.grade(q, ans);
    c.res = res; c.revealed = true;
    if (res.correct) { this.streak++; this.wrongRun = 0; } else { this.streak = 0; this.wrongRun++; }
    this.best = Math.max(this.best, this.streak);
    WR.state.bestStreak = Math.max(WR.state.bestStreak, this.streak);
    const pts = Engine.points(q, res.frac, this.streak);
    c.pts = pts;
    this.score += pts.pts;
    WR.state.points += pts.pts;
    const lostLife = !res.correct && res.frac < 0.5;
    c.lostLife = false;
    if (this.maxLives && lostLife) { this.lives--; c.lostLife = true; }
    if (this.mode === 'codeblue') this.timeLeft = Math.max(0, this.timeLeft + (res.correct ? 3 : -5));
    if (this.mode === 'boss') {
      if (res.correct) { c.dmg = Math.round(100 * Engine.multiplier(this.streak)); this.hp = Math.max(0, this.hp - c.dmg); }
      else { c.heal = 80; this.hp = Math.min(this.maxHp, this.hp + 80); }
      const newPhase = this.hp <= this.maxHp / 3 ? 2 : this.hp <= (this.maxHp * 2) / 3 ? 1 : 0;
      c.phaseUp = newPhase > this.phase;
      this.phase = Math.max(this.phase, newPhase);
    }
    if (this.streak > 0 && this.streak % 10 === 0 && this.cfg.lifelines) { this.lifelines.coffee++; c.bonusCoffee = true; }
    const rec = Engine.record(q, res);
    c.discharged = rec.discharged;
    this.results.push({ qid: q.id, correct: res.correct, frac: res.frac, pts: pts.pts, ans });
    const xp = pts.pts / 10;
    const up = Engine.addXP(xp);
    if (up != null) this.rankUp = up;
    const badges = Engine.checkBadges();
    this.newBadges.push(...badges);
    c.badges = badges;
    Store.save();
    if (this.mode === 'boss' && this.hp <= 0) { this.won = true; }
    return res;
  }

  isEnd() {
    if (this.mode === 'boss' && (this.hp <= 0 || this.lives <= 0)) return true;
    if (this.maxLives && this.lives <= 0) return true;
    if (this.mode === 'codeblue') return this.timeLeft <= 0;
    if (this.cfg.n !== Infinity) return this.idx >= this.queue.length - 1;
    return false;
  }

  // wrong options the colleague would cross out (none for ordering, or when only 2 options are left)
  colleagueCuts() {
    const c = this.cur, q = this.q;
    if (!c || q.type === 'order') return [];
    const wrong = c.order.filter((i) => !q.opts[i].c && c.gone.indexOf(i) === -1);
    const n = q.type === 'sata' ? Math.ceil(wrong.length / 2) : wrong.length - 1;
    return shuffle(wrong).slice(0, Math.max(0, n));
  }
  canColleague() {
    const c = this.cur;
    return !!(this.lifelines.colleague && c && !c.revealed && (this.q.type === 'order' ? c.sel[0] !== 0 || c.sel.length !== 1 : this.colleagueCuts().length));
  }

  useColleague() {
    const c = this.cur, q = this.q;
    if (!this.canColleague()) return false;
    if (q.type === 'order') {
      this.lifelines.colleague--; this.usedLifeline = true;
      c.sel = [0];
      c.gone = [];
      c.hint = 'Your colleague placed the first step for you.';
    } else {
      // single answer: a true 50/50 (the right answer + one wrong one stay)
      // select all that apply: half the wrong options go, rounded up
      const remove = this.colleagueCuts();
      this.lifelines.colleague--; this.usedLifeline = true;
      c.gone.push(...remove);
      c.sel = c.sel.filter((i) => remove.indexOf(i) === -1);
      c.hint = q.type === 'sata' ? `Your colleague crossed out ${remove.length} wrong option${remove.length > 1 ? 's' : ''}.` : "Your colleague narrowed it down to two. It's one of these.";
    }
    return true;
  }

  useCoffee() {
    if (!this.lifelines.coffee || this.lives >= this.maxLives) return false;
    this.lifelines.coffee--; this.usedLifeline = true;
    this.lives++;
    return true;
  }

  stress() {
    let s;
    if (this.mode === 'codeblue') s = 0.5 + 0.45 * (1 - this.timeLeft / 60);
    else if (this.mode === 'boss') s = 0.32 + this.phase * 0.14 + (this.maxLives - this.lives) * 0.1;
    else if (this.mode === 'exam') s = 0.3;
    else s = 0.12 + (this.maxLives ? (this.maxLives - this.lives) * 0.2 : 0);
    s += Math.min(0.3, this.wrongRun * 0.12) - Math.min(0.1, this.streak * 0.02);
    return clamp(s, 0.05, 1);
  }

  finish() {
    if (this.over) return;
    this.over = true;
    const s = WR.state;
    const right = this.results.filter((r) => r.correct).length;
    const extra = [];
    let bonus = 0;
    if (this.mode === 'shift') {
      const u = s.units[this.unit] || (s.units[this.unit] = { shifts: 0, perfect: 0, best: 0 });
      u.shifts++;
      u.best = Math.max(u.best, this.score);
      bonus += 20;
      if (this.results.length >= this.queue.length && right === this.results.length && this.results.length >= 10) { u.perfect++; extra.push('shift_perfect'); bonus += 50; }
      if (this.lives === 1 && this.results.length >= this.queue.length) extra.push('comeback');
    }
    if (this.mode === 'codeblue') {
      extra.push('codeblue');
      if (right >= 12) extra.push('codeblue12');
      s.codeBlueBest = Math.max(s.codeBlueBest, this.score);
      bonus += right * 2;
    }
    if (this.mode === 'boss') {
      s.boss.best = Math.max(s.boss.best, this.score);
      if (this.won) { s.boss.wins++; extra.push('boss'); bonus += 150; if (!this.usedLifeline) { extra.push('boss_clean'); s.boss.noLifelineWin = true; } }
    }
    if (this.mode === 'exam') {
      const pct = this.results.length ? right / this.results.length : 0;
      const byUnit = {};
      this.results.forEach((r) => { const u = Content.byId[r.qid].unit; byUnit[u] = byUnit[u] || [0, 0]; byUnit[u][1]++; if (r.correct) byUnit[u][0]++; });
      s.exams = s.exams.concat({ date: todayStr(), n: this.results.length, right, byUnit }).slice(-20);
      extra.push('exam');
      if (pct >= 0.8 && this.results.length >= 40) extra.push('exam80');
      bonus += 40;
    }
    const up = Engine.addXP(bonus);
    if (up != null) this.rankUp = up;
    this.bonusXP = bonus;
    this.endBadges = Engine.checkBadges({ endOfRun: true, extra });
    this.newBadges.push(...this.endBadges);
    s.openRun = null;
    Store.save({ now: true });
  }

  // state that survives a page update while a round is open
  serialize() {
    const o = Object.assign({}, this);
    return JSON.parse(JSON.stringify(o));
  }
  static restore(o) {
    const r = new Run(o.mode, { unit: o.unit, queue: o.queue });
    Object.assign(r, o);
    r.cfg = MODES[o.mode];
    return r;
  }

  // a round brought back from the autosave; null if it can't continue (e.g. the question bank changed)
  static resume(o) {
    if (!o || !MODES[o.mode] || o.over || !o.cur) return null;
    const r = Run.restore(o);
    if (!r.q || r.results.some((x) => !Content.byId[x.qid])) return null;
    // timed / no-feedback modes move on by themselves after an answer; do that now
    if (r.cur.revealed && !r.cfg.feedback) {
      if (r.isEnd() || !r.next()) { if (!r.over) r.finish(); return null; }
    }
    return r;
  }
}

const Talk = {

  line(kind, ctx = {}) {
    const n = this.name();
    const hour = new Date().getHours();
    const P = {
      floor: [
        `Ready for rounds, ${n}? Tap a room to start a shift.`,
        'Missed patients come back until you get them right on 2 different days.',
        'Rooms 107 to 109 have the most instructor focus points.',
        hour < 12 ? `Good morning, ${n}! Coffee first, then rounds.` : hour >= 21 ? `Night shift, ${n}? Short shifts beat cramming.` : `Afternoon rounds, ${n}. Let's go!`,
        'Every answer has a "why". Reading it is where the learning happens.',
      ],
      start: ['10 patients, 3 lives. You got this.', 'Read the last line of each question first.', 'New shift! Slow is smooth, smooth is fast.'],
      right: ['Nice catch!', "That's right!", 'Textbook!', 'Exactly.', 'Nailed it.', 'Your patient thanks you.'],
      streak: [`${ctx.streak} in a row! You're on fire.`, `Streak ×${Engine.multiplier(ctx.streak || 0)}! Keep it going.`, `${ctx.streak} straight. Charge nurse is watching!`],
      wrong: ['Shake it off. Read the why.', "Close one. Now you'll remember it.", "That's how we learn. It's in Missed Patients now.", 'Breathe. Next patient.'],
      part: ['Partly there! Check which ones you missed.', 'Almost. SATA is all or nothing for the streak.'],
      low: ['Last life! Slow down and read every option.', 'One life left. Use a lifeline if you need it.'],
      back: ['Back on track!', "There it is. That's my nurse."],
      codeblue: ['Code Blue! Quick and calm.', 'Trust your first instinct.', 'Every right answer buys 3 seconds!'],
      boss: ['The Superbug hates good nursing!', 'Hit it with what you know!', 'Wrong answers heal it. Focus!'],
      bossPhase: ["It's mutating! Questions just got harder.", 'It changed color. Stay sharp!'],
      exam: ['Exam mode: no hints until the end.', 'Pace yourself. One question at a time.'],
      review: ['Re-rounding on missed patients. Second chances!', 'Two right days and they are discharged.'],
      win: ['What a shift!', 'You crushed it!', 'Chief Nurse material.'],
      lose: ['Rough shift. The misses are saved for review.', 'Every nurse has hard shifts. Review and come back.'],
    };
    const pool = P[kind] || P.floor;
    let s = pick(pool);
    if (kind === 'right' && ctx.trick && Math.random() < 0.4) s = 'Remember: ' + ctx.trick;
    return s;
  },
  mood(kind) {
    return { right: 'happy', streak: 'cheer', wrong: 'worried', part: 'focus', low: 'worried', back: 'happy', codeblue: 'focus', boss: 'focus', bossPhase: 'worried', win: 'cheer', lose: 'sad', exam: 'focus', review: 'happy', start: 'happy' }[kind] || 'happy';
  },
};

/* ---- 40-app.js ---- */
// ---------- app shell: router, size classes, modals, toasts ----------
const Screens = {};

const App = {
  name: null,
  params: null,
  run: null,
  size: null,
  layout: null,
  el: null,

  measure() {
    const w = window.innerWidth, h = window.innerHeight;
    const size = w >= 1000 ? 'wide' : w >= 700 ? 'regular' : 'compact';
    const layout = size === 'wide' && w > h ? 'h' : 'v';
    const changed = size !== this.size || layout !== this.layout;
    this.size = size; this.layout = layout;
    document.documentElement.dataset.size = size;
    document.documentElement.dataset.layout = layout;
    return changed;
  },

  show(name, params = {}, anim = '') {
    const root = document.getElementById('app');
    const old = this.el;
    const scr = Screens[name];
    if (this.name && Screens[this.name] && Screens[this.name].leave) Screens[this.name].leave();
    this.name = name; this.params = params;
    const sec = document.createElement('section');
    sec.className = 'screen ' + (scr.cls || name) + (anim ? ' ' + anim : '');
    sec.setAttribute('data-screen', name);
    sec.innerHTML = scr.render(params);
    if (old) {
      old.classList.add('leaving');
      setTimeout(() => old.remove(), 220);
      root.appendChild(sec);
    } else {
      root.innerHTML = '';
      root.appendChild(sec);
    }
    this.el = sec;
    if (scr.mount) scr.mount(sec, params);
    const focusEl = sec.querySelector('[data-autofocus]') || sec.querySelector('h1');
    if (focusEl && focusEl.focus && !('ontouchstart' in window)) focusEl.focus({ preventScroll: true });
    Store.saveRun();
  },

  rerender() {
    if (!this.name) return;
    const scr = Screens[this.name];
    if (scr.leave) scr.leave();
    const sec = this.el;
    const y = sec.scrollTop;
    sec.className = 'screen ' + (scr.cls || this.name);
    sec.innerHTML = scr.render(this.params);
    if (scr.mount) scr.mount(sec, this.params);
    sec.scrollTop = y;
  },

  act(action, data, el, ev) {
    Sound.unlock();
    const scr = Screens[this.name];
    let out;
    if (scr && scr.act && scr.act[action]) out = scr.act[action](data, el, ev);
    else if (Global[action]) out = Global[action](data, el, ev);
    if (App.run) Store.saveRun();
    return out;
  },

  toast(text, ms = 2600) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms);
  },

  modal(html, onAct) {
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="modal-backdrop" data-modal-bg><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    const bg = root.firstChild;
    const close = () => { root.innerHTML = ''; };
    bg.addEventListener('click', (e) => {
      if (e.target === bg) { close(); return; }
      const b = e.target.closest('[data-m]');
      if (!b) return;
      Sound.unlock();
      const keep = onAct ? onAct(b.dataset.m, b, close) : false;
      if (!keep) close();
    });
    const first = bg.querySelector('[data-autofocus]') || bg.querySelector('button');
    if (first) first.focus({ preventScroll: true });
    return close;
  },

  confirm(title, body, okLabel, danger) {
    return new Promise((resolve) => {
      this.modal(`<h2>${esc(title)}</h2><p class="dim">${esc(body)}</p>
        <div class="actions"><button class="btn" data-m="no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-m="yes">${esc(okLabel)}</button></div>`,
      (m) => { resolve(m === 'yes'); return false; });
    });
  },
};

// actions available on every screen
const Global = {
  home() { App.run = null; App.show('floor'); },
  locker() { App.show('locker'); },
  stats() { App.show('stats'); },
  settings() { App.show('settings'); },
  missed() { App.show('missed'); },
};

function celebrate(run) {
  if (run.rankUp != null) {
    Sound.play('rank');
    FX.confetti(180);
    App.toast(`Promoted to ${RANKS[run.rankUp].n}!`, 3200);
    run.rankUp = null;
  }
}

function badgeToast(ids) {
  ids.forEach((id, k) => {
    const b = BADGES.find((x) => x.id === id);
    if (!b) return;
    setTimeout(() => { Sound.play('badge'); App.toast(`Badge earned: ${b.n}`); }, 600 + k * 1400);
  });
}
