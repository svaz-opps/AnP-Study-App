<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Ward Rounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>/* Layout: a one-screen hospital game. Landscape iPad = floor plan + two-pane bedside chart;
   portrait / Split View = vertical corridor + stacked chart. Dark ward lighting, with the
   question itself printed on a paper chart clipped to a board (the one bright surface). */
:root {
  color-scheme: dark;
  --bg: #0a1322;
  --floor: #0e1a2c;
  --floor-tile: #122139;
  --surface: #15253d;
  --surface-2: #1b2f4c;
  --surface-3: #243c60;
  --line: #2b4369;
  --text: #e8f0fa;
  --text-dim: #a6b7d0;
  --text-faint: #8597b4;
  --accent: #5cd6c0;
  --accent-ink: #052b25;
  --accent-soft: rgba(92, 214, 192, .15);
  --ecg: #52f0a4;
  --good: #4fdc8f;
  --good-soft: rgba(79, 220, 143, .16);
  --bad: #ff6b7a;
  --bad-soft: rgba(255, 107, 122, .16);
  --warn: #f6bd52;
  --warn-soft: rgba(246, 189, 82, .16);
  --code: #ff4757;
  --xp: #8fa8ff;
  --paper: #f4f7fb;
  --paper-2: #e6edf6;
  --paper-line: #c9d5e6;
  --ink: #13233b;
  --ink-dim: #4b5f7d;
  --ink-good: #11804a;
  --ink-bad: #c42d3f;
  --board: #3a4c66;
  --clip: #c4ced9;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);

  --font-display: "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --text-scale: 1;
  --fs-xs: .74rem;
  --fs-sm: .86rem;
  --fs-md: 1rem;
  --fs-lg: 1.2rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 2rem;
  --fs-3xl: 2.6rem;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --tap: 48px;
}

html {
  height: 100%;
  font-size: calc(18px * var(--text-scale));
  -webkit-text-size-adjust: 100%;
}
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.45;
  overflow: hidden;
  overscroll-behavior: none;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button, .tap { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: relative; height: 100%; overflow: hidden; }

.boot { height: 100%; display: grid; place-content: center; gap: var(--s4); text-align: center; color: var(--text-dim); }
.boot-ecg { width: 220px; height: 60px; margin: 0 auto;
  background: linear-gradient(90deg, transparent 0 40%, var(--ecg) 40% 41%, transparent 41%) 0 50% / 100% 2px no-repeat;
  -webkit-mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
          mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }

/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0;
  overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--s3) var(--s5);
  display: flex; flex-direction: column; gap: var(--s4);
  animation: screen-in .28s ease-out both;
}
.screen.leaving { animation: screen-out .2s ease-in both; pointer-events: none; }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px) scale(.99); } }
@keyframes screen-out { to { opacity: 0; transform: scale(1.02); } }
.screen.zoom-in { animation: zoom-in .38s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes zoom-in { from { opacity: 0; transform: scale(.92); } }

.wrap { width: 100%; max-width: 1180px; margin-inline: auto; }
.narrow { width: 100%; max-width: 760px; margin-inline: auto; }

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap); padding: 0 var(--s5);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  border-radius: 999px; font-weight: 800; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line);
  transition: transform .12s ease, background-color .15s ease, opacity .15s ease;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--code); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: var(--fs-lg); }
.btn:disabled { opacity: .45; transform: none; }
@media (hover: hover) {
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
}
.icon-btn {
  width: var(--tap); height: var(--tap); flex: none;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.icon-btn svg { width: 22px; height: 22px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: var(--fs-sm); font-weight: 700; white-space: nowrap;
}
.chip svg { width: 16px; height: 16px; }
.label { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4); }

.bar { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s ease; }

/* ---------- top bars ---------- */
.topbar { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap); }
.topbar h1 { font-size: var(--fs-xl); }
.topbar .grow { flex: 1; min-width: 0; }

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(4, 9, 18, .7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fade-in .2s ease both;
}
.modal {
  width: min(520px, 100%); max-height: 100%; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4);
  box-shadow: var(--shadow); animation: pop-in .25s cubic-bezier(.2, .9, .3, 1.2) both;
}
.modal h2 { font-size: var(--fs-xl); }
.modal .actions { display: flex; gap: var(--s3); justify-content: flex-end; flex-wrap: wrap; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.94); } }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 60;
  transform: translateX(-50%);
  background: var(--surface-3); border: 1px solid var(--line); color: var(--text);
  padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow);
  max-width: calc(100% - 32px); text-align: center;
  animation: toast-in .3s ease both;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -10px); } }

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; }
.hud-me { display: flex; align-items: center; gap: var(--s3); text-align: left; min-height: var(--tap); padding-right: var(--s3); border-radius: 999px; }
.hud-me .ava { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--accent); overflow: hidden; flex: none; }
.hud-me .ava svg { width: 100%; height: 100%; }
.hud-me b { display: block; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); line-height: 1.1; }
.hud-me span { font-size: var(--fs-sm); color: var(--accent); font-weight: 800; }
.hud-xp { flex: 1 1 220px; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
.hud-xp .bar > i { background: linear-gradient(90deg, var(--xp), var(--accent)); }
.hud-xp .label { display: flex; justify-content: space-between; gap: var(--s2); }
.hud-chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
.chip.streak svg { color: var(--warn); }
.chip.exam svg { color: var(--accent); }

/* ---------- floor plan ---------- */
.floorplan { position: relative; flex: 1; display: grid; gap: 0; min-height: 0; }
.floorplan.h { grid-template-rows: minmax(150px, 1fr) 132px minmax(150px, 1fr); }
.floorplan.v { flex: none; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); grid-auto-rows: auto; row-gap: var(--s3); }
.floorplan.v .room { min-height: 150px; }

.rooms { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s2); }
.floorplan.v .rooms { display: contents; }

.room {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(255, 255, 255, .025) 27px 28px),
    repeating-linear-gradient(90deg, transparent 0 27px, rgba(255, 255, 255, .025) 27px 28px),
    var(--floor-tile);
  border: 2px solid var(--line); border-radius: var(--r-md);
  text-align: left; overflow: hidden;
  transition: border-color .2s ease, transform .15s ease, box-shadow .2s ease;
}
.room:active { transform: scale(.985); }
@media (hover: hover) { .room:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); } }
.room-body { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: var(--s3); min-height: 0; }
.room-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.room-plate { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-sm); background: var(--surface-3); color: var(--text); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }
.room-stars { display: flex; gap: 1px; color: var(--surface-3); }
.room-stars svg { width: 16px; height: 16px; }
.room-stars .on { color: var(--warn); }
.room-ward { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md); line-height: 1.1; overflow-wrap: anywhere; }
.room-topic { font-size: var(--fs-sm); color: var(--text-dim); line-height: 1.2; }
.room-blurb { font-size: var(--fs-xs); color: var(--text-faint); line-height: 1.3; margin-top: 2px; }
[data-size="compact"] .room-blurb { display: none; }
.room-pt { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s2); }
.room-pt .pt { width: 46px; height: 46px; flex: none; }
.room-pt .pt svg { width: 100%; height: 100%; }
.room-meta { font-size: var(--fs-xs); color: var(--text-faint); font-weight: 700; text-align: right; }
.room-dot {
  position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 999px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 800;
  display: grid; place-items: center; box-shadow: 0 0 0 3px var(--floor-tile);
}
.room .room-dot ~ .room-body .room-stars { margin-right: 26px; }

/* the door: a strip on the corridor side of the room that swings open */
.door { height: 14px; flex: none; position: relative; background: var(--surface-2); border-top: 2px solid var(--line); perspective: 300px; }
.door::before {
  content: ""; position: absolute; left: 22%; width: 56%; top: 2px; height: 8px; border-radius: 3px;
  background: linear-gradient(90deg, #6f86a8, #9ab0cc); transform-origin: left center;
  transition: transform .45s cubic-bezier(.4, 1.4, .5, 1);
}
.rooms-top .door { order: 2; }
.rooms-bottom .door, .floorplan.v .door { order: -1; border-top: 0; border-bottom: 2px solid var(--line); }
.room.open .door::before { transform: rotateY(-75deg); }
.room.open { border-color: var(--accent); }

/* ---------- corridor ---------- */
.corridor {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  background:
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255, 255, 255, .03) 46px 48px),
    var(--floor);
  border-block: 2px dashed rgba(255, 255, 255, .06);
  padding: 0 var(--s3);
}
.floorplan.v .corridor {
  grid-column: 2; grid-row: 1 / span 6;
  flex-direction: column; justify-content: flex-start; padding: var(--s3) 0;
  border-block: 0; border-inline: 2px dashed rgba(255, 255, 255, .06);
  background: repeating-linear-gradient(0deg, transparent 0 46px, rgba(255, 255, 255, .03) 46px 48px), var(--floor);
  border-radius: 12px;
}
.station { display: flex; align-items: center; gap: var(--s3); min-width: 0; z-index: 2; }
.station-desk {
  width: 64px; height: 92px; flex: none; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--text-faint); font-size: 10px; font-weight: 800; letter-spacing: .08em; writing-mode: vertical-rl;
}
.walker { position: absolute; left: 0; top: 0; width: 84px; height: 104px; z-index: 3; pointer-events: none; transition: transform .75s cubic-bezier(.45, .05, .35, 1); will-change: transform; }
.walker svg { width: 100%; height: 100%; overflow: visible; }
.walker.walking svg { animation: bob .32s ease-in-out infinite alternate; }
.walker.walking .leg-l { animation: step .32s ease-in-out infinite alternate; transform-origin: 50% 0; transform-box: fill-box; }
.walker.walking .leg-r { animation: step .32s ease-in-out infinite alternate-reverse; transform-origin: 50% 0; transform-box: fill-box; }
@keyframes bob { to { transform: translateY(-3px); } }
@keyframes step { from { transform: rotate(14deg); } to { transform: rotate(-14deg); } }

.bubble {
  position: relative; max-width: 300px; padding: 10px 14px; border-radius: 16px;
  background: var(--paper); color: var(--ink); font-weight: 700; font-size: var(--fs-sm); line-height: 1.3;
  box-shadow: var(--shadow);
}
.bubble::before { content: ""; position: absolute; left: -7px; bottom: 16px; border: 8px solid transparent; border-left: 0; border-right-color: var(--paper); }
.bubble.pop { animation: pop-in .3s cubic-bezier(.2, .9, .3, 1.3) both; }
.floor .station .bubble { margin-left: 92px; }
.station-card { align-items: center; gap: var(--s3); }
.station-card .station-desk { height: 64px; }

.alarm {
  display: flex; align-items: center; gap: var(--s2); padding: 10px 16px; min-height: var(--tap);
  border-radius: 14px; background: color-mix(in srgb, var(--code) 18%, var(--surface)); border: 2px solid var(--code);
  color: #ffd9dd; font-weight: 800; z-index: 2;
}
.alarm .light { width: 14px; height: 14px; border-radius: 50%; background: var(--code); box-shadow: 0 0 12px var(--code); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; box-shadow: none; } }
.elevator {
  display: flex; align-items: center; gap: var(--s3); padding: 8px 14px 8px 8px; min-height: var(--tap);
  border-radius: 14px; background: var(--surface-2); border: 2px solid var(--line); font-weight: 800; text-align: left; z-index: 2;
}
.elevator .doors { width: 44px; height: 54px; border-radius: 6px; background: linear-gradient(90deg, #8193ad 0 49%, #2a3a52 49% 51%, #8193ad 51%); border: 2px solid #5d708d; flex: none; }
.elevator small { display: block; font-weight: 700; color: var(--text-dim); font-size: var(--fs-xs); }
.elevator.locked { opacity: .6; }

.floor-end { display: none; }
.floorplan.v .floor-end { display: flex; grid-column: 1 / -1; gap: var(--s3); flex-wrap: wrap; justify-content: center; padding-top: var(--s2); }
.floorplan.v .corridor .alarm, .floorplan.v .corridor .elevator { display: none; }
.floorplan.h .floor-end { display: none; }

.station-card { display: none; }
.floorplan.v + .station-card, .station-card.show { display: flex; }

/* ---------- dock ---------- */
.dock {
  display: flex; gap: var(--s2); justify-content: center; flex-wrap: wrap;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock button {
  position: relative; display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 16px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: var(--fs-sm);
}
.dock button svg { width: 20px; height: 20px; color: var(--accent); }
.dock .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; line-height: 20px; }

[data-size="compact"] .dock button span.t { display: none; }
[data-size="compact"] .dock button { padding: 0 14px; }
[data-size="compact"] .hud-me .ava { width: 44px; height: 44px; }
[data-size="compact"] .room-pt .pt { width: 38px; height: 38px; }

/* ---------- chart screen ---------- */
.chart { padding-block: var(--s3); }
.chart-grid { flex: 1; display: grid; gap: var(--s4); min-height: 0; width: 100%; max-width: 1280px; margin-inline: auto; }
[data-size="wide"] .chart-grid { grid-template-columns: minmax(300px, 2fr) 3fr; align-items: start; }
.bedside { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
[data-size="wide"] .bedside { position: sticky; top: 0; }
.chartside { position: relative; display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

.lives { display: flex; gap: 4px; }
.lives svg { width: 26px; height: 26px; }
.lives .on { color: var(--bad); }
.lives .off { color: var(--surface-3); }
.lives .lost { animation: heart-break .5s ease both; }
@keyframes heart-break { 30% { transform: scale(1.35); } 100% { transform: scale(1); } }

.patient-card { display: flex; align-items: center; gap: var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s3) var(--s4); }
.patient-card .bed { width: 132px; height: 92px; flex: none; }
.patient-card .bed svg { width: 100%; height: 100%; }
.pt-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pt-info b { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); }
.pt-info .sub { color: var(--text-dim); font-size: var(--fs-sm); }
.band { align-self: flex-start; margin-top: 4px; padding: 1px 8px; border-radius: 6px; background: #fff3c4; color: #5b4300; font-size: 11px; font-weight: 800; letter-spacing: .06em; }
.pt-topic { font-size: var(--fs-xs); color: var(--text-faint); font-weight: 700; }

.monitor { position: relative; background: #050b14; border: 2px solid #1e2c42; border-radius: var(--r-md); padding: 8px 10px; display: flex; align-items: stretch; gap: var(--s3); }
.monitor canvas { flex: 1; min-width: 0; height: 78px; display: block; }
.vitals { display: flex; flex-direction: column; justify-content: center; gap: 2px; font-family: var(--font-mono); min-width: 70px; }
.vitals small { display: block; font-size: 10px; color: #6c86a8; letter-spacing: .08em; }
.vitals b { font-size: 1.6rem; line-height: 1; color: var(--ecg); }
.vitals .spo2 b { font-size: 1.05rem; color: #67d3ff; }
.monitor.amber .vitals .hr b { color: var(--warn); }
.monitor.red .vitals .hr b { color: var(--code); }

.scorebar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.score { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); }
.score small { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--text-faint); font-weight: 800; letter-spacing: .08em; display: block; }
.streak { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; }
.streak svg { width: 18px; height: 18px; color: var(--warn); }
.streak.hot { background: var(--warn-soft); border-color: var(--warn); }
.streak.hot svg { animation: flame .6s ease-in-out infinite alternate; }
@keyframes flame { to { transform: scale(1.18) rotate(-6deg); } }

.nurse-row { display: flex; align-items: flex-end; gap: var(--s3); }
.nurse-row .nurse { width: 86px; height: 104px; flex: none; }
.nurse-row .nurse svg { width: 100%; height: 100%; overflow: visible; }
.nurse-row .bubble { flex: 1; max-width: none; }

/* compact + regular: condensed bedside strip */
[data-size="compact"] .patient-card, [data-size="regular"] .patient-card { padding: var(--s2) var(--s3); gap: var(--s3); }
[data-size="compact"] .patient-card .bed, [data-size="regular"] .patient-card .bed { width: 100px; height: 70px; }
[data-size="compact"] .bedside-row, [data-size="regular"] .bedside-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); align-items: stretch; }
[data-size="compact"] .bedside-row { grid-template-columns: 1fr; }
[data-size="compact"] .monitor canvas, [data-size="regular"] .monitor canvas { height: 56px; }
[data-size="compact"] .nurse-row .nurse, [data-size="regular"] .nurse-row .nurse { width: 52px; height: 64px; }
[data-size="compact"] .nurse-row .bubble, [data-size="regular"] .nurse-row .bubble { font-size: var(--fs-xs); padding: 8px 12px; }
[data-size="compact"] .monitor .spo2 { display: none; }

/* ---------- progress pips ---------- */
.pips { display: flex; gap: 6px; flex-wrap: wrap; }
.pips i { width: 22px; height: 8px; border-radius: 999px; background: var(--surface-3); }
.pips i.ok { background: var(--good); }
.pips i.bad { background: var(--bad); }
.pips i.part { background: var(--warn); }
.pips i.now { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.prog-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }

/* ---------- clipboard + paper chart ---------- */
.clipboard { position: relative; background: var(--board); border-radius: var(--r-lg); padding: 22px 10px 10px; box-shadow: var(--shadow); }
.clipboard .clip {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px;
  border-radius: 8px 8px 12px 12px; background: linear-gradient(180deg, #e3e9f0, var(--clip)); border: 2px solid #8b99aa;
  box-shadow: 0 3px 6px rgba(0, 0, 0, .3);
}
.clipboard .clip::after { content: ""; position: absolute; left: 50%; top: 6px; width: 30px; height: 8px; transform: translateX(-50%); border-radius: 4px; background: #8b99aa; }
.paper {
  background: var(--paper); color: var(--ink); border-radius: 10px; padding: var(--s5) var(--s5) var(--s4);
  display: flex; flex-direction: column; gap: var(--s4);
}
[data-size="compact"] .paper { padding: var(--s4) var(--s3) var(--s3); }
.paper-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); flex-wrap: wrap; border-bottom: 2px solid var(--paper-line); padding-bottom: var(--s2); }
.qtype { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #0e6b5d; background: #d6f3ee; padding: 3px 9px; border-radius: 6px; }
.qtype.sata { color: #6a3fb8; background: #ece3fb; }
.qtype.priority { color: #b23a1d; background: #fde4dc; }
.qtype.teaching { color: #8a5a00; background: #fdf0d2; }
.qtype.order { color: #1d5fb8; background: #dde9fb; }
.qtype.math { color: #0d6e2f; background: #d9f4e2; }
.paper-topic { font-size: var(--fs-xs); color: var(--ink-dim); font-weight: 700; }
.stem { font-size: var(--fs-lg); font-weight: 700; line-height: 1.4; }
[data-size="compact"] .stem { font-size: var(--fs-md); }

.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.opts.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt {
  width: 100%; min-height: 56px; display: flex; align-items: center; gap: var(--s3); text-align: left;
  padding: 10px 14px; border-radius: 12px; background: #fff; border: 2px solid var(--paper-line); color: var(--ink);
  font-weight: 600; line-height: 1.3; transition: border-color .15s, background-color .15s, transform .1s;
}
.opt:active:not(:disabled) { transform: scale(.99); }
@media (hover: hover) { .opt:hover:not(:disabled) { border-color: #8fb3d9; } }
.opt .key {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 9px;
  border: 2px solid #9fb2cc; font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--ink-dim); background: var(--paper);
}
.opt.multi .key { border-radius: 7px; }
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .pt-mini { width: 40px; height: 40px; flex: none; }
.opt .pt-mini svg { width: 100%; height: 100%; }
.opt .mark { width: 26px; height: 26px; flex: none; }
.opt.sel { border-color: #11998a; background: #e3f7f3; }
.opt.sel .key { background: #11998a; border-color: #11998a; color: #fff; }
.opt.gone { opacity: .3; text-decoration: line-through; }
.opt.right { border-color: var(--ink-good); background: #e2f6ea; }
.opt.right .key { background: var(--ink-good); border-color: var(--ink-good); color: #fff; }
.opt.wrong { border-color: var(--ink-bad); background: #fde6e9; }
.opt.wrong .key { background: var(--ink-bad); border-color: var(--ink-bad); color: #fff; }
.opt.missed { border-style: dashed; border-color: var(--ink-good); }
.opt .mark svg { width: 26px; height: 26px; }
.opt.right .mark { color: var(--ink-good); }
.opt.wrong .mark { color: var(--ink-bad); }
.opt:disabled { cursor: default; }
.opt .ord { min-width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px dashed #9fb2cc; font-family: var(--font-mono); font-weight: 700; color: var(--ink-dim); }
.opt.placed .ord { border-style: solid; background: #1d5fb8; border-color: #1d5fb8; color: #fff; }
.order-ans { font-size: var(--fs-xs); font-weight: 800; color: var(--ink-good); white-space: nowrap; }

.tray { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.tray .grow { flex: 1; }
.life-btn {
  display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: var(--fs-sm);
}
.life-btn svg { width: 20px; height: 20px; color: var(--accent); }
.life-btn .n { font-family: var(--font-mono); color: var(--text-dim); }
.life-btn:disabled { opacity: .4; }
[data-size="compact"] .life-btn .t { display: none; }

/* ---------- feedback panel ---------- */
.feedback {
  display: flex; flex-direction: column; gap: var(--s3);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4) var(--s5);
  box-shadow: var(--shadow);
}
.feedback[hidden] { display: none; }
[data-size="wide"] .feedback { animation: slide-in .32s cubic-bezier(.2, .8, .2, 1) both; scroll-margin-bottom: 16px; }
[data-size="regular"] .feedback, [data-size="compact"] .feedback {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 82%; overflow-y: auto;
  border-radius: var(--r-lg) var(--r-lg) 0 0; border-bottom: 0;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--s4) + env(safe-area-inset-bottom, 0px));
  animation: sheet-up .32s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes slide-in { from { opacity: 0; transform: translateX(30px); } }
@keyframes sheet-up { from { transform: translateY(100%); } }
.fb-head { display: flex; align-items: center; gap: var(--s3); }
.fb-head .ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.fb-head .ico svg { width: 26px; height: 26px; }
.fb-head.ok .ico { background: var(--good-soft); color: var(--good); }
.fb-head.bad .ico { background: var(--bad-soft); color: var(--bad); }
.fb-head.part .ico { background: var(--warn-soft); color: var(--warn); }
.fb-head h2 { font-size: var(--fs-xl); }
.fb-head .pts { margin-left: auto; font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); color: var(--good); white-space: nowrap; }
.fb-answer { background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); border-radius: var(--r-md); padding: var(--s3) var(--s4); }
.fb-answer .label { color: var(--good); }
.fb-answer ul, .fb-answer ol { margin: 4px 0 0; padding-left: 1.2em; }
.fb-why { font-size: var(--fs-md); line-height: 1.5; }
.fb-tips { display: flex; flex-direction: column; gap: var(--s2); }
.tip { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); }
.tip svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.tip .label { display: block; margin-bottom: 2px; }
.tip.trick svg { color: var(--warn); }
.tip.ati svg { color: var(--accent); }
.tip.guide svg { color: var(--xp); }
.tip .src { font-size: var(--fs-xs); font-weight: 800; color: var(--text-faint); margin-left: 6px; text-transform: none; letter-spacing: 0; }
details.more { border-top: 1px solid var(--line); padding-top: var(--s2); }
details.more summary { cursor: pointer; font-weight: 800; color: var(--accent); min-height: 40px; display: flex; align-items: center; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸"; margin-right: 8px; transition: transform .2s; }
details.more[open] summary::before { transform: rotate(90deg); }
.why-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s2); }
.why-list li { padding-left: var(--s3); border-left: 3px solid var(--line); font-size: var(--fs-sm); }
.why-list li b { display: block; }
.why-list li.c { border-left-color: var(--good); }
.focus-list { margin: 4px 0 0; padding-left: 1.2em; font-size: var(--fs-sm); color: var(--text-dim); }
.focus-list li.hit { color: var(--text); font-weight: 700; }
.fb-actions .btn { white-space: nowrap; }
.fb-actions .btn svg { width: 18px; height: 18px; }
.fb-actions { display: flex; gap: var(--s3); justify-content: flex-end; position: sticky; bottom: 0; padding-top: var(--s2); }
[data-size="wide"] .fb-actions { margin-top: auto; }

/* ---------- code blue ---------- */
.mode-codeblue { background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 71, 87, .18)); }
.mode-codeblue::before { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 80px rgba(255, 71, 87, .45); animation: alarm-pulse 1s ease-in-out infinite; z-index: 1; }
@keyframes alarm-pulse { 50% { opacity: .25; } }
.timer { display: flex; align-items: center; gap: var(--s3); }
.timer .bar { flex: 1; height: 14px; }
.timer .bar > i { background: var(--code); transition: width .25s linear; }
.timer b { font-family: var(--font-mono); font-size: var(--fs-xl); color: #ffd0d5; min-width: 3.2ch; text-align: right; }
.timer-delta { position: absolute; right: 0; top: -6px; font-weight: 800; font-family: var(--font-display); animation: float-up 1s ease-out forwards; }

/* ---------- boss arena ---------- */
.arena { position: relative; background: radial-gradient(ellipse at 50% 70%, #1d3550, #0b1628); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); overflow: hidden; }
.arena-stage { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); min-height: 170px; }
.arena .boss { width: 170px; height: 170px; flex: none; transition: filter .3s; }
.arena .boss svg { width: 100%; height: 100%; overflow: visible; }
.arena .boss.hit { animation: boss-hit .45s ease both; }
.arena .boss.heal { animation: boss-heal .6s ease both; }
@keyframes boss-hit { 20% { transform: translateX(10px) rotate(4deg); filter: brightness(2.2) saturate(.3); } 60% { transform: translateX(-6px); } }
@keyframes boss-heal { 40% { transform: scale(1.12); filter: drop-shadow(0 0 18px #7dffb2); } }
.arena .nurse { width: 96px; height: 116px; flex: none; }
.arena .nurse svg { width: 100%; height: 100%; overflow: visible; }
.hp { display: flex; flex-direction: column; gap: 4px; }
.hp .bar { height: 16px; background: #2a1420; border: 1px solid #5a2a3c; }
.hp .bar > i { background: linear-gradient(90deg, #ff5d8f, #ff9a5d); }
.hp-row { display: flex; justify-content: space-between; font-weight: 800; font-size: var(--fs-sm); }
.phase-banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-2xl); color: #ffd36b; text-shadow: 0 3px 0 #7a2b00; animation: banner 1.8s ease both; pointer-events: none; }
@keyframes banner { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1.08); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
.projectile { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--accent) 60%, transparent 70%); pointer-events: none; z-index: 4; }

/* compact (Split View / phone): keep the question high on the screen */
[data-size="compact"] .bedside-row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
[data-size="compact"] .patient-card { gap: var(--s2); }
[data-size="compact"] .patient-card .bed { width: 54px; height: 40px; }
[data-size="compact"] .pt-topic, [data-size="compact"] .band { display: none; }
[data-size="compact"] .pt-info b { font-size: var(--fs-md); }
[data-size="compact"] .monitor { padding: 4px 8px; }
[data-size="compact"] .monitor canvas { height: 44px; }
[data-size="compact"] .vitals b { font-size: 1.2rem; }
[data-size="compact"] .vitals { min-width: 44px; }
[data-size="compact"] .score { font-size: var(--fs-lg); }
[data-size="compact"] .bedside { gap: var(--s2); }

/* ---------- whimsy: silly patient reactions (see 22-whimsy.js) ---------- */
/* The card clips everything, so stunts can leave the bed's box without widening the page. */
.patient-card { position: relative; overflow: hidden; }
.patient-card .bed { position: relative; z-index: 0; }
.patient-card .pt-info { position: relative; z-index: 1; }
.patient-card .bed svg { overflow: visible; }
.pt-svg g { transform-box: view-box; }
.pt-all { transform-origin: 74px 60px; }
.pt-iv { transform-origin: 129px 86px; }
.pt-person { transform-origin: 80px 46px; }
.pt-head { transform-origin: 40px 46px; }
.pt-hair { transform-origin: 40px 30px; }
.pt-body { transform-origin: 94px 54px; }
.pt-arm-r { transform-origin: 59.5px 47px; }
.pt-arm-l { transform-origin: 73.5px 47px; }
.pt-arm, .pt-legs { opacity: 0; }
.pt-props text.wh-word { font-family: var(--font-display); font-weight: 700; fill: #ffd36b; stroke: #3b2a00; stroke-width: .6px; paint-order: stroke; }

/* ----- final poses (also what reduced motion shows) */
.wh-thumbs .pt-arm-r, .wh-dance .pt-arm, .wh-fingerguns .pt-arm, .wh-party .pt-arm-l, .wh-surf .pt-arm { opacity: 1; }
.wh-upside .pt-legs { opacity: 1; }
.wh-fingerguns .pt-arm-r { transform: rotate(60deg); }
.wh-fingerguns .pt-arm-l { transform: rotate(50deg); }
.wh-surf .pt-arm-r { transform: rotate(-50deg); }
.wh-surf .pt-arm-l { transform: rotate(50deg); }
.wh-upside .pt-person { transform: rotate(180deg); }
.wh-pill { transform: translate(40px, 20px); }

/* ----- right answers */
.wh-thumbs .pt-arm-r { animation: wh-pop-up .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.wh-wiggle .pt-head { animation: wh-wiggle .9s ease-in-out; }
.wh-hearts .pt-head { animation: wh-nod .6s ease-in-out 2; }
.wh-dance .pt-head { animation: wh-bob .35s ease-in-out 4 alternate; }
.wh-dance .pt-arm-r { animation: wh-wave .35s ease-in-out 4 alternate; }
.wh-dance .pt-arm-l { animation: wh-wave .35s ease-in-out 4 alternate-reverse; }
.wh-dance .pt-body { animation: wh-shimmy .35s ease-in-out 4 alternate; }
.wh-fingerguns .pt-arm { animation: wh-pew .3s ease-out 3; }
.wh-ivtwirl .pt-iv { animation: wh-twirl 1s ease-in-out; transform-origin: 129px 46px; }
.wh-backflip .pt-person { animation: wh-backflip 1.1s cubic-bezier(.45, 0, .3, 1); }
.wh-surf .pt-all { animation: wh-surf 1.3s ease-in-out; }
.wh-surf .pt-props .wh-waves { animation: wh-wave-roll 1.3s linear; }
.wh-party .pt-head { animation: wh-bob .3s ease-in-out 4 alternate; }
.wh-party .pt-arm-l { animation: wh-wave .3s ease-in-out 4 alternate; }
.wh-party .wh-blower { transform-box: view-box; transform-origin: 48px 49px; animation: wh-blow .35s ease-in-out 3 alternate; }
.wh-wheelie .pt-all { animation: wh-wheelie 1.4s cubic-bezier(.3, 1.4, .5, 1); transform-origin: 136px 97px; }
.wh-rocket .pt-all { animation: wh-rocket 1.4s ease-in-out; }
.wh-rocket .wh-flames { transform-box: view-box; transform-origin: 74px 101px; animation: wh-flicker .12s linear infinite alternate; }

/* ----- misses */
.wh-poof .pt-hair { animation: wh-poof 1s cubic-bezier(.2, 1.5, .4, 1); }
.wh-poof .pt-head { animation: wh-jolt .3s ease-out; }
.wh-bonk .wh-pill { animation: wh-pill .8s cubic-bezier(.3, 0, .6, 1) both; }
.wh-bonk .pt-head { animation: wh-bonk .5s ease-out .28s; }
.wh-sneeze .pt-head { animation: wh-sneeze .7s ease-in-out; }
.wh-blanket .pt-body { animation: wh-blanket 1.1s ease-in-out; }
.wh-roll .pt-all { animation: wh-roll 1.15s ease-in-out; }
.wh-roll .wh-speed { animation: wh-fade 1.1s ease-out both; }
.wh-dizzy .pt-head { animation: wh-wobble .4s ease-in-out 3 alternate; }
.wh-dizzy .wh-orbit { transform-box: view-box; transform-origin: 40px 14px; animation: wh-orbit .6s linear 2; }
.wh-topple .pt-iv { animation: wh-topple 1.15s cubic-bezier(.5, 0, .7, 1); }
.wh-topple .pt-head { animation: wh-bonk .5s ease-out .5s; }
.wh-spin .pt-all { animation: wh-spin 1.1s cubic-bezier(.4, 0, .3, 1); }
.wh-upside .pt-person { animation: wh-flip .5s cubic-bezier(.3, 1.4, .5, 1) both; }
.wh-upside .pt-legs { animation: wh-kick .2s ease-in-out .5s 4 alternate; transform-origin: 121px 64px; }

/* ----- prop motion */
.wh-float { animation: wh-float 1.1s ease-out both; }
.wh-pop { transform-box: fill-box; transform-origin: center; animation: wh-pop-up .35s cubic-bezier(.2, 1.6, .4, 1) both; }
.wh-twinkle { transform-box: fill-box; transform-origin: center; animation: wh-twinkle .5s ease-in-out 2 alternate both; }
.wh-confetti { transform-box: fill-box; transform-origin: center; animation: wh-confetti 1.2s cubic-bezier(.1, .7, .3, 1) both; }
.wh-puff { transform-box: fill-box; transform-origin: center; animation: wh-puff .8s ease-out both; }
.wh-spray { animation: wh-spray .5s ease-out .2s both; }

.wh-banner {
  position: absolute; left: var(--s2); top: 50%; z-index: 2; pointer-events: none; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg); color: #ffd36b; text-shadow: 0 2px 0 #7a2b00;
  animation: wh-banner 1.5s ease both;
}
.monitor.wh-sneeze { animation: shake .45s cubic-bezier(.36, .07, .19, .97) .2s both; }

@keyframes wh-pop-up { from { opacity: 0; transform: scale(.2); } }
@keyframes wh-wiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-9deg); } 80% { transform: rotate(6deg); } }
@keyframes wh-nod { 50% { transform: translateY(-3px) rotate(-6deg); } }
@keyframes wh-bob { from { transform: translate(-2px, 0) rotate(-8deg); } to { transform: translate(3px, -6px) rotate(8deg); } }
@keyframes wh-wave { from { transform: rotate(-35deg); } to { transform: rotate(30deg); } }
@keyframes wh-shimmy { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
@keyframes wh-pew { 40% { translate: 2px -2px; } }
@keyframes wh-twirl { 0% { transform: scaleX(1); } 25% { transform: scaleX(-1); } 50% { transform: scaleX(1); } 75% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
@keyframes wh-backflip { 0% { transform: none; } 30% { transform: translateY(-40px) rotate(-120deg); } 60% { transform: translateY(-40px) rotate(-300deg); } 85% { transform: translateY(0) rotate(-360deg); } 92% { transform: translateY(-4px) rotate(-360deg); } 100% { transform: rotate(-360deg); } }
@keyframes wh-surf { 0%, 100% { transform: none; } 20% { transform: translate(-6px, -8px) rotate(-6deg); } 45% { transform: translate(8px, -14px) rotate(5deg); } 70% { transform: translate(-4px, -8px) rotate(-4deg); } }
@keyframes wh-wave-roll { from { transform: translateX(-20px); } to { transform: translateX(20px); } }
@keyframes wh-blow { from { transform: scaleX(.4); } to { transform: scaleX(1.2); } }
@keyframes wh-wheelie { 0% { transform: none; } 25% { transform: rotate(16deg); } 45% { transform: rotate(11deg); } 65% { transform: rotate(17deg); } 90% { transform: rotate(-2deg); } 100% { transform: none; } }
@keyframes wh-rocket { 0% { transform: none; } 15% { transform: translate(-2px, 1px); } 20% { transform: translate(2px, -1px); } 25% { transform: translate(-2px, 1px); } 55% { transform: translateY(-26px); } 75% { transform: translateY(-22px); } 100% { transform: none; } }

d cancer","unit":"ch3","num":"3.8","focus":["Different gene expression drives much cellular specialization.","Distinguish self-renewal, differentiation, benign growth, invasion, and metastasis."],"tips":[]},"ch4-enzymes":{"title":"Metabolism, enzymes, and pathway control","unit":"ch4","num":"4.1","focus":["Explain active site specificity, cofactors/coenzymes, and feedback inhibition.","Enzymes lower activation energy and are reused."],"tips":[]},"ch4-atp":{"title":"ATP, phosphorylation, and redox","unit":"ch4","num":"4.2","focus":["Oxidation loses electrons; reduction gains electrons.","Contrast substrate-level and oxidative phosphorylation."],"tips":[]},"ch4-glycolysis":{"title":"Glycolysis and lactate formation","unit":"ch4","num":"4.3","focus":["One glucose yields two pyruvate, two net ATP, and two NADH in glycolysis.","Lactate formation regenerates NAD+ without adding extra ATP."],"tips":[]},"ch4-aerobic":{"title":"Pyruvate oxidation, Krebs cycle, and electron transport","unit":"ch4","num":"4.4","focus":["Locate each stage and account for carbon, electron carriers, and ATP.","Oxygen is the final acceptor; the proton gradient powers ATP synthase."],"tips":[]},"ch4-fuels":{"title":"Fuel storage and metabolic integration","unit":"ch4","num":"4.5","focus":["Compare glycogen storage with triglyceride reserve fuel.","Fatty acids and amino acid carbon skeletons enter shared energy pathways."],"tips":[]},"ch4-replication":{"title":"DNA structure, genes, and replication","unit":"ch4","num":"4.6","focus":["Replication makes DNA from DNA and preserves one old strand per daughter helix.","Separate replication from transcription and mutation from an inevitable disease outcome."],"tips":[]},"ch4-expression":{"title":"Transcription, translation, and the genetic code","unit":"ch4","num":"4.7","focus":["Transcription makes RNA; translation builds a polypeptide.","Read mRNA codons in the correct direction and distinguish template from coding DNA."],"tips":[]},"ch5-epithelia":{"title":"Four tissue classes and epithelial organization","unit":"ch5","num":"5.1","focus":["Relate epithelial polarity, basement membrane, avascularity, and regeneration.","Classify stratified tissue by the shape of its apical cells."],"tips":[]},"ch5-simple":{"title":"Simple and pseudostratified epithelia","unit":"ch5","num":"5.2","focus":["Link thin squamous layers to exchange and cuboidal/columnar layers to secretion or absorption.","Pseudostratified means every cell contacts the basement membrane."],"tips":[]},"ch5-stratified":{"title":"Stratified and transitional epithelia","unit":"ch5","num":"5.3","focus":["Keratinized stratified squamous forms epidermis; nonkeratinized protects moist surfaces.","Transitional epithelium stretches while maintaining a urinary barrier."],"tips":[]},"ch5-glands":{"title":"Glands, secretion, and epithelial cancer","unit":"ch5","num":"5.4","focus":["Exocrine uses ducts; endocrine releases hormones without ducts.","Holocrine loses the entire secretory cell."],"tips":[]},"ch5-matrix":{"title":"Connective tissue cells, fibers, and matrix","unit":"ch5","num":"5.5","focus":["Matrix equals ground substance plus fibers; cell types contribute different functions.","Collagen resists tension, elastic fibers recoil, reticular fibers form a network."],"tips":[]},"ch5-connective":{"title":"Loose, dense, and specialized connective tissues","unit":"ch5","num":"5.6","focus":["Predict function from fiber arrangement and matrix composition.","Distinguish all three cartilages, compact bone, and blood."],"tips":[]},"ch5-membranes":{"title":"Tissue membranes, muscle, and nervous tissue","unit":"ch5","num":"5.7","focus":["Synovial membranes are connective tissue membranes without true epithelium.","Compare skeletal, cardiac, and smooth muscle by structure, location, and control."],"tips":[]},"ch6-layers":{"title":"Skin layers and their cell types","unit":"ch6","num":"6.1","focus":["Order epidermal strata from basale to corneum; lucidum is specific to thick skin.","Distinguish epidermis, dermis, and hypodermis."],"tips":[]},"ch6-dermis":{"title":"Dermal structure, sensation, and skin functions","unit":"ch6","num":"6.2","focus":["Papillary dermis is areolar; reticular dermis is dense irregular connective tissue.","Compare superficial tactile receptors with deeper lamellated corpuscles."],"tips":[]},"ch6-accessory":{"title":"Hair, nails, and sebaceous glands","unit":"ch6","num":"6.3","focus":["Hair/nails arise from epidermal cells despite follicle structures extending into dermis.","Arrector pili is smooth muscle; sebaceous secretion is holocrine."],"tips":[]},"ch6-sweat":{"title":"Eccrine, apocrine, and modified glands","unit":"ch6","num":"6.4","focus":["Eccrine glands open to surface and support evaporative cooling.","Apocrine sweat commonly drains into follicles; bacterial metabolism contributes odor."],"tips":[]},"ch6-temperature":{"title":"Heat production, transfer, and feedback","unit":"ch6","num":"6.5","focus":["Separate hypothalamic control from skin vessel and sweat responses.","Evaporation depends on environmental conditions, including humidity."],"tips":[]},"ch6-pigment":{"title":"Pigmentation, defense, and skin disorders","unit":"ch6","num":"6.6","focus":["Distinguish melanin, carotene, hemoglobin, and bilirubin contributions.","Link pressure/shear to tissue ischemia and UV exposure to DNA damage risk."],"tips":[]},"ch6-repair":{"title":"Wound healing and burns","unit":"ch6","num":"6.7","focus":["Compare superficial, partial-thickness, and full-thickness depth and regenerative capacity.","Rule of nines estimates adult surface area, not burn depth."],"tips":[]},"ch7-overview":{"title":"The Skeletal System at a Glance","unit":"ch7","num":"7.1","focus":["The adult skeleton has 206 bones divided into axial and appendicular portions.","The girdles (pectoral and pelvic) belong to the appendicular skeleton."],"tips":[]},"ch7-shape":{"title":"Classification of Bones by Shape","unit":"ch7","num":"7.2","focus":["The femur is a long bone; carpals and tarsals (wrists and ankles) are short bones.","The patella is a sesamoid bone (some anatomists call it this because it forms inside the quadriceps tendon).","Vertebrae are irregular bones; skull bones, ribs, sternum, and scapulae are flat bones."],"tips":[{"kind":"tip","label":"Study tip","text":"\"Long\" refers to shape, not size. The tiny bones of the fingers (phalanges) are long bones because each has a shaft and two ends."}]},"ch7-long-bone":{"title":"Parts of a Long Bone","unit":"ch7","num":"7.3","focus":["The diaphysis is made mostly of compact bone.","The epiphyses are made mainly of spongy bone.","The ends of long bones (articular surfaces) are covered by hyaline cartilage.","The epiphyseal disk (plate) on an X-ray tells you a child's bone is still growing."],"tips":[]},"ch7-marrow":{"title":"Bone Marrow and Hematopoiesis","unit":"ch7","num":"7.4","focus":["Yellow marrow stores fat.","Red marrow forms red blood cells, white blood cells, and platelets (hematopoiesis).","In adults, red marrow is found primarily in spongy bone."],"tips":[{"kind":"clinical","label":"Clinical connection","text":"In an emergency or for a marrow biopsy, red marrow is often sampled from the sternum or the iliac crest of the hip bone because these flat bones keep active red marrow throughout life."}]},"ch7-cells":{"title":"Bone Matrix and Bone Cells","unit":"ch7","num":"7.5","focus":["Osteoclasts break down (resorb) bone tissue.","Osteocytes live inside lacunae.","Most of the bone matrix is made of hydroxyapatite crystals (calcium phosphate)."],"tips":[]},"ch7-compact-spongy":{"title":"Compact and Spongy Bone","unit":"ch7","num":"7.6","focus":["Spongy bone = cancellous bone.","Compact bone forms most of the diaphysis and is built of osteons (concentric circles).","The epiphyses are composed mainly of spongy bone."],"tips":[]},"ch7-ossification":{"title":"How Bones Form: Ossification","unit":"ch7","num":"7.7","focus":["The frontal bone (a flat skull bone) forms by intramembranous ossification; the femur, ulna, and radius form by endochondral ossification.","Know the steps of endochondral ossification and recognize the false one (cartilage does not become adipose tissue)."],"tips":[{"kind":"note","label":"Note","text":"Cartilage is replaced by bone, never by adipose (fat) tissue. A statement such as \"hyaline cartilage changes to adipose tissue\" is not a step of endochondral ossification."}]},"ch7-growth":{"title":"How Bones Grow in Length and Thickness","unit":"ch7","num":"7.8","focus":["All bones are normally ossified by about 25 years of age.","You can tell a child's long bone is growing by looking at the epiphyseal disk on an X-ray.","A bone grows in thickness by deposition of compact bone beneath the periosteum."],"tips":[{"kind":"clinical","label":"Clinical connection","text":"On an X-ray of a child, the epiphyseal disk appears as a dark (cartilage) line near the end of the bone. If you can see it, the bone is still growing. In an adult, only a thin epiphyseal line remains."}]},"ch7-factors":{"title":"Factors That Affect Bone Growth","unit":"ch7","num":"7.9","focus":["Vitamin C is required for collagen synthesis.","Excess GH before the epiphyseal plates ossify → pituitary gigantism (after closure → acromegaly).","Excess thyroid hormone can halt bone growth by causing premature ossification of the epiphyseal disks.","Sex hormones stimulate ossification of the epiphyseal disks, with estrogen stronger than androgens.","Increased bone mass from physical stress = bone hypertrophy."],"tips":[]},"ch7-functions":{"title":"Functions of Bones","unit":"ch7","num":"7.10","focus":["Production of blood cells, storage of inorganic salts, and protection of organs are all skeletal functions: the answer \"all of the above.\""],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"\"SPM-BSE\", or think \"Some People Move Blood, Salts, and Energy\": Support, Protection, Movement, Blood cell formation, Salt storage, Energy storage."}]},"ch7-remodeling":{"title":"Bone Remodeling and Calcium Homeostasis","unit":"ch7","num":"7.11","focus":["The thyroid gland releases calcitonin, which causes osteoblasts to deposit calcium in bone.","When the parathyroid glands sense low blood calcium, they release parathyroid hormone.","High blood calcium inhibits osteoclast activity (through calcitonin)."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"CalciTONEin tones down blood calcium. PTH Pulls calcium To the Heart (into the blood)."}]},"ch7-fractures":{"title":"Fractures and Fracture Repair","unit":"ch7","num":"7.12","focus":["A compound fracture: the broken bone is exposed through an opening in the skin.","Fracture repair order: hematoma → granulation tissue → callus (then remodeling).","A spiral fracture is caused by twisting and is often seen in child abuse cases."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"\"Happy Grandmas Cook Recipes\": Hematoma → Granulation tissue → Callus → Remodeling."}]},"ch7-axial":{"title":"The Axial Skeleton","unit":"ch7","num":"7.13","focus":["The parietal and temporal bones are joined by a suture (the squamous suture).","Scoliosis causes one hip or shoulder to be lower than the other and is most common in adolescent females."],"tips":[]},"ch7-appendicular":{"title":"The Appendicular Skeleton","unit":"ch7","num":"7.14","focus":["The pectoral girdle is made of the clavicle and scapula bones."],"tips":[]},"ch7-aging":{"title":"Life-Span Changes and Osteoporosis","unit":"ch7","num":"7.15","focus":["A light-skinned woman is most likely to have the lowest bone mass at age 65.","The upper femur commonly breaks in the elderly because trabecular bone weakens sooner than compact bone."],"tips":[]},"ch7-disorders":{"title":"Other Skeletal Disorders","unit":"ch7","num":"7.16","focus":[],"tips":[]},"ch8-overview":{"title":"What Is a Joint?","unit":"ch8","num":"8.1","focus":[],"tips":[{"kind":"tip","label":"Study tip","text":"Think of function as \"what does it do?\" (movement) and structure as \"what is it made of?\" (fibrous tissue, cartilage, or a fluid-filled capsule)."}]},"ch8-functional":{"title":"Functional Classification of Joints","unit":"ch8","num":"8.2","focus":["Joints with some limited degree of movement are amphiarthrotic.","Synarthrotic = immovable; diarthrotic = freely movable."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"Syn = Stuck (no movement). Amphi = About half (a little movement). Di = Does everything (free movement)."}]},"ch8-fibrous":{"title":"Structural Classification: Fibrous Joints","unit":"ch8","num":"8.3","focus":["The parietal and temporal bones are joined by a suture.","A suture is a fibrous joint (and functionally synarthrotic)."],"tips":[]},"ch8-cartilaginous":{"title":"Structural Classification: Cartilaginous Joints","unit":"ch8","num":"8.4","focus":["The joint between the bodies of the vertebrae and between the two pubic bones is a symphysis.","The symphysis pubis is not a synovial joint and not a fibrous joint."],"tips":[{"kind":"note","label":"Note","text":"The symphysis pubis is a cartilaginous joint, not a fibrous or synovial joint. So is every intervertebral disc."},{"kind":"clinical","label":"Clinical connection","text":"Epiphyseal plate versus intervertebral disc. The epiphyseal plate is a synchondrosis of hyaline cartilage that is later replaced by bone. The intervertebral disc is a symphysis of fibrocartilage that stays cartilage for life."}]},"ch8-synovial-structure":{"title":"Structure of a Synovial Joint","unit":"ch8","num":"8.5","focus":["Bones of a synovial joint are held together by a joint capsule (reinforced by ligaments).","The synovial membrane secretes synovial fluid, surrounds the synovial cavity, and reabsorbs fluid.","A meniscus is part of the knee joint.","Bursae are fluid-filled sacs between skin and bony prominences.","The articular ends of long bones are covered with hyaline cartilage."],"tips":[{"kind":"tip","label":"Study tip","text":"Remember the difference: ligaments connect bone to bone. Tendons connect muscle to bone. A joint capsule is reinforced by ligaments, not tendons."}]},"ch8-types":{"title":"Types of Synovial Joints","unit":"ch8","num":"8.6","focus":["Rotational movement is possible in the ball-and-socket joint (and pivot joints).","The ball-and-socket joint allows the most movements.","Saddle joint: base of the thumb. Gliding joint: between carpals (and tarsals). Pivot: atlas–axis.","A condyloid joint does not allow rotation, and it is not limited to one plane.","Elbow and knee are primarily hinge joints."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"\"Ball and socket: the shoulder and hip rock.\" \"Hinge: like a door at the elbow and knee.\" \"Pivot: shake your head 'no.'\" \"Saddle: the thumb can touch every finger.\""}]},"ch8-movements":{"title":"Joint Movements","unit":"ch8","num":"8.7","focus":["Dorsiflexion brings the foot closer to the shin.","Adduction means moving a body part closer to the trunk (midline)."],"tips":[{"kind":"tip","label":"Study tip","text":"\"Adduction\" = \"add\" to the body (toward the trunk). \"Abduction\" = \"abduct\" (take away) from the trunk."}]},"ch8-examples":{"title":"Shoulder, Elbow, Hip, and Knee","unit":"ch8","num":"8.8","focus":["The anatomical term for the shoulder joint is the glenohumeral joint.","The rotator cuff is found at the shoulder.","The radial collateral ligament is associated with the elbow.","The shoulder allows the most range of motion, so it is the most likely to dislocate.","A meniscus is part of the knee."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"ACL stops the tibia from sliding Anteriorly. PCL stops it from sliding Posteriorly. MCL is Medial and LCL is Lateral."},{"kind":"note","label":"Note","text":"Hip versus shoulder. The hip allows less freedom of movement than the shoulder, because its deep socket and heavy ligaments make it more stable. The shoulder moves more but dislocates more easily. The knee (not the hip) is the largest and most complex synovial joint."}]},"ch8-aging":{"title":"Life-Span Changes","unit":"ch8","num":"8.9","focus":["True statement: loss of function of synovial joints often begins in the third decade of life."],"tips":[]},"ch8-disorders":{"title":"Joint Disorders: Injuries and Arthritis","unit":"ch8","num":"8.10","focus":["A dislocation is displacement of the articulating bones, and the joint is clearly deformed.","A sprain is overstretching or tearing of ligaments and tendons in a joint.","RA is autoimmune; OA is caused by the effects of aging (wear and tear).","Lyme arthritis is caused by a tick-borne bacterium."],"tips":[{"kind":"tip","label":"Study tip","text":"OA is \"Old and Aching\" (aging). RA is \"Rogue Antibodies\" (autoimmune). They do not share the same cause."}]},"ch8-summary":{"title":"Joint Summary Table","unit":"ch8","num":"8.11","focus":["The symphysis pubis is a cartilaginous joint, not fibrous.","The hip is less mobile than the shoulder, and the knee is the largest and most complex synovial joint."],"tips":[]},"ch9-overview":{"title":"Overview of Muscle Tissues","unit":"ch9","num":"9.1","focus":[],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"\"E.C.E.E.\": Excite, Contract, Extend, Elasticity bounce-back."}]},"ch9-structure":{"title":"Structure of a Skeletal Muscle","unit":"ch9","num":"9.2","focus":["The outermost layer of connective tissue (underneath the fascia) surrounding a skeletal muscle is the epimysium.","A tendon attaches muscle to bone.","The severe pain of compartment syndrome results from excessive fluid pressure within the compartment."],"tips":[{"kind":"tip","label":"Study tip","text":"Order from inside out: Endomysium (inside the fiber layer) → Perimysium (peri = around the bundle) → Epimysium (epi = on the outside)."},{"kind":"clinical","label":"Clinical connection","text":"Compartment syndrome. Groups of muscles are enclosed by fascia into compartments. After injury, swelling or bleeding inside the compartment raises fluid pressure, which squeezes blood vessels and nerves. The severe pain is caused by this excessive fluid pressure within the compartment, not by torn walls or stretched tendons. Untreated, it can cause permanent tissue damage; surgery (fasciotomy) relieves the pressure."}]},"ch9-fiber":{"title":"Skeletal Muscle Fiber and the Sarcomere","unit":"ch9","num":"9.3","focus":["Myofibrils are composed primarily of actin and myosin.","The striated appearance comes from the sarcomere arrangement.","The T tubules transmit muscle impulses into the cell's interior; the SR stores calcium.","The sarcomere is the functional unit of contraction.","The Z line holds the bands of actin together and forms the boundaries of the sarcomere."],"tips":[]},"ch9-nmj":{"title":"The Neuromuscular Junction","unit":"ch9","num":"9.4","focus":["A motor unit = a motor neuron and the muscle fibers it controls.","Neurotransmitters are stored in vesicles in the motor neuron endings.","Cholinesterase causes acetylcholine to decompose.","A neuromuscular junction is a junction between a motor neuron and a muscle fiber, with a gap (synaptic cleft), where neurotransmitters are released from the neuron: all of these statements are correct.","The functional connection between neuron and fiber is the synapse (neuromuscular junction)."],"tips":[{"kind":"clinical","label":"Clinical connection","text":"When the NMJ fails. Botulism toxin blocks ACh release (flaccid paralysis). Myasthenia gravis is an autoimmune attack on ACh receptors (weakness). Some pesticides and nerve agents inhibit acetylcholinesterase, so ACh stays in the cleft and the muscle stays contracted (spastic paralysis)."}]},"ch9-contraction":{"title":"Steps of Muscle Contraction","unit":"ch9","num":"9.5","focus":["The first event in contraction: acetylcholine is released from the end of the motor neuron.","ATP supplies energy for myofilament movement.","Calcium released from the SR binds to troponin."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"\"A-T-C-C-S\": ACh → T tubule → Calcium released → Cross-bridges → Slide."},{"kind":"clinical","label":"Clinical connection","text":"Rigor mortis. After death, ATP is no longer made. Without ATP, myosin heads cannot detach from actin, so the muscles stay stiff until the proteins break down."}]},"ch9-energy":{"title":"Energy for Contraction","unit":"ch9","num":"9.6","focus":["Creatine phosphate supplies energy for the synthesis of ATP.","The oxygen needed to convert lactic acid back to glycogen after intense exercise is the oxygen debt.","A muscle cramp is most likely due to a lack of ATP."],"tips":[]},"ch9-responses":{"title":"Muscle Responses","unit":"ch9","num":"9.7","focus":["Latent period = delay between stimulus and response. Refractory period = brief unresponsive moment after stimulation.","Threshold stimulus = the minimal stimulus needed to elicit a contraction.","Matching: isotonic = movement where fibers lengthen or shorten; eccentric = lengthening contraction; concentric = shortening contraction; isometric = tension rises, length unchanged; recruitment = more motor units; twitch = response of one fiber to one impulse; tone = sustained contraction.","Red muscles contract more slowly, have more myoglobin and mitochondria, and fatigue more slowly."],"tips":[{"kind":"note","label":"Note","text":"Watch for the false comparison: red muscles do not have fewer mitochondria than white muscles. They have more."}]},"ch9-disorders":{"title":"Atrophy, Hypertrophy, and Muscle Disorders","unit":"ch9","num":"9.8","focus":["Muscle atrophy from disuse: reduced capillaries, fewer mitochondria, and smaller actin and myosin filaments: all of these."],"tips":[]},"ch9-smooth-cardiac":{"title":"Smooth and Cardiac Muscle","unit":"ch9","num":"9.9","focus":[],"tips":[]},"ch9-actions":{"title":"How Muscles Produce Movement","unit":"ch9","num":"9.10","focus":["A muscle end attached to a relatively immovable part is the origin.","The antagonist opposes the movement of the prime mover (agonist)."],"tips":[{"kind":"tip","label":"Study tip","text":"The general name for a muscle that opposes a movement is the antagonist. Do not confuse it with agonist (prime mover)."}]},"ch9-naming":{"title":"Naming Skeletal Muscles","unit":"ch9","num":"9.11","focus":[],"tips":[]},"ch9-head":{"title":"Muscles of the Head and Neck","unit":"ch9","num":"9.12","focus":["The muscle used to raise the eyebrows is the frontalis."],"tips":[]},"ch9-arm":{"title":"Muscles of the Shoulder and Arm","unit":"ch9","num":"9.13","focus":["The muscle used for abduction of the arm is the deltoid."],"tips":[]},"ch9-trunk":{"title":"Muscles of the Trunk and Pelvis","unit":"ch9","num":"9.14","focus":[],"tips":[]},"ch9-leg":{"title":"Muscles of the Hip, Thigh, and Leg","unit":"ch9","num":"9.15","focus":["The group of muscles used for flexing the lower limb at the knee is the hamstrings (not the quadriceps)."],"tips":[{"kind":"mnemonic","label":"Memory trick","text":"Quads = \"quad\" (four) heads extend the knee. Hamstrings bend (\"flex\") the knee (the ham in the back of the thigh)."}]},"ch10-divisions":{"title":"Nervous-system organization and information flow","unit":"ch10","num":"10.1","focus":["CNS is brain/spinal cord; PNS includes peripheral nerves and ganglia.","Afferent arrives, efferent exits; integration links input to output."],"tips":[]},"ch10-neurons":{"title":"Neuron structure and classification","unit":"ch10","num":"10.2","focus":["Locate receptive regions, trigger zone, conducting axon, and secretory terminal.","Distinguish structural neuron classes from sensory/motor/interneuron roles."],"tips":[]},"ch10-glia":{"title":"Glia, myelin, gray matter, and white matter","unit":"ch10","num":"10.3","focus":["Compare Schwann cells with oligodendrocytes and distinguish the four CNS glial types.","Myelin explains white matter and supports saltatory conduction."],"tips":[]},"ch10-resting":{"title":"Resting potential and graded signals","unit":"ch10","num":"10.4","focus":["Distinguish maintained ion gradients from moment-to-moment channel currents.","Depolarization approaches zero; hyperpolarization becomes more negative."],"tips":[]},"ch10-impulse":{"title":"Action potentials and conduction","unit":"ch10","num":"10.5","focus":["Sodium influx depolarizes; potassium efflux repolarizes.","Predict conduction speed from myelination and diameter."],"tips":[]},"ch10-synapses":{"title":"Chemical synapses and neurotransmitter effects","unit":"ch10","num":"10.6","focus":["Trace calcium-triggered exocytosis and receptor-dependent postsynaptic response.","Explain transmitter removal and distinguish convergence from divergence."],"tips":[]},"ch11-protection":{"title":"Meninges, ventricles, and cerebrospinal fluid","unit":"ch11","num":"11.1","focus":["Locate the CSF-filled subarachnoid space and trace ventricular circulation.","Distinguish spinal epidural space from subarachnoid space."],"tips":[]},"ch11-cord":{"title":"Spinal cord, roots, and tracts","unit":"ch11","num":"11.2","focus":["Dorsal root is sensory; ventral root is motor; spinal nerves and rami are mixed.","Differentiate gray horns from white columns and ascending from descending pathways."],"tips":[]},"ch11-reflex":{"title":"Reflex arcs and integrated responses","unit":"ch11","num":"11.3","focus":["Trace the five components of a reflex and distinguish monosynaptic from polysynaptic circuits.","A spindle monitors muscle length, not simply tendon tension."],"tips":[]},"ch11-cerebrum":{"title":"Cerebral cortex, lobes, and association","unit":"ch11","num":"11.4","focus":["Associate frontal with planning/motor, parietal with somatic sensation, temporal with hearing, occipital with vision.","Cortex is gray matter; deeper pathways include white matter and gray nuclei."],"tips":[]},"ch11-brainstem":{"title":"Diencephalon, brainstem, cerebellum, and networks","unit":"ch11","num":"11.5","focus":["Separate thalamic relay from hypothalamic homeostasis.","Identify midbrain, pons, medulla, and cerebellar coordination roles."],"tips":[]},"ch11-cranial":{"title":"Cranial nerves and peripheral nerve organization","unit":"ch11","num":"11.6","focus":["Know cranial nerve numbers, names, sensory/motor categories, and major actions.","Compare endoneurium, perineurium, epineurium and four major plexuses."],"tips":[]},"ch11-autonomic":{"title":"Somatic and autonomic motor pathways","unit":"ch11","num":"11.7","focus":["Somatic output uses one neuron; typical autonomic output uses a two-neuron chain.","Compare thoracolumbar sympathetic with craniosacral parasympathetic origins."],"tips":[]},"ch11-receptors":{"title":"Autonomic transmitters, receptors, and disorders","unit":"ch11","num":"11.8","focus":["Trace transmitters and receptor classes at ganglia and targets, including sweat gland exceptions.","Distinguish demyelinating, vascular, degenerative, and neuromuscular mechanisms."],"tips":[]},"ch11-disorders":{"title":"Comparing neurological disorder mechanisms","unit":"ch11","num":"11.9","focus":["Differentiate myelin, vascular, developmental, infectious, degenerative, and CSF-flow mechanisms.","A disorder label alone does not describe all causes or manifestations."],"tips":[]},"ch12-receptors":{"title":"Receptors, sensation, perception, and adaptation","unit":"ch12","num":"12.1","focus":["Distinguish detection/transduction from conscious interpretation.","Classify receptors by stimulus and compare adaptation patterns."],"tips":[]},"ch12-somatic":{"title":"Somatic sensation, pain, and proprioception","unit":"ch12","num":"12.2","focus":["Contrast muscle length sensing by spindles with tension sensing by tendon organs.","Explain referred pain and separate fast/slow fibers from acute/chronic duration."],"tips":[]},"ch12-chemical":{"title":"Olfaction and gustation","unit":"ch12","num":"12.3","focus":["Trace smell through receptor cilia, bulb, and tract.","Identify five taste qualities and cranial nerves VII, IX, and X without a rigid tongue map."],"tips":[]},"ch12-ear":{"title":"External, middle, and inner ear","unit":"ch12","num":"12.4","focus":["Trace auricle → canal → tympanic membrane → ossicles → oval window.","Distinguish middle-ear air space, perilymph, and endolymph."],"tips":[]},"ch12-hearing":{"title":"Cochlear transduction and auditory pathways","unit":"ch12","num":"12.5","focus":["Locate scalae, basilar membrane, hair cells, and tectorial membrane.","Trace mechanical vibration to CN VIII signaling and temporal cortical processing."],"tips":[]},"ch12-balance":{"title":"Vestibular equilibrium and head movement","unit":"ch12","num":"12.6","focus":["Maculae detect gravity/linear acceleration; cristae detect angular acceleration.","Trace vestibular input through CN VIII and central balance/gaze circuits."],"tips":[]},"ch12-eye":{"title":"Eye protection, tunics, and chambers","unit":"ch12","num":"12.7","focus":["Identify fibrous, vascular, and neural tunics and their components.","Distinguish aqueous-filled chambers from the vitreous cavity."],"tips":[]},"ch12-vision":{"title":"Accommodation, photoreceptors, and visual pathways","unit":"ch12","num":"12.8","focus":["Near focus: ciliary contraction, reduced zonular tension, rounder lens.","Rods favor dim light; cones favor color/acuity; ganglion axons form CN II."],"tips":[]},"ch12-phototransduction":{"title":"Visual pigments, adaptation, and sensory aging","unit":"ch12","num":"12.9","focus":["Light hyperpolarizes photoreceptors and changes their transmitter release.","Distinguish presbyopia, cataract, glaucoma, retinal disease, and age-related hearing loss."],"tips":[]}},"questions":[{"id":"N1-01","unit":"ch1","sec":"ch1-organization","focus":[["ch1-organization",0]],"type":"mcq","stem":"The lung's air sacs have extremely thin walls. How does this structure help their function?","why":"Anatomy (structure) explains physiology (function). A thin exchange surface shortens the distance gases must travel, so diffusion is fast. If the structure changes, performance changes.","diff":1,"origin":"new","opts":[{"t":"Thin walls allow oxygen and carbon dioxide to diffuse quickly.","c":true},{"t":"Thin walls make the lungs heavier and more stable.","w":"Thin walls make diffusion fast. They aren't about weight."},{"t":"Thin walls store more blood cells.","w":"Blood cells are made in red bone marrow, not stored in the lung walls."},{"t":"Structure and function are unrelated.","w":"A core idea of A&P is that structure supports function."}],"trick":"Form fits function: thin = fast exchange.","tip":"Look for the option that links the structure in the stem directly to a job."},{"id":"N1-02","unit":"ch1","sec":"ch1-organization","focus":[["ch1-organization",1]],"type":"order","stem":"Put the levels of organization in order, from smallest to largest.","why":"Atoms join into molecules, and macromolecules build organelles inside cells. Similar cells form tissues, two or more tissue types form an organ, organs work together as systems, and systems make up the organism.","diff":2,"origin":"new","steps":["Atom","Molecule","Organelle","Cell","Tissue","Organ","Organ system","Organism"],"trick":"All Monkeys Order Cake To Offer Our Optometrist (Atom, Molecule, Organelle, Cell, Tissue, Organ, Organ system, Organism).","tip":"Don't mix up organelle (inside a cell) with organ (made of tissues)."},{"id":"N1-03","unit":"ch1","sec":"ch1-life","focus":[["ch1-life",0]],"type":"mcq","stem":"After a meal, amino acids from digested protein cross the wall of the small intestine into the blood. Which life process is this?","why":"The sequence is digestion (break food down), then absorption (move nutrients across a boundary into body fluids), then assimilation (build them into body structures). Excretion removes wastes.","diff":2,"origin":"new","opts":[{"t":"Absorption","c":true},{"t":"Digestion","w":"Digestion broke the protein INTO amino acids, the step before."},{"t":"Assimilation","w":"Assimilation is when cells build those amino acids into their own proteins, the step after."},{"t":"Excretion","w":"Excretion removes metabolic wastes."}],"trick":"Digest, Absorb, Assimilate: break it, take it in, make it yours.","tip":"Sequence questions: find where the stem sits in the chain (crossing the gut = absorption)."},{"id":"N1-04","unit":"ch1","sec":"ch1-life","focus":[["ch1-life",1]],"type":"sata","stem":"Which statements about the requirements for life are accurate? Select all that apply.","why":"The five requirements: nutrients (energy, building blocks), oxygen (electron acceptor), water (reactions, transport), suitable heat (affects enzymes), and pressure (drives ventilation and filtration). Heat and pressure are physical conditions.","diff":2,"origin":"new","opts":[{"t":"Nutrients supply energy and building materials.","c":true},{"t":"Oxygen accepts electrons during aerobic energy production.","c":true},{"t":"Pressure gradients drive breathing and filtration.","c":true},{"t":"Heat is a chemical nutrient.","w":"Heat (temperature) is a physical condition, not a chemical nutrient."},{"t":"Water is needed only to control body temperature.","w":"Water also supports reactions and transport."}],"trick":"NOW HP: Nutrients, Oxygen, Water, Heat, Pressure.","tip":"'Only' in an option usually makes it false."},{"id":"N1-05","unit":"ch1","sec":"ch1-homeostasis","focus":[["ch1-homeostasis",0]],"type":"mcq","stem":"Which is an example of positive feedback?","why":"Negative feedback opposes a change (most homeostasis). Positive feedback amplifies a process until a separate event stops it, like platelets recruiting more platelets until the injury is sealed.","diff":2,"origin":"new","opts":[{"t":"Platelets recruiting more platelets to form a clot","c":true},{"t":"Sweating when body temperature rises above normal","w":"Sweating cools the body, opposing the rise, so it is negative feedback."},{"t":"Shivering when body temperature drops below normal","w":"Shivering makes heat to oppose the drop: negative feedback."},{"t":"Skin blood vessels narrowing in a cold room","w":"This limits heat loss to oppose the drop: negative feedback."}],"trick":"Negative = Neutralize the change. Positive = Pile on more.","tip":"Ask: does the response push back or push further? Three of these push back."},{"id":"N1-06","unit":"ch1","sec":"ch1-homeostasis","focus":[["ch1-homeostasis",1]],"type":"order","stem":"A client's core temperature rises. Put the steps of the negative feedback loop in order.","why":"Every feedback loop runs stimulus, receptor, control center, effector, response. In negative feedback the response opposes the original change.","diff":2,"origin":"new","steps":["Stimulus: core body temperature rises above its normal range.","Receptors detect the change.","The hypothalamus (control center) compares it with the normal range.","Effectors respond: sweat glands release sweat and skin blood flow increases.","Response: temperature falls back toward normal."],"trick":"See it, Sense it, Decide, Do, Done (Stimulus, Receptor, Control center, Effector, Response).","tip":"Name each part of the loop before ordering. The control center always sits in the middle."},{"id":"N1-07","unit":"ch1","sec":"ch1-cavities","focus":[["ch1-cavities",0],["ch1-cavities",1]],"type":"mcq","stem":"Which statement about the pleura is accurate?","why":"Serous membranes have two layers. Visceral covers an organ and parietal lines a cavity wall. The potential space between them holds a thin film of fluid that lets the organ move with little friction.","diff":2,"origin":"new","opts":[{"t":"Visceral pleura covers the lung, parietal pleura lines the chest wall, and a thin film of fluid lies between them.","c":true},{"t":"The lung sits inside the pleural fluid space.","w":"The lung is outside that thin potential space. Only fluid is inside it."},{"t":"Parietal pleura covers the lung, and visceral pleura lines the chest wall.","w":"This swaps the two layers."},{"t":"The pleura surrounds the heart.","w":"The pericardium surrounds the heart."}],"trick":"Visceral = Viscera (organs). Parietal = the Partition (wall).","tip":"Swapped-layer options are common. Anchor one layer and the other follows."},{"id":"N1-08","unit":"ch1","sec":"ch1-systems","focus":[["ch1-systems",0],["ch1-systems",1]],"type":"sata","stem":"Which organ-system statements are accurate? Select all that apply.","why":"Systems overlap: skeletal marrow makes blood cells for the cardiovascular system, the kidneys form urine and the bladder stores it, and the lymphatic system returns fluid and carries absorbed fats.","diff":2,"origin":"new","opts":[{"t":"Red bone marrow of the skeletal system forms blood cells.","c":true},{"t":"The kidneys regulate blood composition and produce urine.","c":true},{"t":"The lymphatic system returns fluid and transports absorbed fats.","c":true},{"t":"The urinary bladder produces urine.","w":"The bladder STORES urine. The kidneys produce it."},{"t":"The endocrine system provides the body's fastest signaling.","w":"The nervous system gives rapid control. Endocrine (hormone) control is slower."}],"trick":"Kidneys Make it, the bladder Holds it.","tip":"Make vs store is a classic swap. Check which organ does which."},{"id":"N1-09","unit":"ch1","sec":"ch1-directions","focus":[["ch1-directions",0],["ch1-directions",1]],"type":"mcq","stem":"A nurse documents that a wound is between the client's elbow and wrist. Which statement is accurate?","why":"Proximal and distal compare distance from where a limb attaches to the trunk. The elbow is closer to the shoulder (proximal), and the wrist is farther away (distal).","diff":1,"origin":"new","opts":[{"t":"The elbow is proximal to the wrist.","c":true},{"t":"The elbow is distal to the wrist.","w":"Distal means farther from the limb's attachment. The wrist is distal."},{"t":"The elbow is medial to the wrist.","w":"Medial and lateral describe the midline, not a point along a limb."},{"t":"The elbow is superficial to the wrist.","w":"Superficial and deep describe distance f
