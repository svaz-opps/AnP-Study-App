# Publishes the game to GitHub Pages every time main changes.
# The page is the committed single-file build, game/dist/ward-rounds.html,
# served as index.html so the site link opens straight into the game.
name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - game/dist/ward-rounds.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp game/dist/ward-rounds.html _site/index.html
          cp game/dist/ward-rounds.html _site/ward-rounds.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
